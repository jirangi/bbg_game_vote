<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.7.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .star-container { display: inline-flex; gap: 1px; color: #a855f7; font-size: 1rem; }
        .star { position: relative; display: inline-block; width: 1em; height: 1em; }
        .star::before { content: '★'; }
        .star-half::after { content: '★'; position: absolute; left: 0; top: 0; width: 50%; overflow: hidden; color: #a855f7; }
        .star-half, .star-empty { color: rgba(255, 255, 255, 0.1); }
        .member-btn.selected { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.4) !important; }
        .member-btn.ranked { border-color: #10b981 !important; background: rgba(16, 185, 129, 0.4) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="window.history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page pt-24 max-w-sm">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase tracking-widest">Login</h2>
            <div class="space-y-4 text-left">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold hover:bg-blue-500 shadow-lg mt-4">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleModal('profile-modal', true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs font-bold border border-white/10 px-3 py-1.5 rounded-lg">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tighter uppercase text-center italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Game Archive</h1>
        <div class="flex justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-white transition w-1/2">🏆 명예전당</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-red-500 hover:text-white transition w-1/2" onclick="toggleModal('admin-user-modal', true)">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-10 font-bold">
        <div class="flex flex-col mb-8 px-4 gap-6 text-left">
            <div class="flex justify-between items-end">
                <h2 id="rank-title" class="text-4xl font-extrabold italic text-blue-400 tracking-tighter"></h2>
                <button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-600 transition">+ 새 게임 추가</button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                <button onclick="setSort('score_desc')" id="sort-score_desc" class="sort-btn active px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap">점수 높은순</button>
                <button onclick="setSort('diff_desc')" id="sort-diff_desc" class="sort-btn px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap">난이도 높은순</button>
                <button onclick="setSort('diff_asc')" id="sort-diff_asc" class="sort-btn px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap">난이도 낮은순</button>
            </div>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5">
            <table class="w-full border-collapse min-w-[550px]">
                <thead class="bg-white/5 text-gray-500 text-[10px] uppercase font-bold border-b border-white/10 text-center">
                    <tr><th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="p-5 w-36">평가 데이터</th><th class="p-5 w-32">모임 일지</th></tr>
                </thead>
                <tbody id="rank-list" class="divide-y divide-white/5 text-center"></tbody>
            </table>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')">
        <div class="glass w-full max-w-lg p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-8">
                <h3 id="schedule-game-title" class="text-2xl font-black italic text-green-400 tracking-tighter"></h3>
                <button onclick="closeAllModals()" class="text-gray-500 hover:text-white text-3xl">✕</button>
            </div>
            <div class="space-y-5 mb-8 shrink-0 bg-white/5 p-5 rounded-3xl border border-white/5">
                <input type="text" id="new-schedule-name" placeholder="모임 이름 (ex. 2/19 영등포팟)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-green-500 transition text-sm">
                <div class="text-[10px] text-gray-500 ml-1 font-bold uppercase mb-1">참석 인원 체크</div>
                <div id="member-select-grid" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto custom-scrollbar p-2 bg-black/30 rounded-2xl border border-white/10"></div>
                <button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-base shadow-xl">모임 일정 생성하기</button>
            </div>
            <div class="flex-grow overflow-hidden flex flex-col">
                <h4 class="text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1">Past Logs (제목 클릭 시 상세기록)</h4>
                <div id="schedule-list" class="space-y-3 overflow-y-auto custom-scrollbar text-left flex-grow pr-2"></div>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 text-blue-400">
                <h3 id="detail-title" class="text-2xl font-black italic"></h3>
                <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl">✕</button>
            </div>
            <div class="mb-6 shrink-0 bg-white/5 p-4 rounded-2xl border border-white/5">
                <label class="text-[10px] text-gray-500 uppercase tracking-widest block mb-2 ml-1">Notes & Result</label>
                <textarea id="detail-note" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl h-24 outline-none resize-none text-sm focus:border-blue-500 transition font-bold" placeholder="게임 승패나 후기를 적어보세요."></textarea>
            </div>
            <div class="flex-grow overflow-hidden flex flex-col">
                <div class="flex justify-between items-end mb-4 px-1">
                    <span class="text-[10px] text-gray-500 uppercase tracking-widest">Rankings</span>
                    <span class="text-[10px] text-yellow-500 font-black">1등부터 순서대로 터치!</span>
                </div>
                <div id="rank-member-grid" class="grid grid-cols-3 gap-2 overflow-y-auto custom-scrollbar p-2 bg-black/20 rounded-2xl border border-white/5 mb-4"></div>
                <div id="rank-order-display" class="text-xs text-green-400 bg-green-400/10 border border-green-500/20 p-4 rounded-2xl min-h-[50px] text-left leading-relaxed font-bold">순위: </div>
            </div>
            <div class="flex gap-3 mt-8 shrink-0">
                <button onclick="toggleModal('detail-modal', false)" class="flex-1 bg-white/5 border border-white/10 py-4 rounded-2xl font-bold">취소</button>
                <button onclick="saveScheduleDetail()" class="flex-1 bg-blue-600 py-4 rounded-2xl font-black shadow-lg">저장하기</button>
            </div>
        </div>
    </div>

    <div id="admin-user-modal" class="modal" onclick="closeOnBackdrop(event, 'admin-user-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-8 text-red-400"><h3>User Management</h3><button onclick="closeAllModals()" class="text-3xl">✕</button></div><div class="flex gap-2 mb-8 font-bold"><input type="text" id="new-user-name" placeholder="추가할 이름" class="flex-grow bg-white/5 border border-white/10 p-4 rounded-2xl outline-none"><button onclick="adminAddUser()" class="bg-red-600 px-6 rounded-2xl font-black">추가</button></div><div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 pr-2"></div></div></div>
    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-3xl font-black text-center text-blue-400 mb-8 italic">My Page</h3>
            <div class="flex flex-col items-center gap-6 mb-8 pb-8 border-b border-white/10">
                <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover">
                <div class="w-full space-y-3">
                    <input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 text-center font-black">
                    <input type="text" id="edit-icon-url" placeholder="https://..." class="w-full bg-white/5 p-3 rounded-2xl text-[10px] outline-none border border-white/10">
                </div>
                <button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl">업데이트</button>
            </div>
            <h4 class="text-left text-[10px] font-black text-gray-500 uppercase mb-4 ml-1">Activity History</h4>
            <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[220px] space-y-3 custom-scrollbar text-left pr-2"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, increment, arrayUnion, arrayRemove, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let currentSort = "score_desc"; let allRatingsData = [];
        let tempMembers = []; let recordingRanks = []; let currentScheduleId = null;

        window.toggleModal = (id, show) => { const m = document.getElementById(id); if(show) m.classList.add('active'); else m.classList.remove('active'); };
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) closeAllModals(); };
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const target = document.getElementById(id);
            if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 50); }
            if (history.state?.page !== id) history.pushState({ page: id }, '', '');
        };
        window.onpopstate = (e) => {
            const pid = e.state?.page || 'page-home';
            document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const t = document.getElementById(pid); if(t) { t.style.display = 'block'; t.classList.add('active'); }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const data = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", data.pin));
                if (snap.exists() && snap.data().password === data.pw) {
                    currentUser = { pin: data.pin, ...snap.data() };
                    updateHeaderUI();
                    if(currentUser.pin === "100") document.getElementById('admin-user-manage-btn').classList.remove('hidden');
                    showPage('page-home'); return;
                }
            }
            showPage('page-login');
        });

        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, ...snap.data() };
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw }));
                location.reload();
            } else alert("PIN 또는 비밀번호 오류");
        };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };

        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.setSort = (m) => { currentSort = m; document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active')); document.getElementById(`sort-${m}`).classList.add('active'); renderList(); };

        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-30 font-black italic">Loading...</td></tr>`;
            const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db,"games"), where("category","==",selectedCategory))), getDocs(collection(db,"ratings"))]);
            allRatingsData = rSnap.docs.map(d=>d.data());
            let games = gSnap.docs.map(d => {
                const r = allRatingsData.filter(v=>v.gameId === d.id);
                if(r.length === 0) return null;
                const scores = r.map(v=>v.score||0).sort((a,b)=>a-b);
                let avg = scores.length>=3 ? scores.slice(1,-1).reduce((a,c)=>a+c,0)/(scores.length-2) : scores.reduce((a,c)=>a+c,0)/scores.length;
                const vD = r.map(v=>v.difficulty||0).filter(v=>v>0);
                let avgD = vD.length>0 ? vD.reduce((a,c)=>a+c,0)/vD.length : 0;
                return { id: d.id, ...d.data(), avgScore: avg, avgDiff: avgD, voteCount: r.length };
            }).filter(g=>g!==null);
            
            games.sort((a,b) => {
                const a3 = a.voteCount>=3, b3 = b.voteCount>=3;
                if(a3 && !b3) return -1; if(!a3 && b3) return 1;
                if(currentSort==='score_desc') return b.avgScore - a.avgScore;
                if(currentSort==='diff_desc') return b.avgDiff - a.avgDiff;
                return a.avgDiff - b.avgDiff;
            });

            list.innerHTML = games.map((g, i) => {
                const rankIcon = i<3 && g.voteCount>=3 ? ['🥇','🥈','🥉'][i] : `#${i+1}`;
                return `<tr class="hover:bg-white/5 transition font-bold border-b border-white/5">
                    <td class="p-5 text-blue-400 font-black text-lg">${rankIcon}</td>
                    <td class="p-5 text-left">
                        <div class="text-base font-black">${g.name}</div>
                        <div class="text-[9px] opacity-40 uppercase">Votes: ${g.voteCount}</div>
                    </td>
                    <td class="p-5">
                        <div class="text-yellow-400 font-black text-sm mb-1">${g.avgScore.toFixed(1)}점</div>
                        <div class="flex justify-center">${renderStars(g.avgDiff)}</div>
                    </td>
                    <td class="p-5"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600 hover:text-white transition">기록</button></td>
                </tr>`;
            }).join('');
        };

        function renderStars(r) { let h = '<div class="star-container">'; for(let i=1;i<=5;i++){ if(r>=i) h+='<span class="star"></span>'; else if(r>=i-0.5) h+='<span class="star star-half"></span>'; else h+='<span class="star star-empty"></span>'; } return h+'</div>'; }

        // [일정 시스템 핵심]
        window.openSchedules = async (id, name) => {
            activeGameId = id; activeGameName = name;
            document.getElementById('schedule-game-title').innerText = name;
            tempMembers = [];
            const grid = document.getElementById('member-select-grid');
            const uSnap = await getDocs(collection(db, "users"));
            grid.innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[10px] truncate border border-white/10 font-bold transition-all">${d.data().name}</button>`).join('');
            toggleModal('schedule-modal', true);
            loadSchedules();
        };

        window.toggleSelectMember = (pin) => {
            const idx = tempMembers.indexOf(pin);
            const btn = document.getElementById(`sel-${pin}`);
            if(idx > -1) { tempMembers.splice(idx, 1); btn.classList.remove('selected'); }
            else { tempMembers.push(pin); btn.classList.add('selected'); }
        };

        window.createSchedule = async () => {
            const name = document.getElementById('new-schedule-name').value.trim();
            if(!name || tempMembers.length === 0) return alert("제목과 참석자를 확인하세요.");
            await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, name: name, members: tempMembers, ranks: [], note: "", createdAt: serverTimestamp() });
            document.getElementById('new-schedule-name').value = "";
            tempMembers = []; loadSchedules();
        };

        async function loadSchedules() {
            const listDiv = document.getElementById('schedule-list');
            listDiv.innerHTML = `<p class='text-center opacity-30 text-[10px] py-6 font-black'>Fetching...</p>`;
            const q = query(collection(db, "schedules"), where("gameId", "==", activeGameId), orderBy("createdAt", "desc"));
            const sSnap = await getDocs(q);
            listDiv.innerHTML = sSnap.docs.map(d => {
                const s = d.data();
                return `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-white/10 transition mb-2">
                    <div class="text-sm text-green-300 font-black">${s.name}</div>
                    <div class="text-[9px] font-bold ${s.ranks.length > 0 ? 'text-blue-400' : 'text-gray-500'}">${s.ranks.length > 0 ? 'STATUS: RECORDED ✅' : 'STATUS: WAITING ⏳'}</div>
                </div>`;
            }).join('') || `<p class="opacity-20 text-center py-4 text-xs font-bold">기록이 없습니다.</p>`;
        }

        window.openScheduleDetail = async (id) => {
            currentScheduleId = id;
            const sSnap = await getDoc(doc(db, "schedules", id));
            const s = sSnap.data();
            const uSnap = await getDocs(collection(db, "users"));
            const users = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data().name}), {});
            document.getElementById('detail-title').innerText = s.name;
            document.getElementById('detail-note').value = s.note || "";
            recordingRanks = s.ranks ? [...s.ranks] : [];
            const grid = document.getElementById('rank-member-grid');
            grid.innerHTML = s.members.map(pin => `<button onclick="recordRank('${pin}')" id="rank-btn-${pin}" class="member-btn bg-white/5 p-3 rounded-2xl text-[11px] border border-white/10 font-bold transition-all ${recordingRanks.includes(pin) ? 'ranked' : ''}">${users[pin] || '?'}</button>`).join('');
            updateRankDisplay(users);
            toggleModal('detail-modal', true);
        };

        window.recordRank = (pin) => {
            const idx = recordingRanks.indexOf(pin);
            if(idx > -1) { recordingRanks.splice(idx, 1); document.getElementById(`rank-btn-${pin}`).classList.remove('ranked'); }
            else { recordingRanks.push(pin); document.getElementById(`rank-btn-${pin}`).classList.add('ranked'); }
            const uNames = Array.from(document.querySelectorAll('#rank-member-grid button')).reduce((acc, b) => ({...acc, [b.id.split('-')[2]]: b.innerText}), {});
            updateRankDisplay(uNames);
        };

        function updateRankDisplay(users) {
            const path = recordingRanks.map((p, i) => `<span class='font-black'>${i+1}위</span> ${users[p]}`).join(' → ');
            document.getElementById('rank-order-display').innerHTML = "순위: " + (path || "클릭하여 기록하세요.");
        }

        window.saveScheduleDetail = async () => {
            await updateDoc(doc(db, "schedules", currentScheduleId), { note: document.getElementById('detail-note').value, ranks: recordingRanks });
            alert("저장되었습니다."); toggleModal('detail-modal', false); loadSchedules();
        };

        // [마이페이지 히스토리]
        async function loadMyHistory() {
            const listDiv = document.getElementById('my-history-list');
            listDiv.innerHTML = `<p class="opacity-30 text-[10px] font-black uppercase text-center py-6">Loading...</p>`;
            const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin), orderBy("createdAt", "desc"));
            const sSnap = await getDocs(q);
            listDiv.innerHTML = sSnap.docs.map(d => {
                const s = d.data();
                const rankIdx = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1;
                const rankText = rankIdx > -1 ? `<span class="text-yellow-400 text-lg">${rankIdx+1}</span>위` : "기록전";
                return `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-2"><div><div class="text-[9px] text-blue-500 font-black uppercase">${s.gameName}</div><div class="text-sm font-black">${s.name}</div></div><div class="text-xs font-black italic pr-2 uppercase font-bold">${rankText}</div></div>`;
            }).join('') || `<p class="opacity-20 text-[10px] text-center py-4 font-bold italic">No history found.</p>`;
        }

        // [기본 시스템]
        function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님 환영합니다!`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.updateProfile = async () => { const n = document.getElementById('edit-nickname').value.trim(); await updateDoc(doc(db, "users", currentUser.pin), { name: n }); currentUser.name = n; updateHeaderUI(); alert("수정 완료"); };
        window.adminAddUser = async () => { const name = document.getElementById('new-user-name').value.trim(); if(!name) return; const snap = await getDocs(collection(db, "users")); const newPin = Math.max(...snap.docs.map(d => parseInt(d.id))) + 1; await setDoc(doc(db, "users", String(newPin)), { name, password: "1234", iconUrl: "", createdAt: serverTimestamp() }); document.getElementById('new-user-name').value = ""; refreshAdminUserList(); };
        async function refreshAdminUserList() { const listDiv = document.getElementById('admin-user-list'); listDiv.innerHTML = `<p class="text-center py-4 text-[10px] uppercase font-black opacity-30">Refreshing...</p>`; const snap = await getDocs(collection(db, "users")); const users = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => parseInt(a.id) - parseInt(b.id)); listDiv.innerHTML = users.map(u => `<div class="flex justify-between items-center p-4 bg-white/5 rounded-2xl border border-white/5 mb-2"><span class="text-blue-400 font-black text-xs w-8 tracking-tighter">${u.id}</span><span class="flex-grow font-black text-sm ml-2">${u.name}</span>${u.id !== '100' ? `<button onclick="adminDeleteUser('${u.id}')" class="text-red-500 font-black text-[10px] uppercase border border-red-500/20 px-2 py-1 rounded-lg">Delete</button>` : ''}</div>`).join(''); }
        window.adminDeleteUser = async (id) => { if(confirm("영구 삭제합니까?")) { await deleteDoc(doc(db, "users", id)); refreshAdminUserList(); } };
        window.toggleProfileModal = (s) => { if(s) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl||DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
    </script>
</body>
</html>
