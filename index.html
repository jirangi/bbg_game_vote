<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v4.8.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        #detail-modal { z-index: 10005; } /* 상세 정보가 항상 리스트 위에 오도록 */
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
        .member-chip.selected { background: #3b82f6; border-color: #60a5fa; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10 shadow-lg">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-black transition">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4 flex justify-between items-center">
            <h2 id="rank-title" class="text-3xl font-black italic text-blue-400 uppercase"></h2>
            <select id="sort-selector" class="bg-slate-800 text-[10px] p-2 rounded-lg border border-white/10" onchange="renderList()">
                <option value="default">기본(투표순)</option>
                <option value="score_desc">점수 높은순</option>
                <option value="score_asc">점수 낮은순</option>
            </select>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 border border-white/5 shadow-2xl">
            <table class="w-full text-center min-w-[500px]">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 uppercase font-black font-bold font-bold font-bold font-bold font-bold">
                    <th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="w-32">평가</th><th>기록</th>
                </tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold font-bold font-bold font-bold font-bold"></tbody>
            </table>
        </div>
        <div class="px-4 mt-6 text-center font-bold font-bold font-bold"><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-8 py-3 rounded-2xl text-xs font-bold font-bold font-bold">+ 새 게임 추가</button></div>
    </div>

    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3>
                <button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold font-bold">✕</button>
            </div>
            <div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold font-bold font-bold"></div>
            <button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl font-bold font-bold font-bold">+ 새로운 기록 추가</button>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <div class="flex flex-col font-bold font-bold">
                    <h3 id="detail-title" class="text-xl font-black text-blue-400 truncate font-bold font-bold"></h3>
                    <span id="detail-date" class="text-[10px] text-gray-500 font-bold font-bold font-bold"></span>
                </div>
                <div class="flex gap-3 font-bold font-bold font-bold font-bold">
                    <button id="detail-delete-btn" class="text-red-500 text-xs font-bold hidden" onclick="deleteSchedule()">삭제</button>
                    <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold font-bold">✕</button>
                </div>
            </div>
            <div id="detail-podium" class="bg-yellow-400/10 border border-yellow-500/20 p-5 rounded-3xl mb-6 hidden font-bold">
                <div id="detail-rank-result" class="text-sm space-y-1 font-bold text-white/90 font-bold font-bold"></div>
                <button onclick="openRankPopup()" class="w-full mt-4 bg-yellow-500/20 text-yellow-400 py-2 rounded-xl text-[10px] font-black font-bold font-bold">🥇 순위 등록/수정</button>
            </div>
            <div class="flex-grow overflow-y-auto custom-scrollbar font-bold font-bold font-bold">
                <div id="detail-comment-feed" class="space-y-4 text-left font-bold font-bold font-bold"></div>
            </div>
            <div class="mt-6 flex gap-2 font-bold font-bold font-bold">
                <input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold" placeholder="코멘트를 남겨주세요">
                <button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs font-bold">등록</button>
            </div>
        </div>
    </div>

    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-xl font-black mb-6 text-green-400 font-bold">기록 정보 입력</h3>
            <input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold" placeholder="기록 제목 (예: 1월 정기모임)">
            <label class="text-[10px] text-gray-500 mb-2 ml-1 font-bold">참석자 선택 (클릭)</label>
            <div id="member-selector" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto custom-scrollbar mb-6 p-2 bg-white/5 rounded-2xl font-bold font-bold font-bold"></div>
            <button onclick="submitSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl font-bold">기록 생성</button>
        </div>
    </div>

    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic text-center font-bold">My Profile</h3><div class="flex flex-col items-center gap-6 mb-8 border-b border-white/10 pb-8 font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover bg-slate-800 font-bold font-bold"><input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none font-black text-center font-bold" placeholder="닉네임"></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-4 font-bold">참석 히스토리</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[250px] space-y-3 custom-scrollbar font-bold"></div></div></div>
    <div id="rate-modal" class="modal" onclick="toggleModal('rate-modal', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 text-center font-bold"></h3><div id="rate-score-section" class="space-y-4 font-bold"><label class="text-[10px] text-gray-500 block text-center font-bold font-bold">재미 점수 (0 ~ 100)</label><input type="number" id="rate-score-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center text-2xl font-bold" placeholder="0"><button onclick="submitRating('score')" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black font-bold">저장</button></div><div id="rate-diff-section" class="space-y-4 hidden font-bold font-bold"><label class="text-[10px] text-gray-500 block text-center font-bold font-bold">난이도 (1 ~ 5)</label><input type="range" id="rate-diff-range" min="1" max="5" step="1" class="w-full accent-blue-500 font-bold" oninput="document.getElementById('diff-val').innerText = this.value"><div id="diff-val" class="text-center text-3xl font-black text-blue-400 font-bold font-bold">3</div><button onclick="submitRating('diff')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white font-bold">저장</button></div></div></div>
    <div id="page-stats" class="page pt-24 font-bold"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase text-center font-bold">명예전당 🏆</h2><div id="vote-king" class="space-y-3 px-4 font-bold"></div><div id="game-add-king" class="space-y-3 px-4 mt-8 font-bold"></div></div>
    <div id="page-chat-info" class="page pt-24 font-bold px-4"><div id="chat-info-list" class="space-y-4 font-bold"></div></div>
    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center font-bold"><div class="glass p-8 rounded-3xl font-bold"><h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase italic font-bold">Login</h2><div class="space-y-4 font-bold"><input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold"><input type="password" id="pw" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold"><button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold mt-4 font-bold">접속</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, orderBy, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeScheduleId = null; let selectedMembers = [];

        // [내비게이션]
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.onpopstate = () => { if(document.querySelector('.modal.active')) { closeAllModals(); history.pushState({page: 'page-home'}, '', ''); return; } showPage('page-home', false); };
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const t = document.getElementById(id); if(t) { t.classList.add('active'); document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block'; if(push) history.pushState({page: id}, '', ''); if(id === 'page-stats') navToStats(); if(id === 'page-chat-info') loadChatInfo(); }
        };

        // [랭킹 렌더링]
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 font-bold italic">Loading...</td></tr>`;
            const sortType = document.getElementById('sort-selector').value;
            try {
                const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const rt = rS.docs.map(d => d.data());
                let gms = gS.docs.map(d => {
                    const r = rt.filter(v => v.gameId === d.id); const sc = r.map(v => v.score || 0).sort((a,b)=>a-b);
                    let avgS = (r.length >= 5) ? sc.slice(1, -1).reduce((a,c)=>a+c,0)/(sc.length-2) : (r.length > 0 ? sc.reduce((a,c)=>a+c,0)/r.length : 0);
                    const df = r.map(v => v.difficulty || 0).filter(v => v > 0);
                    let avgD = df.length > 0 ? df.reduce((a,c)=>a+c,0)/df.length : 0;
                    return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: avgD, voteCount: r.length };
                });
                gms.sort((a, b) => {
                    const a3 = a.voteCount >= 3; const b3 = b.voteCount >= 3;
                    if(a3 !== b3) return b3 - a3;
                    return sortType === "score_asc" ? a.avgScore - b.avgScore : b.avgScore - a.avgScore;
                });
                list.innerHTML = gms.map((g, i) => `
                    <tr class="hover:bg-white/5 border-b border-white/5 transition font-bold font-bold font-bold font-bold font-bold">
                        <td class="p-5 text-blue-400 font-bold font-bold font-bold font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                        <td class="p-5 text-left font-black font-bold font-bold font-bold font-bold font-bold"><div class="text-sm font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${g.name}</div><div class="text-[9px] opacity-40 font-bold font-bold font-bold font-bold font-bold font-bold font-bold">Votes: ${g.voteCount}</div></td>
                        <td class="p-2 font-bold font-bold font-bold font-bold font-bold font-bold">
                            <div class="flex flex-col items-center gap-1 font-bold font-bold font-bold font-bold">
                                <span onclick="openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-lg cursor-pointer font-black font-bold font-bold">${g.avgScore.toFixed(1)}</span>
                                <div onclick="openRate('diff','${g.id}','${g.name}')" class="flex text-[10px] font-bold font-bold font-bold">
                                    ${Array(5).fill(0).map((_, idx) => `<span class="${idx < Math.round(g.avgDiff) ? 'text-blue-400' : 'text-gray-700'} font-bold font-bold font-bold">★</span>`).join('')}
                                </div>
                            </div>
                        </td>
                        <td class="p-5 font-bold font-bold font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black font-bold font-bold font-bold font-bold font-bold">기록</button></td>
                    </tr>`).join('');
            } catch (e) { list.innerHTML = "Error"; }
        };

        // [기록 상세 및 관리]
        window.openSchedules = async (id, n, targetSid = null) => {
            activeGameId = id; document.getElementById('schedule-game-title').innerText = n;
            toggleModal('schedule-modal', true);
            const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id)));
            const schedules = sSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
            document.getElementById('schedule-list').innerHTML = schedules.map(s => `
                <div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold font-bold font-bold">
                    <div class="text-left font-bold font-bold font-bold"><div class="text-sm text-green-300 font-bold font-bold">${s.name}</div><div class="text-[9px] text-gray-500 font-bold font-bold">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs font-bold font-bold">▶</span>
                </div>`).join('');
            if(targetSid) setTimeout(() => openScheduleDetail(targetSid), 100);
        };

        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid;
            const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]);
            const s = sS.data(); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            
            document.getElementById('detail-title').innerText = s.name;
            document.getElementById('detail-date').innerText = s.createdAt ? new Date(s.createdAt.seconds*1000).toLocaleDateString() : '';
            
            // 삭제 버튼 노출 (참가자 중 본인이 있는 경우)
            document.getElementById('detail-delete-btn').classList.toggle('hidden', !(s.members || []).includes(currentUser.pin));

            const podium = document.getElementById('detail-podium');
            podium.classList.remove('hidden');
            document.getElementById('detail-rank-result').innerHTML = (s.ranks || []).map((p, i) => `
                <div class="flex justify-between font-bold font-bold"><span class="text-xs text-yellow-500 font-black">${i+1}위</span><span class="text-xs font-bold font-bold">${uMap[p]?.name || 'Unknown'}</span></div>`).join('') || "<p class='text-[10px] opacity-30 font-bold'>순위 정보가 없습니다.</p>";

            renderComments(s.feed || [], uMap);
            toggleModal('detail-modal', true);
        };

        function renderComments(feed, uMap) {
            document.getElementById('detail-comment-feed').innerHTML = feed.sort((a,b)=>b.time-a.time).map((l, idx) => `
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center font-bold">
                    <div class="text-xs font-bold font-bold font-bold"><span class="text-blue-300 font-black">${uMap[l.userPin]?.name || '?'}:</span> ${l.text}</div>
                    ${l.userPin === currentUser.pin ? `<button onclick="deleteComment(${idx})" class="text-red-500 px-2 font-bold font-bold">✕</button>` : ''}
                </div>`).join('') || "<p class='opacity-20 text-center py-4 font-bold'>첫 코멘트를 남겨보세요!</p>";
        }

        // [기록 추가 UI 로직]
        window.openAddSchedule = async () => {
            selectedMembers = [currentUser.pin];
            const uS = await getDocs(collection(db, "users"));
            document.getElementById('member-selector').innerHTML = uS.docs.map(d => `
                <div onclick="toggleMemberSelect('${d.id}', this)" class="member-chip p-2 rounded-xl text-[10px] text-center font-bold ${d.id === currentUser.pin ? 'selected' : ''}">
                    ${d.data().name}
                </div>`).join('');
            toggleModal('add-schedule-modal', true);
        };

        window.toggleMemberSelect = (pin, el) => {
            if(pin === currentUser.pin) return; // 본인은 필수
            if(selectedMembers.includes(pin)) {
                selectedMembers = selectedMembers.filter(p => p !== pin);
                el.classList.remove('selected');
            } else {
                selectedMembers.push(pin);
                el.classList.add('selected');
            }
        };

        window.submitSchedule = async () => {
            const name = document.getElementById('new-schedule-name').value.trim();
            if(!name) return alert("제목을 입력하세요.");
            await addDoc(collection(db, "schedules"), {
                gameId: activeGameId, gameName: document.getElementById('schedule-game-title').innerText,
                gameCategory: selectedCategory, name, members: selectedMembers,
                ranks: [], feed: [], createdAt: serverTimestamp()
            });
            toggleModal('add-schedule-modal', false); openSchedules(activeGameId, document.getElementById('schedule-game-title').innerText);
        };

        window.submitComment = async () => {
            const input = document.getElementById('comment-input');
            if(!input.value.trim()) return;
            const sRef = doc(db, "schedules", activeScheduleId);
            const sSnap = await getDoc(sRef);
            const feed = sSnap.data().feed || [];
            feed.push({ userPin: currentUser.pin, text: input.value.trim(), time: Date.now() });
            await updateDoc(sRef, { feed });
            input.value = ""; openScheduleDetail(activeScheduleId);
        };

        window.deleteComment = async (idx) => {
            if(!confirm("삭제하시겠습니까?")) return;
            const sRef = doc(db, "schedules", activeScheduleId);
            const sSnap = await getDoc(sRef);
            let feed = sSnap.data().feed || [];
            feed.splice(feed.length - 1 - idx, 1); // 역순 정렬 고려
            await updateDoc(sRef, { feed });
            openScheduleDetail(activeScheduleId);
        };

        window.deleteSchedule = async () => {
            if(!confirm("이 기록을 완전히 삭제하시겠습니까?")) return;
            await deleteDoc(doc(db, "schedules", activeScheduleId));
            toggleModal('detail-modal', false); openSchedules(activeGameId, document.getElementById('schedule-game-title').innerText);
        };

        // [순위 등록 팝업 (마이페이지용)]
        window.openRankPopup = async () => {
            const sSnap = await getDoc(doc(db, "schedules", activeScheduleId));
            const members = sSnap.data().members || [];
            const uS = await getDocs(collection(db, "users"));
            const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            
            let currentRanks = sSnap.data().ranks || [];
            let resultRanks = [...currentRanks];

            // 순위 선택 UI (간단화)
            let promptText = members.map((m, i) => `${i+1}. ${uMap[m]?.name}`).join('\n');
            let res = prompt("순위대로 번호를 입력하세요 (예: 1,2,3...)\n현재 멤버:\n" + promptText);
            
            if(res) {
                const indices = res.split(',').map(v => parseInt(v.trim()) - 1);
                const newRanks = indices.map(idx => members[idx]);
                await updateDoc(doc(db, "schedules", activeScheduleId), { ranks: newRanks });
                openScheduleDetail(activeScheduleId);
            }
        };

        // [초기화 및 공통 로직]
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", d.pin)); if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home'); return; } } showPage('page-login'); });
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.navToDetailFromHistory = (cat, gid, gname, sid) => { closeAllModals(); selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); setTimeout(() => openSchedules(gid, gname, sid), 400); };
        async function loadMyHistory() { const listDiv = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sSnap = await getDocs(q); listDiv.innerHTML = sSnap.docs.map(d => { const s = d.data(); const rIdx = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1; return `<div onclick="navToDetailFromHistory('${s.gameCategory}', '${s.gameId}', '${s.gameName}', '${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 cursor-pointer hover:bg-white/10 font-bold"><div><span class="text-[8px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.gameCategory}</span><div class="text-sm font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.gameName} - ${s.name}</div></div><div class="text-yellow-400 text-xs font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${rIdx > -1 ? (rIdx + 1) + '위' : '미기록'}</div></div>`; }).join('') || "No Records"; }
        window.openRate = (t, id, n) => { activeGameId = id; document.getElementById('rate-modal-title').innerText = n; document.getElementById('rate-score-section').classList.toggle('hidden', t !== 'score'); document.getElementById('rate-diff-section').classList.toggle('hidden', t !== 'diff'); toggleModal('rate-modal', true); };
        window.submitRating = async (t) => { const v = (t === 'score') ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-range').value); try { const q = query(collection(db, "ratings"), where("gameId", "==", activeGameId), where("userPin", "==", currentUser.pin)); const snap = await getDocs(q); const rD = { gameId: activeGameId, userPin: currentUser.pin, updatedAt: serverTimestamp() }; rD[t === 'score' ? 'score' : 'difficulty'] = v; if(!snap.empty) await updateDoc(doc(db, "ratings", snap.docs[0].id), rD); else await addDoc(collection(db, "ratings"), rD); alert("성공!"); toggleModal('rate-modal', false); renderList(); } catch(e) { alert("실패"); } };
        async function loadChatInfo() { const s = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); document.getElementById('chat-info-list').innerHTML = s.docs.map(d => `<div class='glass p-6 rounded-3xl text-left border border-white/10 font-bold'><h4 class='text-blue-300 mb-2 font-bold font-bold font-bold font-bold font-bold'>${d.data().title}</h4><p class='text-sm opacity-80 whitespace-pre-wrap font-bold font-bold font-bold font-bold font-bold'>${d.data().content}</p></div>`).join('') || "No info."; }
        window.navToStats = async () => { showPage('page-stats'); const [rS, gS, uS] = await Promise.all([getDocs(collection(db,"ratings")), getDocs(collection(db,"games")), getDocs(collection(db,"users"))]); const uM = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); const vC = rS.docs.map(d=>d.data()).reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {}); document.getElementById('vote-king').innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold'><div class='flex items-center gap-3 font-bold font-bold font-bold font-bold'><img src='${uM[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8'><span class='text-xs'>${uM[v[0]]?.name || '?'}</span></div><b class='text-blue-400 text-xs font-bold'>${v[1]}회</b></div>`).join(''); const gC = gS.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {}); document.getElementById('game-add-king').innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold'><div class='flex items-center gap-3 font-bold'><img src='${uM[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold font-bold font-bold'><span class='text-xs'>${uM[v[0]]?.name || '?'}</span></div><b class='text-green-400 text-xs font-bold font-bold font-bold'>${v[1]}개</b></div>`).join(''); };
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
    </script>
</body>
</html>
