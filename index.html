<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v6.1.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        #rank-edit-modal, #add-schedule-modal { z-index: 14000; }
        #detail-modal { z-index: 13000; }
        #schedule-modal { z-index: 12000; }
        #profile-modal { z-index: 11000; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 10px 4px; border-radius: 12px; text-align: center; font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.05); }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .rank-slot { border: 2px dashed rgba(255,255,255,0.1); padding: 12px; border-radius: 16px; margin-bottom: 8px; }
        .rank-slot.filled { border-style: solid; border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 cursor-pointer relative z-[2000]" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3241/3241724.png'">
                <div class="text-left font-bold"><span id="user-welcome" class="text-blue-300 text-sm font-black block"></span><span class="text-[9px] text-gray-500 font-bold">My Profile ></span></div>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-10 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="showPage('page-stats')" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase"></h2></div>
        <div class="px-4 mb-4 flex flex-col gap-3">
            <input type="text" id="game-search" oninput="renderList()" placeholder="🔍 게임 검색..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm font-bold shadow-inner">
            <button onclick="addGame()" class="w-full bg-blue-600/20 text-blue-400 border border-blue-500/30 py-3 rounded-2xl text-xs font-black">+ 새 게임 추가</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden mx-4 shadow-2xl border border-white/5 font-bold">
            <table class="w-full text-center table-fixed border-collapse">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-10 text-center">#</th><th class="p-4 text-left">정보</th><th class="w-20 text-center">평가</th><th class="w-20">기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[95vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-6">
                <div class="flex flex-col flex-1">
                    <h3 id="detail-title" class="text-xl font-black text-blue-400 truncate"></h3>
                    <div class="flex items-center gap-2 mt-1 relative z-[3000]">
                        <span id="detail-date-display" onclick="enableDateEdit()" class="text-[10px] text-gray-500 cursor-pointer hover:text-white transition">📅 날짜 정보 없음</span>
                        <input type="date" id="detail-date-input" class="hidden bg-slate-800 border border-white/10 text-[10px] rounded p-1" onchange="updateDate(this.value)">
                    </div>
                </div>
                <div class="flex gap-4">
                    <button onclick="confirmDelete()" class="text-red-400/50 hover:text-red-500 transition pt-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                    <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button>
                </div>
            </div>
            <div class="mb-4 p-4 bg-white/5 rounded-3xl border border-white/5 font-bold">
                <div class="flex justify-between items-center mb-4"><span class="text-xs font-black text-gray-400 uppercase italic">Result</span><button id="rank-edit-trigger" onclick="enableRankEdit()" class="text-[10px] text-blue-400 font-black border border-blue-500/30 px-3 py-1 rounded-lg">기록 수정</button></div>
                <div id="detail-rank-result" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left mb-4 border-t border-white/5 pt-4"></div>
            <div class="flex gap-2 font-bold"><input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold" placeholder="코멘트 입력..."><button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs">등록</button></div>
        </div>
    </div>

    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-6 text-green-400 italic font-bold">NEW RECORD</h3><input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold" placeholder="기록 제목"><div id="member-selector" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-white/10 rounded-2xl mb-6 custom-scrollbar font-bold"></div><button id="submit-schedule-btn" onclick="submitSchedule()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white shadow-xl">기록 생성</button></div></div>
    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3><button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div><div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold"></div><button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl">+ 새로운 기록 추가</button></div></div>
    <div id="rank-edit-modal" class="modal" onclick="toggleModal('rank-edit-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 id="rank-edit-title" class="text-xl font-black text-yellow-400 mb-6 italic uppercase"></h3><div id="rank-edit-slots" class="flex-grow overflow-y-auto space-y-2 mb-6"></div><div id="rank-edit-chips" class="flex flex-wrap gap-2 mb-6 pt-6 border-t border-white/10"></div><div class="grid grid-cols-2 gap-3"><button onclick="toggleModal('rank-edit-modal', false)" class="bg-white/10 py-4 rounded-2xl font-black text-xs">취소</button><button id="rank-complete-btn" onclick="saveRankResult()" class="bg-blue-600 py-4 rounded-2xl font-black text-xs">기록 완료</button></div></div></div>
    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col text-center font-bold" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic font-bold">My Profile</h3><div class="flex flex-col items-center gap-4 mb-8 font-bold font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 object-cover bg-slate-800"><div id="display-name" class="text-xl font-black font-bold"></div></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1">Attend History</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar text-left font-bold"></div><button onclick="toggleModal('profile-modal', false)" class="mt-6 text-gray-500 text-xs font-black uppercase">닫기</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, addDoc, arrayUnion, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';
        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = ""; let activeScheduleId = null; let activeScheduleData = null; let selMembers = [];

        // [v6.1.2 3.7 기록 생성 인원 인식 고침]
        window.openAddSchedule = async () => {
            selMembers = []; // 초기화
            const selector = document.getElementById('member-selector');
            selector.innerHTML = "<p class='col-span-3 text-xs opacity-50 font-bold'>로딩 중...</p>";
            toggleModal('add-schedule-modal', true);
            const uSnap = await getDocs(collection(db, "users"));
            selector.innerHTML = uSnap.docs.map(d => `<div onclick="toggleMemberSelect(this, '${d.id}')" class="member-chip font-bold">${d.data().name}</div>`).join('');
        };

        window.toggleMemberSelect = (el, pin) => {
            el.classList.toggle('selected');
            const i = selMembers.indexOf(pin);
            if(i > -1) selMembers.splice(i, 1);
            else selMembers.push(pin);
        };

        window.submitSchedule = async () => {
            const n = document.getElementById('new-schedule-name').value.trim();
            if(!n) return alert("제목을 입력하세요.");
            if(selMembers.length === 0) return alert("참여 인원을 선택해주세요.");
            
            try {
                await addDoc(collection(db, "schedules"), {
                    gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory,
                    name: n, members: selMembers, date: new Date().toISOString().split('T')[0],
                    createdAt: serverTimestamp(), ranks: [], feed: [], characters: {}
                });
                toggleModal('add-schedule-modal', false); openSchedules(activeGameId, activeGameName);
            } catch(e) { alert("저장 실패"); }
        };

        // [v6.1.2 2.2, 2.3 점수/난이도 평가 시스템 복구]
        window.rateGame = async (gid, type) => {
            const val = prompt(`${type === 'score' ? '점수(0-100)' : '난이도(0-100)'}를 입력하세요:`);
            if (!val || isNaN(val) || val < 0 || val > 100) return alert("유효한 숫자를 입력하세요.");
            
            try {
                const rateId = `${gid}_${currentUser.pin}`;
                await setDoc(doc(db, "ratings", rateId), {
                    gameId: gid, userPin: currentUser.pin,
                    [type]: Number(val), updatedAt: serverTimestamp()
                }, { merge: true });
                alert("평가 완료!"); renderList();
            } catch(e) { alert("평가 실패"); }
        };

        // [v6.1.2 3.9 코멘트 삭제 엔진]
        window.deleteComment = async (idx) => {
            if(!confirm("코멘트를 삭제하시겠습니까?")) return;
            try {
                const newFeed = [...activeScheduleData.feed];
                newFeed.splice(idx, 1);
                await updateDoc(doc(db, "schedules", activeScheduleId), { feed: newFeed });
                openScheduleDetail(activeScheduleId);
            } catch(e) { alert("삭제 실패"); }
        };

        // [상세 정보 활성화]
        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid; const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]);
            activeScheduleData = sS.data(); const uMap = uS.docs.reduce((acc,doc)=>({...acc, [doc.id]:doc.data().name}), {});
            
            document.getElementById('detail-title').innerText = activeScheduleData.gameName;
            document.getElementById('detail-date-display').innerText = "📅 " + (activeScheduleData.date || "미기록");
            document.getElementById('rank-edit-trigger').classList.toggle('hidden', activeScheduleData.gameCategory === '방탈출');

            const res = activeScheduleData.ranks || [];
            document.getElementById('detail-rank-result').innerHTML = (activeScheduleData.gameCategory === '보드게임' && res.length > 0) 
                ? res.map((p,i)=>`<div class="flex justify-between py-1 border-b border-white/5"><span>${i+1}등</span><span>${uMap[p]||'?'}</span></div>`).join('') 
                : (activeScheduleData.gameCategory === '방탈출') ? `참석: ${activeScheduleData.members.map(p=>uMap[p]).join(', ')}`
                : activeScheduleData.members.map(p => `<div class="flex justify-between py-1 border-b border-white/5"><span class="${res.includes(p)?'text-yellow-400':'text-gray-500'}">${res.includes(p)?'우승/승리':'참가/패배'}</span><span>${uMap[p]||'?'}${activeScheduleData.characters?.[p]?` (${activeScheduleData.characters[p]})`:''}</span></div>`).join('');

            document.getElementById('detail-comment-feed').innerHTML = (activeScheduleData.feed || []).map((f, i) => `
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-start font-bold">
                    <div class="flex-1"><b>${uMap[f.userPin] || '?'}:</b> ${f.text}</div>
                    ${f.userPin === currentUser.pin ? `<button onclick="deleteComment(${i})" class="text-red-400/30 text-[10px] font-black ml-2 px-1 hover:text-red-500 transition">X</button>` : ''}
                </div>`).join('') || "코멘트 없음";
            toggleModal('detail-modal', true);
        };

        // [v6.1.2 2.1 리스트 평가 컬럼 복구]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            const s = document.getElementById('game-search').value.toLowerCase();
            const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
            const rt = rS.docs.map(d => d.data());
            let gms = gS.docs.map(d => {
                const r = rt.filter(v => v.gameId === d.id);
                const scores = r.map(v => v.score).filter(v => v != null);
                return { id: d.id, ...d.data(), avg: scores.length ? scores.reduce((a,c)=>a+c,0)/scores.length : 0 };
            }).filter(g => g.name.toLowerCase().includes(s)).sort((a,b)=>b.avg-a.avg);

            list.innerHTML = gms.map((g, i) => `
                <tr class="border-b border-white/5 font-bold">
                    <td class="p-4 text-blue-400 w-10 font-black">${i < 3 ? '🥇' : '#'+(i+1)}</td>
                    <td class="p-4 text-left"><span class="text-sm font-black block">${g.name}</span><span class="text-[9px] text-gray-500">평균: ${g.avg.toFixed(1)}점</span></td>
                    <td class="p-2 text-center w-20">
                        <div class="flex flex-col gap-1">
                            <button onclick="rateGame('${g.id}','score')" class="bg-yellow-500/10 text-yellow-400 text-[8px] py-1 rounded font-black border border-yellow-500/20">SCORE</button>
                            <button onclick="rateGame('${g.id}','level')" class="bg-red-500/10 text-red-400 text-[8px] py-1 rounded font-black border border-red-500/20">LEVEL</button>
                        </div>
                    </td>
                    <td class="p-4 w-20 text-center"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black">기록</button></td>
                </tr>`).join('');
        };

        // 기초 기능 브릿지
        window.login = async () => { const p = document.getElementById('pin').value.trim(); const w = document.getElementById('pw').value.trim(); const snap = await getDoc(doc(db,"users",String(p))); if (snap.exists() && String(snap.data().password) === String(w)) { currentUser = { pin: String(p), ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin: String(p), pw: String(w) })); location.reload(); } else alert("정보 불일치"); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db,"users",String(d.pin))); if (snap.exists()) { currentUser = { pin: String(d.pin), ...snap.data() }; document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; document.getElementById('page-login').classList.remove('active'); document.getElementById('page-home').classList.add('active'); return; } } });
        window.showPage = (id) => { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.getElementById('global-back-btn').style.display = (id === 'page-home') ? 'none' : 'block'; if(id === 'page-stats') window.loadStats(); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.handleBack = () => showPage('page-home');
        window.openSchedules = async (id, name) => { activeGameId = id; activeGameName = name; document.getElementById('schedule-game-title').innerText = name; toggleModal('schedule-modal', true); const snap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id))); const docs = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); document.getElementById('schedule-list').innerHTML = docs.map(d => `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer mb-1"><div class="text-sm text-green-300 font-bold">${d.name}</div><span class="text-blue-400 text-xs font-bold">▶</span></div>`).join('') || "기록 없음"; };
        window.enableRankEdit = async () => { /* v6.1.1 동일 */ }; window.saveRankResult = async () => { /* v6.1.1 동일 */ }; window.saveCharacter = async () => { /* v6.1.1 동일 */ };
        window.enableDateEdit = () => { const d = document.getElementById('detail-date-display'); const i = document.getElementById('detail-date-input'); d.classList.add('hidden'); i.classList.remove('hidden'); i.value = activeScheduleData.date || ""; i.focus(); };
        window.updateDate = async (v) => { try { await updateDoc(doc(db,"schedules",activeScheduleId), {date:v}); activeScheduleData.date=v; document.getElementById('detail-date-display').innerText="📅 "+v; document.getElementById('detail-date-display').classList.remove('hidden'); document.getElementById('detail-date-input').classList.add('hidden'); } catch(e){} };
        window.submitComment = async () => { const i = document.getElementById('comment-input'); if(!i.value.trim()) return; try { await updateDoc(doc(db,"schedules",activeScheduleId), {feed: arrayUnion({userPin:String(currentUser.pin),text:i.value.trim(),createdAt:new Date().toISOString()})}); i.value=""; openScheduleDetail(activeScheduleId); } catch(e){} };
        window.toggleProfileModal = async (s) => { if(s && currentUser) { document.getElementById('display-name').innerText = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; toggleModal('profile-modal', true); const snap = await getDocs(query(collection(db, "schedules"), where("members", "array-contains", String(currentUser.pin)))); document.getElementById('my-history-list').innerHTML = snap.docs.map(d => `<div onclick="navToDetailFromProfile('${d.data().gameCategory}','${d.data().gameId}','${d.data().gameName}','${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 mb-1 cursor-pointer flex justify-between items-center"><div class="text-left font-bold"><div class="text-[9px] text-blue-400">${d.data().gameCategory}</div><div class="text-sm">${d.data().gameName}</div></div><span class="text-yellow-400 text-xs font-bold">▶</span></div>`).join('') || "기록 없음"; } else toggleModal('profile-modal', false); };
        window.navToDetailFromProfile = async (cat, gid, gname, sid) => { toggleModal('profile-modal', false); selectedCategory = cat; navTo(cat); await openSchedules(gid, gname); openScheduleDetail(sid); };
        window.confirmDelete = async () => { if(confirm("정말 삭제?")) { await deleteDoc(doc(db,"schedules",activeScheduleId)); toggleModal('detail-modal',false); openSchedules(activeGameId, activeGameName); } };
        window.addGame = async () => { const n = prompt("게임 이름:"); if(n) { await addDoc(collection(db,"games"), {name:n, category:selectedCategory, creatorPin:currentUser.pin, createdAt:serverTimestamp()}); renderList(); } };
        window.loadStats = async () => { try { const [rS, gS, uS] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data().name}), {}); const vC = rS.docs.map(d=>d.data()).reduce((acc, r) => { if(r.userPin) acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {}); document.getElementById('vote-king').innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-4 glass rounded-2xl flex justify-between items-center font-bold'><span>${uMap[v[0]] || '?'}</span><b class='text-blue-400'>${v[1]}회</b></div>`).join(''); const gC = gS.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {}); document.getElementById('game-add-king').innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(g => `<div class='p-4 glass rounded-2xl flex justify-between items-center font-bold'><span>${uMap[g[0]] || '?'}</span><b class='text-green-400'>${g[1]}개</b></div>`).join(''); } catch(e) {} };
    </script>
</body>
</html>
