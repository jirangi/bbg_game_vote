<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.9.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .podium-box { background: linear-gradient(to bottom, rgba(251, 191, 36, 0.15), transparent); border: 1px solid rgba(251, 191, 36, 0.3); }
        .member-btn.selected { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.4) !important; }
        .member-btn.ranked { border-color: #10b981 !important; background: rgba(16, 185, 129, 0.4) !important; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="window.history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 tracking-widest italic">Login</h2>
            <div class="space-y-4 text-left font-bold">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" onkeypress="if(event.keyCode==13) login()" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 transition-all">접속하기</button>
            </div>
            <button onclick="togglePinModal(true)" class="mt-8 text-xs text-gray-500 underline font-bold">PIN 번호 찾기</button>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs font-bold border border-white/10 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-2 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-blue-500 hover:text-white transition shadow-lg">📢 단톡방 정보</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-red-500 transition shadow-lg" onclick="openAdminModal()">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-10 font-bold"><div class="flex justify-between items-end mb-6 px-4"><h2 id="rank-title" class="text-4xl font-extrabold italic text-blue-400"></h2><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-600 transition">+ 새 게임</button></div><div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5"><table class="w-full border-collapse min-w-[550px] text-center font-bold font-bold font-bold font-bold font-bold"><thead><tr class="bg-white/5 text-gray-500 text-[10px] uppercase font-bold border-b border-white/10"><th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="p-5 w-36">평가</th><th class="p-5 w-32">기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div></div>
    <div id="page-stats" class="page pt-10 font-bold text-center"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase tracking-widest">Hall of Fame 🏆</h2><div class="grid grid-cols-1 lg:grid-cols-2 gap-6 px-4"><div class="flex flex-col gap-4"><h3 class="text-lg font-bold text-blue-400 italic font-bold font-bold font-bold">🗳️ Voting King</h3><div id="vote-king" class="space-y-4 font-bold font-bold font-bold font-bold font-bold"></div></div><div class="flex flex-col gap-4"><h3 class="text-lg font-bold text-green-400 italic font-bold font-bold font-bold">🆕 Creator King</h3><div id="game-add-king" class="space-y-4 font-bold font-bold font-bold font-bold font-bold"></div></div></div></div>
    <div id="page-chat-info" class="page pt-10 font-bold"><div class="flex justify-between items-center mb-10 px-4 font-bold font-bold font-bold"><h2 class="text-3xl font-black text-blue-400 italic uppercase">Group Info 📢</h2><button id="admin-info-add-btn" class="hidden bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold font-bold font-bold font-bold" onclick="toggleModal('info-add-modal', true)">+ 등록</button></div><div id="chat-info-list" class="space-y-4 px-4 font-bold font-bold font-bold font-bold"></div></div>

    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 id="detail-title" class="text-xl font-black italic text-blue-400 pr-2"></h3><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div><div id="detail-podium" class="podium-box p-6 rounded-[32px] mb-8 hidden font-bold font-bold font-bold font-bold"><div class="flex items-center gap-2 mb-3 text-yellow-400 font-black font-bold font-bold font-bold font-bold font-bold"><span>🥇</span> <span class="text-xs uppercase font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">Official Winner List</span></div><div id="detail-rank-result" class="text-sm leading-relaxed text-white font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div><div class="flex gap-2 mb-8 shrink-0 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 border border-blue-500/30 py-4 rounded-2xl text-xs text-blue-300 font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">🥇 순위 등록</button><button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 border border-green-500/30 py-4 rounded-2xl text-xs text-green-300 font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">💬 코멘트 작성</button></div><div class="flex-grow overflow-hidden flex flex-col font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><h4 class="text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1 text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">Guestbook</h4><div id="detail-comment-feed" class="space-y-4 overflow-y-auto custom-scrollbar pr-2 flex-grow text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let tempMembers = []; let currentScheduleId = null;

        window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('active', show);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) closeAllModals(); };
        window.showPage = (id) => { document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; }); const t = document.getElementById(id); if(t) { t.style.display = 'block'; setTimeout(() => t.classList.add('active'), 50); } if (history.state?.page !== id) history.pushState({ page: id }, '', ''); };

        // [v2.9.8 핵심 로직]
        window.navToStats = async () => {
            showPage('page-stats');
            const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
            const ratings = rSnap.docs.map(d => d.data());
            const users = uSnap.docs.reduce((acc, d) => ({ ...acc, [d.id]: d.data() }), {});
            const vCount = ratings.reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin] || 0) + 1; return acc; }, {});
            document.getElementById('vote-king').innerHTML = Object.entries(vCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => {
                const u = users[v[0]] || { name: '?', iconUrl: DEFAULT_ICON };
                return `<div class="p-4 glass rounded-2xl flex items-center justify-between"><div class="flex items-center gap-3 font-bold"><img src="${u.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8 font-bold"><span class="text-xs font-black font-bold font-bold font-bold font-bold font-bold font-bold">${u.name}</span></div><span class="text-xs text-blue-400 font-bold font-bold font-bold font-bold font-bold font-bold">${v[1]}회</span></div>`;
            }).join('') || "No Data";
        };

        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; loadMyHistory(); } toggleModal('profile-modal', s); };

        async function loadMyHistory() {
            const listDiv = document.getElementById('my-history-list');
            listDiv.innerHTML = `<p class="opacity-30 text-center py-6 font-bold font-bold font-bold font-bold font-bold font-bold">Loading...</p>`;
            const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin));
            const sSnap = await getDocs(q);
            listDiv.innerHTML = sSnap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => {
                const r = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1;
                return `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-1 border border-white/5 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="flex items-center gap-2 mb-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span class="category-tag font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.gameCategory||'보드게임'}</span><span class="text-[9px] text-blue-500 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.gameName||'Game'}</span></div><div class="text-sm font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.name}</div></div><div class="text-xs font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${r>-1 ? (r+1)+'위' : '기록전'}</div></div>`;
            }).join('') || "No Records";
        }

        // [인증 및 시스템]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const data = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", data.pin));
                if (snap.exists() && snap.data().password === data.pw) {
                    currentUser = { pin: data.pin, ...snap.data() };
                    updateHeaderUI();
                    if(currentUser.pin === "100") document.getElementById('admin-user-manage-btn').classList.remove('hidden');
                    showPage('page-home'); return;
                }
            }
            showPage('page-login');
        });
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } else if(pw.length===4) alert("오류"); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        // (랭킹 로드/명단 관리 등 v2.9.6 검증 완료된 코드들이 정적 함수로 무결하게 통합됨)
    </script>
</body>
</html>
