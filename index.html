<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v6.0.25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #detail-modal { z-index: 11000 !important; }
        #schedule-modal { z-index: 10500 !important; }
        #profile-modal { z-index: 10400 !important; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .rank-slot { border: 2px dashed rgba(255,255,255,0.1); padding: 12px; border-radius: 16px; margin-bottom: 8px; transition: 0.3s; }
        .rank-slot.filled { border-style: solid; border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 cursor-pointer relative z-[2000]" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3241/3241724.png'">
                <div class="text-left font-bold"><span id="user-welcome" class="text-blue-300 text-sm font-black block"></span><span class="text-[9px] text-gray-500 font-bold">My Profile ></span></div>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="showPage('page-stats')" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4 font-bold"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase font-bold"></h2></div>
        <div class="px-4 mb-4 flex flex-col gap-3">
            <input type="text" id="game-search" oninput="renderList()" placeholder="🔍 게임 검색..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm font-bold shadow-inner">
            <button onclick="addGame()" class="w-full bg-blue-600/20 text-blue-400 border border-blue-500/30 py-3 rounded-2xl text-xs font-black hover:bg-blue-600 hover:text-white transition">+ 새 게임 추가</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden mx-4 shadow-2xl border border-white/5 font-bold">
            <table class="w-full text-center table-fixed border-collapse">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-12 text-center font-bold">#</th><th class="p-4 text-left font-bold">정보</th><th class="w-24 text-center font-bold">평가</th><th class="w-20 font-bold">기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[95vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 font-bold">
                <div class="flex flex-col min-w-0 flex-1 font-bold">
                    <h3 id="detail-title" class="text-xl font-black text-blue-400 truncate"></h3>
                    <span id="detail-date" class="text-[10px] text-gray-500 font-bold"></span>
                </div>
                <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button>
            </div>
            
            <div id="rank-manager-container" class="mb-6 p-4 bg-white/5 rounded-3xl border border-white/5">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-black text-gray-400 uppercase italic">Rank Result</span>
                    <button id="rank-edit-btn" onclick="enableRankEdit()" class="text-[10px] text-blue-400 font-black border border-blue-500/30 px-3 py-1 rounded-lg">순위 수정</button>
                </div>
                <div id="detail-rank-result" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar font-bold"></div>
            </div>

            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left mb-4 font-bold border-t border-white/5 pt-4"></div>
            <div class="flex gap-2 font-bold"><input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold" placeholder="코멘트 입력..."><button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs font-bold">등록</button></div>
        </div>
    </div>

    <div id="rank-edit-modal" class="modal" onclick="toggleModal('rank-edit-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-xl font-black text-yellow-400 mb-6 italic uppercase">순위 직접 지정</h3>
            <div class="text-[10px] text-gray-500 mb-4">* 참여한 멤버를 순서대로 클릭하여 순위를 확정하세요.</div>
            <div id="rank-edit-slots" class="flex-grow overflow-y-auto space-y-2 mb-6 custom-scrollbar"></div>
            <div class="grid grid-cols-2 gap-3 font-bold">
                <button onclick="toggleModal('rank-edit-modal', false)" class="bg-white/10 py-4 rounded-2xl font-black text-xs">취소</button>
                <button onclick="saveRankResult()" class="bg-blue-600 py-4 rounded-2xl font-black text-xs">순위 저장</button>
            </div>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3><button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold font-bold">✕</button></div><div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold"></div><button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl">+ 새로운 기록 추가</button></div></div>
    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col text-center font-bold" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic font-bold">My Profile</h3><div class="flex flex-col items-center gap-4 mb-8 font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 object-cover bg-slate-800"><div id="display-name" class="text-xl font-black font-bold"></div></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1 font-bold">Attend History</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar text-left font-bold"></div><button onclick="toggleModal('profile-modal', false)" class="mt-6 text-gray-500 text-xs font-black uppercase font-bold">닫기</button></div></div>
    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center font-bold"><div class="glass p-8 rounded-3xl shadow-2xl font-bold"><h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic font-bold">Game Archive</h2><div class="space-y-4 font-bold"><input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold"><input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold"><button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-2 font-bold">접속</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, addDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        let currentUser = null; let activeScheduleId = null; let activeScheduleData = null; let tempRanks = [];

        // [v6.0.25 3.3 순위 지정 시스템]
        window.enableRankEdit = async () => {
            if(!activeScheduleData) return;
            const slotsDiv = document.getElementById('rank-edit-slots');
            slotsDiv.innerHTML = "";
            tempRanks = [];
            
            // 참여 멤버 리스트 가져오기
            const uSnap = await getDocs(collection(db, "users"));
            const uMap = uSnap.docs.reduce((acc,d)=>({...acc, [d.id]:d.data().name}), {});
            
            // 1위부터 N위까지 슬롯 생성
            activeScheduleData.members.forEach((_, i) => {
                const slot = document.createElement('div');
                slot.className = "rank-slot flex justify-between items-center";
                slot.innerHTML = `<span class="text-blue-400 font-black">${i+1}위</span><div id="slot-name-${i}" class="text-sm opacity-30 font-bold">미지정</div>`;
                slotsDiv.appendChild(slot);
            });

            // 선택 가능한 멤버 칩 생성
            const chipContainer = document.createElement('div');
            chipContainer.className = "flex flex-wrap gap-2 mt-6 pt-6 border-t border-white/10";
            activeScheduleData.members.forEach(pin => {
                const chip = document.createElement('div');
                chip.className = "bg-white/10 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-blue-600";
                chip.innerText = uMap[pin] || pin;
                chip.onclick = () => selectMemberForRank(pin, uMap[pin], chip);
                chipContainer.appendChild(chip);
            });
            slotsDiv.appendChild(chipContainer);
            
            toggleModal('rank-edit-modal', true);
        };

        window.selectMemberForRank = (pin, name, chipEl) => {
            if(tempRanks.includes(pin)) return;
            const rankIdx = tempRanks.length;
            if(rankIdx >= activeScheduleData.members.length) return;

            tempRanks.push(pin);
            const slotName = document.getElementById(`slot-name-${rankIdx}`);
            slotName.innerText = name;
            slotName.classList.remove('opacity-30');
            slotName.classList.add('text-white');
            slotName.parentElement.classList.add('filled');
            chipEl.style.display = 'none';
        };

        window.saveRankResult = async () => {
            if(tempRanks.length !== activeScheduleData.members.length) {
                return alert("모든 멤버의 순위를 지정해 주세요.");
            }
            try {
                await updateDoc(doc(db, "schedules", activeScheduleId), { ranks: tempRanks });
                toggleModal('rank-edit-modal', false);
                openScheduleDetail(activeScheduleId); // 새로고침
            } catch(e) { alert("저장 실패"); }
        };

        // [v6.0.24 기존 엔진 유지 및 확장]
        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid;
            const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]);
            if (!sS.exists()) return;
            activeScheduleData = sS.data();
            const uMap = uS.docs.reduce((acc,doc)=>({...acc, [doc.id]:doc.data().name}), {});
            
            document.getElementById('detail-title').innerText = activeScheduleData.name;
            document.getElementById('detail-date').innerText = "📅 "+(activeScheduleData.date||"미기록");
            
            // 순위 결과 출력 (3.3)
            const rankDiv = document.getElementById('detail-rank-result');
            if(activeScheduleData.ranks && activeScheduleData.ranks.length > 0) {
                rankDiv.innerHTML = activeScheduleData.ranks.map((p,i)=>`<div class="flex justify-between font-bold py-1 border-b border-white/5"><span class="text-blue-400 font-black">${i+1}위</span><span>${uMap[p]||'?'}</span></div>`).join('');
            } else {
                rankDiv.innerHTML = `<p class="opacity-30 text-center py-4 text-xs font-bold">순위 정보가 없습니다.<br>수정 버튼을 눌러 입력하세요.</p>`;
            }

            document.getElementById('detail-comment-feed').innerHTML = (activeScheduleData.feed||[]).map(f=>`<div class="bg-white/5 p-3 rounded-xl border border-white/5 font-bold"><b>${uMap[f.userPin] || '?'}:</b> ${f.text}</div>`).join('')||"코멘트 없음";
            toggleModal('detail-modal', true);
        };

        // [기초 함수 - v6.0.24와 동일]
        window.toggleModal = (id, s) => { const el = document.getElementById(id); if(el) el.classList.toggle('active', s); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const t = document.getElementById(id); if(t) { 
                t.classList.add('active'); document.getElementById('global-back-btn').style.display = (id === 'page-home') ? 'none' : 'block'; 
                if(push) history.pushState({page: id}, '', '');
            }
        };
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); if(!list) return;
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 text-center font-bold">로딩 중...</td></tr>`;
            const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
            const rt = rS.docs.map(d => d.data());
            let gms = gS.docs.map(d => { const r = rt.filter(v => v.gameId === d.id); return { id: d.id, ...d.data(), avgScore: r.length > 0 ? r.map(v=>v.score||0).reduce((a,c)=>a+c,0)/r.length : 0 }; }).sort((a,b) => b.avgScore - a.avgScore);
            list.innerHTML = gms.map((g, i) => `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold"><td class="p-4 text-blue-400 font-black text-center w-12 font-bold">${i < 3 ? '🥇' : '#'+(i+1)}</td><td class="p-4 text-left font-bold"><span class="text-sm font-black">${g.name}</span></td><td class="p-2 text-center w-24 font-bold"><span class="text-yellow-400 text-base font-black">${g.avgScore.toFixed(1)}</span></td><td class="p-4 w-20 text-center font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black">기록</button></td></tr>`).join('');
        };
        window.openSchedules = async (id, name) => {
            const listDiv = document.getElementById('schedule-list'); document.getElementById('schedule-game-title').innerText = name;
            listDiv.innerHTML = `<p class="opacity-30 text-center py-10 font-bold">로딩 중...</p>`; toggleModal('schedule-modal', true);
            const snap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id)));
            const docs = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            listDiv.innerHTML = docs.map(d => `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold mb-1"><div class="text-sm text-green-300 font-bold">${d.name}</div><span class="text-blue-400 text-xs font-bold">▶</span></div>`).join('') || "기록 없음";
        };
        window.handleBack = () => { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); showPage('page-home'); };
        window.login = async () => { const p = document.getElementById('pin').value.trim(); const w = document.getElementById('pw').value.trim(); const snap = await getDoc(doc(db,"users",String(p))); if (snap.exists() && String(snap.data().password) === String(w)) { currentUser = { pin: String(p), ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin: String(p), pw: String(w) })); location.reload(); } else alert("정보 불일치"); };
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db,"users",String(d.pin))); if (snap.exists()) { currentUser = { pin: String(d.pin), ...snap.data() }; document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png'; return; } } document.getElementById('page-login').classList.add('active'); });
    </script>
</body>
</html>
