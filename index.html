<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active#page-rank ~ .sticky-back, .page.active#page-stats ~ .sticky-back { display: block; }
        .star-container { display: inline-flex; gap: 1px; color: #a855f7; font-size: 1.25rem; }
        .star { position: relative; display: inline-block; }
        .star-full { color: #a855f7; }
        .star-empty { color: rgba(255, 255, 255, 0.1); }
        .star-half::before { content: '★'; position: absolute; left: 0; width: 50%; overflow: hidden; color: #a855f7; }
        .star-half { color: rgba(255, 255, 255, 0.1); }
        .thumb-img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-sm text-center">

    <div class="fixed top-0 left-0 w-full bg-blue-600/20 backdrop-blur-md border-b border-white/10 p-2 text-center text-[10px] font-semibold text-blue-300 z-50">
        💡 모든 사용자의 기본 비밀번호는 <span class="text-white underline">1234</span>입니다.
    </div>

    <button onclick="history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-home" class="page active w-full max-w-4xl text-center pt-10">
        <div class="flex justify-between items-center mb-4 max-w-md mx-auto px-4 text-left">
            <span id="user-welcome" class="text-blue-400 text-xs font-bold font-bold"></span>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs underline font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-10 tracking-tight uppercase font-bold">Game Archive</h1>
        <button onclick="navToStats()" class="mb-8 bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-3 rounded-2xl font-bold hover:bg-yellow-500 hover:text-white transition shadow-lg">🏆 명예의 전당 보러가기</button>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105 font-bold">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105 font-bold">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105 font-bold">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105 font-bold">🕵️ 머더 미스테리</button>
        </div>
        <div class="mt-10 flex flex-col items-center gap-2">
            <button onclick="togglePinModal(true)" class="text-gray-400 hover:text-white text-xs underline font-bold">내 PIN 번호 확인</button>
            <div class="text-[10px] text-gray-600 opacity-50 font-bold">App Version v2.2.0</div>
        </div>
    </div>

    <div id="page-stats" class="page w-full max-w-5xl text-left">
        <h2 class="text-3xl font-bold text-yellow-400 mb-8 pt-10 font-bold">명예의 전당 🏆</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-3xl border-yellow-500/20"><h3 class="text-base font-bold mb-4 text-center font-bold">🍕 베스트 댓글 왕</h3><div id="best-comment-king" class="space-y-4"></div></div>
            <div class="glass p-6 rounded-3xl border-blue-500/20"><h3 class="text-base font-bold mb-4 text-center font-bold">🗳️ 최다 투표 왕</h3><div id="vote-king" class="space-y-4"></div></div>
            <div class="glass p-6 rounded-3xl border-green-500/20"><h3 class="text-base font-bold mb-4 text-center font-bold">🆕 최다 게임 등록 왕</h3><div id="game-add-king" class="space-y-4"></div></div>
        </div>
    </div>

    <div id="page-rank" class="page w-full max-w-4xl pt-10">
        <div class="flex justify-between items-end mb-8 text-left px-2">
            <div><h2 id="rank-title" class="text-3xl font-bold ml-2 font-bold">카테고리</h2></div>
            <button onclick="addGame()" class="bg-white/10 px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/20 transition font-bold">+ 새 게임 추가</button>
        </div>
        <div class="glass rounded-3xl overflow-hidden overflow-x-auto custom-scrollbar">
            <table class="w-full text-left border-collapse min-w-[550px]">
                <thead class="bg-white/5 text-gray-400 text-[10px] uppercase tracking-wider text-center">
                    <tr><th class="p-4 text-left">순위</th><th class="p-4 text-left">이미지</th><th class="p-4 text-left">게임 정보</th><th class="p-4">전체 재미</th><th class="p-4">전체 난이도</th></tr>
                </thead>
                <tbody id="rank-list" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <div id="comment-modal" class="modal">
        <div class="glass w-full max-w-md p-6 rounded-3xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="comment-game-title" class="text-xl font-extrabold text-blue-400 font-bold text-left">댓글</h3>
                <button onclick="toggleCommentModal(false)" class="text-gray-400 hover:text-white text-2xl">✕</button>
            </div>
            <div id="comment-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-4 text-left"></div>
            <div class="space-y-3 text-left">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="anon-check" class="w-4 h-4 rounded border-gray-300 text-blue-600 bg-white/5">
                    <label for="anon-check" class="text-xs text-gray-400 cursor-pointer font-bold">익명 작성</label>
                </div>
                <div class="flex flex-col gap-2">
                    <input type="text" id="comment-img-input" placeholder="이미지 URL (선택사항)" class="bg-white/5 border border-white/10 p-2 rounded-xl outline-none text-xs font-bold">
                    <div class="flex gap-2">
                        <input type="text" id="comment-input" placeholder="댓글 입력..." class="flex-grow bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold">
                        <button onclick="addComment()" class="bg-blue-600 px-4 rounded-xl font-bold font-bold">등록</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="eval-modal" class="modal">
        <div class="glass w-full max-w-xs p-6 rounded-3xl text-center">
            <h3 id="eval-modal-title" class="text-xl font-bold mb-4 text-blue-400 font-bold">평가 수정</h3>
            <div class="space-y-4 text-left font-bold">
                <div id="score-input-box">
                    <label class="text-xs text-gray-400 block mb-2 ml-1 font-bold">재미 점수 (0~100)</label>
                    <input type="number" id="single-score" step="0.1" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none font-bold font-bold">
                </div>
                <div id="diff-input-box">
                    <label class="text-xs text-gray-400 block mb-2 ml-1 font-bold">난이도 별점 (0~5.0)</label>
                    <input type="number" id="single-diff" step="0.1" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none font-bold font-bold">
                </div>
                <div class="flex gap-2 pt-2 font-bold">
                    <button onclick="toggleEvalModal(false)" class="flex-1 bg-white/10 py-3 rounded-xl font-bold font-bold">취소</button>
                    <button onclick="submitSingleEval()" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold font-bold">저장</button>
                </div>
            </div>
        </div>
    </div>

    <div id="page-login" class="page w-full max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 font-bold">인증이 필요합니다</h2>
            <div class="space-y-4 text-left font-bold">
                <input type="text" id="pin" placeholder="PIN 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none font-bold">
                <input type="password" id="pw" placeholder="PW 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500 transition-all mt-2 font-bold">로그인</button>
            </div>
            <button onclick="togglePinModal(true)" class="mt-6 text-xs text-blue-400 hover:underline font-bold font-bold font-bold">내 PIN 번호를 모르겠어요</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, deleteDoc, query, where, serverTimestamp, updateDoc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);

    let currentUser = null; let selectedCategory = ""; let activeGameId = null; let evalType = ""; 
    let allRatingsData = [];

    function renderStars(rating) {
        let starsHtml = '<div class="star-container">';
        for (let i = 1; i <= 5; i++) {
            if (rating >= i) starsHtml += '<span class="star star-full font-bold">★</span>';
            else if (rating >= i - 0.5) starsHtml += '<span class="star star-half font-bold">★</span>';
            else starsHtml += '<span class="star star-empty font-bold">★</span>';
        }
        starsHtml += '</div>';
        return starsHtml;
    }

    window.onpopstate = (e) => { if(e.state) showPage(e.state.page); else showPage('page-home'); updateBackBtnVisibility(); };
    function updateBackBtnVisibility() {
        const backBtn = document.getElementById('global-back-btn');
        const activePageElem = document.querySelector('.page.active');
        if(activePageElem) backBtn.style.display = (activePageElem.id === 'page-rank' || activePageElem.id === 'page-stats') ? 'block' : 'none';
    }

    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
        const target = document.getElementById(id); target.style.display = 'block';
        setTimeout(() => { target.classList.add('active'); updateBackBtnVisibility(); }, 50);
        if (history.state?.page !== id) history.pushState({ page: id }, '', '');
    };

    window.addEventListener('DOMContentLoaded', async () => {
        const saved = localStorage.getItem('game_archive_auth');
        if (saved) {
            const data = JSON.parse(saved);
            const snap = await getDoc(doc(db, "users", data.pin));
            if (snap.exists() && snap.data().password === data.pw) {
                currentUser = { pin: data.pin, name: snap.data().name };
                document.getElementById('user-welcome').innerText = `${currentUser.name}님 환영해요!`;
                showPage('page-home'); return;
            }
        }
        showPage('page-login');
    });

    window.login = async () => {
        const pin = document.getElementById('pin').value; const pw = document.getElementById('pw').value;
        if(!pin || !pw) return alert("입력 값을 확인해주세요.");
        const snap = await getDoc(doc(db, "users", pin));
        if (snap.exists() && snap.data().password === pw) {
            currentUser = { pin, name: snap.data().name };
            localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload();
        } else alert("인증 실패");
    };
    window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };

    window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };

    // [랭킹 리스트 렌더링 - 이미지 포함]
    window.renderList = async () => {
        const list = document.getElementById('rank-list');
        list.innerHTML = `<tr><td colspan="5" class="p-10 text-center opacity-50 italic font-bold">데이터 분석 중...</td></tr>`;
        const [gSnap, rSnap, cSnap] = await Promise.all([
            getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))),
            getDocs(collection(db, "ratings")),
            getDocs(collection(db, "comments"))
        ]);

        allRatingsData = rSnap.docs.map(d => d.data());
        const comments = cSnap.docs.map(d => d.data());

        let games = [];
        gSnap.forEach(d => {
            const gameId = d.id; const gData = d.data();
            const gRatings = allRatingsData.filter(r => r.gameId === gameId);
            const scores = gRatings.map(r => r.score || 0).sort((a,b) => a-b);
            let finalAvg = 0;
            if (scores.length >= 3) {
                let trim = (scores.length >= 5) ? 1 : 0;
                const trimmed = scores.slice(trim, scores.length - trim);
                finalAvg = trimmed.reduce((a,c) => a+c, 0) / trimmed.length;
            } else { finalAvg = scores.length ? scores.reduce((a,c) => a+c, 0) / scores.length : 0; }
            const diffs = gRatings.map(r => r.difficulty || 0).filter(v => v > 0);
            const avgDiff = diffs.length ? diffs.reduce((a,c) => a+c, 0) / diffs.length : 0;

            games.push({ id: gameId, ...gData, avgScore: finalAvg, avgDiff, voteCount: gRatings.length, commentCount: comments.filter(c => c.gameId === gameId).length, my: gRatings.find(r => r.userPin === currentUser.pin) });
        });

        games.sort((a,b) => b.avgScore - a.avgScore);
        list.innerHTML = games.map((g, i) => {
            let rankDisp = `#${i+1}`;
            if(i === 0) rankDisp = '🥇'; else if(i === 1) rankDisp = '🥈'; else if(i === 2) rankDisp = '🥉';

            return `
            <tr class="hover:bg-white/5 border-b border-white/5 transition text-center font-bold">
                <td class="p-4 font-mono text-blue-400 text-left text-lg font-bold font-bold">${rankDisp}</td>
                <td class="p-4 text-left font-bold font-bold font-bold">
                    <img src="${g.imgUrl || ''}" onerror="this.src='https://via.placeholder.com/40?text=?'" class="thumb-img font-bold font-bold">
                </td>
                <td class="p-4 text-left font-bold font-bold font-bold font-bold font-bold">
                    <div class="flex items-center gap-2 font-bold font-bold">
                        <span onclick="openComments('${g.id}', '${g.name}')" class="font-bold text-base cursor-pointer hover:underline underline-offset-4 decoration-blue-500/30 font-bold font-bold font-bold">${g.name}</span>
                        <button onclick="editGameName('${g.id}', '${g.name}', '${g.creatorPin}', '${g.imgUrl || ''}')" class="text-gray-500 hover:text-white text-[10px] font-bold font-bold">✏️</button>
                    </div>
                    <div class="flex gap-2 mt-1 opacity-50 text-[9px] font-bold font-bold"><span>🗳️ ${g.voteCount}</span><span class="text-blue-300 font-bold font-bold">💬 ${g.commentCount}</span></div>
                </td>
                <td class="p-4 cursor-pointer hover:bg-white/10 rounded-xl font-bold font-bold font-bold font-bold font-bold" onclick="openEvalModal('${g.id}', '${g.name}', 'score')">
                    <div class="text-yellow-400 font-bold text-base font-bold font-bold">${g.avgScore.toFixed(1)}점</div>
                    ${g.my ? `<div class="text-[9px] text-blue-300 opacity-60 font-bold font-bold font-bold font-bold font-bold">(내 점수: ${g.my.score})</div>` : ''}
                </td>
                <td class="p-4 cursor-pointer hover:bg-white/10 rounded-xl font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold" onclick="openEvalModal('${g.id}', '${g.name}', 'diff')">
                    <div class="text-purple-400 font-bold font-bold">
                        ${renderStars(g.avgDiff)}
                        <div class="text-[10px] opacity-60 font-bold mt-1 font-bold font-bold font-bold">${g.avgDiff.toFixed(1)}</div>
                    </div>
                    ${g.my ? `<div class="text-[9px] text-blue-300 opacity-60 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">(내 난이도: ${g.my.difficulty})</div>` : ''}
                </td>
            </tr>`}).join('');
    };

    // [통계 페이지 로직 - 명예의 전당 랭킹 강화]
    window.navToStats = async () => {
        showPage('page-stats');
        const cK = document.getElementById('best-comment-king');
        const vK = document.getElementById('vote-king');
        const gK = document.getElementById('game-add-king');
        [cK, vK, gK].forEach(el => el.innerHTML = `<p class="opacity-30 font-bold">집계 중...</p>`);

        const [cSnap, rSnap, gSnap, uSnap] = await Promise.all([
            getDocs(collection(db, "comments")),
            getDocs(collection(db, "ratings")),
            getDocs(collection(db, "games")),
            getDocs(collection(db, "users"))
        ]);

        const comments = cSnap.docs.map(d => d.data());
        const ratings = rSnap.docs.map(d => d.data());
        const games = gSnap.docs.map(d => d.data());
        const users = uSnap.docs.reduce((acc, d) => ({ ...acc, [d.id]: d.data().name }), {});

        const getRankIcon = (i) => i === 0 ? '👑' : `#${i+1}`;

        // 베스트 댓글
        let topC = [...comments].sort((a,b) => (b.likes||0)-(a.likes||0)).slice(0, 5);
        cK.innerHTML = topC.map((c, i) => `
            <div class="p-3 bg-white/5 rounded-2xl border border-white/5 text-left font-bold">
                <div class="flex justify-between items-start mb-1 font-bold">
                    <span class="text-[10px] text-yellow-500 font-bold font-bold">${getRankIcon(i)}</span>
                    <span class="text-[9px] text-gray-500 font-bold font-bold">${c.isAnonymous?'익명':c.userName}</span>
                </div>
                ${c.imgUrl ? `<img src="${c.imgUrl}" class="w-full h-20 object-cover rounded-lg mb-2">` : ''}
                <p class="text-xs truncate text-gray-300 font-bold font-bold font-bold">${c.text}</p>
                <div class="text-right text-[10px] text-yellow-500 font-bold font-bold font-bold font-bold">🍕 ${c.likes||0}</div>
            </div>
        `).join('');

        // 최다 투표 왕
        const vC = ratings.reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin] || 0) + 1; return acc; }, {});
        let topV = Object.entries(vC).sort((a,b) => b[1]-a[1]).slice(0, 5);
        vK.innerHTML = topV.map((v, i) => `
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-2xl border border-white/5 font-bold">
                <span class="text-blue-400 font-bold font-bold font-bold font-bold">${getRankIcon(i)}</span>
                <span class="font-bold font-bold font-bold font-bold font-bold">${users[v[0]]||'익명'}</span>
                <span class="text-xs text-blue-400 font-mono font-bold font-bold font-bold font-bold font-bold">${v[1]}회</span>
            </div>
        `).join('');

        // 최다 게임 등록 왕
        const gC = games.reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
        let topG = Object.entries(gC).sort((a,b) => b[1]-a[1]).slice(0, 5);
        gK.innerHTML = topG.map((a, i) => `
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-2xl border border-white/5 font-bold">
                <span class="text-green-400 font-bold font-bold font-bold font-bold font-bold">${getRankIcon(i)}</span>
                <span class="font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${users[a[0]]||'익명'}</span>
                <span class="text-xs text-green-400 font-mono font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${a[1]}개</span>
            </div>
        `).join('');
    };

    window.addGame = async () => {
        const n = prompt("추가할 게임:"); if (!n) return;
        const iUrl = prompt("이미지 URL (선택사항):");
        const norm = n.replace(/\s+/g, '').toLowerCase();
        const gS = await getDocs(collection(db, "games"));
        let dup = false; gS.forEach(d => { if(d.data().name.replace(/\s+/g, '').toLowerCase() === norm) dup = true; });
        if(dup) return alert("이미 등록됨");
        await addDoc(collection(db, "games"), { name: n, imgUrl: iUrl, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() });
        renderList();
    };

    window.editGameName = async (id, old, creator, oldImg) => {
        if (currentUser.pin !== creator && currentUser.pin !== "100") return alert("작성자만 가능");
        const n = prompt("수정:", old);
        const i = prompt("이미지 URL 수정:", oldImg);
        if (n && (n !== old || i !== oldImg)) { 
            await updateDoc(doc(db, "games", id), { name: n, imgUrl: i }); 
            renderList(); 
        }
    };

    // [댓글 로직 - 이미지 포함]
    async function loadComments() {
        const list = document.getElementById('comment-list');
        list.innerHTML = `<p class="p-5 italic font-bold font-bold font-bold">로딩 중...</p>`;
        const q = query(collection(db, "comments"), where("gameId", "==", activeGameId));
        const snap = await getDocs(q);
        if(snap.empty) { list.innerHTML = `<p class="p-5 opacity-30 italic font-bold font-bold font-bold">댓글 없음</p>`; return; }
        let ds = snap.docs.map(d => ({id: d.id, ...d.data()}));
        ds.sort((a,b) => (b.likes||0)-(a.likes||0) || (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
        list.innerHTML = ds.map(data => {
            const isMe = data.userPin === currentUser.pin;
            const liked = data.likedUsers?.includes(currentUser.pin);
            const dName = data.isAnonymous ? (isMe ? "익명(나)" : "익명") : data.userName;
            return `
                <div class="p-3 rounded-2xl ${isMe ? 'bg-blue-600/20 ml-8 border-blue-500/20' : 'bg-white/5 mr-8 border-white/5'} mb-3 border shadow-lg font-bold">
                    <div class="flex justify-between items-center mb-1 font-bold">
                        <span class="text-[10px] font-bold ${isMe?'text-blue-300':'text-gray-400'} font-bold">${dName}</span>
                        <div class="flex items-center gap-2 font-bold font-bold font-bold"><button onclick="likeComment('${data.id}')" class="text-[10px] font-bold ${liked?'text-yellow-400':'text-gray-500'} font-bold">🍕 ${data.likes||0}</button>${isMe?`<button onclick="delComment('${data.id}')" class="text-[9px] text-red-500 font-bold opacity-50 font-bold font-bold">삭제</button>`:''}</div>
                    </div>
                    ${data.imgUrl ? `<img src="${data.imgUrl}" class="w-full h-auto rounded-xl mb-2 shadow-lg">` : ''}
                    <p class="text-sm leading-relaxed font-bold font-bold font-bold">${data.text}</p>
                </div>`;
        }).join('');
    }

    window.addComment = async () => {
        const i = document.getElementById('comment-input');
        const img = document.getElementById('comment-img-input');
        const a = document.getElementById('anon-check').checked;
        if(!i.value.trim()) return;
        await addDoc(collection(db, "comments"), { 
            gameId: activeGameId, 
            userPin: currentUser.pin, 
            userName: a?"익명":currentUser.name, 
            isAnonymous: a, 
            text: i.value.trim(), 
            imgUrl: img.value.trim(),
            likes: 0, 
            likedUsers: [], 
            createdAt: serverTimestamp() 
        });
        i.value = ""; img.value = ""; document.getElementById('anon-check').checked = false; loadComments();
    };

    // [기존 유틸 및 기타 함수 생략]
    window.openComments = (id, name) => { activeGameId = id; document.getElementById('comment-game-title').innerText = name; toggleCommentModal(true); loadComments(); };
    window.toggleCommentModal = (s) => document.getElementById('comment-modal').classList.toggle('active', s);
    window.openEvalModal = (id, name, type) => { activeGameId = id; evalType = type; document.getElementById('eval-modal-title').innerText = `${name} - ${type === 'score' ? '재미 평가' : '난이도 평가'}`; const myRating = allRatingsData.find(r => r.gameId === id && r.userPin === currentUser.pin); const sInput = document.getElementById('single-score'); const dInput = document.getElementById('single-diff'); document.getElementById('score-input-box').style.display = type === 'score' ? 'block' : 'none'; document.getElementById('diff-input-box').style.display = type === 'diff' ? 'block' : 'none'; sInput.value = myRating?.score || ''; dInput.value = myRating?.difficulty || ''; toggleEvalModal(true); };
    window.toggleEvalModal = (s) => document.getElementById('eval-modal').classList.toggle('active', s);
    window.submitSingleEval = async () => { const sV = parseFloat(document.getElementById('single-score').value); const dV = parseFloat(document.getElementById('single-diff').value); const myR = allRatingsData.find(r => r.gameId === activeGameId && r.userPin === currentUser.pin); let finalS = evalType === 'score' ? sV : (myR?.score || 0); let finalD = evalType === 'diff' ? dV : (myR?.difficulty || 0); if(isNaN(finalS) || finalS < 0 || finalS > 100 || isNaN(finalD) || finalD < 0 || finalD > 5) return alert("입력값 오류"); await setDoc(doc(db, "ratings", `${currentUser.pin}_${activeGameId}`), { gameId: activeGameId, userPin: currentUser.pin, score: finalS, difficulty: finalD, updatedAt: serverTimestamp() }); toggleEvalModal(false); renderList(); };
    window.likeComment = async (id) => { const ref = doc(db, "comments", id); const snap = await getDoc(ref); const d = snap.data(); const liked = d.likedUsers?.includes(currentUser.pin); await updateDoc(ref, { likes: increment(liked?-1:1), likedUsers: liked?arrayRemove(currentUser.pin):arrayUnion(currentUser.pin) }); loadComments(); };
    window.delComment = async (id) => { if(confirm("삭제?")) { await deleteDoc(doc(db, "comments", id)); loadComments(); } };
    window.togglePinModal = async (show) => { const m = document.getElementById('pin-modal'); if(show) { document.getElementById('pin-list-content').innerHTML = `집계 중...`; m.classList.add('active'); const snap = await getDocs(collection(db, "users")); let us = snap.docs.map(d => ({pin: d.id, name: d.data().name})); us.sort((a,b) => parseInt(a.pin)-parseInt(b.pin)); document.getElementById('pin-list-content').innerHTML = us.map(u => `<div class="flex justify-between p-3 border-b border-white/5"><span>${u.pin}</span><b>${u.name}</b></div>`).join(''); } else m.classList.remove('active'); };
</script>
</body>
</html>
