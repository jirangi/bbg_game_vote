<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v3.1.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .sticky-back { position: fixed; top: 20px; left: 20px; z-index: 500; background: rgba(30, 41, 59, 0.9); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
        .podium-box { background: linear-gradient(to bottom, rgba(251, 191, 36, 0.15), transparent); border: 1px solid rgba(251, 191, 36, 0.3); }
        .member-btn.selected { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.4) !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic uppercase">Login</h2>
            <div class="space-y-4 font-bold">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" onkeypress="if(event.keyCode==13) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer z-[600]" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-2 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-5 py-3 rounded-2xl font-extrabold hover:bg-yellow-500 transition">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-5 py-3 rounded-2xl font-extrabold">📢 단톡방 정보</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-5 py-3 rounded-2xl font-extrabold" onclick="openAdminModal()">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 font-extrabold text-xl hover:text-blue-400 transition">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 font-extrabold text-xl hover:text-blue-400 transition">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 font-extrabold text-xl hover:text-blue-400 transition">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 font-extrabold text-xl hover:text-blue-400 transition">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-10 font-bold">
        <div class="flex justify-between items-end mb-6 px-4">
            <h2 id="rank-title" class="text-4xl font-extrabold italic text-blue-400"></h2>
            <button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm">+ 새 게임</button>
        </div>
        <div class="glass rounded-[40px] overflow-x-auto mx-4 shadow-2xl border border-white/5 custom-scrollbar">
            <table class="w-full text-center min-w-[500px]">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-bold font-bold"><th>순위</th><th class="text-left p-5">게임 정보</th><th>평가</th><th>기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <div id="page-stats" class="page pt-10 font-bold text-center">
        <h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4">
            <div><h3 class="text-blue-400 italic mb-4 font-bold">🗳️ Voting King</h3><div id="vote-king" class="space-y-3 font-bold"></div></div>
            <div><h3 class="text-green-400 italic mb-4 font-bold">🆕 Creator King</h3><div id="game-add-king" class="space-y-3 font-bold"></div></div>
        </div>
    </div>

    <div id="page-chat-info" class="page pt-10 font-bold">
        <div class="flex justify-between items-center mb-10 px-4 font-bold"><h2 class="text-3xl font-black text-blue-400 italic">Group Info 📢</h2><button id="admin-info-add-btn" class="hidden bg-blue-600 px-4 py-2 rounded-xl text-xs" onclick="toggleModal('info-add-modal', true)">+ 등록</button></div>
        <div id="chat-info-list" class="space-y-4 px-4 font-bold"></div>
    </div>

    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-3xl font-black text-center text-blue-400 mb-8 uppercase font-bold">My Profile</h3>
            <div class="flex flex-col items-center gap-6 mb-8 pb-8 border-b border-white/10 font-bold">
                <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover">
                <input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 text-center font-black" placeholder="닉네임">
                <button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl">정보 저장</button>
            </div>
            <h4 class="text-left text-[10px] font-black uppercase mb-4 ml-1 tracking-widest font-bold font-bold">Attendance History</h4>
            <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar text-left pr-2 font-bold font-bold"></div>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')"><div class="glass w-full max-w-lg p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold"><h3 id="schedule-game-title" class="text-2xl font-black italic text-green-400 truncate pr-4 font-bold font-bold"></h3><button onclick="closeAllModals()" class="text-gray-500 text-3xl font-bold font-bold">✕</button></div><div class="space-y-4 mb-8 bg-black/20 p-5 rounded-3xl border border-white/5 font-bold font-bold font-bold"><input type="text" id="new-schedule-name" placeholder="모임 제목" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-white font-bold font-bold font-bold font-bold font-bold"><div id="member-select-grid" class="grid grid-cols-3 gap-2 max-h-32 overflow-y-auto custom-scrollbar p-2 bg-black/40 rounded-xl font-bold font-bold font-bold font-bold font-bold font-bold"></div><button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-xl font-bold font-bold font-bold font-bold font-bold font-bold font-bold">생성</button></div><div id="schedule-list" class="space-y-3 overflow-y-auto custom-scrollbar flex-grow pr-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div></div>
    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold font-bold font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold font-bold font-bold font-bold"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate pr-2 font-bold font-bold font-bold font-bold font-bold"></h3><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold font-bold font-bold font-bold font-bold">✕</button></div><div id="detail-podium" class="podium-box p-6 rounded-[32px] mb-8 hidden font-bold font-bold font-bold font-bold font-bold font-bold"><div class="text-yellow-400 text-xs mb-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold">🥇 Official Ranking</div><div id="detail-rank-result" class="text-sm space-y-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div><div class="flex gap-2 mb-8 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 border border-blue-500/30 py-4 rounded-2xl text-xs text-blue-300 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">🥇 순위 등록</button><button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 border border-green-500/30 py-4 rounded-2xl text-xs text-green-300 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">💬 코멘트</button></div><div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div></div>
    <div id="admin-user-modal" class="modal" onclick="closeOnBackdrop(event, 'admin-user-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-8 text-red-400 font-bold"><h3>명단 관리</h3><button onclick="closeAllModals()" class="text-3xl font-bold">✕</button></div><div class="flex gap-2 mb-8 font-bold"><input type="text" id="new-user-name" placeholder="이름" class="flex-grow bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold text-white"><button onclick="adminAddUser()" class="bg-red-600 px-6 rounded-2xl font-black font-bold shadow-lg">추가</button></div><div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 pr-2 font-bold font-bold"></div></div></div>
    <div id="rank-popup" class="modal" style="z-index: 2000;" onclick="toggleModal('rank-popup', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] text-center font-bold" onclick="event.stopPropagation()"><h4 class="text-blue-400 mb-6 font-black italic">Rank Setting</h4><div id="rank-member-grid" class="grid grid-cols-2 gap-2 mb-6 max-h-48 overflow-y-auto p-1 font-bold font-bold"></div><div id="rank-order-display" class="text-xs text-green-400 mb-6 text-left p-3 bg-black/30 rounded-xl font-bold font-bold">순위: </div><button onclick="saveRanks()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-lg font-bold">저장</button></div></div>
    <div id="comment-popup" class="modal" style="z-index: 2000;" onclick="toggleModal('comment-popup', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] font-bold" onclick="event.stopPropagation()"><h4 class="text-green-400 mb-6 font-black text-center italic">Write Note</h4><textarea id="pop-comment-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl h-32 outline-none text-white font-bold font-bold font-bold mb-6"></textarea><button onclick="saveNote()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-lg font-bold">등록</button></div></div>
    <div id="info-add-modal" class="modal" onclick="closeOnBackdrop(event, 'info-add-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] font-bold font-bold" onclick="event.stopPropagation()"><h3 class="text-xl text-blue-400 mb-6 font-black italic font-bold">정보 등록</h3><div class="space-y-4 text-left font-bold font-bold font-bold"><input type="text" id="info-title" placeholder="제목" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl font-bold font-bold text-white"><textarea id="info-content" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl h-40 font-bold font-bold text-white"></textarea><button onclick="saveChatInfo()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-lg font-bold">저장</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let tempMembers = []; let currentScheduleId = null; let recordingRanks = [];

        // [핵심 제어 로직]
        window.toggleModal = (id, show) => { const m = document.getElementById(id); if(show) { m.classList.add('active'); history.pushState({modal: id}, '', ''); } else { m.classList.remove('active'); } };
        window.closeAllModals = () => { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); };
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) toggleModal(id, false); };
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else window.history.back(); };
        window.onpopstate = (e) => { closeAllModals(); if(e.state?.page) showPage(e.state.page, false); };

        window.showPage = (id, push = true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (push && history.state?.page !== id) history.pushState({ page: id }, '', '');
            if(id === 'page-chat-info') loadChatInfo();
        };

        // [렌더링 & 명예전당 전수 복구]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 italic font-bold">Loading Data...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const ratings = rSnap.docs.map(d => d.data());
                let games = gSnap.docs.map(d => {
                    const r = ratings.filter(v => v.gameId === d.id);
                    const sc = r.map(v => v.score || 0).sort((a, b) => a - b);
                    let avg = sc.length >= 3 ? sc.slice(1, -1).reduce((a, c) => a + c, 0) / (sc.length - 2) : (r.length > 0 ? sc.reduce((a, c) => a + c, 0) / r.length : 0);
                    return { id: d.id, ...d.data(), avgScore: avg, voteCount: r.length };
                }).sort((a, b) => b.avgScore - a.avgScore);
                list.innerHTML = games.map((g, i) => `<tr class="hover:bg-white/5 border-b border-white/5 font-bold"><td class="p-5 text-blue-400 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td><td class="p-5 text-left font-bold"><div class="text-sm font-black">${g.name}</div><div class="text-[9px] opacity-40 uppercase">Votes: ${g.voteCount}</div></td><td class="p-5 font-bold text-yellow-400">${g.avgScore.toFixed(1)}</td><td class="p-5"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black">기록</button></td></tr>`).join('');
            } catch (e) { list.innerHTML = `<tr><td colspan="4" class="p-10 text-red-400 font-bold">Data Error</td></tr>`; }
        };

        window.navToStats = async () => {
            showPage('page-stats');
            const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
            const users = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            const vCount = rSnap.docs.map(d=>d.data()).reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {});
            document.getElementById('vote-king').innerHTML = Object.entries(vCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between font-bold'><span>${users[v[0]]?.name || '?'}</span><b class='text-blue-400'>${v[1]}회</b></div>`).join('');
            const gCount = gSnap.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
            document.getElementById('game-add-king').innerHTML = Object.entries(gCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between font-bold'><span>${users[v[0]]?.name || '?'}</span><b class='text-green-400'>${v[1]}개</b></div>`).join('');
        };

        // [인증 및 공통 기능]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const d = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", d.pin));
                if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home', false); return; }
            }
            showPage('page-login', false);
        });

        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload();
            } else if(pw.length===4) alert("PIN/비밀번호 확인");
        };

        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin==="100") { document.getElementById('admin-user-manage-btn').classList.remove('hidden'); document.getElementById('admin-info-add-btn')?.classList.remove('hidden'); } }
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; loadMyHistory(); } toggleModal('profile-modal', s); };
        async function loadMyHistory() {
            const listDiv = document.getElementById('my-history-list');
            const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin));
            const sSnap = await getDocs(q);
            listDiv.innerHTML = sSnap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => {
                const r = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1;
                return `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-1 border border-white/5 font-bold"><div><div class="flex items-center gap-2 mb-1"><span class="category-tag">${s.gameCategory||'보드게임'}</span><span class="text-[9px] text-blue-500 font-bold">${s.gameName||'Game'}</span></div><div class="text-sm font-bold">${s.name}</div></div><div class="text-xs font-bold">${r>-1 ? (r+1)+'위' : '기록전'}</div></div>`;
            }).join('') || "No Records";
        }

        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.openSchedules = async (id, name) => { activeGameId = id; activeGameName = name; document.getElementById('schedule-game-title').innerText = name; tempMembers = []; const uSnap = await getDocs(collection(db, "users")); document.getElementById('member-select-grid').innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[9px] border border-white/10 font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        window.toggleSelectMember = (p) => { const i = tempMembers.indexOf(p); const b = document.getElementById(`sel-${p}`); if(i>-1){ tempMembers.splice(i,1); b.classList.remove('selected'); } else { tempMembers.push(p); b.classList.add('selected'); } };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("입력 확인"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; tempMembers = []; loadSchedules(); };
        async function loadSchedules() { const listDiv = document.getElementById('schedule-list'); const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); listDiv.innerHTML = sSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center shadow-lg font-bold"><div class="text-left font-bold"><div class="text-sm text-green-300 font-bold">${s.name}</div><div class="text-[9px] text-gray-500 uppercase font-bold">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs font-bold">▶</span></div>`).join(''); }
        window.openScheduleDetail = async (id) => { currentScheduleId = id; const s = (await getDoc(doc(db, "schedules", id))).data(); const uSnap = await getDocs(collection(db, "users")); const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); document.getElementById('detail-title').innerText = s.name; const p = document.getElementById('detail-podium'); if(s.ranks?.length > 0) { p.classList.remove('hidden'); document.getElementById('detail-rank-result').innerHTML = s.ranks.map((p, i) => `<div class='text-xs'>${i+1}위 <b>${uMap[p]?.name}</b></div>`).join(''); } else p.classList.add('hidden'); document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map(l => `<div class="bg-white/5 p-4 rounded-2xl flex gap-3 font-bold"><img src="${uMap[l.userPin]?.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8"><div class="text-left flex-grow font-bold"><div class="flex justify-between text-[9px] text-gray-500 mb-1"><span>${uMap[l.userPin]?.name}</span>${l.userPin === currentUser.pin ? `<button onclick='deleteComment(${JSON.stringify(l)})' class='text-red-500'>🗑️</button>`:''}</div><div class="text-sm font-bold">${l.text}</div></div></div>`).join('') || `<div class='opacity-20 text-center py-10 italic'>No activity.</div>`; toggleModal('detail-modal', true); };
        window.deleteComment = async (o) => { if(confirm("삭제?")){ await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayRemove(o) }); openScheduleDetail(currentScheduleId); } };
        window.saveNote = async () => { const t = document.getElementById('pop-comment-input').value.trim(); if(!t) return; await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayUnion({ userPin: currentUser.pin, text: t, time: Date.now() }) }); toggleModal('comment-popup', false); openScheduleDetail(currentScheduleId); };
        window.openRankPopup = async () => { const s = (await getDoc(doc(db, "schedules", currentScheduleId))).data(); const uSnap = await getDocs(collection(db, "users")); const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); recordingRanks = []; document.getElementById('rank-order-display').innerText = "순위: "; document.getElementById('rank-member-grid').innerHTML = s.members.map(m => `<button id='rb-${m}' onclick='recordRank("${m}", "${uMap[m]?.name}")' class='bg-white/5 p-3 rounded-xl border border-white/10 text-[10px] font-bold'>${uMap[m]?.name}</button>`).join(''); toggleModal('rank-popup', true); };
        window.recordRank = (p, n) => { if(recordingRanks.includes(p)) return; recordingRanks.push(p); document.getElementById(`rb-${p}`).style.opacity = "0.3"; document.getElementById('rank-order-display').innerText += ` ${n} >`; };
        window.saveRanks = async () => { await updateDoc(doc(db, "schedules", currentScheduleId), { ranks: recordingRanks }); toggleModal('rank-popup', false); openScheduleDetail(currentScheduleId); };
        window.openAdminModal = async () => { toggleModal('admin-user-modal', true); const listDiv = document.getElementById('admin-user-list'); const snap = await getDocs(collection(db, "users")); listDiv.innerHTML = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>parseInt(a.id)-parseInt(b.id)).map(u => `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-1 font-bold"><div class="flex items-center gap-3"><span class="text-blue-400 font-black text-xs">${u.id}</span><span class="text-sm font-bold">${u.name}</span></div>${u.id!=='100' ? `<button onclick="adminDeleteUser('${u.id}')" class="text-red-500 text-xs">삭제</button>`:''}</div>`).join(''); };
        window.adminAddUser = async () => { const n = document.getElementById('new-user-name').value.trim(); if(!n) return; const snap = await getDocs(collection(db, "users")); const nextPin = Math.max(...snap.docs.map(d => parseInt(d.id)).filter(p => !isNaN(p))) + 1; await setDoc(doc(db, "users", String(nextPin)), { name: n, password: "1234", createdAt: serverTimestamp() }); alert(`PIN: ${nextPin}`); window.location.reload(); };
        window.adminDeleteUser = async (id) => { if(confirm("삭제?")) { await deleteDoc(doc(db, "users", id)); openAdminModal(); } };
        window.updateProfile = async () => { await updateDoc(doc(db, "users", currentUser.pin), { name: document.getElementById('edit-nickname').value.trim() }); window.location.reload(); };
        window.loadChatInfo = async () => { const snap = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); document.getElementById('chat-info-list').innerHTML = snap.docs.map(d => `<div class='glass p-6 rounded-3xl text-left'><h4 class='text-blue-400 mb-2 font-bold'>${d.data().title}</h4><p class='text-sm opacity-80 whitespace-pre-wrap font-bold'>${d.data().content}</p></div>`).join('') || "No info."; };
        window.saveChatInfo = async () => { const t = document.getElementById('info-title').value.trim(); const c = document.getElementById('info-content').value.trim(); if(!t || !c) return; await addDoc(collection(db, "chatInfo"), { title: t, content: c, createdAt: serverTimestamp() }); location.reload(); };
        window.addGame = async () => { const n = prompt("게임 이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
    </script>
</body>
</html>
