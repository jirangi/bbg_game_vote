<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive PRAC v6.0.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #schedule-modal { z-index: 10010; } 
        #detail-modal { z-index: 10020; } 
        #rate-modal { z-index: 10030; } 
        #add-schedule-modal { z-index: 10040; }
        #admin-modal, #profile-modal { z-index: 11000; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .btn-priority { position: relative; z-index: 2000 !important; cursor: pointer !important; pointer-events: auto !important; }
        .game-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; font-weight: 800; display: block; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 10px 4px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.05); transition: 0.2s; }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center font-bold">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic">GAME ARCHIVE</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-2">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 btn-priority" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3241/3241724.png'">
                <span id="user-welcome" class="text-blue-300 text-sm font-black"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg btn-priority">로그아웃</button>
        </div>
        <div id="admin-entry" class="hidden px-4 mb-6 text-right"><button onclick="openAdmin()" class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl font-black btn-priority">⚙️ 관리자 설정</button></div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="showPage('page-stats')" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg btn-priority">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg btn-priority">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4"><input type="text" id="game-search" oninput="renderList()" placeholder="🔍 게임 검색..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm font-bold shadow-inner"></div>
        <div class="px-4 mb-4 flex justify-between items-center">
            <h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase"></h2>
            <select id="sort-selector" onchange="renderList()" class="bg-slate-800 text-[10px] p-2 rounded-lg border border-white/10 font-bold">
                <option value="default">기본순</option>
                <option value="score_desc">점수 높은순</option>
            </select>
        </div>
        <div class="glass rounded-[40px] overflow-hidden mx-4 shadow-2xl border border-white/5">
            <table class="w-full text-center table-fixed border-collapse">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-12 text-center">#</th><th class="p-4 text-left">정보</th><th class="w-24 text-center">평가</th><th class="w-20">기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
        <div class="px-4 mt-6 text-center"><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-8 py-3 rounded-2xl text-xs font-bold">+ 새 게임 추가</button></div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <div class="flex flex-col min-w-0 flex-1"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate"></h3><span id="detail-date" class="text-[10px] text-gray-500 font-bold"></span></div>
                <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button>
            </div>
            <div id="detail-rank-result" class="text-sm space-y-2 mb-6 border-b border-white/10 pb-6 font-bold"></div>
            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold mb-4"></div>
            <div class="flex gap-2"><input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs" placeholder="코멘트 입력..."><button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs">등록</button></div>
        </div>
    </div>

    <div id="admin-modal" class="modal" onclick="toggleModal('admin-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-xl font-black mb-6 text-red-400 uppercase italic">Admin Settings</h3>
            <div class="flex gap-2 mb-6"><input type="text" id="new-user-name" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm" placeholder="새 유저 이름"><button onclick="addUser()" class="bg-red-600 px-6 rounded-2xl font-black text-xs">추가</button></div>
            <div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 font-bold"></div>
            <button onclick="toggleModal('admin-modal', false)" class="mt-6 text-gray-500 text-xs font-black">닫기</button>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3><button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div><div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6"></div><button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl">+ 새로운 기록 추가</button></div></div>
    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col text-center font-bold" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic">My Profile</h3><div class="flex flex-col items-center gap-6 mb-8 border-b border-white/10 pb-8"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 object-cover bg-slate-800"><div id="display-name" class="text-xl font-black"></div></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1">Attend History</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar text-left font-bold"></div><button onclick="toggleModal('profile-modal', false)" class="mt-6 text-gray-500 text-xs font-black uppercase">닫기</button></div></div>
    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-6 text-green-400">기록 정보 입력</h3><input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold" placeholder="기록 제목 (필수)"><div id="member-selector" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-white/10 rounded-2xl mb-6 custom-scrollbar"></div><button onclick="submitSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl">기록 생성</button></div></div>
    <div id="rate-modal" class="modal" onclick="toggleModal('rate-modal', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 text-center"></h3><div id="rate-score-section" class="space-y-4"><label class="text-[10px] text-gray-500 block text-center font-bold">재미 점수 (0 ~ 100)</label><input type="number" id="rate-score-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center text-2xl" placeholder="0"><button onclick="submitRating('score')" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black">점수 저장</button></div><div id="rate-diff-section" class="space-y-4 hidden"><label class="text-[10px] text-gray-500 block text-center font-bold">난이도 평가 (1 ~ 5)</label><input type="range" id="rate-diff-range" min="1" max="5" step="1" class="w-full accent-blue-500" oninput="document.getElementById('diff-val').innerText = '★'.repeat(this.value)"><div id="diff-val" class="text-center text-3xl text-blue-400 font-bold">★★★</div><button onclick="submitRating('diff')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white">난이도 저장</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, arrayUnion, addDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';
        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeScheduleId = null; let selectedMembers = [];

        // [v6.0.3 초기화 및 세션 유지]
        window.addEventListener('DOMContentLoaded', async () => {
            const savedAuth = localStorage.getItem('bbg_auth');
            if (savedAuth) {
                const { pin, pw } = JSON.parse(savedAuth);
                const snap = await getDoc(doc(db, "users", String(pin)));
                if (snap.exists() && String(snap.data().password) === String(pw)) {
                    currentUser = { pin: String(pin), ...snap.data() };
                    updateUI(); showPage('page-home', false); return;
                }
            }
            showPage('page-login', false);
        });

        // [1.1 마이프로필 로딩 & 4.3 기록 연동]
        window.toggleProfileModal = async (s) => {
            if (s && currentUser) {
                document.getElementById('display-name').innerText = currentUser.name;
                document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON;
                const listDiv = document.getElementById('my-history-list');
                listDiv.innerHTML = `<p class="opacity-30 italic text-sm text-center py-10 font-bold">로딩 중...</p>`;
                toggleModal('profile-modal', true);
                const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin));
                const snap = await getDocs(q);
                listDiv.innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    return `<div onclick="navToHistory('${data.gameCategory}','${data.gameId}','${data.gameName}','${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 font-bold mb-1 cursor-pointer hover:bg-white/10 transition flex justify-between items-center">
                        <div><div class="text-[9px] text-blue-400 uppercase font-black">${data.gameCategory || '🎲'}</div><div class="text-sm">${data.gameName} - ${data.name}</div></div>
                        <span class="text-yellow-400 text-xs">▶</span>
                    </div>`;
                }).join('') || "참석 기록 없음";
            } else toggleModal('profile-modal', false);
        };

        window.navToHistory = async (cat, gid, gname, sid) => {
            closeAllModals(); selectedCategory = cat; document.getElementById('rank-title').innerText = cat;
            showPage('page-rank'); await renderList();
            await openSchedules(gid, gname);
            setTimeout(() => openScheduleDetail(sid), 350);
        };

        // [2. 게임 보드 렌더링]
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 text-center font-bold">로딩 중...</td></tr>`;
            const search = document.getElementById('game-search').value.toLowerCase();
            const sort = document.getElementById('sort-selector').value;
            const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
            const rt = rS.docs.map(d => d.data());
            let gms = gS.docs.map(d => {
                const r = rt.filter(v => v.gameId === d.id); const sc = r.map(v => v.score || 0);
                const avgS = sc.length > 0 ? sc.reduce((a,c)=>a+c,0)/sc.length : 0;
                const df = r.map(v => v.difficulty || 0).filter(v => v > 0);
                return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: df.length > 0 ? df.reduce((a,c)=>a+c,0)/df.length : 0 };
            }).filter(g => g.name.toLowerCase().includes(search));
            if(sort === 'score_desc') gms.sort((a,b)=>b.avgScore - a.avgScore);
            list.innerHTML = gms.map((g, i) => `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold"><td class="p-4 text-blue-400 font-black text-center w-12 font-bold">${i < 3 ? '🥇' : '#'+(i+1)}</td><td class="p-4 text-left font-bold"><span class="game-name-text text-sm font-black font-bold">${g.name}</span></td><td class="p-2 text-center w-24 btn-priority" onclick="event.stopPropagation();"><div class="flex flex-col items-center"><span onclick="openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-base font-black cursor-pointer font-bold">${g.avgScore.toFixed(1)}</span><span onclick="openRate('diff','${g.id}','${g.name}')" class="text-[8px] text-blue-400 cursor-pointer font-bold">${'★'.repeat(Math.round(g.avgDiff))}</span></div></td><td class="p-4 w-20 text-center font-bold btn-priority"><button onclick="event.stopPropagation(); openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black">기록</button></td></tr>`).join('');
        };

        // [3. 상세 결과 데이터 복구]
        window.openSchedules = async (id, n) => {
            activeGameId = id; document.getElementById('schedule-game-title').innerText = n; toggleModal('schedule-modal', true);
            const sS = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id), orderBy("createdAt", "desc")));
            document.getElementById('schedule-list').innerHTML = sS.docs.map(d => `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold mb-1"><div><div class="text-sm text-green-300 font-bold">${d.data().name}</div></div><span class="text-blue-400 text-xs font-bold font-bold font-bold">▶</span></div>`).join('') || "기록 없음";
        };

        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid; const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]);
            const d = sS.data(); const uMap = uS.docs.reduce((acc, doc) => ({...acc, [doc.id]: doc.data().name}), {});
            document.getElementById('detail-title').innerText = d.name; document.getElementById('detail-date').innerText = "📅 " + (d.date || "미기록");
            document.getElementById('detail-rank-result').innerHTML = (d.ranks || []).map((p, i) => `<div class="flex justify-between font-bold"><span>${i+1}위</span><span>${uMap[p] || '?'}</span></div>`).join('') || "순위 미기록";
            document.getElementById('detail-comment-feed').innerHTML = (d.feed || []).map(f => `<div class="bg-white/5 p-3 rounded-xl border border-white/5 font-bold"><b>${uMap[f.userPin] || '?'}:</b> ${f.text}</div>`).join('') || "<p class='opacity-20 text-center py-4 font-bold'>코멘트 없음</p>";
            toggleModal('detail-modal', true);
        };

        // [6. 관리자 시스템]
        window.openAdmin = async () => {
            const uS = await getDocs(collection(db, "users"));
            document.getElementById('admin-user-list').innerHTML = uS.docs.map(d => `<div class="bg-white/5 p-3 rounded-xl flex justify-between items-center font-bold"><span>${d.data().name} (${d.id})</span><button onclick="deleteUser('${d.id}')" class="text-red-400 text-xs font-bold">삭제</button></div>`).join('');
            toggleModal('admin-modal', true);
        };
        window.addUser = async () => {
            const name = document.getElementById('new-user-name').value.trim(); if(!name) return;
            const uS = await getDocs(collection(db, "users"));
            const maxPin = Math.max(...uS.docs.map(d => parseInt(d.id)), 99);
            await setDoc(doc(db, "users", String(maxPin + 1)), { name, password: "1234", iconUrl: "" });
            document.getElementById('new-user-name').value = ""; openAdmin();
            setTimeout(() => { const l = document.getElementById('admin-user-list'); l.scrollTop = l.scrollHeight; }, 300);
        };

        // 기초 유틸리티
        window.login = async () => {
            const pinIn = document.getElementById('pin').value.trim(); const pwIn = document.getElementById('pw').value.trim();
            const snap = await getDoc(doc(db, "users", String(pinIn)));
            if (snap.exists() && String(snap.data().password) === String(pwIn)) {
                currentUser = { pin: String(pinIn), ...snap.data() }; localStorage.setItem('bbg_auth', JSON.stringify({ pin: pinIn, pw: pwIn }));
                updateUI(); showPage('page-home');
            } else alert("정보 불일치");
        };
        window.updateUI = () => {
            document.getElementById('user-welcome').innerText = `${currentUser.name}님`;
            document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON;
            if(currentUser.pin === "100") document.getElementById('admin-entry').classList.remove('hidden');
        };
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const t = document.getElementById(id); if(t) { t.classList.add('active'); document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block'; if(push) history.pushState({page: id}, '', ''); }
        };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.logout = () => { localStorage.removeItem('bbg_auth'); location.reload(); };
    </script>
</body>
</html>
