<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ranking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .category-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .category-card:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.1); border-color: #3b82f6; }
        input::placeholder { color: rgba(255,255,255,0.3); }
        #pin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        #pin-modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="fixed top-0 left-0 w-full bg-blue-600/20 backdrop-blur-md border-b border-white/10 p-2 text-center text-sm font-semibold text-blue-300 z-50">
        💡 모든 사용자의 기본 비밀번호는 <span class="text-white underline">1234</span>입니다.
    </div>

    <div id="page-home" class="page active w-full max-w-4xl text-center pt-10">
        <div class="flex justify-between items-center mb-4 max-w-md mx-auto">
            <span id="user-welcome" class="text-blue-400 text-sm font-bold"></span>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs underline">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tight">GAME <span class="text-blue-500">ARCHIVE</span></h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🕵️ 머더 미스테리</button>
        </div>
        <button onclick="togglePinModal(true)" class="mt-12 text-gray-400 hover:text-white text-sm underline">내 PIN 번호 확인하기</button>
    </div>

    <div id="page-login" class="page w-full max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6">인증이 필요합니다</h2>
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-xs text-gray-400 ml-1">USER PIN</label>
                    <input type="text" id="pin" placeholder="PIN 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 ml-1">PASSWORD</label>
                    <input type="password" id="pw" placeholder="PW 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-blue-500">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500 shadow-lg shadow-blue-500/20 transition-all mt-2">로그인 및 자동 로그인</button>
            </div>
            <div class="mt-6 flex flex-col gap-2">
                <button onclick="togglePinModal(true)" class="text-xs text-blue-400 hover:underline">내 PIN 번호를 모르겠어요</button>
            </div>
        </div>
    </div>

    <div id="pin-modal">
        <div class="glass w-full max-w-md p-6 rounded-3xl max-h-[80vh] flex flex-col text-center">
            <div class="flex justify-between items-center mb-4 text-left">
                <h3 class="text-xl font-bold ml-2">PIN 번호 찾기</h3>
                <button onclick="togglePinModal(false)" class="text-gray-400 hover:text-white text-2xl">✕</button>
            </div>
            <div class="overflow-y-auto pr-2 custom-scrollbar text-left" id="pin-list-content"></div>
            <button onclick="togglePinModal(false)" class="mt-6 w-full bg-white/10 py-3 rounded-xl font-bold hover:bg-white/20">닫기</button>
        </div>
    </div>

    <div id="page-rank" class="page w-full max-w-3xl">
        <div class="flex justify-between items-end mb-8">
            <div><button onclick="showPage('page-home')" class="text-blue-400 text-sm hover:underline mb-2">← 뒤로가기</button><h2 id="rank-title" class="text-3xl font-bold">카테고리</h2></div>
            <button onclick="addGame()" class="bg-white/10 px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/20 transition">+ 새 항목 추가</button>
        </div>
        <div class="glass rounded-3xl overflow-hidden"><table class="w-full text-left border-collapse"><thead class="bg-white/5 text-gray-400 text-xs uppercase tracking-wider"><tr><th class="p-5">순위</th><th class="p-5">게임 이름</th><th class="p-5">평점</th><th class="p-5 text-center">상태</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE",
        authDomain: "game-archive-afacf.firebaseapp.com",
        projectId: "game-archive-afacf",
        storageBucket: "game-archive-afacf.firebasestorage.app",
        messagingSenderId: "927042381268",
        appId: "1:927042381268:web:e41f4106cf9202e45ca241"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let selectedCategory = "";

    // [기능 추가] 페이지 로드 시 자동 로그인 체크
    window.addEventListener('DOMContentLoaded', async () => {
        const savedAuth = localStorage.getItem('game_archive_auth');
        if (savedAuth) {
            const authData = JSON.parse(savedAuth);
            try {
                const snap = await getDoc(doc(db, "users", authData.pin));
                if (snap.exists() && snap.data().password === authData.pw) {
                    currentUser = { pin: authData.pin, name: snap.data().name };
                    updateUIForUser();
                    showPage('page-home');
                } else {
                    showPage('page-login');
                }
            } catch(e) { showPage('page-login'); }
        } else {
            showPage('page-login');
        }
    });

    window.login = async function() {
        const pinInput = document.getElementById('pin').value;
        const pwInput = document.getElementById('pw').value;

        if(!pinInput || !pwInput) return alert("정보를 모두 입력해주세요.");

        try {
            const snap = await getDoc(doc(db, "users", pinInput));
            if (snap.exists() && snap.data().password === pwInput) {
                currentUser = { pin: pinInput, name: snap.data().name };
                
                // [기능 추가] 로그인 성공 시 자동 로그인을 위한 정보 저장
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin: pinInput, pw: pwInput }));
                
                updateUIForUser();
                showPage('page-home');
            } else { alert("인증 정보가 틀립니다."); }
        } catch(e) { alert("로그인 오류"); }
    };

    window.logout = function() {
        localStorage.removeItem('game_archive_auth');
        currentUser = null;
        window.location.reload();
    };

    function updateUIForUser() {
        if(currentUser) {
            document.getElementById('user-welcome').innerText = `${currentUser.name}님 환영합니다!`;
        }
    }

    window.togglePinModal = async function(show) {
        const modal = document.getElementById('pin-modal');
        const content = document.getElementById('pin-list-content');
        if (show) {
            content.innerHTML = `<div class="p-10 text-center opacity-50 text-sm italic">명단 불러오는 중...</div>`;
            modal.classList.add('active');
            try {
                const snap = await getDocs(collection(db, "users"));
                let users = [];
                snap.forEach(d => users.push({ pin: d.id, name: d.data().name }));
                users.sort((a, b) => parseInt(a.pin) - parseInt(b.pin));
                content.innerHTML = users.map(u => `
                    <div class="flex justify-between items-center p-3 border-b border-white/5 hover:bg-white/5 transition">
                        <span class="text-gray-400 font-mono">${u.pin}</span>
                        <span class="font-bold">${u.name}</span>
                    </div>
                `).join('');
            } catch(e) { content.innerHTML = "명단을 불러오지 못했습니다."; }
        } else { modal.classList.remove('active'); }
    };

    window.navTo = function(cat) {
        selectedCategory = cat;
        document.getElementById('rank-title').innerText = cat;
        if (currentUser) renderList(); else showPage('page-login');
    };

    window.showPage = function(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        setTimeout(() => {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            const target = document.getElementById(pageId);
            target.style.display = 'block';
            setTimeout(() => target.classList.add('active'), 50);
        }, 400);
    };

    window.renderList = async function() {
        const list = document.getElementById('rank-list');
        list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-50 text-sm">랭킹 집계 중...</td></tr>`;
        try {
            const gSnap = await getDocs(query(collection(db, "games"), where("category", "==", selectedCategory)));
            const rSnap = await getDocs(collection(db, "ratings"));
            const ratings = rSnap.docs.map(d => d.data());
            
            let games = [];
            gSnap.forEach(d => {
                const gData = d.data();
                const tr = ratings.filter(r => r.gameId === d.id);
                const avg = tr.length > 0 ? tr.reduce((a, c) => a + c.score, 0) / tr.length : 0;
                const my = tr.find(r => r.userPin === currentUser.pin);
                games.push({ id: d.id, name: gData.name, avg, count: tr.length, myScore: my ? my.score : null });
            });
            games.sort((a, b) => b.avg - a.avg);

            list.innerHTML = games.map((g, i) => `
                <tr class="hover:bg-white/5 border-b border-white/5 transition text-sm">
                    <td class="p-5 font-mono text-blue-400">#${i+1}</td>
                    <td class="p-5 font-bold">${g.name} <span class="text-[10px] font-normal opacity-40">(${g.count}명)</span>
                    ${currentUser.pin === "100" ? `<button onclick="delGame('${g.id}','${g.name}')" class="text-red-500 text-[10px] ml-2 hover:underline font-normal">[삭제]</button>` : ''}</td>
                    <td class="p-5 text-yellow-400 font-semibold">${g.avg.toFixed(1)}점</td>
                    <td class="p-5 text-center">
                        <button onclick="inputScore('${g.id}','${g.name}')" class="px-3 py-1.5 rounded-xl text-[10px] font-bold transition ${g.myScore !== null ? 'bg-white/10 text-gray-400 cursor-default' : 'bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600 hover:text-white'}">
                        ${g.myScore !== null ? `내 점수: ${g.myScore}` : '점수 입력'}</button>
                    </td>
                </tr>`).join('');
            showPage('page-rank');
        } catch(e) { console.error(e); }
    };

    window.addGame = async function() {
        const n = prompt("새로운 게임 이름을 입력하세요:");
        if (n) { await addDoc(collection(db, "games"), { name: n, category: selectedCategory, createdAt: new Date() }); renderList(); }
    };

    window.delGame = async function(id, n) {
        if (confirm(`'${n}'을(를) 정말 삭제하시겠습니까?`)) { await deleteDoc(doc(db, "games", id)); renderList(); }
    };

    window.inputScore = async function(id, n) {
        const v = prompt(`${n}에 줄 점수를 입력하세요 (0~100):`);
        if (v !== null) {
            const s = parseFloat(v);
            if (isNaN(s) || s < 0 || s > 100) return alert("0~100 사이의 숫자를 입력해주세요.");
            await setDoc(doc(db, "ratings", `${currentUser.pin}_${id}`), { gameId: id, userPin: currentUser.pin, score: s, updatedAt: new Date() });
            alert("점수가 성공적으로 반영되었습니다!"); renderList();
        }
    };
</script>
</body>
</html>
