<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v3.8.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        .sticky-back { position: fixed; top: 20px; left: 20px; z-index: 5000; background: rgba(30, 41, 59, 0.9); padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; cursor: pointer; pointer-events: auto; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-black">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center font-bold">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase italic">Login</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10 shadow-lg">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg">📢 단톡방 정보</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-5 py-3 rounded-2xl font-extrabold" onclick="openAdminModal()">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-12 font-bold">
        <div class="flex justify-between items-end mb-8 px-4">
            <h2 id="rank-title" class="text-4xl font-black italic text-blue-400"></h2>
            <button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold">+ 새 게임</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 relative">
            <table class="w-full text-center min-w-[600px] font-bold">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 uppercase font-bold">
                    <th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th>평가</th><th>관리</th>
                </tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
    </div>

    <div id="rate-modal" class="modal" onclick="closeOnBackdrop(event, 'rate-modal')">
        <div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 truncate text-center"></h3>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] text-gray-500 block mb-2 font-bold">재미 점수 (0 ~ 100)</label>
                    <input type="number" id="rate-score" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center" placeholder="0 - 100">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 block mb-2 font-bold">체감 난이도 (1 ~ 10)</label>
                    <input type="number" id="rate-diff" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center" placeholder="1 - 10">
                </div>
                <button onclick="submitRating()" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black shadow-xl hover:brightness-110">평가 등록하기</button>
            </div>
        </div>
    </div>

    <div id="page-stats" class="page pt-12 font-bold text-center"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4"><div class="space-y-4"><h3 class="text-blue-400 italic mb-4 font-bold">🗳️ Voting King</h3><div id="vote-king" class="space-y-3 font-bold"></div></div><div class="space-y-4"><h3 class="text-green-400 italic mb-4 font-bold">🆕 Creator King</h3><div id="game-add-king" class="space-y-3 font-bold"></div></div></div></div>
    <div id="page-chat-info" class="page pt-12 font-bold"><div id="chat-info-list" class="space-y-4 px-4 font-bold"></div></div>
    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate pr-2 font-bold"></h3><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div><div id="detail-podium" class="bg-yellow-400/10 border border-yellow-500/20 p-5 rounded-3xl mb-6 hidden font-bold"><div id="detail-rank-result" class="text-sm space-y-1 font-bold"></div></div><div class="flex gap-2 mb-8 font-bold"><button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 py-4 rounded-2xl text-xs text-blue-300 font-bold">🥇 순위</button><button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 py-4 rounded-2xl text-xs text-green-300 font-bold">💬 코멘트</button></div><div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold"></div></div></div>
    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold text-center" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic font-bold">My Profile</h3><div class="flex flex-col items-center gap-6 mb-8 pb-8 border-b border-white/10 font-bold font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover bg-slate-800" onclick="document.getElementById('file-input').click()"><div class="w-full space-y-4"><input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none font-black text-center font-bold" placeholder="닉네임"><input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileUpload(this)"><button onclick="document.getElementById('file-input').click()" class="w-full bg-white/10 py-3 rounded-xl text-xs font-bold">사진 변경 또는 Ctrl+V</button></div><button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl font-bold">저장하기</button></div><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[180px] space-y-3 custom-scrollbar text-left font-bold font-bold"></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let profileImageData = ""; let tempMembers = []; let recordingRanks = []; let currentScheduleId = null;

        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) toggleModal(id, false); };
        
        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active');
            if(id === 'page-chat-info') loadChatInfo();
        };

        // [v3.8.0 렌더링 엔진 - 난이도 복구]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 italic font-bold font-bold font-bold font-bold">Loading...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const allRatings = rSnap.docs.map(d => d.data());
                
                let games = gSnap.docs.map(d => {
                    const r = allRatings.filter(v => v.gameId === d.id);
                    const scores = r.map(v => v.score || 0).sort((a, b) => a - b);
                    let avgS = scores.length >= 3 ? scores.slice(1, -1).reduce((a, c) => a + c, 0) / (scores.length - 2) : (r.length > 0 ? scores.reduce((a, c) => a + c, 0) / r.length : 0);
                    
                    const diffs = r.map(v => v.difficulty || 0).filter(v => v > 0);
                    let avgD = diffs.length > 0 ? diffs.reduce((a,c)=>a+c,0)/diffs.length : 0;
                    
                    return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: avgD, voteCount: r.length };
                }).sort((a, b) => b.avgScore - a.avgScore);

                list.innerHTML = games.map((g, i) => `
                    <tr class="hover:bg-white/5 border-b border-white/5 font-bold transition">
                        <td class="p-5 text-blue-400 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                        <td class="p-5 text-left font-black">
                            <div class="text-sm font-bold">${g.name}</div>
                            <div class="text-[9px] text-gray-500 font-bold">난이도: ${g.avgDiff > 0 ? g.avgDiff.toFixed(1) : '미측정'} | Votes: ${g.voteCount}</div>
                        </td>
                        <td class="p-5 font-bold text-yellow-400 font-bold">${g.avgScore.toFixed(1)}</td>
                        <td class="p-5">
                            <div class="flex gap-1 justify-center font-bold">
                                <button onclick="openRateModal('${g.id}','${g.name}')" class="bg-blue-600/20 text-blue-400 border border-blue-500/20 px-2.5 py-1.5 rounded-lg text-[9px] font-black hover:bg-blue-600 hover:text-white transition">평가</button>
                                <button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/20 px-2.5 py-1.5 rounded-lg text-[9px] font-black hover:bg-green-600 hover:text-white transition">기록</button>
                            </div>
                        </td>
                    </tr>`).join('');
            } catch (e) { list.innerHTML = "Error"; }
        };

        // [v3.8.0 평가 로직 복구]
        window.openRateModal = (id, name) => {
            activeGameId = id;
            document.getElementById('rate-modal-title').innerText = name;
            document.getElementById('rate-score').value = "";
            document.getElementById('rate-diff').value = "";
            toggleModal('rate-modal', true);
        };

        window.submitRating = async () => {
            const sc = parseFloat(document.getElementById('rate-score').value);
            const df = parseFloat(document.getElementById('rate-diff').value);
            if(isNaN(sc) || sc < 0 || sc > 100) return alert("재미 점수 0~100 입력!");
            if(isNaN(df) || df < 1 || df > 10) return alert("난이도 1~10 입력!");

            try {
                const q = query(collection(db, "ratings"), where("gameId", "==", activeGameId), where("userPin", "==", currentUser.pin));
                const snap = await getDocs(q);
                const rData = { gameId: activeGameId, userPin: currentUser.pin, score: sc, difficulty: df, updatedAt: serverTimestamp() };
                
                if(!snap.empty) await updateDoc(doc(db, "ratings", snap.docs[0].id), rData);
                else await addDoc(collection(db, "ratings"), rData);
                
                alert("평가 완료!");
                toggleModal('rate-modal', false);
                renderList();
            } catch(e) { alert("평가 실패"); }
        };

        // [인증 및 공통 기능 통합]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", d.pin)); if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home'); return; } }
            showPage('page-login');
        });
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } };
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin==="100") document.getElementById('admin-user-manage-btn')?.classList.remove('hidden'); }
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.handleFileUpload = (i) => { if(i.files[0]) { const r = new FileReader(); r.onload = (e) => { profileImageData = e.target.result; document.getElementById('profile-preview').src = profileImageData; }; r.readAsDataURL(i.files[0]); } };
        window.updateProfile = async () => { const n = document.getElementById('edit-nickname').value.trim(); const up = { name: n }; if(profileImageData) up.iconUrl = profileImageData; await updateDoc(doc(db, "users", currentUser.pin), up); location.reload(); };
        window.navToStats = async () => { showPage('page-stats'); const [rS, gS, uS] = await Promise.all([getDocs(collection(db,"ratings")), getDocs(collection(db,"games")), getDocs(collection(db,"users"))]); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); const vC = rS.docs.map(d=>d.data()).reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {}); document.getElementById('vote-king').innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center'><div class='flex items-center gap-3'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold'><span class='text-xs font-bold'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-blue-400 text-xs'>${v[1]}회</b></div>`).join(''); const gC = gS.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {}); document.getElementById('game-add-king').innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center'><div class='flex items-center gap-3'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold'><span class='text-xs font-bold'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-green-400 text-xs'>${v[1]}개</b></div>`).join(''); };
        window.openSchedules = async (id, n) => { activeGameId = id; activeGameName = n; document.getElementById('schedule-game-title').innerText = n; tempMembers = []; const uS = await getDocs(collection(db, "users")); document.getElementById('member-select-grid').innerHTML = uS.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[9px] border border-white/10 font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        window.toggleSelectMember = (p) => { const i = tempMembers.indexOf(p); const b = document.getElementById(`sel-${p}`); if(i>-1){ tempMembers.splice(i,1); b.classList.remove('selected'); } else { tempMembers.push(p); b.classList.add('selected'); } };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("입력 확인"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; tempMembers = []; loadSchedules(); };
        async function loadSchedules() { const l = document.getElementById('schedule-list'); const sS = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); l.innerHTML = sS.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center shadow-lg font-bold"><div class="text-left font-bold"><div class="text-sm text-green-300 font-bold">${s.name}</div><div class="text-[9px] text-gray-500 uppercase">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs">▶</span></div>`).join(''); }
        window.openScheduleDetail = async (id) => { currentScheduleId = id; const [sS, uS] = await Promise.all([getDoc(doc(db, "schedules", id)), getDocs(collection(db, "users"))]); const s = sS.data(); const uM = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); document.getElementById('detail-title').innerText = s.name; const p = document.getElementById('detail-podium'); if(s.ranks?.length > 0) { p.classList.remove('hidden'); document.getElementById('detail-rank-result').innerHTML = s.ranks.map((p, i) => `<div class='text-xs font-bold'>${i+1}위 <b>${uM[p]?.name || '?'}</b></div>`).join(''); } else p.classList.add('hidden'); document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map(l => `<div class="bg-white/5 p-4 rounded-2xl flex gap-3 font-bold border border-white/5"><img src="${uM[l.userPin]?.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8"><div class="flex-grow"><div class="flex justify-between items-center text-[10px] text-gray-500 mb-1"><span>${uM[l.userPin]?.name || 'Unknown'}</span>${l.userPin === currentUser.pin ? `<button onclick='deleteComment(${JSON.stringify(l).replace(/'/g, "&apos;")})' class='text-red-500'>🗑️</button>`:''}</div><div class="text-sm text-white/90 leading-relaxed font-bold">${l.text}</div></div></div>`).join('') || `<div class='opacity-20 text-center py-10 italic'>No records.</div>`; toggleModal('detail-modal', true); };
        window.saveNote = async () => { const t = document.getElementById('pop-comment-input').value.trim(); if(!t) return; await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayUnion({ userPin: currentUser.pin, text: t, time: Date.now() }) }); toggleModal('comment-popup', false); openScheduleDetail(currentScheduleId); };
        window.deleteComment = async (o) => { if(confirm("삭제?")){ await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayRemove(o) }); openScheduleDetail(currentScheduleId); } };
        window.openRankPopup = async () => { const s = (await getDoc(doc(db, "schedules", currentScheduleId))).data(); const uS = await getDocs(collection(db, "users")); const uM = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); recordingRanks = []; document.getElementById('rank-member-grid').innerHTML = s.members.map(m => `<button id='rb-${m}' onclick='recordRank("${m}")' class='bg-white/5 p-3 rounded-xl border border-white/10 text-[10px] font-bold'>${uM[m]?.name}</button>`).join(''); toggleModal('rank-popup', true); };
        window.recordRank = (p) => { if(recordingRanks.includes(p)) return; recordingRanks.push(p); document.getElementById(`rb-${p}`).style.opacity = "0.3"; };
        window.saveRanks = async () => { await updateDoc(doc(db, "schedules", currentScheduleId), { ranks: recordingRanks }); toggleModal('rank-popup', false); openScheduleDetail(currentScheduleId); };
        async function loadChatInfo() { const s = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); document.getElementById('chat-info-list').innerHTML = s.docs.map(d => `<div class='glass p-6 rounded-3xl text-left border border-white/10 shadow-xl'><h4 class='text-blue-300 mb-2 font-black font-bold'>${d.data().title}</h4><p class='text-sm opacity-80 whitespace-pre-wrap font-bold'>${d.data().content}</p></div>`).join('') || "No info."; }
        async function loadMyHistory() { const l = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sS = await getDocs(q); l.innerHTML = sS.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-1 border border-white/5 font-black"><div><div class="flex items-center gap-2 mb-1"><span class="category-tag font-bold">${s.gameCategory||'보드게임'}</span><span class="text-[9px] text-blue-500 font-bold">${s.gameName||'Unknown'}</span></div><div class="text-sm font-bold">${s.name}</div></div><div class="text-xs font-bold text-yellow-400">${s.ranks?.indexOf(currentUser.pin)>-1 ? (s.ranks.indexOf(currentUser.pin)+1)+'위' : '기록전'}</div></div>`).join(''); }
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
    </script>
</body>
</html>
