<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.9.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .member-btn.selected { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.4) !important; }
        .member-btn.ranked { border-color: #10b981 !important; background: rgba(16, 185, 129, 0.4) !important; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="window.history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm"><div class="glass p-8 rounded-3xl shadow-2xl text-center"><h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase tracking-widest italic">Login</h2><div class="space-y-4 text-left font-bold font-bold font-bold font-bold"><input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white"><input type="password" id="pw" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white"><button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 transition-all">접속하기</button></div></div></div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer font-bold" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold font-bold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs font-bold border border-white/10 px-3 py-1.5 rounded-lg transition font-bold font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 text-center font-bold">Game Archive</h1>
        <div class="flex justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition w-1/2 shadow-lg font-bold font-bold">🏆 명예전당</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-red-500 transition w-1/2 shadow-lg font-bold font-bold" onclick="toggleModal('admin-user-modal', true)">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 font-bold font-bold">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 font-bold font-bold">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 font-bold font-bold">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 font-bold font-bold">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-10 font-bold"><div class="flex flex-col mb-8 px-4 gap-6 text-left font-bold"><div class="flex justify-between items-end font-bold font-bold"><h2 id="rank-title" class="text-4xl font-extrabold italic text-blue-400 tracking-tighter font-bold"></h2><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-600 transition font-bold font-bold">+ 새 게임 추가</button></div><div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar font-bold font-bold font-bold"><button onclick="setSort('score_desc')" id="sort-score_desc" class="sort-btn active px-4 py-2 rounded-full border border-white/10 text-[11px] transition font-bold font-bold">점수 높은순</button></div></div><div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 font-bold"><table class="w-full border-collapse min-w-[550px] font-bold"><thead class="bg-white/5 text-gray-500 text-[10px] uppercase font-bold border-b border-white/10 text-center font-bold font-bold"><tr><th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="p-5 w-36">평가</th><th class="p-5 w-32">기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5 text-center font-bold font-bold font-bold"></tbody></table></div></div>
    
    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')"><div class="glass w-full max-w-lg p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-8 font-bold font-bold font-bold"><h3 id="schedule-game-title" class="text-2xl font-black italic text-green-400 tracking-tighter truncate pr-4 font-bold font-bold"></h3><button onclick="closeAllModals()" class="text-gray-500 hover:text-white text-3xl font-bold font-bold font-bold">✕</button></div><div class="space-y-5 mb-8 shrink-0 bg-white/5 p-5 rounded-3xl border border-white/5 font-bold font-bold font-bold font-bold"><input type="text" id="new-schedule-name" placeholder="모임 제목 (ex. 2/19 영등포팟)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold font-bold font-bold text-white"><div id="member-select-grid" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto custom-scrollbar p-2 bg-black/30 rounded-2xl border border-white/10 font-bold font-bold"></div><button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-xl font-bold font-bold font-bold">모임 일정 생성</button></div><div id="schedule-list" class="space-y-3 overflow-y-auto custom-scrollbar text-left flex-grow pr-2 font-bold font-bold font-bold"></div></div></div>

    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-3xl font-black text-center text-blue-400 mb-8 uppercase font-bold">My Profile</h3>
            <div class="flex flex-col items-center gap-6 mb-8 pb-8 border-b border-white/10 font-bold font-bold font-bold font-bold">
                <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover">
                <input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 text-center font-black" placeholder="닉네임">
                <button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl font-bold">정보 저장</button>
            </div>
            <h4 class="text-left text-[10px] font-black text-gray-500 uppercase mb-4 ml-1 tracking-widest font-bold font-bold">Attendance History</h4>
            <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[250px] space-y-3 custom-scrollbar text-left pr-2 font-bold font-bold font-bold font-bold"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let currentSort = "score_desc"; let allRatingsData = [];
        let tempMembers = []; let recordingRanks = []; let currentScheduleId = null;

        window.toggleModal = (id, show) => { document.getElementById(id).classList.toggle('active', show); };
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) closeAllModals(); };
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const target = document.getElementById(id);
            if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 50); }
            if (history.state?.page !== id) history.pushState({ page: id }, '', '');
        };

        // [인증]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const data = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", data.pin));
                if (snap.exists() && snap.data().password === data.pw) {
                    currentUser = { pin: data.pin, ...snap.data() };
                    updateHeaderUI();
                    if(currentUser.pin === "100") document.getElementById('admin-user-manage-btn').classList.remove('hidden');
                    showPage('page-home'); return;
                }
            }
            showPage('page-login');
        });

        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, ...snap.data() };
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw }));
                location.reload();
            } else alert("오류");
        };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };

        // [랭킹]
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-30 font-bold">Loading...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                allRatingsData = rSnap.docs.map(d => d.data());
                let games = gSnap.docs.map(d => {
                    const r = allRatingsData.filter(v => v.gameId === d.id); if (r.length === 0) return null;
                    const sc = r.map(v => v.score || 0).sort((a, b) => a - b);
                    let avg = sc.length >= 3 ? sc.slice(1, -1).reduce((a, c) => a + c, 0) / (sc.length - 2) : sc.reduce((a, c) => a + c, 0) / sc.length;
                    return { id: d.id, ...d.data(), avgScore: avg, voteCount: r.length };
                }).filter(g => g !== null);
                games.sort((a, b) => b.avgScore - a.avgScore);
                list.innerHTML = games.map((g, i) => { const rI = i < 3 && g.voteCount >= 3 ? ['🥇', '🥈', '🥉'][i] : `#${i + 1}`; return `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold"><td class="p-5 text-blue-400 text-lg font-bold">${rI}</td><td class="p-5 text-left font-bold"><div class="text-base font-black">${g.name}</div><div class="text-[9px] opacity-40 uppercase">Votes: ${g.voteCount}</div></td><td class="p-5 font-bold"><div class="text-yellow-400 font-black text-sm mb-1">${g.avgScore.toFixed(1)}점</div></td><td class="p-5 font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600 transition">기록</button></td></tr>`; }).join('');
            } catch (e) { list.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-400">Error</td></tr>`; }
        };

        // [v2.9.1 모든 카테고리 일정 생성 복구]
        window.openSchedules = async (id, name) => {
            activeGameId = id; activeGameName = name; // 전역 변수 설정
            document.getElementById('schedule-game-title').innerText = name;
            tempMembers = [];
            const grid = document.getElementById('member-select-grid');
            const uSnap = await getDocs(collection(db, "users"));
            grid.innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[10px] border border-white/10 font-bold">${d.data().name}</button>`).join('');
            toggleModal('schedule-modal', true);
            loadSchedules();
        };

        window.toggleSelectMember = (pin) => {
            const idx = tempMembers.indexOf(pin);
            const btn = document.getElementById(`sel-${pin}`);
            if(idx > -1) { tempMembers.splice(idx, 1); btn.classList.remove('selected'); } else { tempMembers.push(pin); btn.classList.add('selected'); }
        };

        window.createSchedule = async () => {
            const name = document.getElementById('new-schedule-name').value.trim();
            if(!name || tempMembers.length === 0) return alert("제목과 인원 확인");
            try {
                // gameName과 category 정보를 누락 없이 저장하여 히스토리에서 사용
                await addDoc(collection(db, "schedules"), {
                    gameId: activeGameId,
                    gameName: activeGameName,
                    gameCategory: selectedCategory, // 카테고리 정보 추가
                    name: name,
                    members: tempMembers,
                    ranks: [], feed: [], createdAt: serverTimestamp()
                });
                document.getElementById('new-schedule-name').value = "";
                tempMembers = []; loadSchedules();
            } catch(e) { alert("기록 생성 실패: " + e.message); }
        };

        async function loadSchedules() {
            const listDiv = document.getElementById('schedule-list');
            const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId)));
            let logs = sSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            logs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            listDiv.innerHTML = logs.map(s => {
                const canDelete = s.members?.includes(currentUser.pin);
                return `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center hover:bg-white/10 transition-all mb-2 shadow-lg font-bold"><div onclick="openScheduleDetail('${s.id}')" class="flex-grow cursor-pointer pr-4 font-bold"><div class="text-sm text-green-300 mb-1 font-bold font-bold">${s.name}</div><div class="text-[9px] font-bold ${s.ranks?.length > 0 ? 'text-blue-400' : 'text-gray-500'} font-bold">${s.ranks?.length > 0 ? 'RECORDED' : 'WAITING'}</div></div>${canDelete ? `<button onclick="deleteSchedule('${s.id}')" class="p-2 text-gray-500 hover:text-red-500 text-xs">🗑️</button>` : ''}</div>`;
            }).join('') || `<p class="opacity-20 text-center py-4 text-xs italic font-bold">No Records</p>`;
        }

        // [v2.9.1 마이 히스토리 태그 추가]
        async function loadMyHistory() {
            const listDiv = document.getElementById('my-history-list');
            listDiv.innerHTML = `<p class="opacity-30 text-[10px] font-black uppercase text-center py-6 italic font-bold">Loading...</p>`;
            try {
                const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin));
                const sSnap = await getDocs(q);
                let logs = sSnap.docs.map(d => d.data());
                logs.sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
                
                listDiv.innerHTML = logs.map(s => {
                    const r = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1;
                    const rankTxt = r > -1 ? `<span class="text-yellow-400 text-lg">${r+1}</span>위` : "기록전";
                    return `
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 shadow-inner font-bold">
                        <div class="text-left">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="category-tag">${s.gameCategory || '기타'}</span>
                                <span class="text-[9px] text-blue-500 font-black uppercase tracking-tighter">${s.gameName || 'Unknown'}</span>
                            </div>
                            <div class="text-sm font-black">${s.name}</div>
                        </div>
                        <div class="text-xs italic pr-1 font-bold font-bold">${rankTxt}</div>
                    </div>`;
                }).join('') || `<p class="opacity-20 text-center py-4 text-xs font-bold">내역 없음</p>`;
            } catch(e) { listDiv.innerHTML = "오류"; }
        }

        // [기타 시스템]
        window.deleteSchedule = async (id) => { if(confirm("삭제?")) { await deleteDoc(doc(db, "schedules", id)); loadSchedules(); } };
        function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.updateProfile = async () => { const n = document.getElementById('edit-nickname').value.trim(); await updateDoc(doc(db, "users", currentUser.pin), { name: n }); currentUser.name = n; updateHeaderUI(); alert("수정 완료"); };
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
    </script>
</body>
</html>
