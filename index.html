<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v3.9.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        /* 뒤로가기 버튼 강제 상위 배치 */
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: none; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn" class="active:scale-95 transition-transform">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic">LOGIN</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold mt-4">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer p-1 hover:bg-white/5 rounded-xl transition" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10 shadow-lg">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg transition hover:text-red-400">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500/20 transition">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500/20 transition">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-20 font-bold">
        <div class="flex justify-between items-end mb-8 px-4 font-bold">
            <h2 id="rank-title" class="text-4xl font-black italic text-blue-400"></h2>
            <button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold">+ 새 게임</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl">
            <table class="w-full text-center min-w-[600px] border-collapse">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 uppercase font-black">
                    <th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="w-32">평가</th><th>기록</th>
                </tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <div id="rate-modal" class="modal" onclick="closeOnBackdrop(event, 'rate-modal')">
        <div class="glass w-full max-w-xs p-8 rounded-[40px] text-center" onclick="event.stopPropagation()">
            <h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 truncate"></h3>
            <div id="rate-score-section" class="space-y-4">
                <p class="text-[10px] text-gray-500">재미 점수 (0 ~ 100)</p>
                <input type="number" id="rate-score-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center text-3xl">
                <button onclick="submitRating('score')" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black">점수 저장</button>
            </div>
            <div id="rate-diff-section" class="space-y-4 hidden">
                <p class="text-[10px] text-gray-500">체감 난이도 (1 ~ 10)</p>
                <input type="range" id="rate-diff-range" min="1" max="10" step="1" class="w-full accent-blue-500" oninput="document.getElementById('diff-val').innerText = this.value">
                <div id="diff-val" class="text-3xl font-black text-blue-400">5</div>
                <button onclick="submitRating('diff')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white">난이도 저장</button>
            </div>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3>
                <button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-2xl font-bold">✕</button>
            </div>
            <div class="mb-6 space-y-3">
                <input type="text" id="new-schedule-name" placeholder="모임/일지 제목" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold">
                <div id="member-select-grid" class="grid grid-cols-4 gap-2 max-h-[120px] overflow-y-auto custom-scrollbar p-1"></div>
                <button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-lg">새 모임 생성</button>
            </div>
            <div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3"></div>
        </div>
    </div>

    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] text-center" onclick="event.stopPropagation()"><h3 class="text-2xl font-black text-blue-400 mb-6 uppercase italic">My Profile</h3><div class="flex flex-col items-center gap-6 mb-8 border-b border-white/10 pb-8"><div class="relative group cursor-pointer" onclick="document.getElementById('file-input').click()"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 object-cover"><div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">📸</div></div><input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-center font-black" placeholder="닉네임"><input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileUpload(this)"><button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black">저장하기</button></div><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[200px] space-y-2 custom-scrollbar text-left"></div></div></div>
    <div id="page-stats" class="page pt-24 font-bold text-center"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4"><div class="space-y-4 text-center"><h3 class="text-blue-400 font-black italic">🗳️ Voting King</h3><div id="vote-king" class="space-y-3"></div></div><div class="space-y-4 text-center"><h3 class="text-green-400 font-black italic">🆕 Creator King</h3><div id="game-add-king" class="space-y-3"></div></div></div></div>
    <div id="page-chat-info" class="page pt-24 font-bold px-4"><h2 class="text-3xl font-black text-blue-400 mb-10 italic uppercase">Group Info 📢</h2><div id="chat-info-list" class="space-y-4"></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let profileImageData = ""; let tempMembers = [];

        // [v3.9.1 내비게이션 복구]
        window.handleBack = () => {
            if(document.querySelector('.modal.active')) { closeAllModals(); return; }
            showPage('page-home');
        };

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // 뒤로가기 버튼 강제 제어
            const backBtn = document.getElementById('global-back-btn');
            if(id !== 'page-home' && id !== 'page-login') backBtn.style.display = 'block';
            else backBtn.style.display = 'none';

            if(id === 'page-chat-info') loadChatInfo();
            if(id === 'page-stats') navToStats();
        };

        // [v3.9.1 리스트 렌더링 - 기록 버튼 복구]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 italic font-bold">Loading...</td></tr>`;
            const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
            const allRatings = rSnap.docs.map(d => d.data());
            
            let games = gSnap.docs.map(d => {
                const r = allRatings.filter(v => v.gameId === d.id);
                const sc = r.map(v => v.score || 0).sort((a,b)=>a-b);
                let avgS = (r.length >= 5) ? sc.slice(1, -1).reduce((a,c)=>a+c,0)/(sc.length-2) : (r.length > 0 ? sc.reduce((a,c)=>a+c,0)/r.length : 0);
                const df = r.map(v => v.difficulty || 0).filter(v => v > 0);
                let avgD = df.length > 0 ? df.reduce((a,c)=>a+c,0)/df.length : 0;
                return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: avgD, voteCount: r.length };
            }).sort((a,b) => b.avgScore - a.avgScore);

            list.innerHTML = games.map((g, i) => {
                const stars = Math.round(g.avgDiff);
                return `
                <tr class="hover:bg-white/5 border-b border-white/5 font-bold transition relative">
                    <td class="p-5 text-blue-400 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                    <td class="p-5 text-left"><div class="text-sm font-black">${g.name}</div><div class="text-[9px] text-gray-500">Votes: ${g.voteCount}</div></td>
                    <td class="p-2">
                        <div class="flex flex-col items-center gap-1">
                            <span onclick="openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-lg cursor-pointer hover:scale-110 font-black">${g.avgScore.toFixed(1)}</span>
                            <div onclick="openRate('diff','${g.id}','${g.name}')" class="flex text-[10px] cursor-pointer hover:opacity-70">
                                ${Array(10).fill(0).map((_, idx) => `<span class="${idx < stars ? 'text-blue-400' : 'text-gray-700'}">★</span>`).join('')}
                            </div>
                        </div>
                    </td>
                    <td class="p-5 relative z-20">
                        <button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/20 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600 hover:text-white transition">기록</button>
                    </td>
                </tr>`;
            }).join('');
        };

        // [평가 및 기록 로직]
        window.openRate = (type, id, name) => { activeGameId = id; document.getElementById('rate-modal-title').innerText = name; document.getElementById('rate-score-section').classList.toggle('hidden', type !== 'score'); document.getElementById('rate-diff-section').classList.toggle('hidden', type !== 'diff'); toggleModal('rate-modal', true); };
        window.submitRating = async (type) => {
            const val = (type === 'score') ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-range').value);
            if(type === 'score' && (isNaN(val) || val < 0 || val > 100)) return alert("0~100 입력!");
            try {
                const q = query(collection(db, "ratings"), where("gameId", "==", activeGameId), where("userPin", "==", currentUser.pin));
                const snap = await getDocs(q);
                const rData = { gameId: activeGameId, userPin: currentUser.pin, updatedAt: serverTimestamp() };
                rData[type === 'score' ? 'score' : 'difficulty'] = val;
                if(!snap.empty) await updateDoc(doc(db, "ratings", snap.docs[0].id), rData);
                else await addDoc(collection(db, "ratings"), rData);
                alert("성공!"); toggleModal('rate-modal', false); renderList();
            } catch(e) { alert("실패"); }
        };

        window.openSchedules = async (id, n) => { 
            activeGameId = id; activeGameName = n; 
            document.getElementById('schedule-game-title').innerText = n; 
            const uS = await getDocs(collection(db, "users")); 
            document.getElementById('member-select-grid').innerHTML = uS.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[9px] border border-white/10 font-bold">${d.data().name}</button>`).join(''); 
            toggleModal('schedule-modal', true); 
            loadSchedules(); 
        };

        async function loadSchedules() { 
            const l = document.getElementById('schedule-list'); 
            const sS = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); 
            l.innerHTML = sS.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-2 shadow-lg font-bold"><div class="text-left font-bold"><div class="text-sm text-green-300">${s.name}</div><div class="text-[9px] text-gray-500 uppercase">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs">▶</span></div>`).join(''); 
        }

        // [인증 및 공통 기능]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", d.pin)); if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home'); return; } }
            showPage('page-login');
        });
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.updateUI = () => { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) toggleModal(id, false); };
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
        window.toggleSelectMember = (p) => { const i = tempMembers.indexOf(p); const b = document.getElementById(`sel-${p}`); if(i>-1){ tempMembers.splice(i,1); b.classList.remove('selected-m'); b.style.borderColor = 'rgba(255,255,255,0.1)'; b.style.color = 'white'; } else { tempMembers.push(p); b.style.borderColor = '#60a5fa'; b.style.color = '#60a5fa'; } };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("입력 확인"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; loadSchedules(); };
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.handleFileUpload = (i) => { if(i.files[0]) { const r = new FileReader(); r.onload = (e) => { profileImageData = e.target.result; document.getElementById('profile-preview').src = e.target.result; }; r.readAsDataURL(i.files[0]); } };
        window.updateProfile = async () => { const n = document.getElementById('edit-nickname').value.trim(); const up = { name: n }; if(profileImageData) up.iconUrl = profileImageData; await updateDoc(doc(db, "users", currentUser.pin), up); location.reload(); };
        async function loadMyHistory() { const l = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sS = await getDocs(q); l.innerHTML = sS.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div class="bg-white/5 p-4 rounded-xl text-xs font-bold border border-white/5 mb-1"><b>${s.gameName}</b><br>${s.name}</div>`).join(''); }
        async function loadChatInfo() { const s = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); document.getElementById('chat-info-list').innerHTML = s.docs.map(d => `<div class='glass p-6 rounded-3xl text-left border border-white/10 font-bold'><h4 class='text-blue-300 mb-2'>${d.data().title}</h4><p class='text-sm opacity-80 whitespace-pre-wrap'>${d.data().content}</p></div>`).join('') || "No info."; }
        async function navToStats() {
            showPage('page-stats');
            const [rS, gS, uS] = await Promise.all([getDocs(collection(db,"ratings")), getDocs(collection(db,"games")), getDocs(collection(db,"users"))]);
            const uM = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            const vC = rS.docs.map(d=>d.data()).reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {});
            document.getElementById('vote-king').innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center text-xs'><span>${uM[v[0]]?.name || '?'}</span><b>${v[1]}회</b></div>`).join('') || "No Data";
        }
    </script>
</body>
</html>
