<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v6.0.20</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        /* 1.1 해결을 위한 레이어 우선순위 강화 */
        #profile-modal { z-index: 11000 !important; }
        #detail-modal { z-index: 10500 !important; }
        #schedule-modal { z-index: 10400 !important; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 10px 4px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.05); transition: 0.2s; }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 cursor-pointer relative z-[2000]" style="pointer-events: auto !important;" onclick="event.preventDefault(); event.stopPropagation(); toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3241/3241724.png'">
                <div class="text-left"><span id="user-welcome" class="text-blue-300 text-sm font-black block"></span><span class="text-[9px] text-gray-500 font-bold">My Profile ></span></div>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg font-bold relative z-[2000]">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="showPage('page-stats')" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold font-bold">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold font-bold font-bold">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold font-bold font-bold">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition font-bold font-bold font-bold font-bold">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <div class="flex flex-col min-w-0 flex-1"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate"></h3><span id="detail-date" class="text-[10px] text-gray-500"></span></div>
                <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold font-bold">✕</button>
            </div>
            <div id="detail-rank-result" class="text-sm space-y-2 mb-6 border-b border-white/10 pb-6"></div>
            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left mb-4"></div>
            <div class="flex gap-2 font-bold"><input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold" placeholder="코멘트 입력..."><button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs font-bold">등록</button></div>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold"><div class="px-4 mb-4 font-bold font-bold"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase"></h2></div><div class="glass rounded-[40px] overflow-hidden mx-4 shadow-2xl border border-white/5 font-bold font-bold font-bold"><table class="w-full text-center table-fixed border-collapse font-bold font-bold font-bold"><thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-12 text-center font-bold">#</th><th class="p-4 text-left font-bold">정보</th><th class="w-24 text-center font-bold">평가</th><th class="w-20 font-bold">기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5 font-bold font-bold font-bold"></tbody></table></div></div>
    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold font-bold font-bold font-bold"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3><button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold font-bold font-bold">✕</button></div><div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold font-bold font-bold font-bold font-bold font-bold"></div><button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl font-bold font-bold font-bold font-bold">+ 새로운 기록 추가</button></div></div>
    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-6 text-green-400 italic">NEW RECORD</h3><input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold" placeholder="기록 제목 (예: 1월 정모)"><label class="text-[10px] text-gray-500 ml-1 mb-2 font-bold uppercase">Members Select</label><div id="member-selector" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-white/10 rounded-2xl mb-6 custom-scrollbar font-bold"></div><button onclick="submitSchedule()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white shadow-xl font-bold font-bold font-bold font-bold">기록 생성</button></div></div>
    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col text-center font-bold font-bold font-bold" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic font-bold">My Profile</h3><div class="flex flex-col items-center gap-4 mb-8 font-bold font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 object-cover bg-slate-800"><div id="display-name" class="text-xl font-black font-bold font-bold font-bold font-bold font-bold"></div></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1 font-bold font-bold font-bold font-bold">Attend History</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar text-left font-bold font-bold font-bold font-bold"></div><button onclick="toggleModal('profile-modal', false)" class="mt-6 text-gray-500 text-xs font-black uppercase font-bold font-bold font-bold font-bold">닫기</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, addDoc, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';
        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = ""; let activeScheduleId = null; let selectedMembers = [];

        // [v6.0.20 3.6 코멘트 등록 엔진 수리]
        window.submitComment = async () => {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text || !activeScheduleId) return;
            try {
                // v6.0.19 오류(3d6c78) 수리: new Date() 형식을 단순화하여 저장
                const commentData = {
                    userPin: String(currentUser.pin),
                    text: text,
                    createdAt: new Date().toISOString()
                };
                await updateDoc(doc(db, "schedules", activeScheduleId), {
                    feed: arrayUnion(commentData)
                });
                input.value = "";
                openScheduleDetail(activeScheduleId); // 실시간 갱신
            } catch(e) { 
                console.error("코멘트 등록 에러:", e);
                alert("등록 실패: 네트워크 상태를 확인하세요."); 
            }
        };

        // [v6.0.20 1.1 마이프로필 & 4.3 히스토리 연동 수리]
        window.toggleProfileModal = async (show) => {
            if (show && currentUser) {
                const nameEl = document.getElementById('display-name');
                const imgEl = document.getElementById('profile-preview');
                const listDiv = document.getElementById('my-history-list');
                
                if(nameEl) nameEl.innerText = currentUser.name;
                if(imgEl) imgEl.src = currentUser.iconUrl || DEFAULT_ICON;
                if(listDiv) listDiv.innerHTML = `<p class="opacity-30 italic text-sm text-center py-10 font-bold font-bold font-bold font-bold">로딩 중...</p>`;
                
                toggleModal('profile-modal', true);
                
                try {
                    const q = query(collection(db, "schedules"), where("members", "array-contains", String(currentUser.pin)));
                    const snap = await getDocs(q);
                    if(listDiv) {
                        listDiv.innerHTML = snap.docs.map(d => {
                            const s = d.data();
                            return `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 mb-1 cursor-pointer hover:bg-white/10 flex justify-between items-center font-bold font-bold font-bold font-bold">
                                <div class="text-left font-bold font-bold font-bold font-bold font-bold"><div class="text-[9px] text-blue-400 uppercase font-black font-bold font-bold">${s.gameCategory || '🎲'}</div><div class="text-sm font-bold font-bold font-bold font-bold">${s.gameName} - ${s.name}</div></div>
                                <span class="text-yellow-400 text-xs font-bold font-bold font-bold font-bold font-bold font-bold">▶</span>
                            </div>`;
                        }).join('') || "기록이 없습니다.";
                    }
                } catch(e) { if(listDiv) listDiv.innerHTML = "조회 실패"; }
            } else toggleModal('profile-modal', false);
        };

        // [v6.0.20 3.2 상세 데이터 로딩 엔진]
        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid;
            const [sS, uS] = await Promise.all([getDoc(doc(db, "schedules", sid)), getDocs(collection(db, "users"))]);
            if (!sS.exists()) return;
            const d = sS.data(); const uMap = uS.docs.reduce((acc, doc) => ({...acc, [doc.id]: doc.data().name}), {});
            
            document.getElementById('detail-title').innerText = d.name;
            document.getElementById('detail-date').innerText = "📅 " + (d.date || "미기록");
            document.getElementById('detail-rank-result').innerHTML = (d.ranks || []).map((p, i) => `<div class="flex justify-between font-bold font-bold font-bold font-bold"><span>${i+1}위</span><span>${uMap[p] || '?'}</span></div>`).join('') || "<p class='opacity-20 text-center font-bold font-bold font-bold font-bold font-bold font-bold'>순위 미기록</p>";
            document.getElementById('detail-comment-feed').innerHTML = (d.feed || []).map(f => `<div class="bg-white/5 p-3 rounded-xl border border-white/5 font-bold font-bold font-bold"><b>${uMap[f.userPin] || '?'}:</b> ${f.text}</div>`).join('') || "<p class='opacity-20 text-center py-4 font-bold font-bold font-bold font-bold font-bold font-bold'>코멘트 없음</p>";
            
            toggleModal('detail-modal', true);
        };

        // 기초 엔진 로직 (v6.0.19 유지)
        window.login = async () => {
            const p = document.getElementById('pin').value.trim(); const w = document.getElementById('pw').value.trim();
            const snap = await getDoc(doc(db, "users", String(p)));
            if (snap.exists() && String(snap.data().password) === String(w)) {
                currentUser = { pin: String(p), ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin: String(p), pw: String(w) }));
                updateUI(); showPage('page-home');
            } else alert("로그인 실패");
        };
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", String(d.pin)));
                if (snap.exists()) { currentUser = { pin: String(d.pin), ...snap.data() }; updateUI(); showPage('page-home', false); return; }
            }
            document.getElementById('page-login').classList.add('active');
        });
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => { const el = document.getElementById(id); if(el) el.classList.toggle('active', s); };
        window.handleBack = () => { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); showPage('page-home'); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.openSchedules = async (id, name) => { activeGameId = id; activeGameName = name; document.getElementById('schedule-game-title').innerText = name; const listDiv = document.getElementById('schedule-list'); listDiv.innerHTML = `<p class="opacity-30 text-center py-10 font-bold font-bold">로딩 중...</p>`; toggleModal('schedule-modal', true); try { const snap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id))); listDiv.innerHTML = snap.docs.map(d => `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold font-bold font-bold font-bold font-bold font-bold"><div class="text-sm text-green-300 font-bold font-bold font-bold font-bold font-bold">${d.data().name}</div><span class="text-blue-400 text-xs font-bold font-bold font-bold font-bold font-bold font-bold font-bold">▶</span></div>`).join('') || "기록 없음"; } catch(e) { listDiv.innerHTML = "조회 실패"; } };
        window.renderList = async () => { /* 리스트 렌더링 유지 */ };
        window.openAddSchedule = async () => { selectedMembers = []; const selector = document.getElementById('member-selector'); selector.innerHTML = `<p class="col-span-3 text-center py-4 font-bold font-bold font-bold font-bold">로딩 중...</p>`; toggleModal('add-schedule-modal', true); const uSnap = await getDocs(collection(db, "users")); selector.innerHTML = uSnap.docs.map(d => `<div onclick="this.classList.toggle('selected'); toggleMember('${d.id}')" class="member-chip font-bold font-bold font-bold font-bold">${d.data().name}</div>`).join(''); };
        window.toggleMember = (pin) => { const idx = selectedMembers.indexOf(pin); if(idx > -1) selectedMembers.splice(idx, 1); else selectedMembers.push(pin); };
        window.submitSchedule = async () => { const name = document.getElementById('new-schedule-name').value.trim(); if(!name || selectedMembers.length === 0) return alert("필수 정보를 선택하세요."); try { await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory, name: name, members: selectedMembers, date: new Date().toISOString().split('T')[0], createdAt: serverTimestamp(), ranks: [], feed: [] }); toggleModal('add-schedule-modal', false); openSchedules(activeGameId, activeGameName); } catch(e) { alert("저장 실패"); } };
    </script>
</body>
</html>
