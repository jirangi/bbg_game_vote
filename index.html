<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v3.3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        /* 좌측 상단 고정 뒤로가기 버튼 */
        .sticky-back { position: fixed; top: 20px; left: 20px; z-index: 1500; background: rgba(30, 41, 59, 0.9); padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-black">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic uppercase">Login</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10 shadow-lg">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 hover:text-white transition shadow-lg">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-12 font-bold"><div class="flex justify-between items-end mb-8 px-4 font-bold"><h2 id="rank-title" class="text-4xl font-black italic text-blue-400"></h2><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold">+ 새 게임</button></div><div class="glass rounded-[40px] overflow-x-auto mx-4 shadow-2xl border border-white/5 font-bold"><table class="w-full text-center min-w-[500px]"><thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 uppercase"><th class="p-5">순위</th><th class="p-5 text-left">게임 정보</th><th>평가</th><th>기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div></div>
    <div id="page-stats" class="page pt-12 font-bold text-center"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4 font-bold"><div class="space-y-4"><h3 class="text-blue-400 font-black italic">🗳️ Voting King</h3><div id="vote-king" class="space-y-3 font-bold"></div></div><div class="space-y-4"><h3 class="text-green-400 font-black italic">🆕 Creator King</h3><div id="game-add-king" class="space-y-3 font-bold"></div></div></div></div>

    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-3xl font-black text-center text-blue-400 mb-8 uppercase italic">My Profile</h3>
            <div class="flex flex-col items-center gap-6 mb-8 pb-8 border-b border-white/10">
                <div class="relative group cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover bg-slate-800">
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">📸</div>
                </div>
                <div class="w-full space-y-4">
                    <div>
                        <label class="text-[10px] text-gray-500 uppercase ml-1 font-bold">닉네임</label>
                        <input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none font-black text-center">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] text-gray-500 uppercase ml-1 font-bold">사진 변경 (파일 업로드 또는 이미지 붙여넣기)</label>
                        <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileUpload(this)">
                        <button onclick="document.getElementById('file-input').click()" class="bg-white/10 py-3 rounded-xl text-xs font-bold hover:bg-white/20 transition">파일 선택하기</button>
                        <p class="text-[9px] text-center text-gray-500 italic">복사한 이미지를 이 창에서 Ctrl+V 하셔도 됩니다.</p>
                    </div>
                </div>
                <button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl">정보 저장하기</button>
            </div>
            <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[200px] space-y-3 custom-scrollbar text-left font-bold"></div>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')"><div class="glass w-full max-w-lg p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 id="schedule-game-title" class="text-2xl font-black italic text-green-400 truncate pr-4"></h3><button onclick="closeAllModals()" class="text-gray-500 text-3xl">✕</button></div><div class="space-y-4 mb-8 bg-black/30 p-6 rounded-3xl border border-white/5 font-bold font-bold font-bold"><input type="text" id="new-schedule-name" placeholder="모임 제목" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold text-white"><div id="member-select-grid" class="grid grid-cols-3 gap-2 max-h-32 overflow-y-auto custom-scrollbar p-2 bg-black/20 rounded-xl font-bold font-bold font-bold"></div><button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-xl">생성</button></div><div id="schedule-list" class="space-y-3 overflow-y-auto custom-scrollbar flex-grow pr-1 font-bold font-bold font-bold"></div></div></div>
    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate pr-2 font-bold font-bold font-bold"></h3><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl">✕</button></div><div id="detail-podium" class="podium-box p-6 rounded-[32px] mb-8 hidden font-bold font-bold font-bold"><div class="text-yellow-400 text-xs mb-3 font-bold font-bold font-bold font-bold font-bold">🥇 Official Ranking</div><div id="detail-rank-result" class="text-sm space-y-1 font-bold font-bold font-bold font-bold font-bold"></div></div><div class="flex gap-2 mb-8 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 border border-blue-500/30 py-4 rounded-2xl text-xs text-blue-300 font-bold font-bold font-bold font-bold font-bold font-bold font-bold">🥇 순위 등록</button><button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 border border-green-500/30 py-4 rounded-2xl text-xs text-green-300 font-bold font-bold font-bold font-bold font-bold font-bold font-bold">💬 코멘트</button></div><div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let recordingRanks = []; let currentScheduleId = null; let tempMembers = []; let profileImageData = "";

        // [v3.3.0 사진 업로드 및 붙여넣기]
        window.handleFileUpload = (input) => {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { 
                    profileImageData = e.target.result;
                    document.getElementById('profile-preview').src = profileImageData;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.addEventListener('paste', (e) => {
            if(!document.getElementById('profile-modal').classList.contains('active')) return;
            const items = e.clipboardData.items;
            for(let i=0; i<items.length; i++) {
                if(items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        profileImageData = ev.target.result;
                        document.getElementById('profile-preview').src = profileImageData;
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        // [브라우저 뒤로가기/마우스 버튼 연동]
        window.handleBack = () => {
            if(document.querySelector('.modal.active')) { closeAllModals(); history.replaceState({page: 'page-home'}, '', ''); }
            else showPage('page-home');
        };

        window.onpopstate = (e) => {
            if(document.querySelector('.modal.active')) { closeAllModals(); return; }
            const pid = e.state?.page || 'page-home';
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pid).classList.add('active');
        };

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            history.pushState({ page: id }, '', '');
        };

        // [명예전당 & 히스토리 데이터 로직]
        window.navToStats = async () => {
            showPage('page-stats');
            const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
            const users = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            const vCount = rSnap.docs.map(d=>d.data()).reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {});
            document.getElementById('vote-king').innerHTML = Object.entries(vCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => {
                const u = users[v[0]] || { name: '?', iconUrl: DEFAULT_ICON };
                return `<div class='p-3 glass rounded-2xl flex justify-between items-center shadow-lg font-bold'><div class='flex items-center gap-3 font-bold'><img src='${u.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold'><span class='font-black text-xs font-bold'>${u.name}</span></div><b class='text-blue-400 text-xs font-bold'>${v[1]}회</b></div>`;
            }).join('');
        };

        window.updateProfile = async () => {
            const n = document.getElementById('edit-nickname').value.trim();
            if(!n) return alert("닉네임을 입력하세요.");
            try {
                const updateData = { name: n };
                if(profileImageData) updateData.iconUrl = profileImageData; // 리사이징된 base64 저장
                await updateDoc(doc(db, "users", currentUser.pin), updateData);
                alert("프로필 저장 완료!");
                location.reload();
            } catch(e) { alert("저장 실패"); }
        };

        // [인증 및 렌더링 유지]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const d = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", d.pin));
                if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home'); return; }
            }
            showPage('page-login');
        });

        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload();
            } else if(pw.length===4) alert("정보 오류");
        };

        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin==="100") document.getElementById('admin-user-manage-btn')?.classList.remove('hidden'); }
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 italic font-bold font-bold font-bold font-bold font-bold font-bold">Loading...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const ratings = rSnap.docs.map(d => d.data());
                let games = gSnap.docs.map(d => {
                    const r = ratings.filter(v => v.gameId === d.id);
                    const sc = r.map(v => v.score || 0).sort((a, b) => a - b);
                    let avg = sc.length >= 3 ? sc.slice(1, -1).reduce((a, c) => a + c, 0) / (sc.length - 2) : (r.length > 0 ? sc.reduce((a, c) => a + c, 0) / r.length : 0);
                    return { id: d.id, ...d.data(), avgScore: avg, voteCount: r.length };
                }).sort((a, b) => b.avgScore - a.avgScore);
                list.innerHTML = games.map((g, i) => `<tr class="hover:bg-white/5 border-b border-white/5 font-bold font-bold font-bold font-bold font-bold"><td class="p-5 text-blue-400 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td><td class="p-5 text-left font-black"><div class="text-sm">${g.name}</div><div class="text-[9px] opacity-40 uppercase">Votes: ${g.voteCount}</div></td><td class="p-5 font-bold text-yellow-400">${g.avgScore.toFixed(1)}</td><td class="p-5 font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-bold">기록</button></td></tr>`).join('');
            } catch (e) { list.innerHTML = "Error"; }
        };

        // 기타 모달 제어 및 필수 로직 유지...
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) toggleModal(id, false); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.openSchedules = async (id, n) => { activeGameId = id; activeGameName = n; document.getElementById('schedule-game-title').innerText = n; tempMembers = []; const uSnap = await getDocs(collection(db, "users")); document.getElementById('member-select-grid').innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[9px] border border-white/10 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        window.toggleSelectMember = (p) => { const i = tempMembers.indexOf(p); const b = document.getElementById(`sel-${p}`); if(i>-1){ tempMembers.splice(i,1); b.classList.remove('selected'); } else { tempMembers.push(p); b.classList.add('selected'); } };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("입력 확인"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; tempMembers = []; loadSchedules(); };
        async function loadSchedules() { const listDiv = document.getElementById('schedule-list'); const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); listDiv.innerHTML = sSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center shadow-lg font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="text-sm text-green-300 font-bold">${s.name}</div><div class="text-[9px] text-gray-500 uppercase">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs">▶</span></div>`).join(''); }
        window.openScheduleDetail = async (id) => { currentScheduleId = id; const s = (await getDoc(doc(db, "schedules", id))).data(); const uSnap = await getDocs(collection(db, "users")); const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); document.getElementById('detail-title').innerText = s.name; const p = document.getElementById('detail-podium'); if(s.ranks?.length > 0) { p.classList.remove('hidden'); document.getElementById('detail-rank-result').innerHTML = s.ranks.map((p, i) => `<div class='text-xs'>${i+1}위 <b>${uMap[p]?.name}</b></div>`).join(''); } else p.classList.add('hidden'); document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map(l => `<div class="bg-white/5 p-4 rounded-2xl flex gap-3 font-bold"><img src="${uMap[l.userPin]?.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8"><div class="text-left flex-grow font-bold font-bold font-bold font-bold font-bold font-bold"><span>${uMap[l.userPin]?.name}</span>${l.userPin === currentUser.pin ? `<button onclick='deleteComment(${JSON.stringify(l)})' class='text-red-500 ml-2'>🗑️</button>`:''}</div></div>`).join(''); toggleModal('detail-modal', true); };
        async function loadMyHistory() { const listDiv = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sSnap = await getDocs(q); listDiv.innerHTML = sSnap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => { const r = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1; return `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-1 border border-white/5 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div><div class="flex items-center gap-2 mb-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span class="category-tag font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.gameCategory||'기타'}</span><span class="text-[9px] text-blue-500 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.gameName||'Unknown'}</span></div><div class="text-sm font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.name}</div></div><div class="text-xs font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${r>-1 ? (r+1)+'위' : '기록전'}</div></div>`; }).join(''); }
    </script>
</body>
