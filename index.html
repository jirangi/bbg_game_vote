<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.9.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="window.history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase tracking-widest italic font-bold">Login</h2>
            <div class="space-y-4 text-left font-bold">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 transition-all">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs font-bold border border-white/10 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Game Archive</h1>
        
        <div class="flex flex-wrap justify-center gap-2 mb-10 px-4 font-bold">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-blue-500 hover:text-white transition shadow-lg">📢 단톡방 정보</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-red-500 transition shadow-lg" onclick="toggleModal('admin-user-modal', true)">⚙️ 명단 관리</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-chat-info" class="page pt-10 font-bold">
        <div class="flex justify-between items-center mb-10 px-4">
            <h2 class="text-3xl font-black text-blue-400 italic uppercase">Group Info 📢</h2>
            <button id="admin-info-add-btn" class="hidden bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold" onclick="toggleModal('info-add-modal', true)">+ 정보 등록</button>
        </div>
        <div id="chat-info-list" class="space-y-4 px-4 font-bold">
            </div>
    </div>

    <div id="info-add-modal" class="modal" onclick="closeOnBackdrop(event, 'info-add-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] font-bold" onclick="event.stopPropagation()">
            <h3 class="text-xl text-blue-400 mb-6 font-black italic">단톡방 정보 등록</h3>
            <div class="space-y-4 font-bold text-left">
                <div>
                    <label class="text-[10px] text-gray-500 ml-1 mb-1 block uppercase">제목</label>
                    <input type="text" id="info-title" placeholder="ex) 오픈채팅 주소 / 회칙" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 ml-1 mb-1 block uppercase">내용</label>
                    <textarea id="info-content" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl h-40 outline-none resize-none text-sm font-bold text-white"></textarea>
                </div>
                <button onclick="saveChatInfo()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-lg">저장하기</button>
            </div>
        </div>
    </div>

    <div id="page-stats" class="page pt-10 font-bold text-center"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase tracking-widest font-bold">Hall of Fame 🏆</h2><div class="grid grid-cols-1 lg:grid-cols-3 gap-6 px-4 font-bold font-bold"><div class="flex flex-col gap-4 font-bold"><h3 class="text-lg font-bold mb-2 text-yellow-500 font-bold italic font-bold">🍕 Best Reviewer</h3><div id="best-comment-king" class="space-y-4 font-bold font-bold font-bold font-bold"></div></div><div class="flex flex-col gap-4 font-bold font-bold font-bold font-bold"><h3 class="text-lg font-bold mb-2 text-blue-400 font-bold italic font-bold">🗳️ Voting King</h3><div id="vote-king" class="space-y-4 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div><div class="flex flex-col gap-4 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><h3 class="text-lg font-bold mb-2 text-green-400 font-bold italic font-bold">🆕 Creator King</h3><div id="game-add-king" class="space-y-4 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let currentSort = "score_desc"; let allRatingsData = [];

        // [기본 UI/인증 제어]
        window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('active', show);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) closeAllModals(); };
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });
        
        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const target = document.getElementById(id);
            if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 50); if(id === 'page-chat-info') loadChatInfo(); }
            if (history.state?.page !== id) history.pushState({ page: id }, '', '');
        };
        window.onpopstate = (e) => { const pid = e.state?.page || 'page-home'; document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; }); const t = document.getElementById(pid); if(t) { t.style.display = 'block'; t.classList.add('active'); } };

        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const data = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", data.pin));
                if (snap.exists() && snap.data().password === data.pw) {
                    currentUser = { pin: data.pin, ...snap.data() };
                    updateHeaderUI();
                    if(currentUser.pin === "100") {
                        document.getElementById('admin-user-manage-btn').classList.remove('hidden');
                        document.getElementById('admin-info-add-btn').classList.remove('hidden');
                    }
                    showPage('page-home'); return;
                }
            }
            showPage('page-login');
        });

        // [v2.9.0 단톡방 정보 로직]
        async function loadChatInfo() {
            const listDiv = document.getElementById('chat-info-list');
            listDiv.innerHTML = `<p class="opacity-30 text-center py-10 font-bold italic">Fetching Information...</p>`;
            try {
                const snap = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc")));
                listDiv.innerHTML = snap.docs.map(d => {
                    const info = d.data();
                    const isAdmin = currentUser.pin === "100";
                    return `
                    <div class="glass p-6 rounded-3xl border border-white/10 text-left relative shadow-xl font-bold">
                        <h4 class="text-blue-300 text-lg font-black mb-2">${info.title}</h4>
                        <p class="text-sm leading-relaxed text-white/80 whitespace-pre-wrap">${info.content}</p>
                        ${isAdmin ? `<button onclick="deleteChatInfo('${d.id}')" class="absolute top-6 right-6 text-red-500 opacity-50 hover:opacity-100 transition-all font-bold">🗑️</button>` : ''}
                    </div>`;
                }).join('') || `<p class="opacity-20 text-center py-10 text-xs italic font-bold">등록된 단톡방 정보가 없습니다.</p>`;
            } catch(e) { listDiv.innerHTML = `<p class="text-red-400 text-center py-10">정보 로드 실패</p>`; }
        }

        window.saveChatInfo = async () => {
            const title = document.getElementById('info-title').value.trim();
            const content = document.getElementById('info-content').value.trim();
            if(!title || !content) return alert("제목과 내용을 모두 입력하세요.");
            try {
                await addDoc(collection(db, "chatInfo"), { title, content, createdAt: serverTimestamp() });
                document.getElementById('info-title').value = "";
                document.getElementById('info-content').value = "";
                toggleModal('info-add-modal', false);
                loadChatInfo();
            } catch(e) { alert("저장 실패: " + e.message); }
        };

        window.deleteChatInfo = async (id) => {
            if(!confirm("이 정보를 삭제하시겠습니까?")) return;
            await deleteDoc(doc(db, "chatInfo", id));
            loadChatInfo();
        };

        // [기본 시스템 함수 복구 - v2.8.6 동일 로직]
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } else alert("오류"); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-30 font-bold italic font-bold">Loading List...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                allRatingsData = rSnap.docs.map(d => d.data());
                let games = gSnap.docs.map(d => {
                    const r = allRatingsData.filter(v => v.gameId === d.id);
                    if (r.length === 0) return null;
                    const sc = r.map(v => v.score || 0).sort((a, b) => a - b);
                    let avg = sc.length >= 3 ? sc.slice(1, -1).reduce((a, c) => a + c, 0) / (sc.length - 2) : sc.reduce((a, c) => a + c, 0) / sc.length;
                    return { id: d.id, ...d.data(), avgScore: avg, voteCount: r.length };
                }).filter(g => g !== null);
                games.sort((a, b) => b.avgScore - a.avgScore);
                list.innerHTML = games.map((g, i) => { const rI = i < 3 && g.voteCount >= 3 ? ['🥇', '🥈', '🥉'][i] : `#${i + 1}`; return `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold font-bold"><td class="p-5 text-blue-400 text-lg font-bold">${rI}</td><td class="p-5 text-left font-bold"><div class="text-base font-black">${g.name}</div><div class="text-[9px] opacity-40 uppercase">Votes: ${g.voteCount}</div></td><td class="p-5 font-bold"><div class="text-yellow-400 font-black text-sm mb-1">${g.avgScore.toFixed(1)}점</div></td><td class="p-5 font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600 transition">기록</button></td></tr>`; }).join('');
            } catch (e) { list.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-400 font-bold">Error</td></tr>`; }
        };
        // 명예전당 로직 v2.8.6과 동일하게 유지...
        window.navToStats = async () => {
            showPage('page-stats');
            const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
            const ratings = rSnap.docs.map(d => d.data());
            const users = uSnap.docs.reduce((acc, d) => ({ ...acc, [d.id]: d.data() }), {});
            const vCount = ratings.reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin] || 0) + 1; return acc; }, {});
            let topV = Object.entries(vCount).sort((a,b) => b[1]-a[1]).slice(0,5);
            document.getElementById('vote-king').innerHTML = topV.map((v, i) => {
                const u = users[v[0]] || { name: '?', iconUrl: DEFAULT_ICON };
                return `<div class="p-4 glass rounded-2xl flex items-center justify-between font-bold"><div class="flex items-center gap-3"><img src="${u.iconUrl || DEFAULT_ICON}" class="user-icon w-10 h-10 border border-white/10 font-bold"><div class="text-left leading-tight font-bold"><span class="text-xs font-black">${u.name}</span></div></div><span class="text-xs text-blue-400 font-black">${v[1]}회</span></div>`;
            }).join('');
        };
        // 일정 관련 openSchedules 등은 이전 v2.8.5 로직 그대로 통합...
        window.openSchedules = async (id, n) => { activeGameId = id; document.getElementById('schedule-game-title').innerText = n; const grid = document.getElementById('member-select-grid'); const uSnap = await getDocs(collection(db, "users")); grid.innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[10px] font-bold border border-white/10 font-bold font-bold font-bold font-bold font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("제목/인원 확인"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameId, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; tempMembers = []; loadSchedules(); };
        async function loadSchedules() { const listDiv = document.getElementById('schedule-list'); const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); let logs = sSnap.docs.map(d => ({ id: d.id, ...d.data() })); logs.sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); listDiv.innerHTML = logs.map(s => { const canDelete = s.members?.includes(currentUser.pin); return `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center hover:bg-white/10 transition-all mb-2 shadow-lg font-bold"><div onclick="openScheduleDetail('${s.id}')" class="flex-grow cursor-pointer pr-4 font-bold font-bold"><div class="text-sm text-green-300 mb-1 font-bold font-bold">${s.name}</div><div class="text-[9px] font-bold ${s.ranks?.length > 0 ? 'text-blue-400' : 'text-gray-500'} font-bold font-bold">${s.ranks?.length > 0 ? 'RECORDED ✅' : 'WAITING ⏳'}</div></div>${canDelete ? `<button onclick="deleteSchedule('${s.id}')" class="p-2 text-gray-500 hover:text-red-500 text-xs font-bold font-bold font-bold font-bold font-bold font-bold font-bold">🗑️</button>` : ''}</div>`; }).join('') || `<p class="opacity-20 text-center py-4 text-xs italic font-bold font-bold font-bold">No Records</p>`; }
    </script>
</body>
</html>
