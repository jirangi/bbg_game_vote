<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v4.1.0 - Step 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 8000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic">LOGIN</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold mt-4">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer p-1" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-10 h-10 rounded-full border-2 border-blue-500/50 object-cover">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-black transition">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-stats" class="page pt-24 font-bold text-center">
        <h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4">
            <div class="space-y-4">
                <h3 class="text-blue-400 font-black italic">🗳️ Voting King (투표왕)</h3>
                <div id="vote-king" class="space-y-3">
                    <div class="p-10 opacity-30 italic">Loading Ranking...</div>
                </div>
            </div>
            <div class="space-y-4">
                <h3 class="text-green-400 font-black italic">🆕 Creator King (제작왕)</h3>
                <div id="game-add-king" class="space-y-3">
                    <div class="p-10 opacity-30 italic">Loading Ranking...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold"><h2 id="rank-title" class="text-4xl font-black italic text-blue-400 ml-4 mb-8"></h2><div class="glass mx-4 rounded-3xl overflow-hidden"><table class="w-full text-center"><tbody id="rank-list"></tbody></table></div></div>
    <div id="page-chat-info" class="page pt-24 font-bold px-4"></div>
    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] text-center" onclick="event.stopPropagation()"><h3 class="text-2xl font-black text-blue-400 mb-6 uppercase">My Profile</h3><div id="my-history-list" class="space-y-2 max-h-60 overflow-y-auto"></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null;

        // [v4.1.0 네비게이션]
        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block';
        };

        window.handleBack = () => showPage('page-home');

        // [1번 수정 기능: 명예전당 데이터 로드 로직 복구]
        window.navToStats = async () => {
            showPage('page-stats');
            const vList = document.getElementById('vote-king');
            const gList = document.getElementById('game-add-king');

            try {
                // 데이터 병렬 로드
                const [rSnap, gSnap, uSnap] = await Promise.all([
                    getDocs(collection(db, "ratings")),
                    getDocs(collection(db, "games")),
                    getDocs(collection(db, "users"))
                ]);

                const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data().name}), {});

                // 1. 투표왕 집계 (ratings)
                const voteCounts = {};
                rSnap.docs.forEach(d => {
                    const pin = d.data().userPin;
                    if(pin) voteCounts[pin] = (voteCounts[pin] || 0) + 1;
                });
                
                vList.innerHTML = Object.entries(voteCounts)
                    .sort((a,b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([pin, count], i) => `
                        <div class="glass p-4 rounded-2xl flex justify-between items-center border border-white/5">
                            <span class="text-blue-300 font-bold">${i+1}위 ${uMap[pin] || '알수없음'}</span>
                            <span class="text-white/50 text-xs">${count}회 참여</span>
                        </div>
                    `).join('') || "<div class='opacity-20'>데이터 없음</div>";

                // 2. 제작왕 집계 (games)
                const createCounts = {};
                gSnap.docs.forEach(d => {
                    const pin = d.data().creatorPin;
                    if(pin) createCounts[pin] = (createCounts[pin] || 0) + 1;
                });

                gList.innerHTML = Object.entries(createCounts)
                    .sort((a,b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([pin, count], i) => `
                        <div class="glass p-4 rounded-2xl flex justify-between items-center border border-white/5">
                            <span class="text-green-300 font-bold">${i+1}위 ${uMap[pin] || '알수없음'}</span>
                            <span class="text-white/50 text-xs">${count}개 등록</span>
                        </div>
                    `).join('') || "<div class='opacity-20'>데이터 없음</div>";

            } catch (e) {
                console.error(e);
                vList.innerHTML = gList.innerHTML = "<div class='text-red-400'>데이터를 불러오지 못했습니다.</div>";
            }
        };

        // 기본 로그인/UI 로직 (유지)
        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, ...snap.data() };
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw }));
                location.reload();
            } else { alert("인증 실패"); }
        };

        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };

        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const d = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", d.pin));
                if (snap.exists() && snap.data().password === d.pw) {
                    currentUser = { pin: d.pin, ...snap.data() };
                    document.getElementById('user-welcome').innerText = `${currentUser.name}님`;
                    document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON;
                    showPage('page-home');
                }
            }
        });
        
        window.toggleProfileModal = (s) => document.getElementById('profile-modal').classList.toggle('active', s);
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) document.getElementById(id).classList.remove('active'); };
        window.navTo = (cat) => { /* 4번 수정 시 카테고리 로직 추가 예정 */ showPage('page-rank'); document.getElementById('rank-title').innerText = cat; };
    </script>
</body>
</html>
