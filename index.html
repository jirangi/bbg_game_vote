<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active#page-rank ~ .sticky-back, .page.active#page-stats ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .stat-user-icon { width: 40px; height: 40px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); }
        .rank-gold { border: 2px solid #fbbf24 !important; background: rgba(251, 191, 36, 0.08) !important; transform: scale(1.02); }
        .rank-silver { border: 2px solid #94a3b8 !important; background: rgba(148, 163, 184, 0.08) !important; }
        .rank-bronze { border: 2px solid #b45309 !important; background: rgba(180, 83, 9, 0.08) !important; }
        .star-container { display: inline-flex; gap: 1px; color: #a855f7; font-size: 1.25rem; }
        .star-half::before { content: '★'; position: absolute; left: 0; width: 50%; overflow: hidden; color: #a855f7; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-sm text-center">

    <div class="fixed top-0 left-0 w-full bg-blue-600/20 backdrop-blur-md border-b border-white/10 p-2 text-center text-[10px] font-semibold text-blue-300 z-50">
        💡 모든 사용자의 기본 비밀번호는 <span class="text-white underline">1234</span>입니다.
    </div>

    <button onclick="history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-home" class="page active w-full max-w-4xl text-center pt-10">
        <div class="flex justify-between items-center mb-6 max-w-md mx-auto px-4">
            <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50">
                <span id="user-welcome" class="text-blue-400 text-xs font-bold underline underline-offset-4"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs underline font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-10 tracking-tight uppercase">Game Archive</h1>
        
        <div class="flex flex-wrap justify-center gap-3 mb-8 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-3 rounded-2xl font-bold hover:bg-yellow-500 hover:text-white transition w-full max-w-[120px]">🏆 명예전당</button>
            <button onclick="toggleProfileModal(true)" class="bg-blue-600/10 border border-blue-500/30 text-blue-400 px-6 py-3 rounded-2xl font-bold hover:bg-blue-600 hover:text-white transition w-full max-w-[120px]">👤 프로필</button>
            <button id="admin-user-manage-btn" onclick="toggleAdminUserModal(true)" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-6 py-3 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition w-full max-w-[120px]">⚙️ 유저관리</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-8 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-lg transition hover:scale-105">🕵️ 머더 미스테리</button>
        </div>
        <div class="mt-10 flex flex-col items-center gap-2">
            <button onclick="togglePinModal(true)" class="text-gray-400 hover:text-white text-xs underline font-bold">전체 PIN 번호 확인</button>
            <div class="text-[10px] text-gray-600 opacity-50 font-bold">App Version v2.4.0</div>
        </div>
    </div>

    <div id="admin-user-modal" class="modal">
        <div class="glass w-full max-w-md p-6 rounded-3xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 text-left">
                <h3 class="text-xl font-bold text-red-400">⚙️ 유저 명단 관리</h3>
                <button onclick="toggleAdminUserModal(false)" class="text-gray-400 hover:text-white text-2xl font-bold">✕</button>
            </div>
            <div class="flex gap-2 mb-6 font-bold">
                <input type="text" id="new-user-name" placeholder="추가할 이름" class="flex-grow bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold">
                <button onclick="adminAddUser()" class="bg-blue-600 px-6 rounded-xl font-bold">추가</button>
            </div>
            <div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 text-left font-bold"></div>
        </div>
    </div>

    <div id="profile-modal" class="modal"><div class="glass w-full max-w-xs p-8 rounded-3xl text-center shadow-2xl font-bold"><h3 class="text-xl font-bold mb-6 text-blue-400">마이 프로필 수정</h3><div class="space-y-5 text-left"><div class="flex justify-center mb-2"><img id="profile-preview" src="" class="w-20 h-20 rounded-full border-4 border-blue-500/30 object-cover"></div><div><label class="text-[10px] text-gray-400 block mb-1">닉네임</label><input type="text" id="edit-nickname" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none"></div><div><label class="text-[10px] text-gray-400 block mb-1">이미지 URL</label><input type="text" id="edit-icon-url" oninput="document.getElementById('profile-preview').src=this.value" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none"></div><div class="flex gap-2 pt-2"><button onclick="toggleProfileModal(false)" class="flex-1 bg-white/10 py-3 rounded-xl font-bold">취소</button><button onclick="updateProfile()" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold">저장</button></div></div></div></div>
    <div id="page-rank" class="page w-full max-w-4xl pt-10 text-center"><div class="flex justify-between items-end mb-8 text-left px-2 font-bold"><h2 id="rank-title" class="text-3xl font-bold ml-2"></h2><button onclick="addGame()" class="bg-white/10 px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/20 transition">+ 새 게임 추가</button></div><div class="glass rounded-3xl overflow-hidden overflow-x-auto custom-scrollbar font-bold"><table class="w-full text-left border-collapse min-w-[500px] font-bold"><thead class="bg-white/5 text-gray-400 text-[10px] uppercase tracking-wider text-center font-bold"><tr><th class="p-4 text-left font-bold">순위</th><th class="p-4 text-left font-bold">게임 정보</th><th class="p-4 font-bold">재미 평점</th><th class="p-4 font-bold">전체 난이도</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody></table></div></div>
    <div id="comment-modal" class="modal"><div class="glass w-full max-w-md p-6 rounded-3xl max-h-[85vh] flex flex-col font-bold"><div class="flex justify-between items-center mb-4 font-bold"><h3 id="comment-game-title" class="text-xl font-extrabold text-blue-400 text-left font-bold">댓글</h3><button onclick="toggleCommentModal(false)" class="text-gray-400 hover:text-white text-2xl font-bold font-bold font-bold">✕</button></div><div id="comment-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-4 text-left font-bold"></div><div class="space-y-3 text-left font-bold font-bold"><div class="flex items-center gap-2 font-bold"><input type="checkbox" id="anon-check" class="w-4 h-4 rounded bg-white/5 font-bold font-bold"><label for="anon-check" class="text-xs text-gray-400 font-bold font-bold">익명 작성</label></div><div class="flex gap-2 font-bold font-bold"><input type="text" id="comment-input" placeholder="댓글..." class="flex-grow bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold font-bold"><button onclick="addComment()" class="bg-blue-600 px-4 rounded-xl font-bold font-bold">등록</button></div></div></div></div>
    <div id="page-stats" class="page w-full max-w-6xl text-left"><h2 class="text-3xl font-bold text-yellow-400 mb-8 pt-10 font-bold">명예의 전당 🏆</h2><div class="grid grid-cols-1 lg:grid-cols-3 gap-8 font-bold font-bold"><div class="flex flex-col gap-4 font-bold font-bold"><h3 class="text-lg font-bold mb-2 text-center text-yellow-500 font-bold">🍕 베스트 댓글 왕</h3><div id="best-comment-king" class="space-y-4 font-bold font-bold"></div></div><div class="flex flex-col gap-4 font-bold font-bold font-bold"><h3 class="text-lg font-bold mb-2 text-center text-blue-400 font-bold font-bold">🗳️ 최다 투표 왕</h3><div id="vote-king" class="space-y-4 font-bold font-bold font-bold"></div></div><div class="flex flex-col gap-4 font-bold font-bold font-bold font-bold"><h3 class="text-lg font-bold mb-2 text-center text-green-400 font-bold font-bold font-bold font-bold">🆕 최다 게임 등록 왕</h3><div id="game-add-king" class="space-y-4 font-bold font-bold font-bold font-bold font-bold"></div></div></div></div>
    <div id="page-login" class="page w-full max-w-sm text-center font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="glass p-8 rounded-3xl shadow-2xl font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><h2 class="text-2xl font-bold mb-6 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">인증</h2><div class="space-y-4 text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><input type="password" id="pw" placeholder="PW" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="login()" class="w-full bg-blue-600 py-3 rounded-xl font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">로그인</button></div></div></div>
    <div id="pin-modal" class="modal"><div class="glass w-full max-w-md p-6 rounded-3xl max-h-[80vh] flex flex-col text-center font-bold"><div class="flex justify-between items-center mb-4 text-left font-bold"><h3 class="text-xl font-bold ml-2 font-bold">PIN 찾기</h3><button onclick="togglePinModal(false)" class="text-gray-400 hover:text-white text-2xl font-bold font-bold font-bold">✕</button></div><div id="pin-list-content" class="overflow-y-auto pr-2 custom-scrollbar text-left font-bold font-bold"></div><button onclick="togglePinModal(false)" class="mt-6 w-full bg-white/10 py-3 rounded-xl font-bold font-bold">닫기</button></div></div>
    <div id="eval-modal" class="modal"><div class="glass w-full max-w-xs p-6 rounded-3xl text-center shadow-xl font-bold font-bold"><h3 id="eval-modal-title" class="text-xl font-bold mb-4 text-blue-400 font-bold font-bold">평가 수정</h3><div class="space-y-4 text-left font-bold font-bold font-bold"><div id="score-input-box font-bold font-bold font-bold font-bold"><label class="text-xs text-gray-400 block mb-2 ml-1 font-bold">재미 점수 (0~100)</label><input type="number" id="single-score" step="0.1" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none font-bold"></div><div id="diff-input-box font-bold font-bold"><label class="text-xs text-gray-400 block mb-2 ml-1 font-bold">난이도 별점 (0~5.0)</label><input type="number" id="single-diff" step="0.1" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none font-bold"></div><div class="flex gap-2 pt-2 font-bold font-bold"><button onclick="toggleEvalModal(false)" class="flex-1 bg-white/10 py-3 rounded-xl font-bold font-bold">취소</button><button onclick="submitSingleEval()" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold font-bold">저장</button></div></div></div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, increment, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);

    const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';
    let currentUser = null; let selectedCategory = ""; let activeGameId = null; let evalType = ""; 
    let allRatingsData = [];

    // [페이지 이동 및 초기화]
    window.addEventListener('DOMContentLoaded', async () => {
        const saved = localStorage.getItem('game_archive_auth');
        if (saved) {
            const data = JSON.parse(saved);
            const snap = await getDoc(doc(db, "users", data.pin));
            if (snap.exists() && snap.data().password === data.pw) {
                currentUser = { pin: data.pin, ...snap.data() };
                updateHeaderUI();
                // 관리자 계정(100)이면 관리 버튼 노출
                if(currentUser.pin === "100") document.getElementById('admin-user-manage-btn').classList.remove('hidden');
                showPage('page-home'); return;
            }
        }
        showPage('page-login');
    });

    // [관리자 전용 함수]
    window.toggleAdminUserModal = async (show) => {
        if(show) {
            await refreshAdminUserList();
            document.getElementById('admin-user-modal').classList.add('active');
        } else document.getElementById('admin-user-modal').classList.remove('active');
    };

    async function refreshAdminUserList() {
        const listDiv = document.getElementById('admin-user-list');
        listDiv.innerHTML = `<p class="text-center opacity-30 py-4">불러오는 중...</p>`;
        const snap = await getDocs(collection(db, "users"));
        let users = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => parseInt(a.id) - parseInt(b.id));
        listDiv.innerHTML = users.map(u => `
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-2xl border border-white/10">
                <div class="flex items-center gap-3"><span class="text-blue-400 font-mono text-xs w-8">${u.id}</span><span class="font-bold">${u.name}</span></div>
                ${u.id === '100' ? '<span class="text-[10px] text-gray-500 font-bold">관리자</span>' : `<button onclick="adminDeleteUser('${u.id}', '${u.name}')" class="text-red-500 hover:bg-red-500/10 px-3 py-1 rounded-lg text-xs font-bold transition font-bold font-bold font-bold">삭제</button>`}
            </div>`).join('');
    }

    window.adminAddUser = async () => {
        const name = document.getElementById('new-user-name').value.trim();
        if(!name) return alert("이름!");
        const snap = await getDocs(collection(db, "users"));
        const existingPins = snap.docs.map(d => parseInt(d.id));
        let newPin = Math.max(...existingPins) + 1;
        if (newPin < 101) newPin = 101;
        await setDoc(doc(db, "users", String(newPin)), { name: name, password: "1234", iconUrl: "", createdAt: serverTimestamp() });
        document.getElementById('new-user-name').value = "";
        alert(`[${name}] 유저 생성 (PIN: ${newPin})`);
        refreshAdminUserList();
    };

    window.adminDeleteUser = async (pin, name) => {
        if(!confirm(`[${name}] 유저를 삭제합니까?`)) return;
        await deleteDoc(doc(db, "users", pin));
        refreshAdminUserList();
    };

    // [기존 UI 및 렌더링 로직 (v2.3.6 기반 유지)]
    function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님 (수정)`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
    window.showPage = (id) => { document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; }); const target = document.getElementById(id); if (target) { target.style.display = 'block'; setTimeout(() => { target.classList.add('active'); updateBackBtnVisibility(); }, 50); if (history.state?.page !== id) history.pushState({ page: id }, '', ''); } };
    window.onpopstate = (e) => showPage(e.state?.page || 'page-home');
    function updateBackBtnVisibility() { const btn = document.getElementById('global-back-btn'); const active = document.querySelector('.page.active')?.id; btn.style.display = (active === 'page-rank' || active === 'page-stats') ? 'block' : 'none'; }
    window.login = async () => { const pin = document.getElementById('pin').value; const pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } else alert("실패"); };
    window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
    window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
    window.renderList = async () => { const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-50 italic font-bold">로딩 중...</td></tr>`; const [gSnap, rSnap, cSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings")), getDocs(collection(db, "comments"))]); allRatingsData = rSnap.docs.map(d => d.data()); const comments = cSnap.docs.map(d => d.data()); let games = []; gSnap.forEach(d => { const gameId = d.id; const gData = d.data(); const gRatings = allRatingsData.filter(r => r.gameId === gameId); const scores = gRatings.map(r => r.score || 0).sort((a,b) => a-b); let finalAvg = 0; if (scores.length >= 3) { let trim = (scores.length >= 5) ? 1 : 0; const trimmed = scores.slice(trim, scores.length - trim); finalAvg = trimmed.reduce((a,c) => a+c, 0) / trimmed.length; } else { finalAvg = scores.length ? scores.reduce((a,c) => a+c, 0) / scores.length : 0; } const validDiffs = gRatings.map(r => r.difficulty || 0).filter(v => v > 0); const avgDiff = validDiffs.length > 0 ? validDiffs.reduce((acc, v) => acc + v, 0) / validDiffs.length : 0; games.push({ id: gameId, ...gData, avgScore: finalAvg, avgDiff, voteCount: gRatings.length, commentCount: comments.filter(c => c.gameId === gameId).length, my: gRatings.find(r => r.userPin === currentUser.pin) }); }); games.sort((a,b) => b.avgScore - a.avgScore); list.innerHTML = games.map((g, i) => { let rankDisp = i < 3 ? ['🥇','🥈','🥉'][i] : `#${i+1}`; return `<tr class="hover:bg-white/5 border-b border-white/5 transition text-center font-bold"><td class="p-4 font-mono text-blue-400 text-left text-lg">${rankDisp}</td><td class="p-4 text-left"><div class="flex items-center gap-2 font-bold"><span onclick="openComments('${g.id}', '${g.name}')" class="font-bold text-base cursor-pointer hover:underline font-bold">${g.name}</span><button onclick="editGameName('${g.id}', '${g.name}', '${g.creatorPin}')" class="text-gray-500 hover:text-white text-[10px] font-bold">✏️</button></div><div class="flex gap-2 mt-1 opacity-50 text-[9px] font-bold font-bold font-bold font-bold"><span>🗳️ ${g.voteCount}</span><span class="text-blue-300 font-bold font-bold font-bold">💬 ${g.commentCount}</span></div></td><td class="p-4 cursor-pointer hover:bg-white/10 rounded-xl font-bold font-bold" onclick="openEvalModal('${g.id}', '${g.name}', 'score')"><div class="text-yellow-400 font-bold text-base font-bold font-bold">${g.avgScore.toFixed(1)}점</div>${g.my ? `<div class="text-[9px] text-blue-300 opacity-60 font-bold font-bold font-bold font-bold font-bold">(내 점수: ${g.my.score})</div>` : ''}</td><td class="p-4 cursor-pointer hover:bg-white/10 rounded-xl font-bold font-bold" onclick="openEvalModal('${g.id}', '${g.name}', 'diff')"><div class="text-purple-400 font-bold font-bold font-bold"><div class="flex justify-center">${renderStars(g.avgDiff)}</div><div class="text-[10px] opacity-60 font-bold mt-1 font-bold font-bold font-bold">${g.avgDiff.toFixed(1)}</div></div>${g.my ? `<div class="text-[9px] text-blue-300 opacity-60 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">(내 난이도: ${g.my.difficulty})</div>` : ''}</td></tr>`}).join(''); };
    function renderStars(rating) { let starsHtml = '<div class="star-container">'; for (let i = 1; i <= 5; i++) { if (rating >= i) starsHtml += '<span class="star font-bold">★</span>'; else if (rating >= i - 0.5) starsHtml += '<span class="star star-half font-bold">★</span>'; else starsHtml += '<span class="star opacity-10 font-bold font-bold">★</span>'; } starsHtml += '</div>'; return starsHtml; }
    window.openEvalModal = (id, name, type) => { activeGameId = id; evalType = type; document.getElementById('eval-modal-title').innerText = `${name} - ${type === 'score' ? '재미 평가' : '난이도 평가'}`; const myRating = allRatingsData.find(r => r.gameId === id && r.userPin === currentUser.pin); document.getElementById('score-input-box').style.display = type === 'score' ? 'block' : 'none'; document.getElementById('diff-input-box').style.display = type === 'diff' ? 'block' : 'none'; document.getElementById('single-score').value = myRating?.score || ''; document.getElementById('single-diff').value = myRating?.difficulty || ''; document.getElementById('eval-modal').classList.add('active'); };
    window.toggleEvalModal = (s) => document.getElementById('eval-modal').classList.toggle('active', s);
    window.submitSingleEval = async () => { const myRating = allRatingsData.find(r => r.gameId === activeGameId && r.userPin === currentUser.pin); let s = parseFloat(document.getElementById('single-score').value); let d = parseFloat(document.getElementById('single-diff').value); let finalS = evalType === 'score' ? s : (myRating?.score || 0); let finalD = evalType === 'diff' ? d : (myRating?.difficulty || 0); await setDoc(doc(db, "ratings", `${currentUser.pin}_${activeGameId}`), { gameId: activeGameId, userPin: currentUser.pin, score: finalS, difficulty: finalD, updatedAt: serverTimestamp() }); toggleEvalModal(false); renderList(); };
    window.navToStats = async () => { showPage('page-stats'); const [cSnap, rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "comments")), getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]); const comments = cSnap.docs.map(d => ({id: d.id, ...d.data()})); const ratings = rSnap.docs.map(d => d.data()); const games = gSnap.docs.map(d => ({id: d.id, ...d.data()})); const users = uSnap.docs.reduce((acc, d) => ({ ...acc, [d.id]: d.data() }), {}); const getMedal = (i) => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`; const getRankClass = (i) => i === 0 ? 'rank-gold' : i === 1 ? 'rank-silver' : i === 2 ? 'rank-bronze' : ''; let topC = [...comments].sort((a,b) => (b.likes||0)-(a.likes||0)).slice(0,5); document.getElementById('best-comment-king').innerHTML = topC.map((c, i) => { const game = games.find(g => g.id === c.gameId) || {name: "알수없음"}; const user = users[c.userPin] || {name: "익명", iconUrl: ""}; return `<div onclick="goToGameComment('${c.gameId}', '${game.name}', '${game.category}')" class="p-4 glass rounded-3xl ${getRankClass(i)} cursor-pointer hover:brightness-125 transition font-bold"><div class="flex items-center gap-3 mb-2 font-bold"><img src="${user.iconUrl || DEFAULT_ICON}" class="stat-user-icon"><div class="text-left font-bold font-bold"><span class="text-[10px] block opacity-50 font-bold">${getMedal(i)}</span><span class="font-bold text-xs">${user.name}</span></div></div><p class="text-[9px] text-blue-400 font-bold mb-1 font-bold font-bold">@ ${game.name}</p><p class="text-xs truncate font-bold text-gray-200 font-bold">${c.text}</p><div class="text-right text-[10px] text-yellow-500 font-bold mt-1 font-bold">🍕 ${c.likes||0}</div></div>`; }).join(''); const vCount = ratings.reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin] || 0) + 1; return acc; }, {}); let topV = Object.entries(vCount).sort((a,b) => b[1]-a[1]).slice(0,5); document.getElementById('vote-king').innerHTML = topV.map((v, i) => { const user = users[v[0]] || {name: "익명", iconUrl: ""}; return `<div class="p-4 glass rounded-2xl ${getRankClass(i)} flex items-center justify-between font-bold"><div class="flex items-center gap-3 font-bold font-bold"><img src="${user.iconUrl || DEFAULT_ICON}" class="stat-user-icon"><div class="text-left font-bold"><span class="text-[10px] block opacity-50 font-bold font-bold font-bold">${getMedal(i)}</span><span class="font-bold text-xs">${user.name}</span></div></div><span class="text-xs text-blue-400 font-bold font-bold font-bold">${v[1]}회</span></div>`; }).join(''); const gCount = games.reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {}); let topG = Object.entries(gCount).sort((a,b) => b[1]-a[1]).slice(0,5); document.getElementById('game-add-king').innerHTML = topG.map((a, i) => { const user = users[a[0]] || {name: "익명", iconUrl: ""}; return `<div class="p-4 glass rounded-2xl ${getRankClass(i)} flex items-center justify-between font-bold"><div class="flex items-center gap-3 font-bold font-bold font-bold font-bold"><img src="${user.iconUrl || DEFAULT_ICON}" class="stat-user-icon font-bold font-bold"><div class="text-left font-bold font-bold"><span class="text-[10px] block opacity-50 font-bold font-bold font-bold font-bold">${getMedal(i)}</span><span class="font-bold text-xs">${user.name}</span></div></div><span class="text-xs text-green-400 font-bold font-bold font-bold font-bold">${a[1]}개</span></div>`; }).join(''); };
    window.goToGameComment = (id, name, cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList().then(() => { showPage('page-rank'); setTimeout(() => openComments(id, name), 300); }); };
    window.toggleProfileModal = (s) => { if(s) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('edit-icon-url').value = currentUser.iconUrl || ''; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; } document.getElementById('profile-modal').classList.toggle('active', s); };
    window.updateProfile = async () => { const newName = document.getElementById('edit-nickname').value.trim(); const newIcon = document.getElementById('edit-icon-url').value.trim(); if(!newName) return alert("닉네임!"); await updateDoc(doc(db, "users", currentUser.pin), { name: newName, iconUrl: newIcon }); currentUser.name = newName; currentUser.iconUrl = newIcon; updateHeaderUI(); toggleProfileModal(false); alert("변경 완료"); };
    window.openComments = (id, name) => { activeGameId = id; document.getElementById('comment-game-title').innerText = name; toggleCommentModal(true); loadComments(); };
    window.toggleCommentModal = (s) => document.getElementById('comment-modal').classList.toggle('active', s);
    async function loadComments() { const list = document.getElementById('comment-list'); list.innerHTML = `<p class="p-5 italic font-bold opacity-50 font-bold font-bold font-bold font-bold font-bold">로딩 중...</p>`; const [cSnap, uSnap] = await Promise.all([getDocs(query(collection(db, "comments"), where("gameId", "==", activeGameId))), getDocs(collection(db, "users"))]); const users = uSnap.docs.reduce((acc, d) => ({ ...acc, [d.id]: d.data() }), {}); let ds = cSnap.docs.map(d => ({id: d.id, ...d.data()})); ds.sort((a,b) => (b.likes||0)-(a.likes||0) || (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); list.innerHTML = ds.map(data => { const isMe = data.userPin === currentUser.pin; const writer = users[data.userPin] || { name: "알 수 없음", iconUrl: "" }; const dName = data.isAnonymous ? (isMe ? "익명(나)" : "익명") : writer.name; const dIcon = data.isAnonymous ? DEFAULT_ICON : (writer.iconUrl || DEFAULT_ICON); return `<div class="p-3 rounded-2xl ${isMe ? 'bg-blue-600/20 ml-8 border-blue-500/20' : 'bg-white/5 mr-8 border-white/5'} mb-3 border shadow-lg font-bold font-bold font-bold"><div class="flex justify-between items-center mb-2 font-bold font-bold font-bold"><div class="flex items-center gap-2 font-bold font-bold font-bold font-bold font-bold font-bold"><img src="${dIcon}" class="user-icon font-bold font-bold font-bold"><span class="text-[10px] font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold ${isMe?'text-blue-300':'text-gray-400'}">${dName}</span></div><div class="flex items-center gap-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="likeComment('${data.id}')" class="text-[10px] font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">🍕 ${data.likes||0}</button>${isMe?`<button onclick="delComment('${data.id}')" class="text-[9px] text-red-500 opacity-50 font-bold font-bold font-bold font-bold font-bold font-bold">삭제</button>`:''}</div></div><p class="text-sm leading-relaxed font-bold pl-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${data.text}</p></div>`; }).join(''); }
    window.addComment = async () => { const i = document.getElementById('comment-input'); if(!i.value.trim()) return; await addDoc(collection(db, "comments"), { gameId: activeGameId, userPin: currentUser.pin, isAnonymous: document.getElementById('anon-check').checked, text: i.value.trim(), likes: 0, likedUsers: [], createdAt: serverTimestamp() }); i.value = ""; document.getElementById('anon-check').checked = false; loadComments(); };
    window.likeComment = async (id) => { const ref = doc(db, "comments", id); const snap = await getDoc(ref); const liked = snap.data().likedUsers?.includes(currentUser.pin); await updateDoc(ref, { likes: increment(liked?-1:1), likedUsers: liked?arrayRemove(currentUser.pin):arrayUnion(currentUser.pin) }); loadComments(); };
    window.delComment = async (id) => { if(confirm("삭제?")) { await deleteDoc(doc(db, "comments", id)); loadComments(); } };
    window.addGame = async () => { const n = prompt("이름:"); if(!n) return; const norm = n.replace(/\s+/g, '').toLowerCase(); const gS = await getDocs(collection(db, "games")); let dup = false; gS.forEach(d => { if(d.data().name.replace(/\s+/g, '').toLowerCase() === norm) dup = true; }); if(dup) return alert("중복"); await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
    window.editGameName = async (id, old, cr) => { if (currentUser.pin !== cr && currentUser.pin !== "100") return alert("권한없음"); const n = prompt("수정:", old); if (n && n !== old) { await updateDoc(doc(db, "games", id), { name: n }); renderList(); } };
    window.togglePinModal = async (s) => { const m = document.getElementById('pin-modal'); if(!s) return m.classList.remove('active'); m.classList.add('active'); const snap = await getDocs(collection(db, "users")); let us = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => parseInt(a.id)-parseInt(b.id)); document.getElementById('pin-list-content').innerHTML = us.map(u => `<div class="flex justify-between p-3 border-b border-white/5"><span>${u.id}</span><b>${u.name}</b></div>`).join(''); };
</script>
