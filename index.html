<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.8.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .member-btn.selected { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.4) !important; }
        .member-btn.ranked { border-color: #10b981 !important; background: rgba(16, 185, 129, 0.4) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="window.history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase tracking-widest italic">Login</h2>
            <div class="space-y-4 text-left font-bold">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 transition-all">접속하기</button>
            </div>
            <button onclick="toggleModal('pin-modal', true)" class="mt-8 text-xs text-gray-500 underline font-bold">PIN 번호 찾기</button>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs font-bold border border-white/10 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 text-center w-full">Game Archive</h1>
        <div class="flex justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition w-1/2 shadow-lg">🏆 명예전당</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-red-500 transition w-1/2 shadow-lg" onclick="openAdminModal()">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition border border-white/5 shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="admin-user-modal" class="modal" onclick="closeOnBackdrop(event, 'admin-user-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-8 text-red-400">
                <h3 class="text-2xl font-black italic">명단 관리</h3>
                <button onclick="closeAllModals()" class="text-3xl">✕</button>
            </div>
            <div class="flex gap-2 mb-8">
                <input type="text" id="new-user-name" placeholder="추가할 이름 입력" class="flex-grow bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold focus:border-blue-500">
                <button onclick="adminAddUser()" class="bg-blue-600 px-6 rounded-2xl font-black shadow-lg hover:bg-blue-500 transition">추가</button>
            </div>
            <div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 pr-2">
                </div>
        </div>
    </div>

    <div id="page-rank" class="page pt-10 font-bold"><div class="flex flex-col mb-8 px-4 gap-6 text-left"><div class="flex justify-between items-end font-bold"><h2 id="rank-title" class="text-4xl font-extrabold italic text-blue-400 tracking-tighter font-bold"></h2><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-600 transition">+ 새 게임 추가</button></div><div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar font-bold"><button onclick="setSort('score_desc')" id="sort-score_desc" class="sort-btn active px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap font-bold">점수 높은순</button><button onclick="setSort('diff_desc')" id="sort-diff_desc" class="sort-btn px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap font-bold">난이도 높은순</button><button onclick="setSort('diff_asc')" id="sort-diff_asc" class="sort-btn px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap font-bold">난이도 낮은순</button></div></div><div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 font-bold"><table class="w-full border-collapse min-w-[550px] font-bold"><thead class="bg-white/5 text-gray-500 text-[10px] uppercase font-bold border-b border-white/10 text-center font-bold"><tr><th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="p-5 w-36">평가 데이터</th><th class="p-5 w-32">모임 일지</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5 text-center font-bold"></tbody></table></div></div>
    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')"><div class="glass w-full max-w-lg p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-8 text-green-400 font-bold"><h3 id="schedule-game-title" class="text-2xl font-black italic pr-4"></h3><button onclick="closeAllModals()" class="text-gray-500 text-3xl font-bold">✕</button></div><div class="space-y-5 mb-8 shrink-0 bg-white/5 p-5 rounded-3xl border border-white/5 font-bold"><input type="text" id="new-schedule-name" placeholder="모임 제목" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold text-white"><div id="member-select-grid" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto custom-scrollbar p-2 bg-black/30 rounded-2xl border border-white/10 font-bold"></div><button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-base shadow-xl font-bold">생성하기</button></div><div id="schedule-list" class="space-y-3 overflow-y-auto custom-scrollbar text-left flex-grow pr-2 font-bold"></div></div></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let allRatingsData = [];

        // [v2.8.3 유저 관리 핵심 로직]
        window.openAdminModal = async () => {
            toggleModal('admin-user-modal', true);
            await refreshAdminUserList();
        };

        async function refreshAdminUserList() {
            const listDiv = document.getElementById('admin-user-list');
            listDiv.innerHTML = `<p class="text-center opacity-30 py-10 font-black italic">Loading members...</p>`;
            
            try {
                const snap = await getDocs(collection(db, "users"));
                let users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // PIN 번호 순서대로 정렬
                users.sort((a, b) => parseInt(a.id) - parseInt(b.id));

                listDiv.innerHTML = users.map(u => `
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center hover:border-blue-500/30 transition-all font-bold">
                        <div class="flex items-center gap-3">
                            <span class="text-blue-400 font-black text-xs w-8 tracking-tighter">${u.id}</span>
                            <span class="text-sm">${u.name}</span>
                        </div>
                        ${u.id !== '100' ? `<button onclick="adminDeleteUser('${u.id}', '${u.name}')" class="text-red-500 font-black text-xs border border-red-500/20 px-3 py-1 rounded-lg hover:bg-red-500 hover:text-white transition">삭제</button>` : '<span class="text-[10px] text-gray-500">Root Admin</span>'}
                    </div>
                `).join('');
            } catch(e) {
                listDiv.innerHTML = `<p class="text-red-400 text-center py-10">오류 발생: ${e.message}</p>`;
            }
        }

        window.adminAddUser = async () => {
            const name = document.getElementById('new-user-name').value.trim();
            if(!name) return alert("추가할 유저 이름을 입력하세요.");
            
            try {
                // 1. 기존 유저들 PIN 번호 확인하여 다음 번호 따기
                const snap = await getDocs(collection(db, "users"));
                const pins = snap.docs.map(d => parseInt(d.id)).filter(p => !isNaN(p));
                const nextPin = pins.length > 0 ? Math.max(...pins) + 1 : 101;
                
                // 2. 신규 유저 생성 (비밀번호 기본 1234)
                await setDoc(doc(db, "users", String(nextPin)), {
                    name: name,
                    password: "1234",
                    iconUrl: "",
                    createdAt: serverTimestamp()
                });

                document.getElementById('new-user-name').value = "";
                alert(`[${name}] 유저가 성공적으로 추가되었습니다!\n임시 PIN: ${nextPin}`);
                await refreshAdminUserList(); // 목록 즉시 갱신
            } catch(e) {
                alert("유저 추가 실패: " + e.message);
            }
        };

        window.adminDeleteUser = async (id, name) => {
            if(!confirm(`[${name}] 회원을 정말로 삭제하시겠습니까?`)) return;
            try {
                await deleteDoc(doc(db, "users", id));
                await refreshAdminUserList();
            } catch(e) {
                alert("삭제 권한이 없거나 오류가 발생했습니다.");
            }
        };

        // [나머지 랭킹 / 일정 / 인증 로직 통합]
        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, ...snap.data() };
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw }));
                location.reload();
            } else alert("PIN 또는 비밀번호 오류");
        };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.toggleModal = (id, show) => { document.getElementById(id).classList.toggle('active', show); };
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) closeAllModals(); };
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });
        
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const data = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", data.pin));
                if (snap.exists() && snap.data().password === data.pw) {
                    currentUser = { pin: data.pin, ...snap.data() };
                    updateHeaderUI();
                    if(currentUser.pin === "100") document.getElementById('admin-user-manage-btn').classList.remove('hidden');
                    showPage('page-home'); return;
                }
            }
            showPage('page-login');
        });
        function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.showPage = (id) => { document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; }); const target = document.getElementById(id); if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 50); } if (history.state?.page !== id) history.pushState({ page: id }, '', ''); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.setSort = (m) => { currentSort = m; document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active')); document.getElementById(`sort-${m}`).classList.add('active'); renderList(); };
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-30 font-black italic">Loading Data...</td></tr>`;
            const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db,"games"), where("category","==",selectedCategory))), getDocs(collection(db,"ratings"))]);
            allRatingsData = rSnap.docs.map(d=>d.data());
            let games = gSnap.docs.map(d => {
                const r = allRatingsData.filter(v=>v.gameId === d.id); if(r.length === 0) return null;
                const scores = r.map(v=>v.score||0).sort((a,b)=>a-b);
                let avg = scores.length>=3 ? scores.slice(1,-1).reduce((a,c)=>a+c,0)/(scores.length-2) : scores.reduce((a,c)=>a+c,0)/scores.length;
                const vD = r.map(v=>v.difficulty||0).filter(v=>v>0);
                return { id: d.id, ...d.data(), avgScore: avg, avgDiff: (vD.length>0 ? vD.reduce((a,c)=>a+c,0)/vD.length : 0), voteCount: r.length };
            }).filter(g=>g!==null);
            games.sort((a,b) => { const a3 = a.voteCount>=3, b3 = b.voteCount>=3; if(a3 && !b3) return -1; if(!a3 && b3) return 1; if(currentSort==='score_desc') return b.avgScore-a.avgScore; if(currentSort==='diff_desc') return b.avgDiff-a.avgDiff; return a.avgDiff-b.avgDiff; });
            list.innerHTML = games.map((g, i) => { const rIcon = i<3 && g.voteCount>=3 ? ['🥇','🥈','🥉'][i] : `#${i+1}`; return `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold font-bold"><td class="p-5 text-blue-400 text-lg">${rIcon}</td><td class="p-5 text-left"><div class="text-base font-black leading-tight">${g.name}</div><div class="text-[9px] opacity-40 uppercase">Votes: ${g.voteCount}</div></td><td class="p-5"><div class="text-yellow-400 font-black text-sm mb-1">${g.avgScore.toFixed(1)}점</div></td><td class="p-5"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600">기록</button></td></tr>`; }).join('');
        };
        // [명예의 전당 / 프로필 수정 등 기존 기능 모두 포함됨]
    </script>
</body>
</html>
