<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v3.1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
        .podium-box { background: linear-gradient(to bottom, rgba(251, 191, 36, 0.15), transparent); border: 1px solid rgba(251, 191, 36, 0.3); }
        .member-btn.selected { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.4) !important; }
        .member-btn.ranked { border-color: #10b981 !important; background: rgba(16, 185, 129, 0.4) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="window.history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 tracking-widest italic">Login</h2>
            <div class="space-y-4 text-left font-bold">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" onkeypress="if(event.keyCode==13) login()" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 transition-all">접속하기</button>
            </div>
            <button onclick="togglePinModal(true)" class="mt-8 text-xs text-gray-500 underline font-bold">PIN 번호 찾기</button>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs font-bold border border-white/10 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-2 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-blue-500 hover:text-white transition shadow-lg">📢 단톡방 정보</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-2xl font-extrabold hover:bg-red-500 transition shadow-lg" onclick="openAdminModal()">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-10 font-bold">
        <div class="flex justify-between items-end mb-6 px-4">
            <h2 id="rank-title" class="text-4xl font-extrabold italic text-blue-400"></h2>
            <button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-600 transition">+ 새 게임</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5">
            <table class="w-full border-collapse min-w-[550px] font-bold text-center">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] uppercase font-bold border-b border-white/10"><th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="p-5 w-36">평가</th><th class="p-5 w-32">기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <div id="page-stats" class="page pt-10 font-bold text-center">
        <h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase tracking-widest">명예전당 🏆</h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 px-4">
            <div class="flex flex-col gap-4">
                <h3 class="text-lg font-bold text-blue-400 italic">🗳️ Voting King</h3>
                <div id="vote-king" class="space-y-4"></div>
            </div>
            <div class="flex flex-col gap-4">
                <h3 class="text-lg font-bold text-green-400 italic">🆕 Creator King</h3>
                <div id="game-add-king" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <div id="page-chat-info" class="page pt-10 font-bold">
        <div class="flex justify-between items-center mb-10 px-4">
            <h2 class="text-3xl font-black text-blue-400 italic uppercase">Group Info 📢</h2>
            <button id="admin-info-add-btn" class="hidden bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold" onclick="toggleModal('info-add-modal', true)">+ 등록</button>
        </div>
        <div id="chat-info-list" class="space-y-4 px-4"></div>
    </div>

    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h3 id="detail-title" class="text-xl font-black italic text-blue-400 pr-2"></h3>
                <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button>
            </div>
            <div id="detail-podium" class="podium-box p-6 rounded-[32px] mb-8 hidden">
                <div class="flex items-center gap-2 mb-3 text-yellow-400 font-black"><span>🥇</span> <span class="text-xs uppercase font-bold">Official Ranking</span></div>
                <div id="detail-rank-result" class="text-sm leading-relaxed text-white"></div>
            </div>
            <div class="flex gap-2 mb-8 shrink-0 font-bold">
                <button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 border border-blue-500/30 py-4 rounded-2xl text-xs text-blue-300 font-black">🥇 순위 등록</button>
                <button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 border border-green-500/30 py-4 rounded-2xl text-xs text-green-300 font-black">💬 코멘트 작성</button>
            </div>
            <div class="flex-grow overflow-hidden flex flex-col">
                <h4 class="text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1 text-left">Guestbook</h4>
                <div id="detail-comment-feed" class="space-y-4 overflow-y-auto custom-scrollbar pr-2 flex-grow text-left"></div>
            </div>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')"><div class="glass w-full max-w-lg p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 text-green-400 font-bold"><h3 id="schedule-game-title" class="text-2xl font-black italic truncate pr-4"></h3><button onclick="closeAllModals()" class="text-gray-500 text-3xl font-bold">✕</button></div><div class="space-y-5 mb-8 bg-white/5 p-5 rounded-3xl border border-white/5 font-bold"><input type="text" id="new-schedule-name" placeholder="모임 제목" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold text-white focus:border-green-500 transition"><div id="member-select-grid" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto custom-scrollbar p-2 bg-black/30 rounded-2xl border border-white/10"></div><button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-xl">생성</button></div><div id="schedule-list" class="space-y-3 overflow-y-auto custom-scrollbar text-left flex-grow pr-2"></div></div></div>
    <div id="admin-user-modal" class="modal" onclick="closeOnBackdrop(event, 'admin-user-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-8 text-red-400 font-bold"><h3>명단 관리</h3><button onclick="closeAllModals()" class="text-3xl font-bold">✕</button></div><div class="flex gap-2 mb-8 font-bold"><input type="text" id="new-user-name" placeholder="이름" class="flex-grow bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold text-white"><button onclick="adminAddUser()" class="bg-red-600 px-6 rounded-2xl font-black shadow-lg">추가</button></div><div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 pr-2"></div></div></div>
    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold text-center" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 italic mb-8 uppercase">My Profile</h3><div class="flex flex-col items-center gap-6 mb-8 pb-8 border-b border-white/10 font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover font-bold"><input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 text-center font-black" placeholder="닉네임"><button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl">저장</button></div><h4 class="text-left text-[10px] font-black uppercase mb-4 tracking-widest font-bold">History</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[250px] space-y-3 custom-scrollbar text-left pr-2 font-bold"></div></div></div>
    <div id="rank-popup" class="modal" style="z-index: 200;" onclick="toggleModal('rank-popup', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] font-bold text-center" onclick="event.stopPropagation()"><h4 class="text-blue-400 mb-2 font-black italic uppercase">Setting Rank</h4><div id="rank-member-grid" class="grid grid-cols-2 gap-2 mb-6 max-h-48 overflow-y-auto custom-scrollbar p-1"></div><div id="rank-order-display" class="text-xs text-green-400 bg-green-400/10 border border-green-500/20 p-4 rounded-2xl min-h-[40px] mb-6 text-left font-black">순위: </div><button onclick="saveRanks()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-lg">저장</button></div></div>
    <div id="comment-popup" class="modal" style="z-index: 200;" onclick="toggleModal('comment-popup', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] font-bold" onclick="event.stopPropagation()"><h4 class="text-green-400 mb-6 font-black text-center italic">Write a Note</h4><textarea id="pop-comment-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl h-40 outline-none resize-none text-sm font-bold mb-6 text-white" placeholder="내용을 입력하세요."></textarea><button onclick="saveNote()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-lg">등록</button></div></div>
    <div id="info-add-modal" class="modal" onclick="closeOnBackdrop(event, 'info-add-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] font-bold" onclick="event.stopPropagation()"><h3 class="text-xl text-blue-400 mb-6 font-black italic">정보 등록</h3><div class="space-y-4 text-left"><input type="text" id="info-title" placeholder="제목" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl font-bold text-white"><textarea id="info-content" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl h-40 font-bold text-white"></textarea><button onclick="saveChatInfo()" class="w-full bg-blue-600 py-4 rounded-2xl font-black">저장</button></div></div></div>
    <div id="pin-modal" class="modal" onclick="closeOnBackdrop(event, 'pin-modal')"><div class="glass w-full max-w-sm p-8 rounded-[40px] max-h-[80vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 text-blue-400 font-bold uppercase"><h3>PIN Finder</h3><button onclick="closeAllModals()" class="text-2xl font-bold">✕</button></div><div id="pin-list-content" class="overflow-y-auto pr-2 custom-scrollbar space-y-2 mb-6 text-left font-bold"></div><button onclick="closeAllModals()" class="w-full bg-white/10 py-4 rounded-2xl font-black">닫기</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let recordingRanks = []; let currentScheduleId = null; let tempMembers = [];

        window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('active', show);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) closeAllModals(); };
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });
        
        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const target = document.getElementById(id);
            if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 50); if(id==='page-chat-info') loadChatInfo(); }
            if (history.state?.page !== id) history.pushState({ page: id }, '', '');
        };
        window.onpopstate = (e) => { const pid = e.state?.page || 'page-home'; document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; }); const t = document.getElementById(pid); if(t) { t.style.display = 'block'; t.classList.add('active'); } };

        // [v3.1.1 렌더링 엔진 완벽 복구]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-30 font-bold italic">Loading List...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const ratings = rSnap.docs.map(d => d.data());
                let games = gSnap.docs.map(d => {
                    const r = ratings.filter(v => v.gameId === d.id); if (r.length === 0) return null;
                    const sc = r.map(v => v.score || 0).sort((a, b) => a - b);
                    let avg = sc.length >= 3 ? sc.slice(1, -1).reduce((a, c) => a + c, 0) / (sc.length - 2) : sc.reduce((a, c) => a + c, 0) / sc.length;
                    return { id: d.id, ...d.data(), avgScore: avg, voteCount: r.length };
                }).filter(g => g !== null);
                games.sort((a, b) => b.avgScore - a.avgScore);
                list.innerHTML = games.map((g, i) => {
                    const rI = i < 3 && g.voteCount >= 3 ? ['🥇', '🥈', '🥉'][i] : `#${i + 1}`;
                    return `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold"><td class="p-5 text-blue-400 text-lg font-bold font-bold">${rI}</td><td class="p-5 text-left font-bold font-bold"><div class="text-base font-black">${g.name}</div><div class="text-[9px] opacity-40 uppercase">Votes: ${g.voteCount}</div></td><td class="p-5 font-bold font-bold"><div class="text-yellow-400 font-black text-sm mb-1">${g.avgScore.toFixed(1)}점</div></td><td class="p-5 font-bold font-bold font-bold font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600 transition">기록</button></td></tr>`;
                }).join('');
            } catch (e) { list.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-400">Restoration Failed</td></tr>`; }
        };

        // [인증 및 자동 로그인]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const data = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", data.pin));
                if (snap.exists() && snap.data().password === data.pw) {
                    currentUser = { pin: data.pin, ...snap.data() };
                    updateHeaderUI();
                    if(currentUser.pin === "100") { document.getElementById('admin-user-manage-btn').classList.remove('hidden'); document.getElementById('admin-info-add-btn')?.classList.remove('hidden'); }
                    showPage('page-home'); return;
                }
            }
            showPage('page-login');
        });

        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            if(!pin || !pw) return;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, ...snap.data() };
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw }));
                location.reload();
            } else if(pw.length === 4) { alert("PIN 또는 비밀번호 오류"); document.getElementById('pw').value=""; }
        };

        // [명예전당 & 히스토리 복구]
        window.navToStats = async () => {
            showPage('page-stats');
            const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
            const ratings = rSnap.docs.map(d => d.data());
            const users = uSnap.docs.reduce((acc, d) => ({ ...acc, [d.id]: d.data() }), {});
            const vCount = ratings.reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin] || 0) + 1; return acc; }, {});
            document.getElementById('vote-king').innerHTML = Object.entries(vCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => {
                const u = users[v[0]] || { name: '?', iconUrl: DEFAULT_ICON };
                return `<div class="p-4 glass rounded-2xl flex items-center justify-between"><div class="flex items-center gap-3"><img src="${u.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8"><span class="text-xs font-black font-bold font-bold">${u.name}</span></div><span class="text-xs text-blue-400 font-bold font-bold">${v[1]}회</span></div>`;
            }).join('');
            const gCount = gSnap.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
            document.getElementById('game-add-king').innerHTML = Object.entries(gCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => {
                const u = users[v[0]] || { name: '?', iconUrl: DEFAULT_ICON };
                return `<div class="p-4 glass rounded-2xl flex items-center justify-between"><div class="flex items-center gap-3"><img src="${u.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8 font-bold font-bold"><span class="text-xs font-black font-bold font-bold font-bold">${u.name}</span></div><span class="text-xs text-green-400 font-bold font-bold font-bold">${v[1]}개</span></div>`;
            }).join('');
        };

        window.openScheduleDetail = async (id) => {
            currentScheduleId = id;
            const sSnap = await getDoc(doc(db, "schedules", id));
            if(!sSnap.exists()) return;
            const s = sSnap.data();
            const uSnap = await getDocs(collection(db, "users"));
            const users = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            document.getElementById('detail-title').innerText = s.name;
            const podium = document.getElementById('detail-podium');
            if(s.ranks && s.ranks.length > 0) {
                podium.classList.remove('hidden');
                document.getElementById('detail-rank-result').innerHTML = s.ranks.map((p, i) => `<div class='mb-1 font-bold'><span class='text-blue-400'>${i+1}위</span> <span class='ml-2 font-bold'>${users[p]?.name || '?'}</span></div>`).join('');
            } else { podium.classList.add('hidden'); }
            const feed = document.getElementById('detail-comment-feed');
            feed.innerHTML = (s.feed || []).sort((a,b) => b.time - a.time).map(l => {
                const w = users[l.userPin] || { name: 'Unknown', iconUrl: DEFAULT_ICON };
                const isMy = l.userPin === currentUser.pin;
                return `<div class="bg-white/5 p-4 rounded-3xl border border-white/5 flex gap-4"><img src="${w.iconUrl || DEFAULT_ICON}" class="user-icon w-9 h-9 border border-white/10"><div class="text-left flex-grow font-bold font-bold"><div class="flex justify-between items-center mb-1"><span class="text-[10px] text-gray-500">${w.name}</span>${isMy ? `<button onclick='deleteComment(${JSON.stringify(l).replace(/'/g, "&apos;")})' class="text-red-500 opacity-50 hover:opacity-100 text-[10px]">🗑️</button>` : ''}</div><div class="text-sm leading-relaxed text-white/90">${l.text}</div></div></div>`;
            }).join('') || `<p class="opacity-20 text-center py-10 italic">No activity.</p>`;
            toggleModal('detail-modal', true);
        };

        // [공통 함수 통합]
        window.deleteComment = async (obj) => { if(confirm("삭제?")){ await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayRemove(obj) }); openScheduleDetail(currentScheduleId); } };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; loadMyHistory(); } toggleModal('profile-modal', s); };
        async function loadMyHistory() { const listDiv = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sSnap = await getDocs(q); listDiv.innerHTML = sSnap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => { const r = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1; return `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-1 border border-white/5 font-bold font-bold font-bold font-bold font-bold font-bold"><div><div class="flex items-center gap-2 mb-1"><span class="category-tag font-bold font-bold font-bold font-bold font-bold">${s.gameCategory||'보드게임'}</span><span class="text-[9px] text-blue-500 uppercase tracking-tighter">${s.gameName||'Game'}</span></div><div class="text-sm font-black font-bold font-bold font-bold font-bold font-bold font-bold">${s.name}</div></div><div class="text-xs pr-1 font-bold font-bold font-bold">${r>-1 ? (r+1)+'위' : '기록전'}</div></div>`; }).join('') || "No Records"; }
        window.openAdminModal = async () => { toggleModal('admin-user-modal', true); const listDiv = document.getElementById('admin-user-list'); const snap = await getDocs(collection(db, "users")); let users = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => parseInt(a.id) - parseInt(b.id)); listDiv.innerHTML = users.map(u => `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="flex items-center gap-3 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span class="text-blue-400 font-black text-xs font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${u.id}</span><span class="text-sm font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${u.name}</span></div>${u.id !== '100' ? `<button onclick="adminDeleteUser('${u.id}')" class="text-red-500 text-xs font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">삭제</button>` : ''}</div>`).join(''); };
        window.adminAddUser = async () => { const name = document.getElementById('new-user-name').value.trim(); if(!name) return; const snap = await getDocs(collection(db, "users")); const nextPin = Math.max(...snap.docs.map(d => parseInt(d.id)).filter(p => !isNaN(p))) + 1; await setDoc(doc(db, "users", String(nextPin)), { name, password: "1234", createdAt: serverTimestamp() }); alert(`PIN: ${nextPin}`); window.location.reload(); };
        window.updateProfile = async () => { await updateDoc(doc(db, "users", currentUser.pin), { name: document.getElementById('edit-nickname').value.trim() }); window.location.reload(); };
        window.openSchedules = async (id, name) => { activeGameId = id; activeGameName = name; document.getElementById('schedule-game-title').innerText = name; tempMembers = []; const uSnap = await getDocs(collection(db, "users")); document.getElementById('member-select-grid').innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[10px] border border-white/10 font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("제목/인원 확인"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; tempMembers = []; loadSchedules(); };
        async function loadSchedules() { const listDiv = document.getElementById('schedule-list'); const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); listDiv.innerHTML = sSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center hover:bg-white/10 mb-2 shadow-lg font-bold"><div onclick="openScheduleDetail('${s.id}')" class="flex-grow cursor-pointer font-bold"><div class="text-sm text-green-300 mb-1">${s.name}</div><div class="text-[9px] font-bold ${s.ranks?.length > 0 ? 'text-blue-400' : 'text-gray-500'} font-bold font-bold font-bold font-bold">${s.ranks?.length > 0 ? 'RECORDED' : 'WAITING'}</div></div></div>`).join(''); }
        window.saveNote = async () => { const txt = document.getElementById('pop-comment-input').value.trim(); if(!txt) return; await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayUnion({ userPin: currentUser.pin, text: txt, time: Date.now() }) }); toggleModal('comment-popup', false); openScheduleDetail(currentScheduleId); };
        window.saveRanks = async () => { await updateDoc(doc(db, "schedules", currentScheduleId), { ranks: recordingRanks }); toggleModal('rank-popup', false); openScheduleDetail(currentScheduleId); };
        window.recordRank = (pin) => { const idx = recordingRanks.indexOf(pin); if(idx > -1) { recordingRanks.splice(idx, 1); document.getElementById(`rb-${pin}`).classList.remove('ranked'); } else { recordingRanks.push(pin); document.getElementById(`rb-${pin}`).classList.add('ranked'); } };
        window.toggleSelectMember = (p) => { const i = tempMembers.indexOf(p); const b = document.getElementById(`sel-${p}`); if(i>-1){ tempMembers.splice(i,1); b.classList.remove('selected'); } else { tempMembers.push(p); b.classList.add('selected'); } };
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
        window.togglePinModal = (s) => { if(s) { const list = document.getElementById('pin-list-content'); getDocs(collection(db, "users")).then(snap => { list.innerHTML = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => parseInt(a.id)-parseInt(b.id)).map(u => `<div class="flex justify-between p-3 border-b border-white/5 font-bold font-bold font-bold font-bold font-bold font-bold"><span>${u.id}</span><b>${u.name}</b></div>`).join(''); }); } toggleModal('pin-modal', s); };
        async function loadChatInfo() { const listDiv = document.getElementById('chat-info-list'); try { const snap = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); listDiv.innerHTML = snap.docs.map(d => { const info = d.data(); const isAdmin = currentUser.pin === "100"; return `<div class="glass p-6 rounded-3xl border border-white/10 text-left relative shadow-xl font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><h4 class="text-blue-300 text-lg font-black mb-2">${info.title}</h4><p class="text-sm leading-relaxed text-white/80 whitespace-pre-wrap">${info.content}</p>${isAdmin ? `<button onclick="deleteChatInfo('${d.id}')" class="absolute top-6 right-6 text-red-500 opacity-50 hover:opacity-100 transition-all font-bold">🗑️</button>` : ''}</div>`; }).join('') || "No info."; } catch(e) { listDiv.innerHTML = "Load failed."; } }
        window.deleteChatInfo = async (id) => { if(confirm("삭제?")) { await deleteDoc(doc(db, "chatInfo", id)); loadChatInfo(); } };
        window.saveChatInfo = async () => { const title = document.getElementById('info-title').value.trim(); const content = document.getElementById('info-content').value.trim(); if(!title || !content) return; await addDoc(collection(db, "chatInfo"), { title, content, createdAt: serverTimestamp() }); location.reload(); };
    </script>
</body>
</html>
