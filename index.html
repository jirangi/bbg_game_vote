<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v4.0.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 8000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; cursor: pointer; }
        .page.active:not(#page-home):not(#page-login) ~ #global-back-btn { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic">LOGIN</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold mt-4 shadow-lg active:scale-95 transition">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer p-1 hover:bg-white/5 rounded-xl transition" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg transition hover:text-red-400">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="flex justify-between items-end mb-8 px-4 font-bold">
            <h2 id="rank-title" class="text-4xl font-black italic text-blue-400"></h2>
            <button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold">+ 새 게임</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5">
            <table class="w-full text-center min-w-[600px] font-bold">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 uppercase font-black">
                    <th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="w-32">평가</th><th>기록</th>
                </tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="closeOnBackdrop(event, 'schedule-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3>
                <button onclick="closeAllModals()" class="text-gray-500 text-3xl font-bold">✕</button>
            </div>
            <div class="mb-6 space-y-3">
                <input type="text" id="new-schedule-name" placeholder="모임/일지 제목" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-bold">
                <div id="member-select-grid" class="grid grid-cols-3 gap-2 max-h-[120px] overflow-y-auto custom-scrollbar p-1"></div>
                <button onclick="createSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-xl">모임 일지 생성</button>
            </div>
            <div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 pr-1"></div>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate pr-2 font-bold"></h3><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div>
            <div id="detail-podium" class="bg-yellow-400/10 border border-yellow-500/20 p-5 rounded-3xl mb-6 hidden font-bold">
                <div class="text-yellow-400 text-[10px] mb-3 font-black uppercase tracking-widest">🥇 Official Ranking</div>
                <div id="detail-rank-result" class="text-sm space-y-1 font-bold"></div>
            </div>
            <div class="flex gap-2 mb-8 font-bold">
                <button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 border border-blue-500/30 py-4 rounded-2xl text-xs text-blue-300 font-black">🥇 순위 등록</button>
                <button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 border border-green-500/30 py-4 rounded-2xl text-xs text-green-300 font-black">💬 코멘트</button>
            </div>
            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left pr-1 font-bold"></div>
        </div>
    </div>

    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold text-center" onclick="event.stopPropagation()">
            <h3 class="text-2xl font-black text-blue-400 mb-6 uppercase italic">My Profile</h3>
            <div class="flex flex-col items-center gap-6 mb-8 border-b border-white/10 pb-8 font-bold">
                <div class="relative group cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 object-cover bg-slate-800">
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity font-bold">📸</div>
                </div>
                <div class="w-full space-y-4 font-bold">
                    <input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none font-black text-center font-bold" placeholder="닉네임">
                    <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileUpload(this)">
                    <button onclick="document.getElementById('file-input').click()" class="w-full bg-white/10 py-3 rounded-xl text-xs font-bold font-bold">사진 변경 (또는 Ctrl+V)</button>
                </div>
                <button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl font-bold">저장하기</button>
            </div>
            <h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1 font-bold">Attendance History</h4>
            <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[180px] space-y-2 custom-scrollbar text-left font-bold"></div>
        </div>
    </div>

    <div id="rank-popup" class="modal" style="z-index: 10001;" onclick="toggleModal('rank-popup', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] text-center font-bold" onclick="event.stopPropagation()"><h4 class="text-blue-400 mb-6 font-black uppercase italic font-bold">Setting Rank</h4><div id="rank-member-grid" class="grid grid-cols-2 gap-2 mb-6 max-h-48 overflow-y-auto p-1 font-bold"></div><div id="rank-order-display" class="text-xs text-green-400 mb-6 text-left p-4 bg-black/40 rounded-2xl font-bold font-bold">순위: </div><button onclick="saveRanks()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-lg font-bold">저장</button></div></div>
    <div id="comment-popup" class="modal" style="z-index: 10001;" onclick="toggleModal('comment-popup', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] font-bold" onclick="event.stopPropagation()"><h4 class="text-green-400 mb-6 font-black text-center italic uppercase font-bold">Add Note</h4><textarea id="pop-comment-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl h-32 outline-none text-white font-bold font-bold mb-6"></textarea><button onclick="saveNote()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-lg font-bold">등록</button></div></div>
    <div id="page-stats" class="page pt-24 font-bold text-center"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase font-bold">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4 font-bold font-bold"><div class="space-y-4 font-bold font-bold"><h3 class="text-blue-400 font-black italic font-bold font-bold">🗳️ Voting King</h3><div id="vote-king" class="space-y-3 font-bold font-bold"></div></div><div class="space-y-4 font-bold font-bold"><h3 class="text-green-400 font-black italic font-bold font-bold">🆕 Creator King</h3><div id="game-add-king" class="space-y-3 font-bold font-bold"></div></div></div></div>
    <div id="page-chat-info" class="page pt-24 font-bold px-4 font-bold font-bold"><h2 class="text-3xl font-black text-blue-400 mb-10 italic uppercase font-bold font-bold">Group Info 📢</h2><div id="chat-info-list" class="space-y-4 font-bold font-bold"></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let recordingRanks = []; let currentScheduleId = null; let tempMembers = []; let profileImageData = "";

        // [v4.0.0 브라우저 뒤로가기 완벽 대응]
        window.handleBack = () => {
            if(document.querySelector('.modal.active')) { closeAllModals(); return; }
            showPage('page-home');
        };

        window.onpopstate = (e) => {
            if(document.querySelector('.modal.active')) { closeAllModals(); return; }
            const targetId = e.state?.page || 'page-home';
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(targetId);
            if(target) target.classList.add('active');
            updateBackBtn(targetId);
        };

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            history.pushState({ page: id }, '', '');
            updateBackBtn(id);
            if(id === 'page-chat-info') loadChatInfo();
            if(id === 'page-stats') navToStats();
        };

        function updateBackBtn(id) {
            const btn = document.getElementById('global-back-btn');
            btn.style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block';
        }

        // [v4.0.0 렌더링 엔진]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 italic font-bold">Loading...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const ratings = rSnap.docs.map(d => d.data());
                let games = gSnap.docs.map(d => {
                    const r = ratings.filter(v => v.gameId === d.id);
                    const sc = r.map(v => v.score || 0).sort((a,b)=>a-b);
                    let avgS = (r.length >= 5) ? sc.slice(1, -1).reduce((a,c)=>a+c,0)/(sc.length-2) : (r.length > 0 ? sc.reduce((a,c)=>a+c,0)/r.length : 0);
                    const df = r.map(v => v.difficulty || 0).filter(v => v > 0);
                    let avgD = df.length > 0 ? df.reduce((a,c)=>a+c,0)/df.length : 0;
                    return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: avgD, voteCount: r.length };
                }).sort((a,b) => b.avgScore - a.avgScore);

                list.innerHTML = games.map((g, i) => {
                    const stars = Math.round(g.avgDiff);
                    return `
                    <tr class="hover:bg-white/5 border-b border-white/5 font-bold transition">
                        <td class="p-5 text-blue-400 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                        <td class="p-5 text-left"><div class="text-sm font-black">${g.name}</div><div class="text-[9px] text-gray-500">Votes: ${g.voteCount}</div></td>
                        <td class="p-2">
                            <div class="flex flex-col items-center gap-1 font-bold">
                                <span onclick="openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-lg cursor-pointer hover:scale-110 transition font-black">${g.avgScore.toFixed(1)}</span>
                                <div onclick="openRate('diff','${g.id}','${g.name}')" class="flex text-[10px] cursor-pointer hover:opacity-70 font-bold">
                                    ${Array(10).fill(0).map((_, idx) => `<span class="${idx < stars ? 'text-blue-400' : 'text-gray-700'}">★</span>`).join('')}
                                </div>
                            </div>
                        </td>
                        <td class="p-5"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/20 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-green-600 transition font-bold">기록</button></td>
                    </tr>`;
                }).join('');
            } catch (e) { list.innerHTML = "Error"; }
        };

        // [v4.0.0 기록 상세 복구]
        window.openSchedules = async (id, n) => { activeGameId = id; activeGameName = n; document.getElementById('schedule-game-title').innerText = n; const uSnap = await getDocs(collection(db, "users")); document.getElementById('member-select-grid').innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="bg-white/5 p-2 rounded-lg text-[9px] border border-white/10 font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        async function loadSchedules() { const l = document.getElementById('schedule-list'); const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); l.innerHTML = sSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center shadow-lg font-bold cursor-pointer hover:bg-white/10 transition-all"><div class="text-left font-bold"><div class="text-sm text-green-300 font-bold font-bold">${s.name}</div><div class="text-[9px] text-gray-500 uppercase font-bold">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs font-bold">▶</span></div>`).join(''); }
        window.openScheduleDetail = async (id) => { currentScheduleId = id; const [sSnap, uSnap] = await Promise.all([getDoc(doc(db, "schedules", id)), getDocs(collection(db, "users"))]); const s = sSnap.data(); const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); document.getElementById('detail-title').innerText = s.name; const p = document.getElementById('detail-podium'); if(s.ranks?.length > 0) { p.classList.remove('hidden'); document.getElementById('detail-rank-result').innerHTML = s.ranks.map((p, i) => `<div class='text-xs font-bold font-bold'>${i+1}위 <b>${uMap[p]?.name || '?'}</b></div>`).join(''); } else p.classList.add('hidden'); document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map(l => `<div class="bg-white/5 p-4 rounded-2xl flex gap-3 font-bold border border-white/5 font-bold"><img src="${uMap[l.userPin]?.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8 font-bold"><div class="flex-grow font-bold font-bold"><div class="flex justify-between items-center text-[10px] text-gray-500 mb-1 font-bold"><span>${uMap[l.userPin]?.name || 'Unknown'}</span>${l.userPin === currentUser.pin ? `<button onclick='deleteComment(${JSON.stringify(l).replace(/'/g, "&apos;")})' class='text-red-500'>🗑️</button>`:''}</div><div class="text-sm text-white/90 font-bold">${l.text}</div></div></div>`).join('') || `<div class='opacity-20 text-center py-10 italic font-bold'>기록 없음</div>`; toggleModal('detail-modal', true); };

        // [v4.0.0 마이페이지 히스토리 복구]
        async function loadMyHistory() {
            const listDiv = document.getElementById('my-history-list');
            const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin));
            const sSnap = await getDocs(q);
            listDiv.innerHTML = sSnap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => {
                const rIdx = s.ranks?.indexOf(currentUser.pin);
                const rankText = rIdx > -1 ? (rIdx + 1) + '위' : '기록전';
                return `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center font-bold mb-1"><div class="text-left font-bold"><div class="flex items-center gap-2 mb-1 font-bold"><span class="category-tag font-bold font-bold">${s.gameCategory||'기타'}</span><span class="text-[9px] text-blue-500 font-bold">${s.gameName||'Unknown'}</span></div><div class="text-[13px] font-bold">${s.name}</div></div><b class="text-yellow-400 text-xs font-bold">${rankText}</b></div>`;
            }).join('') || "참가 기록이 없습니다.";
        }

        // [인증 및 사진 기능 - v3.9.0 안정 버전 유지]
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", d.pin)); if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home'); return; } } showPage('page-login'); });
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } };
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin==="100") document.getElementById('admin-user-manage-btn')?.classList.remove('hidden'); }
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.handleFileUpload = (i) => { if(i.files[0]) { const r = new FileReader(); r.onload = (e) => { profileImageData = e.target.result; document.getElementById('profile-preview').src = e.target.result; }; r.readAsDataURL(i.files[0]); } };
        window.addEventListener('paste', (e) => { if(!document.getElementById('profile-modal').classList.contains('active')) return; const items = e.clipboardData.items; for(let i=0; i<items.length; i++) { if(items[i].type.indexOf('image') !== -1) { const b = items[i].getAsFile(); const r = new FileReader(); r.onload = (ev) => { profileImageData = ev.target.result; document.getElementById('profile-preview').src = ev.target.result; }; r.readAsDataURL(b); } } });
        window.updateProfile = async () => { const n = document.getElementById('edit-nickname').value.trim(); const up = { name: n }; if(profileImageData) up.iconUrl = profileImageData; await updateDoc(doc(db, "users", currentUser.pin), up); location.reload(); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.openRate = (t, id, n) => { activeGameId = id; document.getElementById('rate-modal-title').innerText = n; document.getElementById('rate-score-section').classList.toggle('hidden', t !== 'score'); document.getElementById('rate-diff-section').classList.toggle('hidden', t !== 'diff'); toggleModal('rate-modal', true); };
        window.submitRating = async (t) => { const v = (t === 'score') ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-range').value); try { const q = query(collection(db, "ratings"), where("gameId", "==", activeGameId), where("userPin", "==", currentUser.pin)); const snap = await getDocs(q); const rD = { gameId: activeGameId, userPin: currentUser.pin, updatedAt: serverTimestamp() }; rD[t === 'score' ? 'score' : 'difficulty'] = v; if(!snap.empty) await updateDoc(doc(db, "ratings", snap.docs[0].id), rD); else await addDoc(collection(db, "ratings"), rD); alert("성공!"); toggleModal('rate-modal', false); renderList(); } catch(e) { alert("실패"); } };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) toggleModal(id, false); };
        window.deleteComment = async (o) => { if(confirm("삭제?")){ await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayRemove(o) }); openScheduleDetail(currentScheduleId); } };
        window.saveNote = async () => { const t = document.getElementById('pop-comment-input').value.trim(); if(!t) return; await updateDoc(doc(db, "schedules", currentScheduleId), { feed: arrayUnion({ userPin: currentUser.pin, text: t, time: Date.now() }) }); toggleModal('comment-popup', false); openScheduleDetail(currentScheduleId); };
        window.openRankPopup = async () => { const s = (await getDoc(doc(db, "schedules", currentScheduleId))).data(); const uS = await getDocs(collection(db, "users")); const uM = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); recordingRanks = []; document.getElementById('rank-member-grid').innerHTML = s.members.map(m => `<button id='rb-${m}' onclick='recordRank("${m}")' class='bg-white/5 p-3 rounded-xl border border-white/10 text-[10px] font-bold'>${uM[m]?.name}</button>`).join(''); toggleModal('rank-popup', true); };
        window.recordRank = (p) => { if(recordingRanks.includes(p)) return; recordingRanks.push(p); document.getElementById(`rb-${p}`).style.opacity = "0.3"; };
        window.saveRanks = async () => { await updateDoc(doc(db, "schedules", currentScheduleId), { ranks: recordingRanks }); toggleModal('rank-popup', false); openScheduleDetail(currentScheduleId); };
        window.toggleSelectMember = (p) => { const i = tempMembers.indexOf(p); const b = document.getElementById(`sel-${p}`); if(i>-1){ tempMembers.splice(i,1); b.style.borderColor = 'rgba(255,255,255,0.1)'; b.style.color = 'white'; } else { tempMembers.push(p); b.style.borderColor = '#60a5fa'; b.style.color = '#60a5fa'; } };
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
    </script>
</body>
</html>
