<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ranking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .category-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .category-card:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.1); border-color: #3b82f6; }
        input::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div id="page-home" class="page active w-full max-w-4xl text-center">
        <h1 class="text-4xl font-extrabold mb-12 tracking-tight">GAME <span class="text-blue-500">ARCHIVE</span></h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400">🕵️ 머더 미스테리</button>
        </div>
        <button onclick="createAdminOnce()" class="mt-20 text-xs text-gray-600 hover:text-gray-400 opacity-30 underline">관리자 계정(100번) 원클릭 생성</button>
    </div>

    <div id="page-login" class="page w-full max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6">인증이 필요합니다</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white">
                <input type="password" id="pw" placeholder="PW 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white">
                <button onclick="login()" class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500">시작하기</button>
            </div>
            <button onclick="showPage('page-home')" class="mt-4 text-sm text-gray-500 hover:text-white">돌아가기</button>
        </div>
    </div>

    <div id="page-rank" class="page w-full max-w-3xl">
        <div class="flex justify-between items-end mb-8">
            <div>
                <button onclick="showPage('page-home')" class="text-blue-400 text-sm hover:underline mb-2">← 뒤로가기</button>
                <h2 id="rank-title" class="text-3xl font-bold">카테고리</h2>
            </div>
            <button onclick="addGame()" class="bg-white/10 px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/20">+ 새 항목 추가</button>
        </div>
        <div class="glass rounded-3xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-white/5 text-gray-400 text-xs uppercase tracking-wider">
                    <tr><th class="p-5">순위</th><th class="p-5">게임 이름</th><th class="p-5">평점</th><th class="p-5 text-center">상태</th></tr>
                </thead>
                <tbody id="rank-list" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE",
        authDomain: "game-archive-afacf.firebaseapp.com",
        projectId: "game-archive-afacf",
        storageBucket: "game-archive-afacf.firebasestorage.app",
        messagingSenderId: "927042381268",
        appId: "1:927042381268:web:e41f4106cf9202e45ca241"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let selectedCategory = "";

    // [중요] 관리자 생성 원클릭 함수
    window.createAdminOnce = async function() {
        try {
            await setDoc(doc(db, "users", "100"), { name: "관리자", password: "1004" });
            alert("관리자 계정(100/1004) 생성 완료! 이제 로그인해보세요.");
        } catch(e) { alert("오류: " + e.message); }
    };

    window.navTo = function(cat) {
        selectedCategory = cat;
        document.getElementById('rank-title').innerText = cat;
        if (currentUser) renderList(); else showPage('page-login');
    };

    window.login = async function() {
        const pin = document.getElementById('pin').value;
        const pw = document.getElementById('pw').value;
        try {
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, name: snap.data().name };
                renderList();
            } else { alert("인증 정보가 틀립니다."); }
        } catch(e) { alert("로그인 오류"); }
    };

    window.showPage = function(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        setTimeout(() => {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            const target = document.getElementById(pageId);
            target.style.display = 'block';
            setTimeout(() => target.classList.add('active'), 50);
        }, 400);
    };

    window.renderList = async function() {
        const list = document.getElementById('rank-list');
        list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-50">랭킹 계산 중...</td></tr>`;
        try {
            const gSnap = await getDocs(query(collection(db, "games"), where("category", "==", selectedCategory)));
            const rSnap = await getDocs(collection(db, "ratings"));
            const ratings = rSnap.docs.map(d => d.data());
            
            let games = [];
            gSnap.forEach(d => {
                const gData = d.data();
                const tr = ratings.filter(r => r.gameId === d.id);
                const avg = tr.length > 0 ? tr.reduce((a, c) => a + c.score, 0) / tr.length : 0;
                const my = tr.find(r => r.userPin === currentUser.pin);
                games.push({ id: d.id, name: gData.name, avg, count: tr.length, myScore: my ? my.score : null });
            });
            games.sort((a, b) => b.avg - a.avg);

            list.innerHTML = games.map((g, i) => `
                <tr class="hover:bg-white/5 border-b border-white/5">
                    <td class="p-5 font-mono text-blue-400">#${i+1}</td>
                    <td class="p-5 font-bold">${g.name} <span class="text-xs font-normal opacity-40">(${g.count}명)</span>
                    ${currentUser.pin === "100" ? `<button onclick="delGame('${g.id}','${g.name}')" class="text-red-500 text-xs ml-2 hover:underline">[삭제]</button>` : ''}</td>
                    <td class="p-5 text-yellow-400 font-semibold">${g.avg.toFixed(1)}</td>
                    <td class="p-5 text-center">
                        <button onclick="inputScore('${g.id}','${g.name}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${g.myScore !== null ? 'bg-white/10 text-gray-400' : 'bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600 hover:text-white'}">
                        ${g.myScore !== null ? `내 점수: ${g.myScore}` : '점수 입력'}</button>
                    </td>
                </tr>`).join('');
            showPage('page-rank');
        } catch(e) { console.error(e); }
    };

    window.addGame = async function() {
        const n = prompt("새 게임 이름:");
        if (n) { await addDoc(collection(db, "games"), { name: n, category: selectedCategory, createdAt: new Date() }); renderList(); }
    };

    window.delGame = async function(id, n) {
        if (confirm(`'${n}'을(를) 삭제하시겠습니까?`)) { await deleteDoc(doc(db, "games", id)); renderList(); }
    };

    window.inputScore = async function(id, n) {
        const v = prompt(`${n} 점수 (0~100):`);
        if (v !== null) {
            const s = parseFloat(v);
            if (isNaN(s) || s < 0 || s > 100) return alert("0~100 사이 숫자를 입력하세요.");
            await setDoc(doc(db, "ratings", `${currentUser.pin}_${id}`), { gameId: id, userPin: currentUser.pin, score: s, updatedAt: new Date() });
            alert("반영되었습니다!"); renderList();
        }
    };
</script>
</body>
</html>
