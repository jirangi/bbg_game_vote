<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v6.7.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        /* 모달: 비활성 시 클릭 차단 */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: none; }
        .modal.active { display: flex; pointer-events: auto; }
        
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 30000 !important; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; pointer-events: auto; }
        
        #admin-user-modal { z-index: 21000 !important; }
        #admin-modal { z-index: 20000 !important; }
        #rank-edit-modal, #add-schedule-modal { z-index: 15000 !important; } 
        #detail-modal { z-index: 14000 !important; }
        #schedule-modal { z-index: 13000 !important; }
        #profile-modal { z-index: 12000 !important; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 10px 4px; border-radius: 12px; text-align: center; font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.05); transition: 0.2s; }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .rank-slot { cursor: pointer; border: 2px dashed rgba(255,255,255,0.1); padding: 12px; border-radius: 16px; margin-bottom: 8px; transition: 0.2s; }
        .rank-slot.filled { border-style: solid; border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .custom-checkbox { appearance: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 4px; cursor: pointer; position: relative; }
        .custom-checkbox:checked { background-color: #3b82f6; border-color: #3b82f6; }
        .custom-checkbox:checked::after { content: '✔'; position: absolute; font-size: 10px; color: white; top: -1px; left: 2px; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div id="my-profile-trigger" class="flex items-center gap-3 p-2 cursor-pointer relative z-[9999]" style="pointer-events: auto !important;" onclick="event.stopPropagation(); toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3241/3241724.png'">
                <div class="text-left font-bold"><span id="user-welcome" class="text-blue-300 text-sm font-black block"></span><span class="text-[9px] text-gray-500 font-bold">My Profile ></span></div>
            </div>
            <div class="flex gap-2">
                <button id="admin-btn" onclick="openModal('admin-modal')" class="hidden bg-red-500/10 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-black">⚙️ 관리자</button>
                <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg font-bold">로그아웃</button>
            </div>
        </div>
        <h1 class="text-4xl font-extrabold mb-10 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="showPage('page-stats')" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg relative z-20">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg relative z-20">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold relative z-10">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition relative active:scale-95">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition relative active:scale-95">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition relative active:scale-95">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition relative active:scale-95">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase"></h2></div>
        <div class="px-4 mb-4 flex flex-col gap-3 font-bold">
            <input type="text" id="game-search" oninput="renderList()" placeholder="🔍 게임 검색..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm font-bold shadow-inner font-bold">
            <button onclick="addGame()" class="w-full bg-blue-600/20 text-blue-400 border border-blue-500/30 py-3 rounded-2xl text-xs font-black font-bold">+ 새 게임 추가</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden mx-4 shadow-2xl border border-white/5 font-bold">
            <table class="w-full text-center table-fixed border-collapse">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-10 text-center">#</th><th class="p-4 text-left">정보</th><th class="w-24 text-center">평가</th><th class="w-20">기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>

    <div id="page-chat-info" class="page pt-24 text-center font-bold">
        <h2 class="text-3xl font-black text-blue-400 mb-10 italic uppercase">단톡방 정보 📢</h2>
        <div class="px-4 space-y-6">
            <div id="admin-notice-write" class="hidden glass p-6 rounded-[30px] border border-green-500/20 text-left">
                <div class="mb-3 text-xs text-green-400 font-black uppercase">✨ New Notice</div>

                <textarea id="notice-input" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none text-sm h-20 resize-none font-bold mb-3 placeholder-gray-500" placeholder="내용을 입력하세요..."></textarea>
                <div class="flex gap-2 mb-3"><input id="notice-link-text" class="w-1/3 bg-white/5 border border-white/10 p-3 rounded-xl outline-none text-xs font-bold placeholder-gray-500" placeholder="버튼명"><input id="notice-link-url" class="w-2/3 bg-white/5 border border-white/10 p-3 rounded-xl outline-none text-xs font-bold placeholder-gray-500" placeholder="URL"></div>
                <div class="border-t border-white/10 pt-3"><div class="flex justify-between items-center mb-2"><span class="text-xs text-yellow-400 font-black">📊 투표 만들기</span><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="vote-multi" class="w-4 h-4 rounded bg-white/10 border-none"><span class="text-[10px] text-gray-400">중복 투표 가능</span></label></div><div id="vote-inputs" class="space-y-2 mb-2"><input class="vote-option-input w-full bg-white/5 border border-white/10 p-2 rounded-xl text-xs font-bold placeholder-gray-600" placeholder="투표 버튼 1"><input class="vote-option-input w-full bg-white/5 border border-white/10 p-2 rounded-xl text-xs font-bold placeholder-gray-600" placeholder="투표 버튼 2"></div><button onclick="addVoteInput()" class="w-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 py-2 rounded-xl text-[10px] font-black">+ 투표 버튼 추가</button></div>
                <button id="notice-submit-btn" class="w-full bg-green-600 py-3 rounded-xl font-black text-xs mt-4 shadow-lg">공지 등록</button>
            </div>
            <div id="notice-list" class="space-y-6 pb-10"></div>
        </div>
    </div>

    <div id="page-stats" class="page pt-24 text-center font-bold"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4 mb-6"><div class="space-y-4"><h3 class="text-blue-400 font-black italic">🗳️ Voting King</h3><div id="vote-king" class="space-y-3"></div></div><div class="space-y-4"><h3 class="text-green-400 font-black italic">🆕 Creator King</h3><div id="game-add-king" class="space-y-3"></div></div></div><div class="px-4"><h3 class="text-purple-400 font-black italic mb-4">💬 Best Reviews</h3><div id="best-reviews" class="space-y-3"></div></div></div>
    <div id="page-login" class="page pt-20 text-center font-bold active"><h1 class="text-4xl font-black mb-10 italic text-blue-500">GAME ARCHIVE</h1><div class="glass p-8 rounded-[40px] mx-4 space-y-4 font-bold"><input type="number" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-center font-bold"><input type="password" id="pw" placeholder="PASSWORD (4자리)" maxlength="4" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-center font-bold" oninput="if(this.value.length===4) login()"><button onclick="login()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white font-bold">입장하기</button></div></div>

    <div id="profile-modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col text-center font-bold" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic">My Profile</h3><div class="flex flex-col items-center gap-4 mb-8 font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 object-cover bg-slate-800"><div id="display-name" class="text-xl font-black"></div></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1">Attend History</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar text-left font-bold"></div><button onclick="closeModal()" class="mt-6 text-gray-500 text-xs font-black uppercase">닫기</button></div></div>
    <div id="schedule-modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3><button onclick="closeModal()" class="text-gray-500 text-3xl font-bold">✕</button></div><div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold"></div><button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl font-bold">+ 새로운 기록 추가</button></div></div>
    <div id="detail-modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[95vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-start mb-6"><div class="flex flex-col flex-1"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate"></h3><div class="flex items-center gap-2 mt-1 relative z-[3000]"><span id="detail-date-display" onclick="enableDateEdit()" class="text-[10px] text-gray-500 cursor-pointer hover:text-white transition">📅 </span><input type="date" id="detail-date-input" class="hidden bg-slate-800 border border-white/10 text-[10px] rounded p-1"></div></div><div class="flex gap-4"><button onclick="confirmDelete()" class="text-red-400/50 hover:text-red-500 pt-1 font-bold"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button><button onclick="closeModal()" class="text-gray-500 text-3xl font-bold">✕</button></div></div><div class="mb-4 p-4 bg-white/5 rounded-3xl border border-white/5 font-bold"><div class="flex justify-between items-center mb-4"><span class="text-xs font-black text-gray-400 uppercase italic">Result</span><button id="rank-edit-trigger" onclick="enableRankEdit()" class="text-[10px] text-blue-400 font-black border border-blue-500/30 px-3 py-1 rounded-lg hover:bg-white/5">기록 수정</button></div><div id="detail-rank-result" class="space-y-2 max-h-40 overflow-y-auto font-bold"></div></div><div id="murder-character-box" class="hidden mb-4 p-4 bg-purple-500/10 rounded-2xl border border-purple-500/20 font-bold"><div class="text-[10px] text-purple-300 font-black mb-2 uppercase">Played Character</div><div class="flex gap-2"><input type="text" id="character-input" class="flex-1 bg-white/5 border border-white/10 p-3 rounded-xl outline-none text-xs font-bold" placeholder="캐릭터 이름..."><button onclick="saveCharacter()" class="bg-purple-600 px-4 rounded-xl text-xs font-black">저장</button></div></div><div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left mb-4 border-t border-white/5 pt-4"></div><div class="flex gap-2 font-bold"><input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold" placeholder="코멘트 입력..."><button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs font-bold">등록</button></div></div></div>
    <div id="add-schedule-modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-6 text-green-400 italic">NEW RECORD</h3><input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold" placeholder="기록 제목"><div id="member-selector" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-white/10 rounded-2xl mb-6 custom-scrollbar font-bold"></div><button id="submit-schedule-btn" onclick="submitSchedule()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white shadow-xl">기록 생성</button><button onclick="closeModal()" class="mt-4 text-gray-500 text-xs font-black uppercase">취소</button></div></div>
    <div id="rank-edit-modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 id="rank-edit-title" class="text-xl font-black text-yellow-400 mb-6 italic uppercase"></h3><div id="rank-edit-slots" class="flex-grow overflow-y-auto space-y-2 mb-6"></div><div id="rank-edit-chips" class="flex flex-wrap gap-2 mb-6 pt-6 border-t border-white/10"></div><div class="grid grid-cols-2 gap-3"><button onclick="closeModal()" class="bg-white/10 py-4 rounded-2xl font-black text-xs">취소</button><button id="rank-complete-btn" onclick="saveRankResult()" class="bg-blue-600 py-4 rounded-2xl font-black text-xs">기록 완료</button></div></div></div>
    <div id="admin-modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold text-center" onclick="event.stopPropagation()"><h3 class="text-2xl font-black text-red-400 mb-6 uppercase">Admin Menu</h3><div class="grid grid-cols-2 gap-4 mb-6"><button onclick="openAdminUserMode()" class="bg-white/5 py-4 rounded-2xl border border-white/10 hover:bg-white/10">👥 유저 추가</button><button class="bg-white/5 py-4 rounded-2xl border border-white/10 opacity-50 cursor-not-allowed">🔐 비번 초기화<br><span class="text-[9px]">(준비중)</span></button><button class="bg-white/5 py-4 rounded-2xl border border-white/10 opacity-50 cursor-not-allowed">📜 자동 스크롤<br><span class="text-[9px]">(준비중)</span></button><button class="bg-white/5 py-4 rounded-2xl border border-white/10 opacity-50 cursor-not-allowed">💾 DB 관리<br><span class="text-[9px]">(준비중)</span></button></div><button onclick="closeModal()" class="text-gray-500 text-xs font-black uppercase">닫기</button></div></div>
    <div id="admin-user-modal" class="modal" onclick="if(event.target===this) closeModal()"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black text-blue-400 mb-6 uppercase">유저 관리</h3><div class="flex gap-2 mb-4"><input id="new-user-name" class="w-2/3 bg-white/5 border border-white/10 p-3 rounded-xl outline-none text-sm font-bold" placeholder="이름"><input id="new-user-pin" type="number" class="w-1/3 bg-white/5 border border-white/10 p-3 rounded-xl outline-none text-sm font-bold text-center" placeholder="PIN(자동)"></div><button onclick="addUser()" class="w-full bg-blue-600 py-3 rounded-xl font-black text-xs mb-6">유저 추가</button><h4 class="text-xs text-gray-500 mb-2">등록된 유저 목록 (최신순)</h4><div id="user-list-container" class="flex-grow overflow-y-auto max-h-60 space-y-2 custom-scrollbar"></div><button onclick="closeModal()" class="mt-4 text-gray-500 text-xs font-black uppercase text-center">닫기</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, addDoc, arrayUnion, arrayRemove, deleteDoc, setDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';
        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = ""; let activeScheduleId = null; let activeScheduleData = null; let tempRanks = []; let selMembersGlobal = []; let allUsers = {};
        let myPlayedGames = new Set(); let myManualChecks = new Set();

        // [v6.7.2 핵심 수정] 네비게이션 우선 처리 및 안전장치
        window.navTo = (cat) => {
            try {
                // 1. 화면 전환을 먼저 수행 (반응 속도 향상)
                showPage('page-rank');
                
                // 2. 카테고리 설정 및 타이틀 변경
                selectedCategory = cat;
                const titleEl = document.getElementById('rank-title');
                if(titleEl) titleEl.innerText = cat;
                
                // 3. 데이터 로딩 (비동기)
                renderList();
            } catch(e) {
                console.error("Navigation error:", e);
                alert("페이지 이동 중 오류가 발생했습니다.");
            }
        };

        window.renderList = async () => { 
            const list = document.getElementById('rank-list');
            if(!list) return; // 방어 코드
            
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-50 text-center font-bold">로딩 중...</td></tr>`;
            
            try { 
                const s = (document.getElementById('game-search')?.value || "").toLowerCase(); 
                const q = query(collection(db, "games"), where("category", "==", selectedCategory)); 
                const [gS, rS] = await Promise.all([getDocs(q), getDocs(collection(db, "ratings"))]); 
                const rt = rS.docs.map(d => d.data()); 
                
                let gms = gS.docs.map(d => { 
                    const r = rt.filter(v => v.gameId === d.id); 
                    const scs = r.map(v => v.score).filter(v => v != null); 
                    const lvs = r.map(v => v.level).filter(v => v != null); 
                    return { id: d.id, ...d.data(), avgS: scs.length ? (scs.reduce((a,c)=>a+c,0)/scs.length).toFixed(1) : "0.0", avgL: lvs.length ? (lvs.reduce((a,c)=>a+c,0)/lvs.length).toFixed(1) : "0.0" }; 
                }).filter(g => g.name.toLowerCase().includes(s)).sort((a,b)=>Number(b.avgS)-Number(a.avgS)); 
                
                list.innerHTML = gms.map((g, i) => {
                    // 데이터 안전 참조 (Set이 없어도 에러 안 나도록)
                    const hasRecord = myPlayedGames?.has(g.id) || false;
                    const isChecked = myManualChecks?.has(g.id) || false;
                    const isPlayed = hasRecord || isChecked;
                    const bgClass = isPlayed ? 'bg-blue-600/30' : 'border-b border-white/5';

                    return `
                    <tr class="${bgClass} font-bold transition duration-200">
                        <td class="p-4 text-blue-400 w-10 font-black">${i < 3 ? '🥇' : '#'+(i+1)}</td>
