<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v6.0.13</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #schedule-modal { z-index: 10010; } 
        #add-schedule-modal { z-index: 10020; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .btn-priority { position: relative; z-index: 2000 !important; cursor: pointer !important; pointer-events: auto !important; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 8px 4px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.05); transition: 0.2s; }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 btn-priority" onclick="event.stopPropagation(); toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3241/3241724.png'">
                <div class="text-left font-bold"><span id="user-welcome" class="text-blue-300 text-sm font-black block"></span><span class="text-[9px] text-gray-500 font-bold font-bold">My Profile ></span></div>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg btn-priority font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority font-bold">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority font-bold">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority font-bold">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4 flex justify-between items-center"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase font-bold"></h2></div>
        <div class="glass rounded-[40px] overflow-hidden mx-4 shadow-2xl border border-white/5 font-bold">
            <table class="w-full text-center table-fixed border-collapse">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-12 text-center">#</th><th class="p-4 text-left">정보</th><th class="w-24 text-center">평가</th><th class="w-20">기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 font-bold">
                <h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3>
                <button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold font-bold">✕</button>
            </div>
            <div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold"></div>
            <button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white shadow-xl font-bold">+ 새로운 기록 추가</button>
        </div>
    </div>

    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-xl font-black mb-6 text-green-400 italic font-bold">NEW RECORD</h3>
            <input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold font-bold" placeholder="기록 제목 입력">
            <div id="member-selector" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-white/10 rounded-2xl mb-6 custom-scrollbar font-bold"></div>
            <button onclick="submitSchedule()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white shadow-xl font-bold">생성하기</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, serverTimestamp, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = ""; let selectedMembers = [];

        // [v6.0.13 3.1 기록 목록 조회 및 3.7 추가 로직 연동]
        window.openSchedules = async (id, name) => {
            activeGameId = id; activeGameName = name;
            const titleEl = document.getElementById('schedule-game-title');
            const listDiv = document.getElementById('schedule-list');
            
            if(titleEl) titleEl.innerText = name;
            if(listDiv) listDiv.innerHTML = `<p class="opacity-30 text-center py-10 font-bold font-bold">로딩 중...</p>`;
            
            toggleModal('schedule-modal', true);

            try {
                const q = query(collection(db, "schedules"), where("gameId", "==", id), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                if(listDiv) {
                    listDiv.innerHTML = snap.docs.map(d => `<div onclick="alert('상세 진입 준비중')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold mb-1 font-bold"><div class="text-sm text-green-300 font-bold font-bold">${d.data().name}</div><span class="text-blue-400 text-xs font-bold font-bold">▶</span></div>`).join('') || "기록 없음";
                }
            } catch(e) { if(listDiv) listDiv.innerHTML = "조회 실패"; }
        };

        window.openAddSchedule = async () => {
            selectedMembers = [];
            const selector = document.getElementById('member-selector');
            if(selector) selector.innerHTML = `<p class="col-span-3 text-center py-4 font-bold font-bold font-bold">로딩 중...</p>`;
            toggleModal('add-schedule-modal', true);
            const uSnap = await getDocs(collection(db, "users"));
            if(selector) selector.innerHTML = uSnap.docs.map(d => `<div onclick="this.classList.toggle('selected'); toggleMember('${d.id}')" class="member-chip font-bold font-bold">${d.data().name}</div>`).join('');
        };

        window.toggleMember = (pin) => {
            const idx = selectedMembers.indexOf(pin);
            if(idx > -1) selectedMembers.splice(idx, 1);
            else selectedMembers.push(pin);
        };

        window.submitSchedule = async () => {
            const name = document.getElementById('new-schedule-name').value.trim();
            if(!name || selectedMembers.length === 0) return alert("필수 정보를 입력하세요.");
            try {
                await addDoc(collection(db, "schedules"), {
                    gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory,
                    name: name, members: selectedMembers, date: new Date().toISOString().split('T')[0],
                    createdAt: serverTimestamp(), ranks: [], feed: []
                });
                document.getElementById('new-schedule-name').value = "";
                toggleModal('add-schedule-modal', false);
                openSchedules(activeGameId, activeGameName);
            } catch(e) { alert("저장 실패"); }
        };

        // [v6.0.13 버튼 바인딩 수정된 렌더링 로직]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            if(!list) return;
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 text-center font-bold font-bold font-bold font-bold font-bold font-bold">로딩 중...</td></tr>`;
            const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
            const rt = rS.docs.map(d => d.data());
            let gms = gS.docs.map(d => {
                const r = rt.filter(v => v.gameId === d.id);
                return { id: d.id, ...d.data(), avgScore: r.length > 0 ? r.map(v=>v.score||0).reduce((a,c)=>a+c,0)/r.length : 0 };
            });
            gms.sort((a, b) => b.avgScore - a.avgScore);
            list.innerHTML = gms.map((g, i) => `
                <tr class="hover:bg-white/5 border-b border-white/5 transition font-bold font-bold font-bold font-bold font-bold font-bold font-bold">
                    <td class="p-4 text-blue-400 font-black text-center w-12 font-bold font-bold font-bold">${i < 3 ? '🥇' : '#'+(i+1)}</td>
                    <td class="p-4 text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span class="game-name-text text-sm font-black font-bold font-bold font-bold">${g.name}</span></td>
                    <td class="p-2 text-center w-24 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span class="text-yellow-400 text-base font-black font-bold font-bold font-bold">${g.avgScore.toFixed(1)}</span></td>
                    <td class="p-4 w-20 text-center font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">
                        <button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black font-bold font-bold">기록</button>
                    </td>
                </tr>`).join('');
        };

        // 기초 인증 및 UI 제어 (v6.0.12 유지)
        window.login = async () => {
            const p = document.getElementById('pin').value.trim();
            const w = document.getElementById('pw').value.trim();
            const snap = await getDoc(doc(db, "users", String(p)));
            if (snap.exists() && String(snap.data().password) === String(w)) {
                currentUser = { pin: String(p), ...snap.data() };
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin: String(p), pw: String(w) }));
                updateUI(); showPage('page-home');
            } else alert("로그인 실패");
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const d = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", String(d.pin)));
                if (snap.exists()) {
                    currentUser = { pin: String(d.pin), ...snap.data() };
                    updateUI(); showPage('page-home', false); return;
                }
            }
            showPage('page-login', false);
        });

        function updateUI() {
            const welcomeEl = document.getElementById('user-welcome');
            const iconEl = document.getElementById('my-profile-icon');
            if(welcomeEl) welcomeEl.innerText = `${currentUser.name}님`;
            if(iconEl) iconEl.src = currentUser.iconUrl || DEFAULT_ICON;
        }

        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const t = document.getElementById(id); if(t) { t.classList.add('active'); document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block'; if(push) history.pushState({page: id}, '', ''); }
        };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => { const el = document.getElementById(id); if(el) el.classList.toggle('active', s); };
        window.handleBack = () => { if(document.querySelector('.modal.active')) document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); else showPage('page-home'); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.toggleProfileModal = async (s) => { /* v6.0.12 로직과 동일 */ 
            if (s && currentUser) { toggleModal('profile-modal', true); document.getElementById('display-name').innerText = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; } else toggleModal('profile-modal', false);
        };
    </script>
</body>
</html>
