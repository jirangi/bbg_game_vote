<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v5.2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #detail-modal { z-index: 10005; } 
        #rank-management-modal { z-index: 10010; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; cursor: pointer; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
        .game-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; font-weight: 800; display: block; }
        .expanded .game-name-text { white-space: normal; overflow: visible; max-width: none; color: #60a5fa; }
        .game-comment-box { display: none; background: rgba(0,0,0,0.3); border-radius: 12px; margin-top: 10px; padding: 10px; text-align: left; }
        .expanded .game-comment-box { display: block; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; }
        .member-chip.selected { background: #3b82f6; border-color: #60a5fa; opacity: 0.3; pointer-events: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer p-1 relative z-[100]" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-10 h-10 rounded-full border-2 border-blue-500/50 object-cover bg-slate-800">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg transition font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 relative z-[200]">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-black transition shadow-lg pointer-events-auto">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg pointer-events-auto">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold relative z-[50]">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4 flex justify-between items-center"><h2 id="rank-title" class="text-3xl font-black italic text-blue-400 uppercase"></h2><select id="sort-selector" class="bg-slate-800 text-[10px] p-2 rounded-lg border border-white/10" onchange="renderList()"><option value="default">기본(투표순)</option><option value="score_desc">점수 높은순</option><option value="diff_desc">난이도 높은순</option></select></div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5"><table class="w-full text-center min-w-[340px] table-fixed"><thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black font-bold"><th class="p-4 w-12 text-center">#</th><th class="p-4 text-left">게임 정보</th><th class="w-24 text-center">평가</th><th class="w-16">기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div>
        <div class="px-4 mt-6 text-center"><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-8 py-3 rounded-2xl text-xs font-bold">+ 새 게임 추가</button></div>
    </div>
    <div id="page-stats" class="page pt-24 text-center font-bold font-bold"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase font-bold font-bold">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4 font-bold font-bold"><div class="space-y-4"><h3 class="text-blue-400 font-black italic">🗳️ Voting King</h3><div id="vote-king" class="space-y-3"></div></div><div class="space-y-4"><h3 class="text-green-400 font-black italic">🆕 Creator King</h3><div id="game-add-king" class="space-y-3"></div></div></div></div>
    <div id="page-chat-info" class="page pt-24 px-4 font-bold"><h2 class="text-3xl font-black text-blue-400 mb-10 italic uppercase font-bold">Group Info 📢</h2><div id="chat-info-list" class="space-y-4 font-bold"></div></div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold font-bold font-bold font-bold font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 font-bold font-bold font-bold font-bold font-bold font-bold">
                <div class="flex flex-col min-w-0 flex-1 font-bold font-bold font-bold font-bold font-bold font-bold"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate"></h3><span id="detail-date" class="text-[10px] text-gray-500 font-bold font-bold font-bold font-bold font-bold"></span></div>
                <div class="flex gap-3 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button id="detail-delete-btn" class="text-red-500 text-xs hidden" onclick="deleteSchedule()">삭제</button><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl">✕</button></div>
            </div>
            <div id="detail-podium" class="bg-yellow-400/10 border border-yellow-500/20 p-5 rounded-3xl mb-6 hidden font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">
                <div id="detail-rank-result" class="text-sm space-y-1 font-bold text-white/90 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div>
                <button onclick="startRankSelection()" class="w-full mt-4 bg-yellow-500/20 text-yellow-400 py-2 rounded-xl text-[10px] font-black">🏆 순위 기록하기</button>
            </div>
            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div>
            <div class="mt-6 flex gap-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs" placeholder="모임 코멘트"><button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs font-bold font-bold font-bold">등록</button></div>
        </div>
    </div>

    <div id="rank-management-modal" class="modal" onclick="toggleModal('rank-management-modal', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-2 text-yellow-400 text-center">순위 선택</h3><p class="text-[10px] text-gray-500 mb-6 text-center font-bold">1위부터 순서대로 누르세요.</p><div id="rank-order-display" class="mb-4 p-3 bg-black/30 rounded-xl min-h-[40px] text-xs text-blue-400 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div><div id="rank-candidate-grid" class="grid grid-cols-2 gap-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"></div><button onclick="resetRankSelection()" class="mt-6 text-[10px] text-gray-500 underline">다시 선택</button></div></div>
    
    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3><button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl">✕</button></div><div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6"></div><button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white font-bold font-bold">+ 새로운 기록 추가</button></div></div>
    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-6 text-green-400">기록 정보 입력</h3><input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold" placeholder="기록 제목"><div id="member-selector" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto mb-6 p-2 bg-white/5 rounded-2xl"></div><button onclick="submitSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white font-bold">기록 생성</button></div></div>
    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold text-center" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic">My Profile</h3><div class="flex flex-col items-center gap-6 mb-8 border-b border-white/10 pb-8"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover bg-slate-800"><input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none font-black text-center" placeholder="닉네임"></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1">Attend History</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[250px] space-y-3 custom-scrollbar"></div></div></div>
    <div id="rate-modal" class="modal" onclick="toggleModal('rate-modal', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 text-center"></h3><div id="rate-score-section" class="space-y-4"><label class="text-[10px] text-gray-500 block text-center font-bold">재미 점수 (0 ~ 100)</label><input type="number" id="rate-score-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center text-2xl font-bold" placeholder="0"><button onclick="submitRating('score')" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black">저장</button></div><div id="rate-diff-section" class="space-y-4 hidden"><label class="text-[10px] text-gray-500 block text-center font-bold">난이도 (1 ~ 5)</label><input type="range" id="rate-diff-range" min="1" max="5" step="1" class="w-full accent-blue-500" oninput="document.getElementById('diff-val').innerText = this.value"><div id="diff-val" class="text-center text-3xl font-black text-blue-400 font-bold">3</div><button onclick="submitRating('diff')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white">저장</button></div></div></div>
    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center font-bold"><div class="glass p-8 rounded-3xl"><h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase italic">Login</h2><div class="space-y-4"><input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white"><input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold font-bold font-bold font-bold font-bold"><button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">접속</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, orderBy, addDoc, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeScheduleId = null; let recordingRanks = []; let selectedMembers = [];

        // [v5.2.1 내비게이션 & 뒤로가기 고정]
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.onpopstate = () => { if(document.querySelector('.modal.active')) { closeAllModals(); history.pushState({page: 'page-home'}, '', ''); return; } showPage('page-home', false); };
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(id); if(target) { target.classList.add('active'); document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block'; if(push) history.pushState({page: id}, '', ''); if(id === 'page-stats') navToStats(); if(id === 'page-chat-info') loadChatInfo(); }
        };

        // [v5.2.1 렌더링 - 점수 및 기록 버튼 간섭 방지 최적화]
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 italic font-bold">로딩 중...</td></tr>`;
            const sortType = document.getElementById('sort-selector').value;
            const [gS, rS, uS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings")), getDocs(collection(db, "users"))]);
            const rt = rS.docs.map(d => d.data()); const uMap = uS.docs.reduce((acc, d) => ({...acc,[d.id]:d.data()}), {});
            
            let gms = gS.docs.map(d => {
                const r = rt.filter(v => v.gameId === d.id); const sc = r.map(v => v.score || 0).sort((a,b)=>a-b);
                let avgS = (r.length >= 5) ? sc.slice(1, -1).reduce((a,c)=>a+c,0)/(sc.length-2) : (r.length > 0 ? sc.reduce((a,c)=>a+c,0)/r.length : 0);
                const df = r.map(v => v.difficulty || 0).filter(v => v > 0);
                return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: df.length > 0 ? df.reduce((a,c)=>a+c,0)/df.length : 0, voteCount: r.length };
            });
            gms.sort((a, b) => { const a3 = a.voteCount >= 3; const b3 = b.voteCount >= 3; if(a3 !== b3) return b3 - a3; return sortType === "score_desc" ? b.avgScore - a.avgScore : b.avgScore - a.avgScore; });

            list.innerHTML = gms.map((g, i) => `
                <tr class="transition" id="row-${g.id}">
                    <td class="p-4 text-blue-400 font-black text-center w-12">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                    <td class="p-4 text-left font-bold" onclick="toggleGameRow('${g.id}')">
                        <div class="game-name-text text-sm font-black">${g.name}</div>
                        <div class="text-[9px] opacity-40">Votes: ${g.voteCount}</div>
                        <div class="game-comment-box" onclick="event.stopPropagation()">
                            <div class="max-h-24 overflow-y-auto mb-2 custom-scrollbar space-y-1">
                                ${(g.comments || []).map((c, idx) => `<div class="text-[10px] flex justify-between bg-white/5 p-1.5 rounded-lg"><span><b class="text-blue-300">${uMap[c.userPin]?.name || '?'}:</b> ${c.text}</span>${(c.userPin===currentUser.pin || currentUser.pin==="100")?`<button onclick="deleteGameComment('${g.id}',${idx})" class="text-red-500 ml-2">✕</button>`:''}</div>`).join('') || "<p class='opacity-20 text-[9px]'>첫 댓글을 쓰세요!</p>"}
                            </div>
                            <div class="flex gap-1"><input type="text" id="gc-${g.id}" class="bg-white/10 text-[10px] p-2 rounded flex-1 outline-none" placeholder="댓글..."><button onclick="addGameComment('${g.id}')" class="bg-blue-600 text-[10px] px-2 rounded">등록</button></div>
                        </div>
                    </td>
                    <td class="p-2 text-center w-24"><div class="flex flex-col items-center"><span onclick="openRate('score','${g.id}','${g.name}');event.stopPropagation();" class="text-yellow-400 text-lg font-black cursor-pointer">${g.avgScore.toFixed(1)}</span><div onclick="openRate('diff','${g.id}','${g.name}');event.stopPropagation();" class="flex text-[8px] cursor-pointer">${Array(5).fill(0).map((_, idx) => `<span class="${idx < Math.round(g.avgDiff) ? 'text-blue-400' : 'text-gray-700'}">★</span>`).join('')}</div></div></td>
                    <td class="p-4 w-16"><button onclick="openSchedules('${g.id}','${g.name}');event.stopPropagation();" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[9px] font-black hover:bg-green-600 transition">기록</button></td>
                </tr>`).join('');
        };

        window.toggleGameRow = (id) => document.getElementById(`row-${id}`).classList.toggle('expanded');
        window.addGameComment = async (gid) => { const i = document.getElementById(`gc-${gid}`); if(!i.value.trim()) return; await updateDoc(doc(db,"games",gid), { comments: arrayUnion({userPin:currentUser.pin, text:i.value.trim(), time:Date.now()}) }); renderList(); };
        window.deleteGameComment = async (gid, idx) => { if(!confirm("삭제?")) return; const gS = await getDoc(doc(db,"games",gid)); let c = gS.data().comments || []; c.splice(idx,1); await updateDoc(doc(db,"games",gid), {comments:c}); renderList(); };

        // [v5.2.1 순위 클릭 저장 로직]
        window.startRankSelection = async () => {
            const sSnap = await getDoc(doc(db,"schedules",activeScheduleId)); const members = sSnap.data().members || [];
            const uS = await getDocs(collection(db,"users")); const uMap = uS.docs.reduce((acc, d) => ({...acc,[d.id]:d.data().name}), {});
            recordingRanks = []; document.getElementById('rank-order-display').innerText = "1위를 선택하세요";
            document.getElementById('rank-candidate-grid').innerHTML = members.map(m => `<div id="rank-btn-${m}" onclick="pickRankPlayer('${m}','${uMap[m]}')" class="member-chip border border-white/10 p-3 rounded-xl">${uMap[m] || '?'}</div>`).join('');
            toggleModal('rank-management-modal', true);
        };
        window.pickRankPlayer = async (pin, name) => {
            if(recordingRanks.includes(pin)) return;
            recordingRanks.push(pin); document.getElementById(`rank-btn-${pin}`).classList.add('selected');
            const sSnap = await getDoc(doc(db,"schedules",activeScheduleId));
            if(recordingRanks.length === sSnap.data().members.length) { await updateDoc(doc(db,"schedules",activeScheduleId), { ranks: recordingRanks }); toggleModal('rank-management-modal', false); openScheduleDetail(activeScheduleId); }
            else { document.getElementById('rank-order-display').innerText = (recordingRanks.length + 1) + "위를 선택하세요"; }
        };
        window.resetRankSelection = () => startRankSelection();

        // [v5.2.1 머더 미스테리 기록 추가 복구 핵심]
        window.openAddSchedule = async () => {
            selectedMembers = [currentUser.pin]; const uS = await getDocs(collection(db, "users"));
            document.getElementById('member-selector').innerHTML = uS.docs.map(d => `<div onclick="toggleMemberSelect('${d.id}', this)" class="member-chip ${d.id === currentUser.pin ? 'selected' : ''}">${d.data().name}</div>`).join('');
            toggleModal('add-schedule-modal', true);
        };
        window.toggleMemberSelect = (pin, el) => { if(pin===currentUser.pin) return; if(el.classList.toggle('selected')) selectedMembers.push(pin); else selectedMembers = selectedMembers.filter(p=>p!==pin); };
        window.submitSchedule = async () => {
            const name = document.getElementById('new-schedule-name').value.trim(); if(!name) return;
            await addDoc(collection(db,"schedules"), { gameId: activeGameId, gameName: document.getElementById('schedule-game-title').innerText, gameCategory: selectedCategory, name, members: selectedMembers, ranks: [], feed: [], createdAt: serverTimestamp() });
            toggleModal('add-schedule-modal', false); openSchedules(activeGameId, document.getElementById('schedule-game-title').innerText);
        };

        // [v5.2.1 명예전당 로딩 복구]
        window.navToStats = async () => {
            showPage('page-stats'); const vL = document.getElementById('vote-king'); const gL = document.getElementById('game-add-king');
            vL.innerHTML = gL.innerHTML = `<p class="opacity-30 italic font-bold">Loading...</p>`;
            try {
                const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
                const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
                const vC = rSnap.docs.map(d=>d.data()).reduce((acc, r) => { if(r.userPin) acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {});
                vL.innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold'><div class='flex items-center gap-3 font-bold font-bold font-bold font-bold'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold font-bold'><span class='text-xs'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-blue-400 text-xs'>${v[1]}회</b></div>`).join('');
                const gC = gSnap.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
                gL.innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold font-bold font-bold'><div class='flex items-center gap-3 font-bold'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold'><span class='text-xs font-bold'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-green-400 text-xs'>${v[1]}개</b></div>`).join('');
            } catch(e) { vL.innerHTML = "조회 실패"; }
        };

        // [인증 및 공통 기능 안정화 유지]
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", d.pin)); if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home', false); return; } } showPage('page-login', false); });
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.openSchedules = async (id, n, targetSid = null) => { activeGameId = id; document.getElementById('schedule-game-title').innerText = n; toggleModal('schedule-modal', true); const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id))); const schedules = sSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); document.getElementById('schedule-list').innerHTML = schedules.map(s => `<div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold"><div class="text-left font-bold"><div class="text-sm text-green-300 font-bold">${s.name}</div><div class="text-[9px] text-gray-500 uppercase font-bold font-bold">Recorded</div></div><span class="text-blue-400 text-xs">▶</span></div>`).join(''); if(targetSid) setTimeout(() => openScheduleDetail(targetSid), 150); };
        window.openScheduleDetail = async (sid) => { activeScheduleId = sid; const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]); const s = sS.data(); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); document.getElementById('detail-title').innerText = s.name; document.getElementById('detail-date').innerText = s.createdAt ? new Date(s.createdAt.seconds*1000).toLocaleDateString() : ''; document.getElementById('detail-delete-btn').classList.toggle('hidden', !(s.members || []).includes(currentUser.pin)); const podium = document.getElementById('detail-podium'); podium.classList.remove('hidden'); document.getElementById('detail-rank-result').innerHTML = (s.ranks || []).map((p, i) => `<div class="flex justify-between font-bold"><span class="text-xs text-yellow-500 font-black">${i+1}위</span><span class="text-xs font-bold font-bold font-bold font-bold">${uMap[p]?.name || 'Unknown'}</span></div>`).join('') || "<p class='text-[10px] opacity-30'>No rank</p>"; document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map((l, idx) => `<div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center font-bold"><div class="text-xs"><span><b class="text-blue-300">${uMap[l.userPin]?.name || '?'}:</b> ${l.text}</span></div>${l.userPin === currentUser.pin ? `<button onclick="deleteComment(${idx})" class="text-red-500 px-2">✕</button>` : ''}</div>`).join('') || "<p class='opacity-20 text-center py-4 font-bold font-bold font-bold'>No comments.</p>"; toggleModal('detail-modal', true); };
        async function loadMyHistory() { const listDiv = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sSnap = await getDocs(q); listDiv.innerHTML = sSnap.docs.map(d => { const s = d.data(); const rIdx = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1; const catName = s.gameCategory || '보드게임'; return `<div onclick="navToDetailFromHistory('${catName}', '${s.gameId}', '${s.gameName}', '${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 font-bold cursor-pointer hover:bg-white/10 font-bold"><div><span class="category-tag font-bold font-bold">${catName}</span><div class="text-sm font-bold font-bold font-bold">${s.gameName} - ${s.name}</div></div><div class="text-yellow-400 text-xs font-black font-bold font-bold font-bold">${rIdx > -1 ? (rIdx + 1) + '위' : '참여'}</div></div>`; }).join('') || "기록 없음"; }
        window.navToDetailFromHistory = (cat, gid, gname, sid) => { closeAllModals(); selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); setTimeout(() => openSchedules(gid, gname, sid), 450); };
        window.openRate = (t,id,n) => { activeGameId=id; document.getElementById('rate-modal-title').innerText=n; document.getElementById('rate-score-section').classList.toggle('hidden',t!=='score'); document.getElementById('rate-diff-section').classList.toggle('hidden',t!=='diff'); toggleModal('rate-modal',true); };
        window.submitRating = async (t) => { const v = (t==='score') ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-range').value); try { const q = query(collection(db,"ratings"), where("gameId","==",activeGameId), where("userPin","==",currentUser.pin)); const snap = await getDocs(q); const rD = { gameId:activeGameId, userPin:currentUser.pin, updatedAt:serverTimestamp() }; rD[t==='score'?'score':'difficulty']=v; if(!snap.empty) await updateDoc(doc(db,"ratings",snap.docs[0].id), rD); else await addDoc(collection(db,"ratings"), rD); toggleModal('rate-modal', false); renderList(); } catch(e) { alert("실패"); } };
        async function loadChatInfo() { const s = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); document.getElementById('chat-info-list').innerHTML = s.docs.map(d => `<div class='glass p-6 rounded-3xl text-left border border-white/10 shadow-xl font-bold font-bold'><h4 class='text-blue-300 mb-2 font-bold'>${d.data().title}</h4><p class='text-sm opacity-80 whitespace-pre-wrap font-bold'>${d.data().content}</p></div>`).join('') || "정보가 없습니다."; }
        window.submitComment = async () => { const i = document.getElementById('comment-input'); if(!i.value.trim()) return; const sRef = doc(db,"schedules",activeScheduleId); const sS = await getDoc(sRef); const feed = sS.data().feed || []; feed.push({userPin:currentUser.pin, text:i.value.trim(), time:Date.now()}); await updateDoc(sRef,{feed}); i.value=""; openScheduleDetail(activeScheduleId); };
        window.deleteComment = async (idx) => { if(!confirm("삭제?")) return; const sRef = doc(db,"schedules",activeScheduleId); const sS = await getDoc(sRef); let f = sS.data().feed || []; f.splice(f.length-1-idx, 1); await updateDoc(sRef,{feed:f}); openScheduleDetail(activeScheduleId); };
        window.deleteSchedule = async () => { if(!confirm("기록 삭제?")) return; await deleteDoc(doc(db,"schedules",activeScheduleId)); toggleModal('detail-modal',false); openSchedules(activeGameId, document.getElementById('schedule-game-title').innerText); };
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp(), comments: [] }); renderList(); };
    </script>
</body>
</html>
