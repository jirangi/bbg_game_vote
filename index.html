<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v6.0.17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #detail-modal { z-index: 10020; }
        #profile-modal { z-index: 11000 !important; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .btn-priority { position: relative; z-index: 2000 !important; cursor: pointer !important; pointer-events: auto !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 text-center font-bold font-bold">
        <div class="flex justify-between items-center mb-6 px-4 font-bold">
            <div class="flex items-center gap-3 p-2 btn-priority font-bold" onclick="event.stopPropagation(); toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3241/3241724.png'">
                <div class="text-left font-bold font-bold"><span id="user-welcome" class="text-blue-300 text-sm font-black block"></span><span class="text-[9px] text-gray-500 font-bold font-bold">My Profile ></span></div>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg btn-priority font-bold font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 font-bold font-bold">
            <button onclick="showPage('page-stats')" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg btn-priority font-bold font-bold">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg btn-priority font-bold font-bold">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold font-bold font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold font-bold font-bold">
        <div class="px-4 mb-4 flex justify-between items-center font-bold font-bold font-bold font-bold"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase"></h2></div>
        <div class="glass rounded-[40px] overflow-hidden mx-4 shadow-2xl border border-white/5 font-bold font-bold font-bold font-bold">
            <table class="w-full text-center table-fixed border-collapse">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black font-bold font-bold"><th class="p-4 w-12 text-center">#</th><th class="p-4 text-left">정보</th><th class="w-24 text-center">평가</th><th class="w-20">기록</th></tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col text-center font-bold font-bold" onclick="event.stopPropagation()">
            <h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic font-bold">My Profile</h3>
            <div id="profile-content" class="space-y-6 font-bold font-bold font-bold">
                <div class="flex flex-col items-center gap-4 font-bold font-bold">
                    <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover bg-slate-800">
                    <div id="display-name" class="text-xl font-black font-bold font-bold"></div>
                </div>
                <div class="text-left font-bold font-bold">
                    <h4 class="text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1 font-bold font-bold">Attend History</h4>
                    <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar"></div>
                </div>
            </div>
            <button onclick="toggleModal('profile-modal', false)" class="mt-6 text-gray-500 text-xs font-black uppercase font-bold font-bold">닫기</button>
        </div>
    </div>

    <div id="page-stats" class="page pt-24 text-center font-bold"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4"><div class="space-y-4"><h3 class="text-blue-400 font-black italic">🗳️ Voting King</h3><div id="vote-king" class="space-y-3 font-bold font-bold"></div></div><div class="space-y-4"><h3 class="text-green-400 font-black italic">🆕 Creator King</h3><div id="game-add-king" class="space-y-3 font-bold font-bold"></div></div></div></div>
    <div id="page-chat-info" class="page pt-24 text-center font-bold"><h2 class="text-3xl font-black text-blue-400 mb-10 italic uppercase">단톡방 정보 📢</h2><div class="px-4 space-y-6 font-bold font-bold font-bold font-bold"><div class="glass p-8 rounded-[40px] text-left border border-blue-500/20 shadow-2xl"><h3 class="text-blue-300 font-black mb-4">💬 공식 오픈채팅방</h3><p class="text-sm text-gray-400 leading-relaxed mb-6 font-bold font-bold">모임 공지 및 실시간 소통이 이루어지는 공간입니다.</p><a href="#" class="inline-block bg-blue-600 px-8 py-4 rounded-2xl font-black text-sm shadow-lg font-bold font-bold">단톡방 입장하기</a></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';
        let currentUser = null; let selectedCategory = "";

        // [v6.0.17 1.1 마이프로필 로딩 엔진]
        window.toggleProfileModal = async (show) => {
            if (show && currentUser) {
                document.getElementById('display-name').innerText = currentUser.name;
                document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON;
                const listDiv = document.getElementById('my-history-list');
                listDiv.innerHTML = `<p class="opacity-30 italic text-sm text-center py-10 font-bold">불러오는 중...</p>`;
                toggleModal('profile-modal', true);
                try {
                    const snap = await getDocs(query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)));
                    listDiv.innerHTML = snap.docs.map(d => `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 mb-1 font-bold"><div class="text-[9px] text-blue-400 uppercase font-black">${d.data().gameCategory || '🎲'}</div><div class="text-sm font-bold font-bold">${d.data().gameName} - ${d.data().name}</div></div>`).join('') || "기록 없음";
                } catch(e) { listDiv.innerHTML = "조회 실패"; }
            } else toggleModal('profile-modal', false);
        };

        // [v6.0.17 1.4~1.7 게임 목록 렌더링 엔진]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            if(!list) return;
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 text-center font-bold">로딩 중...</td></tr>`;
            try {
                const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const rt = rS.docs.map(d => d.data());
                let gms = gS.docs.map(d => {
                    const r = rt.filter(v => v.gameId === d.id);
                    return { id: d.id, ...d.data(), avgScore: r.length > 0 ? r.map(v=>v.score||0).reduce((a,c)=>a+c,0)/r.length : 0 };
                }).sort((a,b) => b.avgScore - a.avgScore);
                list.innerHTML = gms.map((g, i) => `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold font-bold font-bold font-bold font-bold"><td class="p-4 text-blue-400 font-black text-center w-12 font-bold font-bold font-bold">${i < 3 ? '🥇' : '#'+(i+1)}</td><td class="p-4 text-left font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span class="text-sm font-black font-bold font-bold font-bold font-bold">${g.name}</span></td><td class="p-2 text-center w-24 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span class="text-yellow-400 text-base font-black font-bold font-bold font-bold font-bold">${g.avgScore.toFixed(1)}</span></td><td class="p-4 w-20 text-center font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black font-bold font-bold font-bold font-bold">기록</button></td></tr>`).join('');
            } catch(e) { list.innerHTML = `<tr><td colspan="4" class="p-10 text-red-400 font-bold font-bold">목록 로드 실패</td></tr>`; }
        };

        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };

        // [공통 페이지 제어 및 통계 로딩]
        window.loadStats = async () => {
            const [rS, gS, uS] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
            const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data().name}), {});
            const vC = rS.docs.map(d=>d.data()).reduce((acc, r) => { if(r.userPin) acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {});
            document.getElementById('vote-king').innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-4 glass rounded-2xl flex justify-between items-center font-bold font-bold font-bold'><span>${uMap[v[0]] || '?'}</span><b class='text-blue-400'>${v[1]}회</b></div>`).join('');
            const gC = gS.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
            document.getElementById('game-add-king').innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(g => `<div class='p-4 glass rounded-2xl flex justify-between items-center font-bold font-bold font-bold'><span>${uMap[g[0]] || '?'}</span><b class='text-green-400'>${g[1]}개</b></div>`).join('');
        };

        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const t = document.getElementById(id); if(t) { 
                t.classList.add('active'); 
                document.getElementById('global-back-btn').style.display = (id === 'page-home') ? 'none' : 'block'; 
                if(push) history.pushState({page: id}, '', ''); 
                if(id === 'page-stats') window.loadStats();
            }
        };

        // 기타 기초 함수 (인증, 모달 제어 등 v6.0.16 유지)
        window.handleBack = () => { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); showPage('page-home'); };
        window.toggleModal = (id, s) => { const el = document.getElementById(id); if(el) el.classList.toggle('active', s); };
        window.login = async () => {
            const p = document.getElementById('pin').value.trim(); const w = document.getElementById('pw').value.trim();
            const snap = await getDoc(doc(db, "users", String(p)));
            if (snap.exists() && String(snap.data().password) === String(w)) {
                currentUser = { pin: String(p), ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin: String(p), pw: String(w) }));
                document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON;
                showPage('page-home');
            } else alert("로그인 실패");
        };
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", String(d.pin)));
                if (snap.exists()) { currentUser = { pin: String(d.pin), ...snap.data() }; document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; showPage('page-home', false); return; }
            }
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page-login').classList.add('active');
        });
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
    </script>
</body>
</html>
