<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v4.9.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #detail-modal { z-index: 10005; } 
        #rank-management-modal { z-index: 10010; }
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; cursor: pointer; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; }
        .category-tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 800; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; padding: 8px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; }
        .member-chip.selected { background: #3b82f6; border-color: #60a5fa; color: white; opacity: 0.3; pointer-events: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-home" class="page active pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer p-1 relative z-[100]" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10 shadow-lg">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg transition font-bold">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4 font-bold relative z-[200]">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-black transition shadow-lg pointer-events-auto">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg pointer-events-auto">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold relative z-[50]">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl pointer-events-auto">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl pointer-events-auto">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl pointer-events-auto">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl pointer-events-auto">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-stats" class="page pt-24 font-bold text-center">
        <h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase">명예전당 🏆</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4">
            <div class="space-y-4"><h3 class="text-blue-400 font-black italic">🗳️ Voting King</h3><div id="vote-king" class="space-y-3"></div></div>
            <div class="space-y-4"><h3 class="text-green-400 font-black italic">🆕 Creator King</h3><div id="game-add-king" class="space-y-3"></div></div>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4 flex justify-between items-center font-bold">
            <h2 id="rank-title" class="text-3xl font-black italic text-blue-400 uppercase"></h2>
            <select id="sort-selector" class="bg-slate-800 text-[10px] p-2 rounded-lg border border-white/10" onchange="renderList()">
                <option value="default">기본(투표순)</option>
                <option value="score_desc">점수 높은순</option>
                <option value="diff_desc">난이도 높은순</option>
            </select>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 font-bold">
            <table class="w-full text-center min-w-[500px]">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 uppercase font-black font-bold">
                    <th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="w-32">평가</th><th>기록</th>
                </tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
        <div class="px-4 mt-6 text-center font-bold"><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-8 py-3 rounded-2xl text-xs font-bold font-bold">+ 새 게임 추가</button></div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <div class="flex flex-col font-bold">
                    <h3 id="detail-title" class="text-xl font-black text-blue-400 truncate font-bold"></h3>
                    <span id="detail-date" class="text-[10px] text-gray-500 font-bold"></span>
                </div>
                <div class="flex gap-3">
                    <button id="detail-delete-btn" class="text-red-500 text-xs font-bold hidden" onclick="deleteSchedule()">삭제</button>
                    <button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button>
                </div>
            </div>
            <div id="detail-podium" class="bg-yellow-400/10 border border-yellow-500/20 p-5 rounded-3xl mb-6 hidden">
                <div class="text-yellow-400 text-[10px] mb-3 font-black uppercase font-bold">🥇 Official Ranking</div>
                <div id="detail-rank-result" class="text-sm space-y-1 font-bold text-white/90"></div>
                <button onclick="startRankSelection()" class="w-full mt-4 bg-yellow-500/20 text-yellow-400 py-2 rounded-xl text-[10px] font-black font-bold">🏆 순위 기록 (클릭 방식)</button>
            </div>
            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold font-bold"></div>
            <div class="mt-6 flex gap-2 font-bold">
                <input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold" placeholder="코멘트 남기기">
                <button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs font-bold">등록</button>
            </div>
        </div>
    </div>

    <div id="rank-management-modal" class="modal" onclick="toggleModal('rank-management-modal', false)">
        <div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-xl font-black mb-2 text-yellow-400 text-center">순위 기록</h3>
            <p class="text-[10px] text-gray-500 mb-6 text-center font-bold">1위부터 순서대로 참석자를 눌러주세요.</p>
            <div id="rank-order-display" class="mb-4 p-3 bg-black/30 rounded-xl min-h-[40px] text-xs text-blue-400 font-bold"></div>
            <div id="rank-candidate-grid" class="grid grid-cols-2 gap-2 font-bold"></div>
            <button onclick="resetRankSelection()" class="mt-6 text-[10px] text-gray-500 underline font-bold">다시 선택</button>
        </div>
    </div>

    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold font-bold"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate font-bold font-bold font-bold"></h3><button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold font-bold font-bold">✕</button></div><div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold font-bold"></div><button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white font-bold font-bold font-bold">+ 새로운 기록 추가</button></div></div>
    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold text-center font-bold font-bold" onclick="event.stopPropagation()"><h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic font-bold font-bold font-bold">My Profile</h3><div class="flex flex-col items-center gap-6 mb-8 border-b border-white/10 pb-8 font-bold font-bold"><img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover bg-slate-800 font-bold"><input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none font-black text-center font-bold font-bold" placeholder="닉네임"></div><h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-4 font-bold font-bold">참석 히스토리</h4><div id="my-history-list" class="flex-grow overflow-y-auto max-h-[250px] space-y-3 custom-scrollbar font-bold font-bold font-bold"></div></div></div>
    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-6 text-green-400 font-bold font-bold">기록 정보 입력</h3><input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold font-bold font-bold" placeholder="기록 제목"><div id="member-selector" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto p-2 bg-white/5 rounded-2xl font-bold font-bold"></div><button onclick="submitSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white font-bold font-bold font-bold">기록 생성</button></div></div>
    <div id="rate-modal" class="modal" onclick="toggleModal('rate-modal', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold font-bold font-bold" onclick="event.stopPropagation()"><h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 text-center font-bold font-bold"></h3><div id="rate-score-section" class="space-y-4 font-bold font-bold font-bold"><label class="text-[10px] text-gray-500 block text-center font-bold font-bold">재미 점수 (0 ~ 100)</label><input type="number" id="rate-score-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center text-2xl font-bold font-bold" placeholder="0"><button onclick="submitRating('score')" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black font-bold font-bold font-bold">저장</button></div><div id="rate-diff-section" class="space-y-4 hidden font-bold font-bold font-bold"><label class="text-[10px] text-gray-500 block text-center font-bold font-bold font-bold">난이도 (1 ~ 5)</label><input type="range" id="rate-diff-range" min="1" max="5" step="1" class="w-full accent-blue-500 font-bold font-bold" oninput="document.getElementById('diff-val').innerText = this.value"><div id="diff-val" class="text-center text-3xl font-black text-blue-400 font-bold font-bold font-bold">3</div><button onclick="submitRating('diff')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white font-bold font-bold font-bold">저장</button></div></div></div>
    <div id="page-chat-info" class="page pt-24 font-bold px-4 font-bold"><div id="chat-info-list" class="space-y-4 font-bold font-bold"></div></div>
    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center font-bold"><div class="glass p-8 rounded-3xl font-bold"><h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase italic font-bold">Login</h2><div class="space-y-4 font-bold font-bold"><input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold font-bold"><input type="password" id="pw" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold font-bold"><button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 font-bold font-bold">접속</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, orderBy, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeScheduleId = null; let selectedMembers = []; let recordingRanks = [];

        // [v4.9.4 내비게이션 복구]
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.onpopstate = () => { if(document.querySelector('.modal.active')) { closeAllModals(); history.pushState({page: 'page-home'}, '', ''); return; } showPage('page-home', false); };
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(id); if(target) { target.classList.add('active'); document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block'; if(push) history.pushState({page: id}, '', ''); if(id === 'page-stats') navToStats(); if(id === 'page-chat-info') loadChatInfo(); }
        };

        // [v4.9.4 명예의 전당 복구 핵심]
        window.navToStats = async () => {
            showPage('page-stats');
            const vL = document.getElementById('vote-king'); const gL = document.getElementById('game-add-king');
            vL.innerHTML = gL.innerHTML = `<p class="opacity-30 italic font-bold">데이터 로딩 중...</p>`;
            try {
                const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
                const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
                const vC = rSnap.docs.map(d=>d.data()).reduce((acc, r) => { if(r.userPin) acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {});
                vL.innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold'><div class='flex items-center gap-3 font-bold'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold'><span class='text-xs'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-blue-400 text-xs font-bold'>${v[1]}회</b></div>`).join('') || "데이터 없음";
                const gC = gSnap.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
                gL.innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold'><div class='flex items-center gap-3 font-bold'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 font-bold'><span class='text-xs'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-green-400 text-xs font-bold'>${v[1]}개</b></div>`).join('') || "데이터 없음";
            } catch(e) { vL.innerHTML = "조회 실패"; }
        };

        // [v4.9.4 순위 선택 및 object Object 해결 핵심]
        window.startRankSelection = async () => {
            const sSnap = await getDoc(doc(db, "schedules", activeScheduleId));
            const members = sSnap.data().members || [];
            const uSnap = await getDocs(collection(db, "users"));
            const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data().name}), {});
            recordingRanks = [];
            document.getElementById('rank-order-display').innerText = "1위를 선택하세요";
            document.getElementById('rank-candidate-grid').innerHTML = members.map(m => `
                <div id="rank-btn-${m}" onclick="pickRankPlayer('${m}', '${uMap[m]}')" class="member-chip border border-white/10 p-3 rounded-xl font-bold font-bold">
                    ${uMap[m] || 'Unknown'}
                </div>`).join('');
            toggleModal('rank-management-modal', true);
        };

        window.pickRankPlayer = async (pin, name) => {
            if(recordingRanks.includes(pin)) return;
            recordingRanks.push(pin); 
            document.getElementById(`rank-btn-${pin}`).classList.add('selected');
            document.getElementById('rank-order-display').innerText = recordingRanks.map((p, i) => `${i+1}위`).join(', ') + " " + (recordingRanks.length + 1) + "위를 선택하세요";
            const sSnap = await getDoc(doc(db, "schedules", activeScheduleId));
            if(recordingRanks.length === sSnap.data().members.length) {
                await updateDoc(doc(db, "schedules", activeScheduleId), { ranks: recordingRanks });
                toggleModal('rank-management-modal', false);
                openScheduleDetail(activeScheduleId);
            }
        };

        window.resetRankSelection = () => startRankSelection();

        // [v4.9.4 기록 및 상세 상세 로직]
        window.openSchedules = async (id, n, targetSid = null) => {
            activeGameId = id; document.getElementById('schedule-game-title').innerText = n; toggleModal('schedule-modal', true);
            const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id)));
            const schedules = sSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
            document.getElementById('schedule-list').innerHTML = schedules.map(s => `<div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold font-bold"><div class="text-left font-bold font-bold"><div class="text-sm text-green-300 font-bold font-bold">${s.name}</div><div class="text-[9px] text-gray-500 font-bold uppercase">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs font-bold">▶</span></div>`).join('');
            if(targetSid) setTimeout(() => openScheduleDetail(targetSid), 150);
        };

        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid; const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]);
            const s = sS.data(); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            document.getElementById('detail-title').innerText = s.name;
            document.getElementById('detail-date').innerText = s.createdAt ? new Date(s.createdAt.seconds*1000).toLocaleDateString() : '';
            document.getElementById('detail-delete-btn').classList.toggle('hidden', !(s.members || []).includes(currentUser.pin));
            const podium = document.getElementById('detail-podium'); podium.classList.remove('hidden');
            // ID를 이름으로 치환하여 출력
            document.getElementById('detail-rank-result').innerHTML = (s.ranks || []).map((p, i) => `
                <div class="flex justify-between font-bold font-bold"><span class="text-xs text-yellow-500 font-black">${i+1}위</span><span class="text-xs font-bold font-bold">${uMap[p]?.name || 'Unknown'}</span></div>`).join('') || "<p class='text-[10px] opacity-30 font-bold'>No data.</p>";
            document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map((l, idx) => `<div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center font-bold font-bold"><div class="text-xs font-bold font-bold"><span class="text-blue-300 font-black">${uMap[l.userPin]?.name || '?'}:</span> ${l.text}</div>${l.userPin === currentUser.pin ? `<button onclick="deleteComment(${idx})" class="text-red-500 px-2 font-bold">✕</button>` : ''}</div>`).join('') || "<p class='opacity-20 text-center py-4 font-bold font-bold'>No comments.</p>";
            toggleModal('detail-modal', true);
        };

        // [인증 및 공통 기능 유지]
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", d.pin)); if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home', false); return; } } showPage('page-login', false); });
        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; document.getElementById('sort-selector').value = 'default'; renderList(); showPage('page-rank'); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) toggleModal(id, false); };
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 font-bold italic font-bold">Loading...</td></tr>`;
            const sortType = document.getElementById('sort-selector').value;
            const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
            const rt = rS.docs.map(d => d.data());
            let gms = gS.docs.map(d => {
                const r = rt.filter(v => v.gameId === d.id); const sc = r.map(v => v.score || 0).sort((a,b)=>a-b);
                let avgS = (r.length >= 5) ? sc.slice(1, -1).reduce((a,c)=>a+c,0)/(sc.length-2) : (r.length > 0 ? sc.reduce((a,c)=>a+c,0)/r.length : 0);
                const df = r.map(v => v.difficulty || 0).filter(v => v > 0);
                return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: df.length > 0 ? df.reduce((a,c)=>a+c,0)/df.length : 0, voteCount: r.length };
            });
            gms.sort((a, b) => { const a3 = a.voteCount >= 3; const b3 = b.voteCount >= 3; if(a3 !== b3) return b3 - a3; return sortType === "score_desc" ? b.avgScore - a.avgScore : b.avgScore - a.avgScore; });
            list.innerHTML = gms.map((g, i) => `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold font-bold font-bold font-bold">
                    <td class="p-5 text-blue-400 font-bold font-bold font-bold font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                    <td class="p-5 text-left font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="text-sm font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${g.name}</div><div class="text-[9px] opacity-40 font-bold font-bold font-bold font-bold font-bold">Votes: ${g.voteCount}</div></td>
                    <td class="p-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div class="flex flex-col items-center gap-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><span onclick="openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-lg cursor-pointer font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${g.avgScore.toFixed(1)}</span><div onclick="openRate('diff','${g.id}','${g.name}')" class="flex text-[10px] cursor-pointer font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${Array(5).fill(0).map((_, idx) => `<span class="${idx < Math.round(g.avgDiff) ? 'text-blue-400' : 'text-gray-700'} font-bold font-bold font-bold font-bold font-bold font-bold font-bold">★</span>`).join('')}</div></div></td>
                    <td class="p-5 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-green-600 transition font-bold font-bold font-bold font-bold font-bold">기록</button></td>
                </tr>`).join('');
        };
        window.openRate = (t, id, n) => { activeGameId = id; document.getElementById('rate-modal-title').innerText = n; document.getElementById('rate-score-section').classList.toggle('hidden', t !== 'score'); document.getElementById('rate-diff-section').classList.toggle('hidden', t !== 'diff'); toggleModal('rate-modal', true); };
        window.submitRating = async (t) => { const v = (t === 'score') ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-range').value); try { const q = query(collection(db, "ratings"), where("gameId", "==", activeGameId), where("userPin", "==", currentUser.pin)); const snap = await getDocs(q); const rD = { gameId: activeGameId, userPin: currentUser.pin, updatedAt: serverTimestamp() }; rD[t === 'score' ? 'score' : 'difficulty'] = v; if(!snap.empty) await updateDoc(doc(db, "ratings", snap.docs[0].id), rD); else await addDoc(collection(db, "ratings"), rD); alert("성공!"); toggleModal('rate-modal', false); renderList(); } catch(e) { alert("실패"); } };
        async function loadChatInfo() { const s = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); document.getElementById('chat-info-list').innerHTML = s.docs.map(d => `<div class='glass p-6 rounded-3xl text-left border border-white/10 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold'><h4 class='text-blue-300 mb-2 font-bold'>${d.data().title}</h4><p class='text-sm opacity-80 whitespace-pre-wrap font-bold'>${d.data().content}</p></div>`).join('') || "No info."; }
        async function loadMyHistory() { const listDiv = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sSnap = await getDocs(q); listDiv.innerHTML = sSnap.docs.map(d => { const s = d.data(); const rIdx = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1; const catName = s.gameCategory || '보드게임'; return `<div onclick="navToDetailFromHistory('${catName}', '${s.gameId}', '${s.gameName}', '${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 font-bold cursor-pointer hover:bg-white/10 font-bold font-bold font-bold font-bold font-bold"><div><span class="category-tag font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${catName}</span><div class="text-sm font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${s.gameName} - ${s.name}</div></div><div class="text-yellow-400 text-xs font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${rIdx > -1 ? (rIdx + 1) + '위' : '참여'}</div></div>`; }).join('') || "No Records"; }
        window.submitComment = async () => { const i = document.getElementById('comment-input'); if(!i.value.trim()) return; const sRef = doc(db,"schedules",activeScheduleId); const sS = await getDoc(sRef); const feed = sS.data().feed || []; feed.push({userPin:currentUser.pin, text:i.value.trim(), time:Date.now()}); await updateDoc(sRef,{feed}); i.value=""; openScheduleDetail(activeScheduleId); };
        window.deleteComment = async (idx) => { if(!confirm("삭제?")) return; const sRef = doc(db,"schedules",activeScheduleId); const sS = await getDoc(sRef); let f = sS.data().feed || []; f.splice(f.length-1-idx, 1); await updateDoc(sRef,{feed:f}); openScheduleDetail(activeScheduleId); };
        window.deleteSchedule = async () => { if(!confirm("삭제?")) return; await deleteDoc(doc(db,"schedules",activeScheduleId)); toggleModal('detail-modal',false); openSchedules(activeGameId, document.getElementById('schedule-game-title').innerText); };
        window.openAddSchedule = async () => { selectedMembers = [currentUser.pin]; const uS = await getDocs(collection(db,"users")); document.getElementById('member-selector').innerHTML = uS.docs.map(d => `<div onclick="toggleMemberSelect('${d.id}', this)" class="member-chip font-bold font-bold font-bold font-bold font-bold font-bold ${d.id === currentUser.pin ? 'selected' : ''}">${d.data().name}</div>`).join(''); toggleModal('add-schedule-modal', true); };
        window.toggleMemberSelect = (pin, el) => { if(pin===currentUser.pin) return; if(selectedMembers.includes(pin)) { selectedMembers = selectedMembers.filter(p=>p!==pin); el.classList.remove('selected'); } else { selectedMembers.push(pin); el.classList.add('selected'); } };
        window.submitSchedule = async () => { const name = document.getElementById('new-schedule-name').value.trim(); if(!name) return; await addDoc(collection(db,"schedules"), {gameId:activeGameId, gameName:document.getElementById('schedule-game-title').innerText, gameCategory:selectedCategory, name, members:selectedMembers, ranks:[], feed:[], createdAt:serverTimestamp()}); toggleModal('add-schedule-modal',false); openSchedules(activeGameId, document.getElementById('schedule-game-title').innerText); };
        window.addGame = async () => { const n = prompt("이름:"); if(!n) return; await addDoc(collection(db, "games"), { name: n, category: selectedCategory, creatorPin: currentUser.pin, createdAt: serverTimestamp() }); renderList(); };
    </script>
</body>
</html>
