<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v3.8.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        .sticky-back { position: fixed; top: 20px; left: 20px; z-index: 5000; background: rgba(30, 41, 59, 0.9); padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; cursor: pointer; pointer-events: auto; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .difficulty-star { cursor: pointer; color: #64748b; transition: color 0.2s; }
        .difficulty-star.active { color: #fbbf24; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-black shadow-xl">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase italic">Login</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer p-1 hover:bg-white/5 rounded-xl transition" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10 shadow-lg">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg transition">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold shadow-lg">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-12 font-bold">
        <div class="flex justify-between items-end mb-8 px-4">
            <h2 id="rank-title" class="text-4xl font-black italic text-blue-400"></h2>
            <button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg">+ 새 게임</button>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 relative">
            <table class="w-full text-center min-w-[600px] font-bold">
                <thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 uppercase font-bold">
                    <th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="w-32">평가</th><th>기록</th>
                </tr></thead>
                <tbody id="rank-list" class="divide-y divide-white/5 font-bold"></tbody>
            </table>
        </div>
    </div>

    <div id="rate-modal" class="modal" onclick="closeOnBackdrop(event, 'rate-modal')">
        <div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 truncate text-center"></h3>
            <div id="rate-container-score" class="space-y-4">
                <label class="text-[10px] text-gray-500 block text-center font-bold">재미 점수 (0 ~ 100)</label>
                <input type="number" id="rate-score-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center text-2xl" placeholder="점수 입력">
                <button onclick="submitRating('score')" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black shadow-xl">점수 저장</button>
            </div>
            <div id="rate-container-diff" class="space-y-4 hidden">
                <label class="text-[10px] text-gray-500 block text-center font-bold">체감 난이도 (낮음 1 ~ 높음 10)</label>
                <div class="flex justify-center gap-2 py-4">
                    <input type="range" id="rate-diff-input" min="1" max="10" step="1" class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>
                <div id="diff-value-display" class="text-center text-3xl font-black text-blue-400 mb-4">5</div>
                <button onclick="submitRating('diff')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white shadow-xl">난이도 저장</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate pr-2 font-bold"></h3><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div><div id="detail-podium" class="bg-yellow-400/10 border border-yellow-500/20 p-5 rounded-3xl mb-6 hidden"><div id="detail-rank-result" class="text-sm space-y-1 font-bold"></div></div><div class="flex gap-2 mb-8"><button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 py-4 rounded-2xl text-xs text-blue-300 font-bold">🥇 순위</button><button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 py-4 rounded-2xl text-xs text-green-300 font-bold">💬 코멘트</button></div><div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold"></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeGameName = "";
        let tempMembers = []; let currentScheduleId = null;

        // [v3.8.2 제어 엔진 - 내비게이션 복구]
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.goHome = () => showPage('page-home');
        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(history.state?.page !== id) history.pushState({page: id}, '', '');
        };

        // [v3.8.2 렌더링 엔진 - 평가 인터페이스 개선]
        window.renderList = async () => {
            const list = document.getElementById('rank-list');
            list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 italic font-bold">Loading...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
                const allRatings = rSnap.docs.map(d => d.data());
                
                let games = gSnap.docs.map(d => {
                    const r = allRatings.filter(v => v.gameId === d.id);
                    const scores = r.map(v => v.score || 0).sort((a, b) => a - b);
                    let avgS = r.length >= 5 ? scores.slice(1, -1).reduce((a, c) => a + c, 0) / (scores.length - 2) : (r.length > 0 ? scores.reduce((a, c) => a + c, 0) / r.length : 0);
                    const diffs = r.map(v => v.difficulty || 0).filter(v => v > 0);
                    let avgD = diffs.length > 0 ? diffs.reduce((a,c)=>a+c,0)/diffs.length : 0;
                    return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: avgD, voteCount: r.length };
                }).sort((a, b) => b.avgScore - a.avgScore);

                list.innerHTML = games.map((g, i) => {
                    const stars = Math.round(g.avgDiff);
                    return `
                    <tr class="hover:bg-white/5 border-b border-white/5 font-bold transition">
                        <td class="p-5 text-blue-400 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                        <td class="p-5 text-left"><div class="text-sm font-black">${g.name}</div><div class="text-[9px] text-gray-500">Votes: ${g.voteCount}</div></td>
                        <td class="p-2">
                            <div class="flex flex-col items-center gap-1">
                                <span onclick="openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-lg cursor-pointer hover:scale-110 transition font-black">${g.avgScore.toFixed(1)}</span>
                                <div onclick="openRate('diff','${g.id}','${g.name}')" class="flex text-[10px] cursor-pointer hover:opacity-70 transition">
                                    ${Array(10).fill(0).map((_, idx) => `<span class="${idx < stars ? 'text-blue-400' : 'text-gray-700'}">★</span>`).join('')}
                                </div>
                            </div>
                        </td>
                        <td class="p-5"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/20 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-green-600 transition">기록</button></td>
                    </tr>`;
                }).join('');
            } catch (e) { list.innerHTML = "Error"; }
        };

        // [v3.8.2 평가 로직]
        window.openRate = (type, id, name) => {
            activeGameId = id;
            document.getElementById('rate-modal-title').innerText = name;
            document.getElementById('rate-container-score').classList.toggle('hidden', type !== 'score');
            document.getElementById('rate-container-diff').classList.toggle('hidden', type !== 'diff');
            toggleModal('rate-modal', true);
        };

        document.getElementById('rate-diff-input').oninput = function() { document.getElementById('diff-value-display').innerText = this.value; };

        window.submitRating = async (type) => {
            const val = type === 'score' ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-input').value);
            if(type === 'score' && (isNaN(val) || val < 0 || val > 100)) return alert("0~100 사이 점수를 입력하세요.");
            try {
                const q = query(collection(db, "ratings"), where("gameId", "==", activeGameId), where("userPin", "==", currentUser.pin));
                const snap = await getDocs(q);
                const rData = { gameId: activeGameId, userPin: currentUser.pin, updatedAt: serverTimestamp() };
                rData[type === 'score' ? 'score' : 'difficulty'] = val;
                
                if(!snap.empty) await updateDoc(doc(db, "ratings", snap.docs[0].id), rData);
                else await addDoc(collection(db, "ratings"), rData);
                
                alert("평가 완료!"); toggleModal('rate-modal', false); renderList();
            } catch(e) { alert("저장 실패"); }
        };

        // [인증 및 공통 기능]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const d = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", d.pin));
                if (snap.exists() && snap.data().password === d.pw) { currentUser = { pin: d.pin, ...snap.data() }; updateUI(); showPage('page-home'); return; }
            }
            showPage('page-login');
        });

        window.login = async () => {
            const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value;
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); }
        };

        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin==="100") document.getElementById('admin-user-manage-btn')?.classList.remove('hidden'); }
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        window.toggleProfileModal = (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        
        // [일정/기록 로직]
        window.openSchedules = async (id, n) => { activeGameId = id; activeGameName = n; document.getElementById('schedule-game-title').innerText = n; const uS = await getDocs(collection(db, "users")); document.getElementById('member-select-grid').innerHTML = uS.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[9px] border border-white/10 font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        async function loadSchedules() { const l = document.getElementById('schedule-list'); const sS = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); l.innerHTML = sS.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => `<div onclick="openScheduleDetail('${s.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-2 shadow-lg cursor-pointer hover:bg-white/10"><div class="text-left font-bold"><div class="text-sm text-green-300">${s.name}</div><div class="text-[9px] text-gray-500">${s.ranks?.length > 0 ? 'Recorded' : 'Waiting'}</div></div><span class="text-blue-400 text-xs">▶</span></div>`).join('') || "No records."; }
        window.openScheduleDetail = async (id) => { currentScheduleId = id; const [sS, uS] = await Promise.all([getDoc(doc(db, "schedules", id)), getDocs(collection(db, "users"))]); const s = sS.data(); const uM = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); document.getElementById('detail-title').innerText = s.name; const p = document.getElementById('detail-podium'); if(s.ranks?.length > 0) { p.classList.remove('hidden'); document.getElementById('detail-rank-result').innerHTML = s.ranks.map((p, i) => `<div class='text-xs'>${i+1}위 <b>${uM[p]?.name}</b></div>`).join(''); } else p.classList.add('hidden'); document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map(l => `<div class="bg-white/5 p-4 rounded-2xl flex gap-3 font-bold border border-white/5"><img src="${uM[l.userPin]?.iconUrl || DEFAULT_ICON}" class="user-icon w-8 h-8"><div class="flex-grow"><div class="flex justify-between items-center text-[10px] text-gray-500 mb-1"><span>${uM[l.userPin]?.name}</span>${l.userPin === currentUser.pin ? `<button onclick='deleteComment(${JSON.stringify(l)})' class='text-red-500'>🗑️</button>`:''}</div><div class="text-sm text-white/90">${l.text}</div></div></div>`).join(''); toggleModal('detail-modal', true); };

        window.toggleSelectMember = (p) => { const i = tempMembers.indexOf(p); const b = document.getElementById(`sel-${p}`); if(i>-1){ tempMembers.splice(i,1); b.classList.remove('selected'); } else { tempMembers.push(p); b.classList.add('selected'); } };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("제목/인원 입력!"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameName, gameCategory: selectedCategory, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; tempMembers = []; loadSchedules(); };
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) toggleModal(id, false); };
        async function loadMyHistory() { const l = document.getElementById('my-history-list'); const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); const sS = await getDocs(q); l.innerHTML = sS.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(s => { const r = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1; return `<div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-1 border border-white/5 font-black"><div><div class="flex items-center gap-2 mb-1"><span class="category-tag">${s.gameCategory||'보드게임'}</span><span class="text-[9px] text-blue-500 font-bold">${s.gameName||'Game'}</span></div><div class="text-sm font-bold">${s.name}</div></div><div class="text-xs font-bold text-yellow-400">${r>-1 ? (r+1)+'위' : '기록전'}</div></div>`; }).join('') || "No Records"; }
    </script>
</body>
</html>
