<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ranking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .category-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .category-card:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.1); border-color: #3b82f6; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="fixed top-0 left-0 w-full bg-blue-600/20 backdrop-blur-md border-b border-white/10 p-2 text-center text-sm font-semibold text-blue-300 z-50">
        💡 모든 사용자의 기본 비밀번호는 <span class="text-white underline">1234</span>입니다.
    </div>

    <div id="page-home" class="page active w-full max-w-4xl text-center pt-10">
        <div class="flex justify-between items-center mb-4 max-w-md mx-auto">
            <span id="user-welcome" class="text-blue-400 text-sm font-bold"></span>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs underline">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tight uppercase tracking-widest">Game Archive</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-bold text-xl">🕵️ 머더 미스테리</button>
        </div>
        <button onclick="togglePinModal(true)" class="mt-12 text-gray-400 hover:text-white text-sm underline">내 PIN 번호 확인하기</button>
    </div>

    <div id="page-login" class="page w-full max-w-sm text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6">인증이 필요합니다</h2>
            <div class="space-y-4 text-left">
                <input type="text" id="pin" placeholder="PIN 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-blue-500">
                <input type="password" id="pw" placeholder="PW 입력" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-blue-500">
                <button onclick="login()" class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500 shadow-lg shadow-blue-500/20 transition-all mt-2">로그인</button>
            </div>
            <button onclick="togglePinModal(true)" class="mt-6 text-xs text-blue-400 hover:underline">내 PIN 번호를 모르겠어요</button>
        </div>
    </div>

    <div id="page-rank" class="page w-full max-w-3xl">
        <div class="flex justify-between items-end mb-8">
            <div><button onclick="history.back()" class="text-blue-400 text-sm hover:underline mb-2">← 뒤로가기</button><h2 id="rank-title" class="text-3xl font-bold">카테고리</h2></div>
            <button onclick="addGame()" class="bg-white/10 px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/20 transition">+ 새 항목 추가</button>
        </div>
        <div class="glass rounded-3xl overflow-hidden"><table class="w-full text-left border-collapse"><thead class="bg-white/5 text-gray-400 text-xs uppercase tracking-wider"><tr><th class="p-5">순위</th><th class="p-5">게임 이름</th><th class="p-5">평점</th><th class="p-5 text-center">상태</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div>
    </div>

    <div id="comment-modal" class="modal">
        <div class="glass w-full max-w-md p-6 rounded-3xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="comment-game-title" class="text-xl font-extrabold text-blue-400">댓글</h3>
                <button onclick="toggleCommentModal(false)" class="text-gray-400 hover:text-white text-2xl">✕</button>
            </div>
            <div id="comment-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-4 pr-2"></div>
            <div class="flex gap-2">
                <input type="text" id="comment-input" placeholder="댓글을 입력하세요..." class="flex-grow bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-blue-500">
                <button onclick="addComment()" class="bg-blue-600 px-4 rounded-xl font-bold hover:bg-blue-500">등록</button>
            </div>
        </div>
    </div>

    <div id="pin-modal" class="modal">
        <div class="glass w-full max-w-md p-6 rounded-3xl max-h-[80vh] flex flex-col"><div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold ml-2">PIN 번호 찾기</h3><button onclick="togglePinModal(false)" class="text-gray-400 hover:text-white text-2xl">✕</button></div><div id="pin-list-content" class="overflow-y-auto pr-2 custom-scrollbar"></div><button onclick="togglePinModal(false)" class="mt-6 w-full bg-white/10 py-3 rounded-xl font-bold hover:bg-white/20">닫기</button></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, deleteDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE",
        authDomain: "game-archive-afacf.firebaseapp.com",
        projectId: "game-archive-afacf",
        storageBucket: "game-archive-afacf.firebasestorage.app",
        messagingSenderId: "927042381268",
        appId: "1:927042381268:web:e41f4106cf9202e45ca241"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let selectedCategory = "";
    let activeGameId = null;

    // [기능] 브라우저 뒤로가기 제어
    window.onpopstate = function(event) {
        if (!event.state) showPage('page-home');
        else showPage(event.state.page);
    };

    window.showPage = function(pageId) {
        document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
        const target = document.getElementById(pageId);
        target.style.display = 'block';
        setTimeout(() => target.classList.add('active'), 50);
        
        // 히스토리 상태 저장 (뒤로가기용)
        if (history.state?.page !== pageId) {
            history.pushState({ page: pageId }, '', '');
        }
    };

    window.addEventListener('DOMContentLoaded', async () => {
        const savedAuth = localStorage.getItem('game_archive_auth');
        if (savedAuth) {
            const authData = JSON.parse(savedAuth);
            try {
                const snap = await getDoc(doc(db, "users", authData.pin));
                if (snap.exists() && snap.data().password === authData.pw) {
                    currentUser = { pin: authData.pin, name: snap.data().name };
                    document.getElementById('user-welcome').innerText = `${currentUser.name}님 환영합니다!`;
                    showPage('page-home');
                    return;
                }
            } catch(e) {}
        }
        showPage('page-login');
    });

    window.login = async function() {
        const pin = document.getElementById('pin').value;
        const pw = document.getElementById('pw').value;
        try {
            const snap = await getDoc(doc(db, "users", pin));
            if (snap.exists() && snap.data().password === pw) {
                currentUser = { pin, name: snap.data().name };
                localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw }));
                window.location.reload();
            } else alert("인증 정보가 틀립니다.");
        } catch(e) { alert("로그인 오류"); }
    };

    window.logout = () => { localStorage.removeItem('game_archive_auth'); window.location.reload(); };

    window.navTo = function(cat) {
        selectedCategory = cat;
        document.getElementById('rank-title').innerText = cat;
        if (currentUser) {
            renderList();
            showPage('page-rank');
        } else showPage('page-login');
    };

    // [기능] 랭킹 리스트 출력
    window.renderList = async function() {
        const list = document.getElementById('rank-list');
        list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-50">로딩 중...</td></tr>`;
        try {
            const gSnap = await getDocs(query(collection(db, "games"), where("category", "==", selectedCategory)));
            const rSnap = await getDocs(collection(db, "ratings"));
            const ratings = rSnap.docs.map(d => d.data());
            
            let games = [];
            gSnap.forEach(d => {
                const tr = ratings.filter(r => r.gameId === d.id);
                const avg = tr.length > 0 ? tr.reduce((a, c) => a + c.score, 0) / tr.length : 0;
                games.push({ id: d.id, name: d.data().name, avg, count: tr.length, my: tr.find(r => r.userPin === currentUser.pin) });
            });
            games.sort((a, b) => b.avg - a.avg);

            list.innerHTML = games.map((g, i) => `
                <tr class="hover:bg-white/5 border-b border-white/5 transition">
                    <td class="p-5 font-mono text-blue-400">#${i+1}</td>
                    <td class="p-5">
                        <div onclick="openComments('${g.id}', '${g.name}')" class="font-bold text-lg cursor-pointer hover:text-blue-400 transition underline decoration-blue-500/30 underline-offset-4">
                            ${g.name} <span class="text-[10px] font-normal opacity-40">(${g.count}명 참여)</span>
                        </div>
                        ${currentUser.pin === "100" ? `<button onclick="delGame('${g.id}','${g.name}')" class="text-red-500 text-[10px] mt-1 hover:underline">[삭제]</button>` : ''}
                    </td>
                    <td class="p-5 text-yellow-400 font-semibold">${g.avg.toFixed(1)}점</td>
                    <td class="p-5 text-center">
                        <button onclick="inputScore('${g.id}','${g.name}')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${g.my ? 'bg-white/10 text-gray-400' : 'bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600 hover:text-white'}">
                        ${g.my ? `내 점수: ${g.my.score}` : '점수 입력'}</button>
                    </td>
                </tr>`).join('');
        } catch(e) { console.error(e); }
    };

    // [댓글] 팝업 열기
    window.openComments = async function(gameId, title) {
        activeGameId = gameId;
        document.getElementById('comment-game-title').innerText = title;
        toggleCommentModal(true);
        loadComments();
    };

    async function loadComments() {
        const list = document.getElementById('comment-list');
        list.innerHTML = `<div class="p-5 text-center text-xs opacity-50">댓글 로딩 중...</div>`;
        const q = query(collection(db, "comments"), where("gameId", "==", activeGameId), orderBy("createdAt", "asc"));
        const snap = await getDocs(q);
        
        if (snap.empty) {
            list.innerHTML = `<div class="p-5 text-center text-xs opacity-30 italic">첫 댓글을 남겨보세요!</div>`;
            return;
        }

        list.innerHTML = snap.docs.map(d => {
            const data = d.data();
            const isMe = data.userPin === currentUser.pin;
            return `
                <div class="p-3 rounded-2xl ${isMe ? 'bg-blue-600/20 ml-8 border border-blue-500/20' : 'bg-white/5 mr-8 border border-white/5'}">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold ${isMe ? 'text-blue-300' : 'text-gray-400'}">${data.userName}</span>
                        ${isMe ? `<button onclick="delComment('${d.id}')" class="text-[9px] text-red-500 opacity-50 hover:opacity-100">삭제</button>` : ''}
                    </div>
                    <p class="text-sm leading-relaxed">${data.text}</p>
                </div>
            `;
        }).join('');
        list.scrollTop = list.scrollHeight;
    }

    window.addComment = async function() {
        const input = document.getElementById('comment-input');
        if (!input.value.trim()) return;
        try {
            await addDoc(collection(db, "comments"), {
                gameId: activeGameId,
                userPin: currentUser.pin,
                userName: currentUser.name,
                text: input.value.trim(),
                createdAt: serverTimestamp()
            });
            input.value = "";
            loadComments();
        } catch(e) { alert("댓글 등록 실패"); }
    };

    window.delComment = async function(id) {
        if (!confirm("댓글을 삭제하시겠습니까?")) return;
        await deleteDoc(doc(db, "comments", id));
        loadComments();
    };

    window.toggleCommentModal = (show) => {
        document.getElementById('comment-modal').classList.toggle('active', show);
        if (!show) activeGameId = null;
    };

    window.togglePinModal = async function(show) {
        const modal = document.getElementById('pin-modal');
        if (show) {
            document.getElementById('pin-list-content').innerHTML = `로딩 중...`;
            modal.classList.add('active');
            const snap = await getDocs(collection(db, "users"));
            let users = []; snap.forEach(d => users.push({ pin: d.id, name: d.data().name }));
            users.sort((a,b) => a.pin - b.pin);
            document.getElementById('pin-list-content').innerHTML = users.map(u => `<div class="flex justify-between p-2 border-b border-white/5"><span>${u.pin}</span><b>${u.name}</b></div>`).join('');
        } else modal.classList.remove('active');
    };

    window.addGame = async function() {
        const n = prompt("새 게임 이름:");
        if (n) { await addDoc(collection(db, "games"), { name: n, category: selectedCategory }); renderList(); }
    };

    window.inputScore = async function(id, n) {
        const v = prompt(`${n} 점수 (0~100):`);
        if (v) {
            const s = parseFloat(v);
            if (s >= 0 && s <= 100) {
                await setDoc(doc(db, "ratings", `${currentUser.pin}_${id}`), { gameId: id, userPin: currentUser.pin, score: s });
                renderList();
            } else alert("0~100 사이 숫자만 가능!");
        }
    };

    window.delGame = async (id, n) => { if (confirm(`'${n}' 삭제?`)) { await deleteDoc(doc(db, "games", id)); renderList(); } };
</script>
</body>
</html>
