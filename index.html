<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v5.8.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        
        /* 모달 및 전역 요소 우선순위 설정 */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #detail-modal { z-index: 10005; } 
        #add-schedule-modal { z-index: 10020; } 
        #admin-modal, #find-pin-modal { z-index: 10030; } 
        
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .game-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; font-weight: 800; display: block; cursor: pointer; }
        .game-comment-box { display: block; background: rgba(0,0,0,0.4); border-radius: 16px; padding: 12px; width: 100%; margin: 8px 0; border: 1px solid rgba(255,255,255,0.05); }
        
        /* 31, 32번 해결: 홈 화면 버튼 클릭 방해 요소 완전 제거 및 우선권 부여 */
        .menu-btn-primary { position: relative; z-index: 2000 !important; cursor: pointer !important; pointer-events: auto !important; }
        
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 10px 4px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.05); }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center font-bold">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic">Game Archive</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-2">접속</button>
                <div class="pt-4 space-y-2">
                    <button onclick="openFindPin()" class="text-gray-500 text-xs underline">내 PIN 번호 알아보기</button>
                    <p class="text-blue-400/60 text-[10px]">기본 비밀번호는 1234입니다.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="page-home" class="page active pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 menu-btn-primary" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800">
                <span id="user-welcome" class="text-blue-300 text-sm font-black"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg menu-btn-primary">로그아웃</button>
        </div>
        <div id="admin-entry" class="hidden px-4 mb-6 text-right"><button onclick="openAdmin()" class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl font-black menu-btn-primary">⚙️ 관리자 설정</button></div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-black transition shadow-lg menu-btn-primary">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg menu-btn-primary font-bold">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition menu-btn-primary">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition menu-btn-primary">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition menu-btn-primary">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition menu-btn-primary font-bold">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold"><div class="px-4 mb-4"><input type="text" id="game-search" oninput="renderList()" placeholder="🔍 검색..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm font-bold shadow-inner"></div><div class="px-4 mb-4 flex justify-between items-center font-bold"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase font-bold"></h2><select id="sort-selector" class="bg-slate-800 text-[10px] p-2 rounded-lg border border-white/10 font-bold" onchange="renderList()"><option value="default">기본</option><option value="score_desc">점수순</option><option value="diff_desc">난이도순</option></select></div><div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5"><table class="w-full text-center min-w-[340px] table-fixed border-collapse"><thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-12 text-center">#</th><th class="p-4 text-left">정보</th><th class="w-24 text-center">평가</th><th class="w-20">기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div><div class="px-4 mt-6 text-center font-bold"><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-8 py-3 rounded-2xl text-xs font-bold">+ 새 게임 추가</button></div></div>

    <div id="profile-modal" class="modal" onclick="toggleModal('profile-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold text-center" onclick="event.stopPropagation()">
            <h3 class="text-3xl font-black text-blue-400 mb-8 uppercase italic">My Profile</h3>
            <div class="flex flex-col items-center gap-6 mb-8 border-b border-white/10 pb-8">
                <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover bg-slate-800">
                <input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none font-black text-center" placeholder="닉네임">
            </div>
            <h4 class="text-left text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1">Attend History</h4>
            <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[300px] space-y-3 custom-scrollbar text-left font-bold"></div>
            <button onclick="toggleModal('profile-modal', false)" class="mt-6 text-gray-500 text-xs font-black uppercase">닫기</button>
        </div>
    </div>

    <div id="admin-modal" class="modal" onclick="toggleModal('admin-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6"><h3 class="text-xl font-black text-red-400 uppercase font-bold">User Manager ⚙️</h3><button onclick="toggleModal('admin-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div><div class="flex gap-2 mb-6"><input type="text" id="new-user-name" placeholder="이름 입력" class="flex-1 bg-white/5 p-4 rounded-xl border border-white/10 text-xs font-bold outline-none"><button onclick="addUser()" class="bg-blue-600 px-6 rounded-xl text-xs font-black">추가</button></div><div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 pr-2 font-bold"></div></div></div>
    <div id="page-stats" class="page pt-24 text-center font-bold"><h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase font-bold">명예전당 🏆</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4 font-bold font-bold"><div class="space-y-4 font-bold"><h3 class="text-blue-400 font-black italic">🗳️ Voting King</h3><div id="vote-king" class="space-y-3 font-bold"></div></div><div class="space-y-4 font-bold"><h3 class="text-green-400 font-black italic">🆕 Creator King</h3><div id="game-add-king" class="space-y-3 font-bold"></div></div></div></div>
    <div id="rate-modal" class="modal" onclick="toggleModal('rate-modal', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()"><h3 id="rate-modal-title" class="text-xl font-black text-yellow-400 mb-6 text-center"></h3><div id="rate-score-section" class="space-y-4 font-bold"><label class="text-[10px] text-gray-500 block text-center">재미 점수 (0 ~ 100)</label><input type="number" id="rate-score-input" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none font-black text-center text-2xl font-bold" placeholder="0"><button onclick="submitRating('score')" class="w-full bg-yellow-500 py-4 rounded-2xl font-black text-black">저장</button></div><div id="rate-diff-section" class="space-y-4 hidden font-bold"><label class="text-[10px] text-gray-500 block text-center font-bold">난이도 (1 ~ 5)</label><input type="range" id="rate-diff-range" min="1" max="5" step="1" class="w-full accent-blue-500 font-bold" oninput="document.getElementById('diff-val').innerText = this.value"><div id="diff-val" class="text-center text-3xl font-black text-blue-400 font-bold">3</div><button onclick="submitRating('diff')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white">저장</button></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, orderBy, addDoc, deleteDoc, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeScheduleId = null; let recordingRanks = []; let selectedMembers = [];
        const getTodayStr = () => new Date().toISOString().split('T')[0];

        // [v5.8.7 페이지 전환 엔진 - 31번 진입 불가 해결 핵심]
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) {
                target.classList.add('active');
                document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block';
                if(push) history.pushState({page: id}, '', '');
                // 페이지별 데이터 즉시 갱신
                if(id === 'page-stats') navToStats();
                if(id === 'page-chat-info') loadChatInfo();
            }
        };

        // [v5.8.7 인증 엔진 - 신규 PIN 로그인 보장]
        window.login = async () => { 
            const pinIn = document.getElementById('pin').value.trim(); 
            const pwIn = document.getElementById('pw').value.trim();
            if(!pinIn || !pwIn) return;
            try {
                // 문서를 강제 문자열로 조회하여 타입 불일치 차단
                const snap = await getDoc(doc(db, "users", String(pinIn))); 
                if (snap.exists() && String(snap.data().password) === String(pwIn)) { 
                    currentUser = { pin: String(pinIn), ...snap.data() }; 
                    localStorage.setItem('game_archive_auth', JSON.stringify({ pin: String(pinIn), pw: String(pwIn) })); 
                    location.reload(); 
                } else { alert("PIN 또는 비밀번호가 틀렸습니다."); }
            } catch(e) { alert("로그인 오류"); }
        };

        // [v5.8.7 리스트 엔진 - 점수/기록 클릭 차단 완벽 해결]
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 font-bold">로딩 중...</td></tr>`;
            const [gS, rS, uS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings")), getDocs(collection(db, "users"))]);
            const rt = rS.docs.map(d => d.data()); const uMap = uS.docs.reduce((acc, d) => ({...acc,[d.id]:d.data()}), {});
            let gms = gS.docs.map(d => {
                const r = rt.filter(v => v.gameId === d.id); const sc = r.map(v => v.score || 0).sort((a,b)=>a-b);
                let avgS = (r.length >= 5) ? sc.slice(1, -1).reduce((a,c)=>a+c,0)/(sc.length-2) : (r.length > 0 ? sc.reduce((a,c)=>a+c,0)/r.length : 0);
                return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: (r.map(v=>v.difficulty||0).filter(v=>v>0).reduce((a,c)=>a+c,0)/(r.filter(v=>v.difficulty>0).length||1)), voteCount: r.length };
            });
            const keyword = document.getElementById('game-search').value.trim().toLowerCase();
            if(keyword) gms = gms.filter(g => g.name.toLowerCase().includes(keyword));
            gms.sort((a, b) => (b.voteCount >= 3) - (a.voteCount >= 3) || b.avgScore - a.avgScore);

            list.innerHTML = gms.map((g, i) => `
                <tr class="hover:bg-white/5 border-b border-white/5 transition" id="row-${g.id}">
                    <td class="p-4 text-blue-400 font-black text-center w-12 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                    <td class="p-4 text-left font-bold" onclick="toggleGameRow('${g.id}')">
                        <span class="game-name-text text-sm font-black">${g.name}</span>
                        <span class="text-[9px] opacity-40">Votes: ${g.voteCount}</span>
                    </td>
                    <td class="p-2 text-center w-24 relative z-[500]" onclick="event.stopPropagation();">
                        <div class="flex flex-col items-center pointer-events-auto">
                            <span onclick="event.stopPropagation(); openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-base font-black cursor-pointer font-bold">${g.avgScore.toFixed(1)}</span>
                            <div onclick="event.stopPropagation(); openRate('diff','${g.id}','${g.name}')" class="flex text-[8px] cursor-pointer">
                                ${Array(5).fill(0).map((_, idx) => `<span class="${idx < Math.round(g.avgDiff) ? 'text-blue-400' : 'text-gray-700'} font-bold">★</span>`).join('')}
                            </div>
                        </div>
                    </td>
                    <td class="p-4 w-20 text-center font-bold relative z-[500]"><button onclick="event.stopPropagation(); openSchedules('${g.id}','${g.name}');" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-green-600 transition font-bold">기록</button></td>
                </tr>
                <tr id="comment-row-${g.id}" style="display:none;"><td colspan="4" class="px-4 pb-4">
                    <div class="game-comment-box font-bold" onclick="event.stopPropagation()">
                        <div class="max-h-32 overflow-y-auto mb-3 custom-scrollbar space-y-2">
                            ${(g.comments || []).map((c, idx) => `<div class="text-[11px] flex justify-between bg-white/5 p-2 rounded-xl"><span><b class="text-blue-300">${uMap[c.userPin]?.name || '?'}:</b> ${c.text}</span>${(c.userPin===currentUser.pin || currentUser.pin==="100")?`<button onclick="deleteGameComment('${g.id}',${idx})" class="text-red-500 ml-2 font-bold font-bold">✕</button>`:''}</div>`).join('') || "<p class='opacity-20 text-center py-2 text-[10px] font-bold'>댓글 없음</p>"}
                        </div>
                        <div class="flex gap-2 font-bold"><input type="text" id="gc-${g.id}" class="bg-white/10 text-[11px] p-3 rounded-xl flex-1 outline-none font-bold" placeholder="메모..."><button onclick="addGameComment('${g.id}')" class="bg-blue-600 text-[11px] px-4 rounded-xl font-black">등록</button></div>
                    </div>
                </td></tr>`).join('');
        };

        window.toggleGameRow = (id) => { const dr = document.getElementById(`comment-row-${id}`); dr.style.display = (dr.style.display === 'none') ? 'table-row' : 'none'; };

        // [마이프로필 데이터 엔진]
        window.toggleProfileModal = async (s) => { 
            if(s && currentUser) { 
                const listDiv = document.getElementById('my-history-list');
                listDiv.innerHTML = `<p class="opacity-30 italic text-sm">로딩 중...</p>`;
                document.getElementById('edit-nickname').value = currentUser.name; 
                document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; 
                toggleModal('profile-modal', true);
                
                const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); 
                const sSnap = await getDocs(q); 
                listDiv.innerHTML = sSnap.docs.map(d => { 
                    const s = d.data(); 
                    return `<div onclick="navToDetailFromHistory('${s.gameCategory}', '${s.gameId}', '${s.gameName}', '${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 font-bold cursor-pointer hover:bg-white/10"><div><span class="category-tag font-bold">${s.gameCategory}</span><div class="text-sm font-bold">${s.gameName} - ${s.name}</div></div><span class="text-yellow-400 text-xs font-black">▶</span></div>`; 
                }).join('') || "참가 기록 없음"; 
            } else { toggleModal('profile-modal', false); }
        };

        // [명예의 전당 데이터 엔진]
        window.navToStats = async () => {
            showPage('page-stats'); const vL = document.getElementById('vote-king'); const gL = document.getElementById('game-add-king');
            vL.innerHTML = gL.innerHTML = `<p class="opacity-30 italic font-bold">로딩 중...</p>`;
            try {
                const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
                const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
                const vC = rSnap.docs.map(d=>d.data()).reduce((acc, r) => { if(r.userPin) acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {});
                vL.innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold'><span>${uMap[v[0]]?.name || '?'}</span><b class='text-blue-400'>${v[1]}회</b></div>`).join('');
                const gC = gSnap.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
                gL.innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold'><span>${uMap[v[0]]?.name || '?'}</span><b class='text-green-400'>${v[1]}개</b></div>`).join('');
            } catch(e) { vL.innerHTML = "데이터 로딩 실패"; }
        };

        // [사용자 추가 엔진 - v5.8.7 최종 고정]
        window.addUser = async () => {
            const n = document.getElementById('new-user-name'); if(!n.value.trim()) return;
            const uS = await getDocs(collection(db, "users"));
            const pins = uS.docs.map(d => parseInt(d.id)).filter(id => !isNaN(id));
            const nextPinStr = String(pins.length > 0 ? Math.max(...pins) + 1 : 101);
            await setDoc(doc(db, "users", nextPinStr), { name: n.value.trim(), password: "1234", pin: nextPinStr, iconUrl: DEFAULT_ICON });
            n.value = ""; await openAdmin();
            const listDiv = document.getElementById('admin-user-list'); listDiv.scrollTo({ top: listDiv.scrollHeight, behavior: 'smooth' });
        };

        // [기초 초기화 및 부가 기능]
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.logout = () => { if(confirm("로그아웃 하시겠습니까?")) { localStorage.removeItem('game_archive_auth'); location.reload(); } };
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", String(d.pin))); if (snap.exists() && String(snap.data().password) === String(d.pw)) { currentUser = { pin: String(d.pin), ...snap.data() }; updateUI(); showPage('page-home', false); return; } } showPage('page-login', false); });
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin === "100") document.getElementById('admin-entry').classList.remove('hidden'); }
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; document.getElementById('game-search').value = ""; renderList(); showPage('page-rank'); };
        window.openAdmin = async () => { if(currentUser.pin !== "100") return; toggleModal('admin-modal', true); const uS = await getDocs(collection(db, "users")); const listDiv = document.getElementById('admin-user-list'); const users = uS.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => parseInt(a.id) - parseInt(b.id)); listDiv.innerHTML = users.map(u => `<div class="flex justify-between items-center p-4 glass rounded-2xl border border-white/5 mb-2 font-bold"><div><span class="font-black">${u.name}</span><span class="text-[9px] text-gray-500 block">PIN: ${u.id}</span></div>${u.id !== "100" ? `<button onclick="deleteUser('${u.id}')" class="bg-red-500/10 text-red-500 px-3 py-1.5 rounded-lg text-[10px] font-black">삭제</button>` : ''}</div>`).join(''); };
        window.deleteUser = async (pin) => { if(confirm("삭제?")) { await deleteDoc(doc(db, "users", pin)); openAdmin(); } };
        window.openFindPin = async () => { toggleModal('find-pin-modal', true); const uS = await getDocs(collection(db, "users")); const listContent = document.getElementById('pin-list-content'); const users = uS.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.name.localeCompare(b.name)); listContent.innerHTML = users.map(u => `<div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5 mb-1 font-bold"><span class="text-blue-200">${u.name}</span><span class="text-yellow-400 font-black">PIN: ${u.id}</span></div>`).join(''); };
        window.openRate = (t,id,n) => { activeGameId=id; document.getElementById('rate-modal-title').innerText=n; document.getElementById('rate-score-section').classList.toggle('hidden',t!=='score'); document.getElementById('rate-diff-section').classList.toggle('hidden',t!=='diff'); toggleModal('rate-modal',true); };
        window.submitRating = async (t) => { const v = (t==='score') ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-range').value); try { const q = query(collection(db,"ratings"), where("gameId","==",activeGameId), where("userPin","==",currentUser.pin)); const snap = await getDocs(q); const rD = { gameId:activeGameId, userPin:currentUser.pin, updatedAt:serverTimestamp() }; rD[t==='score'?'score':'difficulty']=v; if(!snap.empty) await updateDoc(doc(db,"ratings",snap.docs[0].id), rD); else await addDoc(collection(db,"ratings"), rD); toggleModal('rate-modal', false); renderList(); } catch(e) { alert("실패"); } };
        window.openSchedules = async (id, n) => { activeGameId = id; toggleModal('schedule-modal', true); document.getElementById('schedule-game-title').innerText = n; const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id))); document.getElementById('schedule-list').innerHTML = sSnap.docs.map(d => `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold"><div><div class="text-sm text-green-300 font-bold font-bold">${d.data().name}</div><div class="text-[9px] text-gray-500 uppercase">${d.data().date || ''}</div></div><span class="text-blue-400 text-xs font-bold font-bold">▶</span></div>`).join(''); };
        window.openScheduleDetail = async (sid) => { activeScheduleId = sid; const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]); const s = sS.data(); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); document.getElementById('detail-title').innerText = s.name; document.getElementById('detail-date').innerText = "📅 " + (s.date || "미기록"); toggleModal('detail-modal', true); };
        window.navToDetailFromHistory = (cat, gid, gname, sid) => { closeAllModals(); selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); setTimeout(() => openSchedules(gid, gname), 450); };
    </script>
</body>
</html>
