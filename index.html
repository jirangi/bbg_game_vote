<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Archive v2.8.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; width: 100%; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sticky-back { position: fixed; top: 60px; left: 20px; z-index: 40; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: none; }
        .page.active:not(#page-home):not(#page-login) ~ .sticky-back { display: block; }
        .user-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
        .podium-box { background: linear-gradient(to bottom, rgba(251, 191, 36, 0.15), transparent); border: 1px solid rgba(251, 191, 36, 0.3); }
        .rank-gold { border: 2px solid #fbbf24 !important; background: rgba(251, 191, 36, 0.08) !important; }
        .rank-silver { border: 2px solid #94a3b8 !important; background: rgba(148, 163, 184, 0.08) !important; }
        .rank-bronze { border: 2px solid #b45309 !important; background: rgba(180, 83, 9, 0.08) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="window.history.back()" id="global-back-btn" class="sticky-back text-blue-400 hover:text-white transition font-bold shadow-xl font-bold">← 뒤로가기</button>

    <div id="page-login" class="page active pt-24 max-w-sm">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 uppercase tracking-widest italic font-bold">Login</h2>
            <div class="space-y-4 text-left font-bold">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none font-bold text-white">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-4 transition-all">접속하기</button>
            </div>
        </div>
    </div>

    <div id="page-home" class="page pt-10 font-bold text-center">
        <div class="flex justify-between items-center mb-10 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="user-icon border-2 border-blue-500/50 w-10 h-10">
                <span id="user-welcome" class="text-blue-300 text-sm font-extrabold"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-400 text-xs font-bold border border-white/10 px-3 py-1.5 rounded-lg">로그아웃</button>
        </div>
        <h1 class="text-4xl font-extrabold mb-12 tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Game Archive</h1>
        <div class="flex justify-center gap-3 mb-10 px-4 font-bold">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-white transition w-1/2 shadow-lg">🏆 명예전당</button>
            <button id="admin-user-manage-btn" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-red-500 transition w-1/2 shadow-lg" onclick="toggleModal('admin-user-modal', true)">⚙️ 명단 관리</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="category-card glass rounded-3xl p-10 flex flex-col items-center justify-center gap-4 text-white hover:text-blue-400 font-extrabold text-xl transition hover:scale-[1.02] border border-white/5 shadow-xl">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-stats" class="page pt-10 font-bold text-center">
        <h2 class="text-3xl font-black text-yellow-400 mb-10 italic uppercase tracking-widest">Hall of Fame 🏆</h2>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 px-4">
            <div class="flex flex-col gap-4">
                <h3 class="text-lg font-bold mb-2 text-yellow-500 font-bold italic">🍕 Best Reviewer</h3>
                <div id="best-comment-king" class="space-y-4"></div>
            </div>
            <div class="flex flex-col gap-4">
                <h3 class="text-lg font-bold mb-2 text-blue-400 font-bold italic">🗳️ Voting King</h3>
                <div id="vote-king" class="space-y-4"></div>
            </div>
            <div class="flex flex-col gap-4">
                <h3 class="text-lg font-bold mb-2 text-green-400 font-bold italic">🆕 Creator King</h3>
                <div id="game-add-king" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <div id="page-rank" class="page pt-10 font-bold"><div class="flex flex-col mb-8 px-4 gap-6 text-left font-bold"><div class="flex justify-between items-end font-bold font-bold"><h2 id="rank-title" class="text-4xl font-extrabold italic text-blue-400 tracking-tighter"></h2><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-600 transition">+ 새 게임</button></div><div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar font-bold"><button onclick="setSort('score_desc')" id="sort-score_desc" class="sort-btn active px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap">점수 높은순</button><button onclick="setSort('diff_desc')" id="sort-diff_desc" class="sort-btn px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap">난이도 높은순</button><button onclick="setSort('diff_asc')" id="sort-diff_asc" class="sort-btn px-4 py-2 rounded-full border border-white/10 text-[11px] transition whitespace-nowrap">난이도 낮은순</button></div></div><div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 font-bold"><table class="w-full border-collapse min-w-[550px] font-bold"><thead class="bg-white/5 text-gray-500 text-[10px] uppercase font-bold border-b border-white/10 text-center font-bold font-bold"><tr><th class="p-5 w-16">순위</th><th class="p-5 text-left">게임 정보</th><th class="p-5 w-36">평가 데이터</th><th class="p-5 w-32">모임 일지</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5 text-center font-bold font-bold"></tbody></table></div></div>
    
    <div id="profile-modal" class="modal" onclick="closeOnBackdrop(event, 'profile-modal')">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-3xl font-black text-center text-blue-400 italic mb-8 uppercase">My Profile</h3>
            <div class="flex flex-col items-center gap-6 mb-8 pb-8 border-b border-white/10 font-bold font-bold font-bold">
                <img id="profile-preview" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 shadow-2xl object-cover">
                <div class="w-full space-y-3">
                    <input type="text" id="edit-nickname" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 text-center font-black" placeholder="닉네임">
                    <input type="text" id="edit-icon-url" placeholder="이미지 URL" class="w-full bg-white/5 p-3 rounded-2xl text-[10px] outline-none border border-white/10 font-bold">
                </div>
                <button onclick="updateProfile()" class="w-full bg-blue-600 py-4 rounded-2xl font-black shadow-xl">정보 저장하기</button>
            </div>
            <h4 class="text-left text-[10px] font-black text-gray-500 uppercase mb-4 ml-1 tracking-widest font-bold">Attendance History</h4>
            <div id="my-history-list" class="flex-grow overflow-y-auto max-h-[250px] space-y-3 custom-scrollbar text-left pr-2 font-bold font-bold"></div>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="closeOnBackdrop(event, 'detail-modal')"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold"><h3 id="detail-title" class="text-xl font-black italic text-blue-400 pr-2 font-bold font-bold"></h3><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold font-bold">✕</button></div><div id="detail-podium" class="podium-box p-6 rounded-[32px] mb-8 hidden font-bold"><div class="flex items-center gap-2 mb-3 text-yellow-400 font-black"><span>🥇</span> <span class="text-xs uppercase font-bold">Official Ranking</span></div><div id="detail-rank-result" class="text-sm leading-relaxed text-white font-bold font-bold font-bold"></div></div><div class="flex gap-2 mb-8 shrink-0 font-bold"><button onclick="openRankPopup()" class="flex-1 bg-blue-600/20 border border-blue-500/30 py-4 rounded-2xl text-xs text-blue-300 font-black">🥇 순위 등록</button><button onclick="openCommentPopup()" class="flex-1 bg-green-600/20 border border-green-500/30 py-4 rounded-2xl text-xs text-green-300 font-black">💬 코멘트 작성</button></div><div class="flex-grow overflow-hidden flex flex-col font-bold"><h4 class="text-[10px] text-gray-500 uppercase tracking-widest mb-4 ml-1 text-left font-bold">Guestbook</h4><div id="detail-comment-feed" class="space-y-4 overflow-y-auto custom-scrollbar pr-2 flex-grow font-bold text-left font-bold"></div></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, query, where, serverTimestamp, deleteDoc, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let currentSort = "score_desc"; let allRatingsData = [];
        let recordingRanks = []; let currentScheduleId = null;

        // [기본 네비게이션]
        window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('active', show);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.closeOnBackdrop = (e, id) => { if (e.target.id === id) closeAllModals(); };
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });
        
        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const target = document.getElementById(id);
            if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 50); }
            if (history.state?.page !== id) history.pushState({ page: id }, '', '');
        };
        window.onpopstate = (e) => { const pid = e.state?.page || 'page-home'; document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; }); const t = document.getElementById(pid); if(t) { t.style.display = 'block'; t.classList.add('active'); } };

        // [v2.8.6 명예의 전당 복구 로직]
        window.navToStats = async () => {
            showPage('page-stats');
            const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]);
            const ratings = rSnap.docs.map(d => d.data());
            const games = gSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const users = uSnap.docs.reduce((acc, d) => ({ ...acc, [d.id]: d.data() }), {});

            const getMedal = (i) => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
            const getRankClass = (i) => i === 0 ? 'rank-gold' : i === 1 ? 'rank-silver' : i === 2 ? 'rank-bronze' : '';

            // 1. 최다 투표 왕
            const vCount = ratings.reduce((acc, r) => { acc[r.userPin] = (acc[r.userPin] || 0) + 1; return acc; }, {});
            let topV = Object.entries(vCount).sort((a,b) => b[1]-a[1]).slice(0,5);
            document.getElementById('vote-king').innerHTML = topV.map((v, i) => {
                const u = users[v[0]] || { name: '?', iconUrl: DEFAULT_ICON };
                return `<div class="p-4 glass rounded-2xl ${getRankClass(i)} flex items-center justify-between font-bold"><div class="flex items-center gap-3"><img src="${u.iconUrl || DEFAULT_ICON}" class="user-icon w-10 h-10 border border-white/10"><div class="text-left leading-tight"><span class="text-[10px] opacity-50 block">${getMedal(i)}</span><span class="text-xs font-black">${u.name}</span></div></div><span class="text-xs text-blue-400 font-black">${v[1]}회</span></div>`;
            }).join('') || `<p class='opacity-20 text-xs py-10'>No Data</p>`;

            // 2. 최다 게임 등록 왕
            const gCount = games.reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {});
            let topG = Object.entries(gCount).sort((a,b) => b[1]-a[1]).slice(0,5);
            document.getElementById('game-add-king').innerHTML = topG.map((v, i) => {
                const u = users[v[0]] || { name: '?', iconUrl: DEFAULT_ICON };
                return `<div class="p-4 glass rounded-2xl ${getRankClass(i)} flex items-center justify-between font-bold"><div class="flex items-center gap-3"><img src="${u.iconUrl || DEFAULT_ICON}" class="user-icon w-10 h-10 border border-white/10"><div class="text-left leading-tight"><span class="text-[10px] opacity-50 block">${getMedal(i)}</span><span class="text-xs font-black">${u.name}</span></div></div><span class="text-xs text-green-400 font-black">${v[1]}개</span></div>`;
            }).join('') || `<p class='opacity-20 text-xs py-10'>No Data</p>`;
        };

        // [v2.8.6 마이 히스토리 로직 복구]
        async function loadMyHistory() {
            const listDiv = document.getElementById('my-history-list');
            listDiv.innerHTML = `<p class="opacity-30 text-[10px] font-black uppercase text-center py-6 italic">Loading history...</p>`;
            try {
                const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin));
                const sSnap = await getDocs(q);
                let logs = sSnap.docs.map(d => d.data());
                logs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                listDiv.innerHTML = logs.map(s => {
                    const rIdx = s.ranks ? s.ranks.indexOf(currentUser.pin) : -1;
                    const rankTxt = rIdx > -1 ? `<span class="text-yellow-400 font-black text-lg">${rIdx+1}</span>위` : "<span class='text-gray-600'>기록전</span>";
                    return `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 shadow-inner font-bold"><div class="text-left"><div class="text-[9px] text-blue-500 font-black uppercase tracking-tighter">${s.gameName || 'Game'}</div><div class="text-sm font-black">${s.name}</div></div><div class="text-xs italic pr-1 font-bold">${rankTxt}</div></div>`;
                }).join('') || `<p class="opacity-20 text-center py-4 text-xs italic font-bold">참석한 모임이 없습니다.</p>`;
            } catch(e) { listDiv.innerHTML = `<p class='text-red-400 text-xs text-center py-4'>로드 오류</p>`; }
        }

        // [기본 시스템]
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('game_archive_auth');
            if (auth) {
                const data = JSON.parse(auth);
                const snap = await getDoc(doc(db, "users", data.pin));
                if (snap.exists() && snap.data().password === data.pw) {
                    currentUser = { pin: data.pin, ...snap.data() };
                    updateHeaderUI();
                    if(currentUser.pin === "100") document.getElementById('admin-user-manage-btn').classList.remove('hidden');
                    showPage('page-home'); return;
                }
            }
            showPage('page-login');
        });

        window.login = async () => { const pin = document.getElementById('pin').value, pw = document.getElementById('pw').value; const snap = await getDoc(doc(db, "users", pin)); if (snap.exists() && snap.data().password === pw) { currentUser = { pin, ...snap.data() }; localStorage.setItem('game_archive_auth', JSON.stringify({ pin, pw })); location.reload(); } else alert("오류"); };
        window.logout = () => { localStorage.removeItem('game_archive_auth'); location.reload(); };
        function updateHeaderUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; }
        window.toggleProfileModal = (s) => { if(s) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('edit-icon-url').value = currentUser.iconUrl||''; document.getElementById('profile-preview').src = currentUser.iconUrl||DEFAULT_ICON; loadMyHistory(); } toggleModal('profile-modal', s); };
        window.updateProfile = async () => { const n = document.getElementById('edit-nickname').value.trim(); const i = document.getElementById('edit-icon-url').value.trim(); await updateDoc(doc(db, "users", currentUser.pin), { name: n, iconUrl: i }); currentUser.name = n; currentUser.iconUrl = i; updateHeaderUI(); alert("수정 완료"); };
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-30 font-bold">Restoring...</td></tr>`;
            try {
                const [gSnap, rSnap] = await Promise.all([getDocs(query(collection(db,"games"), where("category","==",selectedCategory))), getDocs(collection(db,"ratings"))]);
                allRatingsData = rSnap.docs.map(d=>d.data());
                let games = gSnap.docs.map(d => {
                    const r = allRatingsData.filter(v=>v.gameId === d.id); if(r.length === 0) return null;
                    const sc = r.map(v=>v.score||0).sort((a,b)=>a-b);
                    let avg = sc.length>=3 ? sc.slice(1,-1).reduce((a,c)=>a+c,0)/(sc.length-2) : sc.reduce((a,c)=>a+c,0)/sc.length;
                    return { id: d.id, ...d.data(), avgScore: avg, voteCount: r.length };
                }).filter(g=>g!==null);
                games.sort((a,b) => b.avgScore - a.avgScore);
                list.innerHTML = games.map((g, i) => { const rI = i<3 && g.voteCount>=3 ? ['🥇','🥈','🥉'][i] : `#${i+1}`; return `<tr class="hover:bg-white/5 border-b border-white/5 transition font-bold font-bold"><td class="p-5 text-blue-400 text-lg">${rI}</td><td class="p-5 text-left font-bold"><div class="text-base font-black leading-tight">${g.name}</div><div class="text-[9px] opacity-40 uppercase tracking-tighter">Votes: ${g.voteCount}</div></td><td class="p-5 font-bold"><div class="text-yellow-400 font-black text-sm mb-1">${g.avgScore.toFixed(1)}점</div></td><td class="p-5 font-bold"><button onclick="openSchedules('${g.id}','${g.name}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600 transition">기록</button></td></tr>`; }).join('');
            } catch(e) { list.innerHTML=`<tr><td colspan="4" class="p-10 text-center text-red-400">데이터 로드 실패</td></tr>`; }
        };
        // [일정 관련 openSchedules, openScheduleDetail 등 v2.8.5 로직 그대로 통합 적용됨]
        window.openSchedules = async (id, n) => { activeGameId = id; document.getElementById('schedule-game-title').innerText = n; const grid = document.getElementById('member-select-grid'); const uSnap = await getDocs(collection(db, "users")); grid.innerHTML = uSnap.docs.filter(d => d.id !== "100").map(d => `<button onclick="toggleSelectMember('${d.id}')" id="sel-${d.id}" class="member-btn bg-white/5 p-2 rounded-lg text-[10px] font-bold border border-white/10 font-bold">${d.data().name}</button>`).join(''); toggleModal('schedule-modal', true); loadSchedules(); };
        window.toggleSelectMember = (pin) => { const idx = tempMembers.indexOf(pin); const btn = document.getElementById(`sel-${pin}`); if(idx > -1) { tempMembers.splice(idx, 1); btn.classList.remove('selected'); } else { tempMembers.push(pin); btn.classList.add('selected'); } };
        window.createSchedule = async () => { const n = document.getElementById('new-schedule-name').value.trim(); if(!n || tempMembers.length === 0) return alert("제목/인원 확인"); await addDoc(collection(db, "schedules"), { gameId: activeGameId, gameName: activeGameId, name: n, members: tempMembers, ranks: [], feed: [], createdAt: serverTimestamp() }); document.getElementById('new-schedule-name').value = ""; tempMembers = []; loadSchedules(); };
        async function loadSchedules() { const listDiv = document.getElementById('schedule-list'); const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", activeGameId))); let logs = sSnap.docs.map(d => ({ id: d.id, ...d.data() })); logs.sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); listDiv.innerHTML = logs.map(s => { const canDelete = s.members?.includes(currentUser.pin); return `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center hover:bg-white/10 transition-all mb-2 shadow-lg font-bold"><div onclick="openScheduleDetail('${s.id}')" class="flex-grow cursor-pointer pr-4 font-bold"><div class="text-sm text-green-300 font-bold mb-1">${s.name}</div><div class="text-[9px] font-bold ${s.ranks?.length > 0 ? 'text-blue-400' : 'text-gray-500'} font-bold">${s.ranks?.length > 0 ? 'RECORDED ✅' : 'WAITING ⏳'}</div></div>${canDelete ? `<button onclick="deleteSchedule('${s.id}')" class="p-2 text-gray-500 hover:text-red-500 text-xs font-bold font-bold font-bold font-bold">🗑️</button>` : ''}</div>`; }).join('') || `<p class="opacity-20 text-center py-4 text-xs italic font-bold">No Records</p>`; }
    </script>
</body>
</html>
