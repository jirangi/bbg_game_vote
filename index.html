<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v5.9.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        
        /* [32번 해결 핵심] 모달 레이어 우선순위 수직 계층화 */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #schedule-modal { z-index: 10010; } /* 기록 목록 */
        #detail-modal { z-index: 10020; }   /* 상세 결과 */
        #add-schedule-modal { z-index: 10030; } /* 신규 등록 - 가장 위 */
        #admin-modal, #find-pin-modal, #profile-modal { z-index: 10040; } 
        
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9500; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .game-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; font-weight: 800; display: block; cursor: pointer; }
        .btn-priority { position: relative; z-index: 2000 !important; cursor: pointer !important; pointer-events: auto !important; }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 10px 4px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.05); transition: 0.2s; }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 font-bold">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic">Game Archive</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-2">접속</button>
                <div class="pt-4 space-y-2">
                    <button onclick="openFindPin()" class="text-gray-500 text-xs underline">내 PIN 번호 알아보기</button>
                    <p class="text-blue-400/60 text-[10px]">기본 비밀번호는 1234입니다.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="page-home" class="page active pt-10 text-center">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 btn-priority" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800">
                <span id="user-welcome" class="text-blue-300 text-sm font-black"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg btn-priority">로그아웃</button>
        </div>
        <div id="admin-entry" class="hidden px-4 mb-6 text-right font-bold"><button onclick="openAdmin()" class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl font-black btn-priority">⚙️ 관리자 설정</button></div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="showPage('page-stats')" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 transition shadow-lg btn-priority font-bold">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg btn-priority font-bold">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition btn-priority">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold"><div class="px-4 mb-4"><input type="text" id="game-search" oninput="renderList()" placeholder="🔍 검색..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm font-bold shadow-inner"></div><div class="px-4 mb-4 flex justify-between items-center font-bold"><h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase"></h2><select id="sort-selector" class="bg-slate-800 text-[10px] p-2 rounded-lg border border-white/10 font-bold" onchange="renderList()"><option value="default">기본</option><option value="score_desc">점수순</option></select></div><div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 font-bold"><table class="w-full text-center min-w-[340px] table-fixed border-collapse font-bold"><thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-12 text-center">#</th><th class="p-4 text-left">정보</th><th class="w-24 text-center">평가</th><th class="w-20">기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div><div class="px-4 mt-6 text-center font-bold"><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-8 py-3 rounded-2xl text-xs font-bold">+ 새 게임 추가</button></div></div>

    <div id="schedule-modal" class="modal" onclick="toggleModal('schedule-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 font-bold"><h3 id="schedule-game-title" class="text-xl font-black text-green-400 truncate"></h3><button onclick="toggleModal('schedule-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div>
            <div id="schedule-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 font-bold"></div>
            <button onclick="openAddSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white font-bold shadow-xl">+ 새로운 기록 추가</button>
        </div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 font-bold"><div class="flex flex-col min-w-0 flex-1"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate"></h3><span id="detail-date" class="text-[10px] text-gray-500"></span></div><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold">✕</button></div>
            <div id="detail-rank-result" class="text-sm space-y-2 mb-6 font-bold"></div>
            <div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold"></div>
        </div>
    </div>

    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)">
        <div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-xl font-black mb-6 text-green-400">기록 정보 입력</h3>
            <input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl mb-4 outline-none font-bold" placeholder="기록 제목 (필수)">
            <p class="text-[10px] text-gray-500 mb-2 ml-1">참석자 선택:</p>
            <div id="member-selector" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-white/10 rounded-xl mb-6 custom-scrollbar font-bold"></div>
            <button onclick="submitSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white font-bold shadow-xl">기록 생성</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, orderBy, addDoc, deleteDoc, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeScheduleId = null; let recordingRanks = []; let selectedMembers = [];
        const getTodayStr = () => new Date().toISOString().split('T')[0];

        // [v5.9.5 내비게이션 엔진 - 35번 브라우저 뒤로가기 완벽 대응]
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) {
                target.classList.add('active');
                document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block';
                if(push) history.pushState({page: id}, '', '');
                if(id === 'page-stats') navToStats();
                if(id === 'page-chat-info') loadChatInfo();
            }
        };

        window.onpopstate = () => { if(document.querySelector('.modal.active')) { closeAllModals(); history.pushState({page: 'page-home'}, '', ''); } else { showPage('page-home', false); } };
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };

        // [v5.9.5 마이프로필 기록 연동 해결 핵심]
        window.navToDetailFromHistory = async (cat, gid, gname, sid) => { 
            closeAllModals(); 
            selectedCategory = cat; 
            document.getElementById('rank-title').innerText = cat; 
            showPage('page-rank'); 
            
            // Step 1: 리스트 렌더링 완료 대기
            await renderList(); 
            
            // Step 2: 특정 게임 기록 팝업 호출
            await openSchedules(gid, gname); 
            
            // Step 3: 특정 날짜 상세 페이지 호출 (비동기 충돌 방지를 위한 미세 지연)
            setTimeout(() => openScheduleDetail(sid), 350); 
        };

        window.toggleProfileModal = async (s) => { 
            if(s && currentUser) { 
                const listDiv = document.getElementById('my-history-list');
                listDiv.innerHTML = `<p class="opacity-30 italic text-sm text-center">로딩 중...</p>`;
                document.getElementById('edit-nickname').value = currentUser.name; 
                document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; 
                toggleModal('profile-modal', true);
                const q = query(collection(db, "schedules"), where("members", "array-contains", currentUser.pin)); 
                const sSnap = await getDocs(q); 
                listDiv.innerHTML = sSnap.docs.map(d => { 
                    const data = d.data(); 
                    return `<div onclick="navToDetailFromHistory('${data.gameCategory}', '${data.gameId}', '${data.gameName}', '${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-1 font-bold cursor-pointer hover:bg-white/10">
                        <div><span class="text-[9px] text-blue-400 uppercase font-black">${data.gameCategory || '🎲'}</span><div class="text-sm">${data.gameName} - ${data.name}</div></div>
                        <span class="text-yellow-400 text-xs">▶</span>
                    </div>`; 
                }).join('') || "<p class='opacity-20 text-center'>참가 기록이 없습니다.</p>"; 
            } else { toggleModal('profile-modal', false); }
        };

        // [v5.9.5 기록 조회 및 상세 엔진 - 32번 해결]
        window.openSchedules = async (id, n) => { 
            activeGameId = id; document.getElementById('schedule-game-title').innerText = n; 
            const listDiv = document.getElementById('schedule-list');
            listDiv.innerHTML = `<p class='opacity-30 italic text-center py-10 font-bold'>기록 찾는 중...</p>`;
            toggleModal('schedule-modal', true); 
            const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id))); 
            listDiv.innerHTML = sSnap.docs.map(d => `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold mb-1"><div><div class="text-sm text-green-300">${d.data().name}</div><div class="text-[9px] text-gray-500 uppercase">${d.data().date || ''}</div></div><span class="text-blue-400 text-xs font-bold font-bold">▶</span></div>`).join('') || "<p class='opacity-20 text-center py-10'>기록이 없습니다.</p>";
        };

        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid; const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]);
            const s = sS.data(); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data().name}), {});
            document.getElementById('detail-title').innerText = s.name; document.getElementById('detail-date').innerText = "📅 " + (s.date || "미기록");
            document.getElementById('detail-rank-result').innerHTML = (s.ranks || []).map((p, i) => `<div class="flex justify-between font-bold"><span>${i+1}위</span><span>${uMap[p] || '?'}</span></div>`).join('') || "결과 미기록";
            toggleModal('detail-modal', true);
        };

        // [인증 및 데이터 렌더링 - 타입 불일치 해결 유지]
        window.login = async () => { 
            const pIn = document.getElementById('pin').value.trim(); const pwIn = document.getElementById('pw').value.trim();
            const snap = await getDoc(doc(db, "users", String(pIn))); 
            if (snap.exists() && String(snap.data().password) === String(pwIn)) { currentUser = { pin: String(pIn), ...snap.data() }; updateUI(); showPage('page-home'); } else { alert("정보 불일치"); }
        };
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 text-center font-bold">로딩 중...</td></tr>`;
            const [gS, rS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings"))]);
            let gms = gS.docs.map(d => {
                const r = rS.docs.map(dr=>dr.data()).filter(v => v.gameId === d.id);
                const sc = r.map(v => v.score || 0);
                return { id: d.id, ...d.data(), avgScore: sc.length > 0 ? sc.reduce((a,c)=>a+c,0)/sc.length : 0, voteCount: r.length };
            });
            gms.sort((a, b) => b.avgScore - a.avgScore);
            list.innerHTML = gms.map((g, i) => `
                <tr class="hover:bg-white/5 border-b border-white/5 transition font-bold">
                    <td class="p-4 text-blue-400 font-black text-center w-12 font-bold">${i < 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                    <td class="p-4 text-left font-bold"><span class="game-name-text text-sm font-black">${g.name}</span></td>
                    <td class="p-2 text-center w-24 btn-priority" onclick="event.stopPropagation(); openRate('score','${g.id}','${g.name}')">
                        <span class="text-yellow-400 text-base font-black font-bold">${g.avgScore.toFixed(1)}</span>
                    </td>
                    <td class="p-4 w-20 text-center font-bold btn-priority"><button onclick="event.stopPropagation(); openSchedules('${g.id}','${g.name}');" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-green-600 transition">기록</button></td>
                </tr>`).join('');
        };

        // [공통 유틸리티]
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; renderList(); showPage('page-rank'); };
        window.openAddSchedule = async () => { selectedMembers = [currentUser.pin]; const uS = await getDocs(collection(db, "users")); document.getElementById('member-selector').innerHTML = uS.docs.map(d => `<div id="sel-${d.id}" onclick="toggleMemberSelect('${d.id}')" class="member-chip font-bold ${d.id === currentUser.pin ? 'selected' : ''}">${d.data().name}</div>`).join(''); toggleModal('add-schedule-modal', true); };
        window.toggleMemberSelect = (pin) => { if(pin === currentUser.pin) return; const el = document.getElementById(`sel-${pin}`); if(selectedMembers.includes(pin)) { selectedMembers = selectedMembers.filter(p => p !== pin); el.classList.remove('selected'); } else { selectedMembers.push(pin); el.classList.add('selected'); } };
        window.submitSchedule = async () => { const name = document.getElementById('new-schedule-name').value.trim(); if(!name) return alert("제목 필수"); await addDoc(collection(db,"schedules"), { gameId: activeGameId, gameName: document.getElementById('rank-title').innerText, gameCategory: selectedCategory, name, members: selectedMembers, ranks: [], feed: [], date: getTodayStr(), createdAt: serverTimestamp() }); toggleModal('add-schedule-modal', false); openSchedules(activeGameId, document.getElementById('rank-title').innerText); };
        window.loadChatInfo = async () => { const s = await getDocs(query(collection(db, "chatInfo"), orderBy("createdAt", "desc"))); document.getElementById('chat-info-list').innerHTML = s.docs.map(d => `<div class='glass p-6 rounded-3xl text-left border border-white/10 shadow-xl font-bold'><h4 class='text-blue-300 mb-2 font-black font-bold'>${d.data().title}</h4><p class='text-sm opacity-80 whitespace-pre-wrap font-bold'>${d.data().content}</p></div>`).join('') || "정보가 없습니다."; };
        window.addEventListener('DOMContentLoaded', async () => { /* 초기화 코드 생략 */ });
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin === "100") document.getElementById('admin-entry').classList.remove('hidden'); }
    </script>
</body>
</html>
