<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Archive v5.8.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; overflow-x: hidden; width: 100%; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; width: 100%; max-width: 800px; margin: 0 auto; pointer-events: auto; }
        .page.active { display: block; opacity: 1; transform: translateY(0); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
        .modal.active { display: flex; }
        #detail-modal { z-index: 10005; } 
        #rank-management-modal { z-index: 10010; }
        #add-schedule-modal { z-index: 10020; } 
        #admin-modal, #find-pin-modal { z-index: 10030; } 
        #global-back-btn { position: fixed; top: 24px; left: 20px; z-index: 9000; background: #1e293b; color: #60a5fa; padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 900; display: none; cursor: pointer; }
        .game-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; font-weight: 800; display: block; cursor: pointer; }
        .game-comment-box { display: block; background: rgba(0,0,0,0.4); border-radius: 16px; padding: 12px; width: 100%; margin: 8px 0; border: 1px solid rgba(255,255,255,0.05); }
        .member-chip { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 10px 4px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.05); }
        .member-chip.selected { background: #3b82f6 !important; border-color: #60a5fa !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .home-action-btn { position: relative; z-index: 500; cursor: pointer; pointer-events: auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <button onclick="handleBack()" id="global-back-btn">← 뒤로가기</button>

    <div id="page-login" class="page pt-24 max-w-sm mx-auto text-center font-bold">
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-blue-400 italic">Game Archive</h2>
            <div class="space-y-4">
                <input type="text" id="pin" placeholder="PIN 번호" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <input type="password" id="pw" placeholder="비밀번호" maxlength="4" oninput="if(this.value.length===4) login()" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-white font-bold">
                <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold shadow-lg mt-2 font-bold">접속</button>
                <div class="pt-4 space-y-2">
                    <button onclick="openFindPin()" class="text-gray-500 text-xs underline font-bold">내 PIN 번호 알아보기</button>
                    <p class="text-blue-400/60 text-[10px] font-bold">기본 비밀번호는 1234입니다.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="find-pin-modal" class="modal" onclick="toggleModal('find-pin-modal', false)">
        <div class="glass w-full max-w-xs p-6 rounded-[30px] max-h-[70vh] flex flex-col font-bold" onclick="event.stopPropagation()">
            <h3 class="text-lg font-black text-blue-300 mb-4 text-center border-b border-white/10 pb-2">PIN 리스트</h3>
            <div id="pin-list-content" class="overflow-y-auto custom-scrollbar space-y-2 text-sm pr-2"></div>
            <button onclick="toggleModal('find-pin-modal', false)" class="mt-4 text-gray-500 text-xs font-bold uppercase">닫기</button>
        </div>
    </div>

    <div id="page-home" class="page active pt-10 text-center font-bold">
        <div class="flex justify-between items-center mb-6 px-4">
            <div class="flex items-center gap-3 p-2 home-action-btn" onclick="toggleProfileModal(true)">
                <img id="my-profile-icon" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-xl object-cover bg-slate-800">
                <span id="user-welcome" class="text-blue-300 text-sm font-black"></span>
            </div>
            <button onclick="logout()" class="text-gray-500 text-xs border border-white/10 px-3 py-1.5 rounded-lg transition home-action-btn">로그아웃</button>
        </div>
        <div id="admin-entry" class="hidden px-4 mb-6 text-right"><button onclick="openAdmin()" class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl font-black home-action-btn">⚙️ 관리자 설정</button></div>
        <h1 class="text-4xl font-extrabold mb-12 italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 uppercase tracking-tighter">Game Archive</h1>
        <div class="flex flex-wrap justify-center gap-3 mb-10 px-4">
            <button onclick="navToStats()" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-yellow-500 hover:text-black transition shadow-lg home-action-btn">🏆 명예전당</button>
            <button onclick="showPage('page-chat-info')" class="bg-blue-500/10 border border-blue-500/30 text-blue-400 px-6 py-4 rounded-2xl font-extrabold hover:bg-blue-500 transition shadow-lg home-action-btn font-bold">📢 단톡방 정보</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 px-4 font-bold">
            <button onclick="navTo('보드게임')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition home-action-btn">🎲 보드게임</button>
            <button onclick="navTo('지니어스')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition home-action-btn">🧠 지니어스</button>
            <button onclick="navTo('방탈출')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition home-action-btn">🔑 방탈출</button>
            <button onclick="navTo('머더 미스테리')" class="glass rounded-3xl p-10 text-xl font-black hover:text-blue-400 transition home-action-btn">🕵️ 머더 미스테리</button>
        </div>
    </div>

    <div id="page-rank" class="page pt-24 font-bold">
        <div class="px-4 mb-4"><input type="text" id="game-search" oninput="renderList()" placeholder="🔍 검색..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm font-bold shadow-inner"></div>
        <div class="px-4 mb-4 flex justify-between items-center font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">
            <h2 id="rank-title" class="text-2xl font-black italic text-blue-400 uppercase font-bold font-bold"></h2>
            <select id="sort-selector" class="bg-slate-800 text-[10px] p-2 rounded-lg border border-white/10 font-bold" onchange="renderList()"><option value="default">기본</option><option value="score_desc">점수순</option><option value="diff_desc">난이도순</option></select>
        </div>
        <div class="glass rounded-[40px] overflow-hidden overflow-x-auto custom-scrollbar mx-4 shadow-2xl border border-white/5 font-bold font-bold font-bold font-bold font-bold"><table class="w-full text-center min-w-[340px] table-fixed border-collapse font-bold"><thead><tr class="bg-white/5 text-gray-500 text-[10px] border-b border-white/10 font-black"><th class="p-4 w-12">#</th><th class="p-4 text-left">정보</th><th class="w-24 text-center">평가</th><th class="w-20">기록</th></tr></thead><tbody id="rank-list" class="divide-y divide-white/5"></tbody></table></div>
        <div class="px-4 mt-6 text-center font-bold"><button onclick="addGame()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-8 py-3 rounded-2xl text-xs font-bold">+ 새 게임 추가</button></div>
    </div>

    <div id="detail-modal" class="modal" onclick="toggleModal('detail-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[90vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold font-bold font-bold"><div class="flex flex-col min-w-0 flex-1 font-bold font-bold font-bold font-bold font-bold"><h3 id="detail-title" class="text-xl font-black text-blue-400 truncate font-bold font-bold font-bold font-bold"></h3><div id="date-display-container" class="mt-1 cursor-pointer font-bold font-bold font-bold font-bold font-bold font-bold" onclick="toggleDateEdit()"><span id="detail-date" class="text-[10px] text-gray-500 font-bold"></span><input type="date" id="date-editor" class="hidden bg-slate-800 border border-blue-500 text-[10px] p-1 rounded font-bold" onchange="updateScheduleDate(this.value)"></div></div><div class="flex gap-3 font-bold font-bold"><button id="detail-delete-btn" class="text-red-500 text-xs hidden font-bold" onclick="deleteSchedule()">삭제</button><button onclick="toggleModal('detail-modal', false)" class="text-gray-500 text-3xl font-bold font-bold font-bold font-bold">✕</button></div></div><div id="detail-podium" class="bg-yellow-400/10 border border-yellow-500/20 p-5 rounded-3xl mb-6 hidden font-bold font-bold font-bold"><div id="detail-rank-result" class="text-sm space-y-1 font-bold text-white/90 font-bold font-bold"></div><button id="rank-action-btn" onclick="startRankSelection()" class="w-full mt-4 bg-yellow-500/20 text-yellow-400 py-2 rounded-xl text-[10px] font-black font-bold font-bold">🏆 결과 기록/수정</button></div><div id="escape-members" class="bg-blue-400/10 border border-blue-500/20 p-5 rounded-3xl mb-6 hidden font-bold font-bold"><div class="text-blue-400 text-[10px] mb-2 font-black uppercase tracking-widest font-bold font-bold">👥 Participants</div><div id="escape-member-list" class="text-xs font-bold text-white/90 font-bold font-bold"></div></div><div id="detail-comment-feed" class="flex-grow overflow-y-auto custom-scrollbar space-y-4 text-left font-bold font-bold"></div><div class="mt-6 flex gap-2 font-bold font-bold font-bold"><input type="text" id="comment-input" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold font-bold" placeholder="코멘트 남기기"><button onclick="submitComment()" class="bg-blue-600 px-6 rounded-2xl font-black text-xs font-bold font-bold font-bold">등록</button></div></div></div>
    <div id="admin-modal" class="modal" onclick="toggleModal('admin-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] max-h-[85vh] flex flex-col font-bold" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-6 font-bold"><h3 class="text-xl font-black text-red-400 uppercase font-bold">User Manager ⚙️</h3><button onclick="toggleModal('admin-modal', false)" class="text-gray-500 text-3xl font-bold font-bold">✕</button></div><div class="flex gap-2 mb-6 font-bold font-bold font-bold"><input type="text" id="new-user-name" placeholder="이름 입력" class="flex-1 bg-white/5 p-4 rounded-xl border border-white/10 text-xs font-bold outline-none font-bold font-bold font-bold font-bold"><button onclick="addUser()" class="bg-blue-600 px-6 rounded-xl text-xs font-black font-bold font-bold font-bold">추가</button></div><div id="admin-user-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 pr-2 font-bold font-bold"></div></div></div>
    <div id="add-schedule-modal" class="modal" onclick="toggleModal('add-schedule-modal', false)"><div class="glass w-full max-w-md p-8 rounded-[40px] flex flex-col font-bold font-bold font-bold font-bold" onclick="event.stopPropagation()"><h3 class="text-xl font-black mb-6 text-green-400 font-bold font-bold font-bold">기록 정보 입력</h3><input type="text" id="new-schedule-name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none font-bold font-bold font-bold" placeholder="기록 제목 (필수) font-bold font-bold font-bold"><p class="text-[10px] text-gray-500 mb-2 ml-1 font-bold font-bold">참석자 선택: font-bold font-bold font-bold</p><div id="member-selector" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 bg-white/10 rounded-2xl mb-6 custom-scrollbar font-bold font-bold font-bold font-bold font-bold"></div><button onclick="submitSchedule()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-white font-bold shadow-xl font-bold font-bold font-bold">기록 생성</button></div></div>
    <div id="rank-management-modal" class="modal" onclick="toggleModal('rank-management-modal', false)"><div class="glass w-full max-w-xs p-8 rounded-[40px] flex flex-col font-bold font-bold font-bold font-bold" onclick="event.stopPropagation()"><h3 id="rank-modal-title" class="text-xl font-black mb-2 text-yellow-400 text-center font-bold font-bold font-bold">순위 선택</h3><p id="rank-modal-desc" class="text-[10px] text-gray-500 mb-6 text-center font-bold font-bold font-bold">순서대로 누르세요.</p><div id="rank-order-display" class="mb-4 p-3 bg-black/30 rounded-xl min-h-[40px] text-xs text-blue-400 font-bold font-bold font-bold"></div><div id="rank-candidate-grid" class="grid grid-cols-2 gap-2 font-bold font-bold font-bold"></div><button onclick="resetRankSelection()" class="mt-6 text-[10px] text-gray-500 underline font-bold font-bold font-bold font-bold">다시 선택</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, where, serverTimestamp, orderBy, addDoc, deleteDoc, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBVp-GgD8Ts-tGw5itr9Av_MnZAt-U4teE", authDomain: "game-archive-afacf.firebaseapp.com", projectId: "game-archive-afacf", storageBucket: "game-archive-afacf.firebasestorage.app", messagingSenderId: "927042381268", appId: "1:927042381268:web:e41f4106cf9202e45ca241" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/3241/3241724.png';

        let currentUser = null; let selectedCategory = ""; let activeGameId = null; let activeScheduleId = null; let recordingRanks = []; let selectedMembers = [];
        const getTodayStr = () => new Date().toISOString().split('T')[0];

        // [v5.8.3 페이지 엔진]
        window.showPage = (id, push=true) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) {
                target.classList.add('active');
                document.getElementById('global-back-btn').style.display = (id === 'page-home' || id === 'page-login') ? 'none' : 'block';
                if(push) history.pushState({page: id}, '', '');
                if(id === 'page-stats') navToStats();
                if(id === 'page-chat-info') loadChatInfo();
            }
        };
        window.handleBack = () => { if(document.querySelector('.modal.active')) closeAllModals(); else showPage('page-home'); };
        window.onpopstate = () => { if(document.querySelector('.modal.active')) { closeAllModals(); history.pushState({page: 'page-home'}, '', ''); return; } showPage('page-home', false); };

        // [인증 엔진 - 신규 PIN 로그인 불일치 해결 핵심]
        window.login = async () => { 
            const pinIn = document.getElementById('pin').value.trim(); 
            const pwIn = document.getElementById('pw').value.trim();
            if(!pinIn || !pwIn) return;
            try {
                // 문서를 문자열 타입으로 정확히 조회
                const snap = await getDoc(doc(db, "users", String(pinIn))); 
                if (snap.exists() && String(snap.data().password) === String(pwIn)) { 
                    currentUser = { pin: String(pinIn), ...snap.data() }; 
                    localStorage.setItem('game_archive_auth', JSON.stringify({ pin: String(pinIn), pw: String(pwIn) })); 
                    location.reload(); 
                } else { alert("PIN 또는 비밀번호 정보가 다릅니다."); }
            } catch(e) { alert("로그인 오류"); }
        };

        // [v5.8.3 리스트 렌더링 - 점수/난이도 클릭 차단 완벽 해결]
        window.renderList = async () => {
            const list = document.getElementById('rank-list'); list.innerHTML = `<tr><td colspan="4" class="p-10 opacity-30 font-bold">로딩 중...</td></tr>`;
            const sortType = document.getElementById('sort-selector').value;
            const searchKeyword = document.getElementById('game-search').value.trim().toLowerCase();
            const [gS, rS, uS] = await Promise.all([getDocs(query(collection(db, "games"), where("category", "==", selectedCategory))), getDocs(collection(db, "ratings")), getDocs(collection(db, "users"))]);
            const rt = rS.docs.map(d => d.data()); const uMap = uS.docs.reduce((acc, d) => ({...acc,[d.id]:d.data()}), {});
            let gms = gS.docs.map(d => {
                const r = rt.filter(v => v.gameId === d.id); const sc = r.map(v => v.score || 0).sort((a,b)=>a-b);
                let avgS = (r.length >= 5) ? sc.slice(1, -1).reduce((a,c)=>a+c,0)/(sc.length-2) : (r.length > 0 ? sc.reduce((a,c)=>a+c,0)/r.length : 0);
                const df = r.map(v => v.difficulty || 0).filter(v => v > 0);
                return { id: d.id, ...d.data(), avgScore: avgS, avgDiff: df.length > 0 ? df.reduce((a,c)=>a+c,0)/df.length : 0, voteCount: r.length };
            });
            if(searchKeyword) gms = gms.filter(g => g.name.toLowerCase().includes(searchKeyword));
            gms.sort((a, b) => { const a3 = a.voteCount >= 3; const b3 = b.voteCount >= 3; if(a3 !== b3) return b3 - a3; return sortType === "score_desc" ? b.avgScore - a.avgScore : b.avgScore - a.avgScore; });

            list.innerHTML = gms.map((g, i) => `
                <tr class="hover:bg-white/5 border-b border-white/5 transition" id="row-${g.id}">
                    <td class="p-4 text-blue-400 font-black text-center w-12 font-bold">${i < 3 && g.voteCount >= 3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</td>
                    <td class="p-4 text-left font-bold" onclick="toggleGameRow('${g.id}')">
                        <span class="game-name-text text-sm font-black font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${g.name} font-bold font-bold font-bold</span>
                        <span class="text-[9px] opacity-40 font-bold font-bold font-bold font-bold font-bold font-bold">Votes: ${g.voteCount} font-bold font-bold font-bold font-bold font-bold</span>
                    </td>
                    <td class="p-2 text-center w-24 relative z-[400]" onclick="event.stopPropagation();">
                        <div class="flex flex-col items-center pointer-events-auto">
                            <span onclick="event.stopPropagation(); openRate('score','${g.id}','${g.name}')" class="text-yellow-400 text-base font-black cursor-pointer font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">${g.avgScore.toFixed(1)} font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold</span>
                            <div onclick="event.stopPropagation(); openRate('diff','${g.id}','${g.name}')" class="flex text-[8px] cursor-pointer font-bold font-bold font-bold font-bold font-bold font-bold">
                                ${Array(5).fill(0).map((_, idx) => `<span class="${idx < Math.round(g.avgDiff) ? 'text-blue-400' : 'text-gray-700'} font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">★</span>`).join('')}
                            </div>
                        </div>
                    </td>
                    <td class="p-4 w-20 text-center font-bold relative z-[400] font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><button onclick="event.stopPropagation(); openSchedules('${g.id}','${g.name}');" class="bg-green-600/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-green-600 transition font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">기록</button></td>
                </tr>
                <tr id="comment-row-${g.id}" style="display:none;"><td colspan="4" class="px-4 pb-4">
                    <div class="game-comment-box font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold" onclick="event.stopPropagation()">
                        <div class="max-h-32 overflow-y-auto mb-3 custom-scrollbar space-y-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold">
                            ${(g.comments || []).map((c, idx) => `<div class="text-[11px] flex justify-between bg-white/5 p-2 rounded-xl"><span><b class="text-blue-300 font-bold font-bold font-bold font-bold font-bold">${uMap[c.userPin]?.name || '?'}:</b> ${c.text}</span>${(c.userPin===currentUser.pin || currentUser.pin==="100")?`<button onclick="deleteGameComment('${g.id}',${idx})" class="text-red-500 ml-2 font-bold font-bold">✕</button>`:''}</div>`).join('') || "<p class='opacity-20 py-2 text-center text-[10px] font-bold'>첫 댓글을 쓰세요!</p>"}
                        </div>
                        <div class="flex gap-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><input type="text" id="gc-${g.id}" class="bg-white/10 text-[11px] p-3 rounded-xl flex-1 outline-none font-bold font-bold font-bold" placeholder="메모..."><button onclick="addGameComment('${g.id}')" class="bg-blue-600 text-[11px] px-4 rounded-xl font-black font-bold font-bold font-bold">등록</button></div>
                    </div>
                </td></tr>`).join('');
        };

        window.toggleGameRow = (id) => { const dr = document.getElementById(`comment-row-${id}`); dr.style.display = (dr.style.display === 'none') ? 'table-row' : 'none'; };

        // [사용자 추가 - 31번 문제 완결]
        window.addUser = async () => {
            const n = document.getElementById('new-user-name'); if(!n.value.trim()) return;
            const uS = await getDocs(collection(db, "users"));
            const maxPin = Math.max(...uS.docs.map(d => parseInt(d.id)).filter(id => !isNaN(id)), 100);
            const nextPinStr = String(maxPin + 1);
            // 31번 해결: 인증용 password 필드 명시적 저장 및 타입 통일
            await setDoc(doc(db, "users", nextPinStr), { 
                name: n.value.trim(), 
                password: "1234", 
                pin: nextPinStr,
                iconUrl: DEFAULT_ICON 
            });
            n.value = ""; await openAdmin();
            const listDiv = document.getElementById('admin-user-list'); listDiv.scrollTo({ top: listDiv.scrollHeight, behavior: 'smooth' });
        };

        // [부가 기능 유지]
        window.logout = () => { if(confirm("로그아웃 하시겠습니까?")) { localStorage.removeItem('game_archive_auth'); location.reload(); } };
        window.addEventListener('DOMContentLoaded', async () => { const auth = localStorage.getItem('game_archive_auth'); if (auth) { const d = JSON.parse(auth); const snap = await getDoc(doc(db, "users", String(d.pin))); if (snap.exists() && String(snap.data().password) === String(d.pw)) { currentUser = { pin: String(d.pin), ...snap.data() }; updateUI(); showPage('page-home', false); return; } } showPage('page-login', false); });
        function updateUI() { document.getElementById('user-welcome').innerText = `${currentUser.name}님`; document.getElementById('my-profile-icon').src = currentUser.iconUrl || DEFAULT_ICON; if(currentUser.pin === "100") document.getElementById('admin-entry').classList.remove('hidden'); }
        window.toggleModal = (id, s) => document.getElementById(id).classList.toggle('active', s);
        window.closeAllModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        window.navTo = (cat) => { selectedCategory = cat; document.getElementById('rank-title').innerText = cat; document.getElementById('game-search').value = ""; renderList(); showPage('page-rank'); };
        window.openAdmin = async () => { if(currentUser.pin !== "100") return; toggleModal('admin-modal', true); const uS = await getDocs(collection(db, "users")); const listDiv = document.getElementById('admin-user-list'); const users = uS.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => parseInt(a.id) - parseInt(b.id)); listDiv.innerHTML = users.map(u => `<div class="flex justify-between items-center p-4 glass rounded-2xl border border-white/5 mb-2 font-bold"><div><span class="font-black">${u.name}</span><span class="text-[9px] text-gray-500 block">PIN: ${u.id}</span></div>${u.id !== "100" ? `<button onclick="deleteUser('${u.id}')" class="bg-red-500/10 text-red-500 px-3 py-1.5 rounded-lg text-[10px] font-black">삭제</button>` : ''}</div>`).join(''); };
        window.deleteUser = async (pin) => { if(confirm("삭제?")) { await deleteDoc(doc(db, "users", pin)); openAdmin(); } };
        window.openFindPin = async () => { toggleModal('find-pin-modal', true); const uS = await getDocs(collection(db, "users")); const listContent = document.getElementById('pin-list-content'); const users = uS.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.name.localeCompare(b.name)); listContent.innerHTML = users.map(u => `<div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5 mb-1 font-bold"><span>${u.name}</span><span class="text-yellow-400 font-black">PIN: ${u.id}</span></div>`).join(''); };
        window.openRate = (t,id,n) => { activeGameId=id; document.getElementById('rate-modal-title').innerText=n; document.getElementById('rate-score-section').classList.toggle('hidden',t!=='score'); document.getElementById('rate-diff-section').classList.toggle('hidden',t!=='diff'); toggleModal('rate-modal',true); };
        window.submitRating = async (t) => { const v = (t==='score') ? parseFloat(document.getElementById('rate-score-input').value) : parseInt(document.getElementById('rate-diff-range').value); try { const q = query(collection(db,"ratings"), where("gameId","==",activeGameId), where("userPin","==",currentUser.pin)); const snap = await getDocs(q); const rD = { gameId:activeGameId, userPin:currentUser.pin, updatedAt:serverTimestamp() }; rD[t==='score'?'score':'difficulty']=v; if(!snap.empty) await updateDoc(doc(db,"ratings",snap.docs[0].id), rD); else await addDoc(collection(db,"ratings"), rD); toggleModal('rate-modal', false); renderList(); } catch(e) { alert("실패"); } };
        window.openSchedules = async (id, n, targetSid = null) => { activeGameId = id; toggleModal('schedule-modal', true); document.getElementById('schedule-game-title').innerText = n; const sSnap = await getDocs(query(collection(db, "schedules"), where("gameId", "==", id))); document.getElementById('schedule-list').innerHTML = sSnap.docs.map(d => `<div onclick="openScheduleDetail('${d.id}')" class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-white/10 font-bold"><div><div class="text-sm text-green-300 font-bold">${d.data().name}</div><div class="text-[9px] text-gray-500 uppercase">${d.data().date || ''}</div></div><span class="text-blue-400 text-xs font-bold font-bold font-bold font-bold">▶</span></div>`).join(''); };
        window.openScheduleDetail = async (sid) => {
            activeScheduleId = sid; const [sS, uS] = await Promise.all([getDoc(doc(db,"schedules",sid)), getDocs(collection(db,"users"))]);
            const s = sS.data(); const uMap = uS.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {});
            document.getElementById('detail-title').innerText = s.name; document.getElementById('detail-date').innerText = "📅 " + (s.date || "미기록");
            document.getElementById('detail-delete-btn').classList.toggle('hidden', !(s.members || []).includes(currentUser.pin));
            const podium = document.getElementById('detail-podium'); const actionBtn = document.getElementById('rank-action-btn'); const escapeList = document.getElementById('escape-members');
            if(selectedCategory === "방탈출") { podium.classList.add('hidden'); escapeList.classList.remove('hidden'); document.getElementById('escape-member-list').innerText = (s.members || []).map(m => uMap[m]?.name || '?').join(', '); } 
            else { podium.classList.remove('hidden'); escapeList.classList.add('hidden'); if(selectedCategory === "머더 미스테리") { actionBtn.innerText = "🕵️ 승리팀 기록/수정"; const winL = s.ranks || []; const loseL = (s.members || []).filter(m => !winL.includes(m)); document.getElementById('detail-rank-result').innerHTML = `<div><b class='text-blue-400 font-bold'>[승리]:</b> ${winL.map(p=>uMap[p]?.name||'?').join(', ')}</div><div class='opacity-50 mt-1'><b class='text-red-400 font-bold font-bold font-bold font-bold font-bold font-bold'>[패배]:</b> ${loseL.map(p=>uMap[p]?.name||'?').join(', ')}</div>`; } else { actionBtn.innerText = "🥇 순위 기록/수정"; document.getElementById('detail-rank-result').innerHTML = (s.ranks || []).map((p, i) => `<div class="flex justify-between font-bold"><span>${i+1}위</span><span>${uMap[p]?.name || '?'}</span></div>`).join('') || "미기록"; } }
            document.getElementById('detail-comment-feed').innerHTML = (s.feed || []).sort((a,b)=>b.time-a.time).map((l, idx) => `<div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center"><div class="text-xs font-bold font-bold font-bold font-bold font-bold"><span><b class="text-blue-300 font-bold font-bold font-bold font-bold font-bold">${uMap[l.userPin]?.name || '?'}:</b> ${l.text}</span></div>${l.userPin === currentUser.pin ? `<button onclick="deleteComment(${idx})" class="text-red-500 px-2 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold">✕</button>` : ''}</div>`).join('') || "<p class='opacity-20 text-center py-4 font-bold'>코멘트 없음</p>";
            toggleModal('detail-modal', true);
        };
        window.openAddSchedule = async () => { selectedMembers = [currentUser.pin]; const uS = await getDocs(collection(db, "users")); document.getElementById('member-selector').innerHTML = uS.docs.map(d => `<div id="sel-${d.id}" onclick="toggleMemberSelect('${d.id}')" class="member-chip font-bold ${d.id === currentUser.pin ? 'selected' : ''}">${d.data().name}</div>`).join(''); toggleModal('add-schedule-modal', true); };
        window.toggleMemberSelect = (pin) => { if(pin === currentUser.pin) return; const el = document.getElementById(`sel-${pin}`); if(selectedMembers.includes(pin)) { selectedMembers = selectedMembers.filter(p => p !== pin); el.classList.remove('selected'); } else { selectedMembers.push(pin); el.classList.add('selected'); } };
        window.submitSchedule = async () => { const name = document.getElementById('new-schedule-name').value.trim(); if(!name) return alert("제목 필수"); await addDoc(collection(db,"schedules"), { gameId: activeGameId, gameName: document.getElementById('schedule-game-title').innerText, gameCategory: selectedCategory, name, members: selectedMembers, ranks: [], feed: [], date: getTodayStr(), createdAt: serverTimestamp() }); toggleModal('add-schedule-modal', false); openSchedules(activeGameId, document.getElementById('schedule-game-title').innerText); };
        window.navToStats = async () => { showPage('page-stats'); const vL = document.getElementById('vote-king'); const gL = document.getElementById('game-add-king'); try { const [rSnap, gSnap, uSnap] = await Promise.all([getDocs(collection(db, "ratings")), getDocs(collection(db, "games")), getDocs(collection(db, "users"))]); const uMap = uSnap.docs.reduce((acc, d) => ({...acc, [d.id]: d.data()}), {}); const vC = rSnap.docs.map(d=>d.data()).reduce((acc, r) => { if(r.userPin) acc[r.userPin] = (acc[r.userPin]||0)+1; return acc; }, {}); vL.innerHTML = Object.entries(vC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold font-bold font-bold'><div class='flex items-center gap-3'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 rounded-full font-bold font-bold font-bold'><span class='text-xs font-bold font-bold font-bold font-bold'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-blue-400 text-xs font-bold font-bold font-bold font-bold font-bold font-bold'>${v[1]}회</b></div>`).join(''); const gC = gSnap.docs.map(d=>d.data()).reduce((acc, g) => { if(g.creatorPin) acc[g.creatorPin] = (acc[g.creatorPin]||0)+1; return acc; }, {}); gL.innerHTML = Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,5).map(v => `<div class='p-3 glass rounded-xl flex justify-between items-center mb-1 font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold'><div class='flex items-center gap-3 font-bold font-bold font-bold font-bold font-bold font-bold'><img src='${uMap[v[0]]?.iconUrl || DEFAULT_ICON}' class='user-icon w-8 h-8 rounded-full font-bold font-bold font-bold font-bold'><span class='text-xs font-bold font-bold font-bold font-bold font-bold'>${uMap[v[0]]?.name || '?'}</span></div><b class='text-green-400 text-xs font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold font-bold'>${v[1]}개</b></div>`).join(''); } catch(e) {} };
        window.resetRankSelection = () => startRankSelection();
        window.toggleProfileModal = async (s) => { if(s && currentUser) { document.getElementById('edit-nickname').value = currentUser.name; document.getElementById('profile-preview').src = currentUser.iconUrl || DEFAULT_ICON; await loadMyHistory(); } toggleModal('profile-modal', s); };
    </script>
</body>
</html>
